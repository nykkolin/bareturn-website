<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的账户 · 订单与许可管理 · BareTurn</title>
  <link rel="icon" type="image/svg+xml" href="assets/bareturn-mark.svg">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="portal.css">
</head>
<body>
  <header class="nav-wrap">
    <div class="container nav">
      <a class="brand" href="index.html">
        <img src="assets/bareturn-mark.svg" alt="" width="30" height="30">
        <strong>BareTurn</strong><span class="by">账户中心</span>
      </a>
      <nav class="nav-links">
        <a href="index.html">官网首页</a>
        <a href="account.html" style="color:var(--brand);font-weight:600">我的账户</a>
        <a href="admin.html" id="nav-admin-link" class="hidden" style="color:var(--brand);font-weight:600">管理后台</a>
      </nav>
      <div class="nav-actions">
        <span id="nav-user-label" class="muted hide-sm" style="font-size:13px"></span>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="切换主题">◐</button>
        <button class="btn sm ghost" id="btn-logout" type="button">退出登录</button>
      </div>
    </div>
  </header>

  <main class="portal-main">
    <div class="container">
      <div class="page-top">
        <div>
          <h1 id="welcome-title">我的账户</h1>
          <p id="welcome-sub">集中管理您的 BareTurn 永久许可、历史订单、离线证书与换机迁移。</p>
        </div>
        <div class="top-actions">
          <button class="btn sm" id="btn-claim" type="button">认领激活码</button>
          <button class="btn sm primary" id="btn-buy-more" type="button">+ 购买永久席位</button>
        </div>
      </div>

      <div class="kpi-grid">
        <div class="kpi-card"><small>有效永久许可</small><strong id="k-lic">—</strong><span class="sub">终身免费更新（Lifetime Updates）</span></div>
        <div class="kpi-card"><small>Server 服务器席位</small><strong id="k-srv">—</strong><span class="sub">可向下兼容保护工作站</span></div>
        <div class="kpi-card"><small>Workstation 工作站席位</small><strong id="k-ws">—</strong><span class="sub">Windows 10 / 11 桌面端</span></div>
        <div class="kpi-card"><small>历史订单数</small><strong id="k-ord">—</strong><span class="sub">Creem 安全结算</span></div>
      </div>

      <div class="portal-tabs" role="tablist">
        <button type="button" class="on" data-tab="licenses">我的许可</button>
        <button type="button" data-tab="orders">我的订单</button>
        <button type="button" data-tab="profile">账户与安全</button>
      </div>

      <section id="sec-licenses">
        <div id="licenses-grid" class="lic-cards"><div class="empty-box">正在加载许可…</div></div>
      </section>

      <section id="sec-orders" class="hidden">
        <div class="panel">
          <div class="panel-head"><h2>订单记录</h2></div>
          <div class="table-wrap">
            <table class="data">
              <thead><tr><th>创建时间</th><th>订单号</th><th>席位明细</th><th>金额</th><th>状态</th><th>激活码</th></tr></thead>
              <tbody id="orders-tbody"><tr><td colspan="6" class="empty-box">正在加载…</td></tr></tbody>
            </table>
          </div>
        </div>
      </section>

      <section id="sec-profile" class="hidden">
        <div class="form-row">
          <div class="panel">
            <div class="panel-head"><h2>基本资料</h2></div>
            <div class="panel-body">
              <form id="profile-form">
                <div class="field"><label>邮箱（登录账号）</label><input id="p-email" disabled></div>
                <div class="field"><label for="p-name">姓名 / 联系人</label><input id="p-name" required></div>
                <div class="field"><label for="p-company">公司 / 组织</label><input id="p-company"></div>
                <button type="submit" class="btn primary">保存资料</button>
              </form>
            </div>
          </div>
          <div class="panel">
            <div class="panel-head"><h2>修改密码</h2></div>
            <div class="panel-body">
              <form id="pw-form">
                <div class="field"><label for="pw-cur">当前密码</label><input id="pw-cur" type="password" required></div>
                <div class="field"><label for="pw-new">新密码</label><input id="pw-new" type="password" minlength="8" required><span class="hint">至少 8 个字符；修改后其他设备会话将自动失效。</span></div>
                <button type="submit" class="btn primary">更新密码</button>
              </form>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="portal-common.js"></script>
  <script src="account.js"></script>
</body>
</html>
