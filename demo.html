  <title>BareTurn</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%2316323C'/%3E%3Cstop offset='1' stop-color='%230B191F'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='256' height='256' rx='58' fill='url(%23g)'/%3E%3Cg transform='translate(128 128) scale(1.08) translate(-128 -128)'%3E%3Cpath d='M61.4 169 128 204.2 194.6 169' fill='none' stroke='%23189486' stroke-width='23' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M61.4 131.2 128 166.4 194.6 131.2' fill='none' stroke='%233ED0BD' stroke-width='23' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M121 42.9c4.5-2.6 9.6-2.6 14 0l64.6 34.6c5.8 3.2 5.8 9 0 12.1L135 124.2c-4.5 2.6-9.6 2.6-14 0L56.3 89.6c-5.8-3.2-5.8-9 0-12.1Z' fill='%23fff'/%3E%3Cpath d='M128 60.8 167 81.9 139.5 96.6 100.5 75.5Z' fill='%230B7A6E'/%3E%3Cpath d='M92.2 80.6 131.2 101.8 118.4 108.8 79.4 87.7Z' fill='%2318A999'/%3E%3C/g%3E%3C/svg%3E">
  <style>
/* BareTurn 3.0 console */
:root {
  --ink: #15232d; --ink-2: #364753; --muted: #66757f; --faint: #8b989f;
  --line: #dce2e5; --line-strong: #c4cdd2; --canvas: #edf1f2; --surface: #ffffff; --surface-2: #f6f8f9; --hover: #f1f4f5;
  --brand: #0b7a6e; --brand-ink: #075c53; --brand-tint: #e1f1ee; --brand-line: #a9d6cf;
  --warn: #a8600b; --warn-tint: #fbefdc; --danger: #b8382a; --danger-tint: #fbe5e1; --info: #2b59cf; --info-tint: #e5ebfb; --offline: #74828b; --offline-tint: #e8ecee;
  --nav: #13202a; --nav-2: #1b2b37; --nav-ink: #c9d4da; --nav-muted: #7f9099;
  --p-efi: #7b61c9; --p-msr: #b3bdc2; --p-recovery: #cf8a26; --p-windows: #0b7a6e; --p-data: #3d6fd6; --p-system: #4f97a3; --p-oem: #8e6f59; --p-free: transparent;
  --radius: 10px; --radius-sm: 6px;
  --font: "Segoe UI Variable Text", "Segoe UI", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --shadow-pop: 0 12px 32px rgba(16, 32, 42, .16), 0 2px 6px rgba(16, 32, 42, .08);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --ink: #e4ebee; --ink-2: #c1cdd3; --muted: #93a2aa; --faint: #6f7f88;
  --line: #26353f; --line-strong: #34454f; --canvas: #0e161b; --surface: #15212a; --surface-2: #1a2832; --hover: #1d2c36;
  --brand: #2fb3a1; --brand-ink: #6fd3c4; --brand-tint: #133a36; --brand-line: #22665d;
  --warn: #e0a24a; --warn-tint: #3a2b14; --danger: #ef7d6d; --danger-tint: #3d1f1b; --info: #7fa0f2; --info-tint: #1c2a4a; --offline: #94a3ab; --offline-tint: #22303a;
  --nav: #0a1115; --nav-2: #131e25;
  --shadow-pop: 0 12px 32px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 14px/1.5 var(--font); color: var(--ink); background: var(--canvas); font-feature-settings: "tnum" 1; -webkit-font-smoothing: antialiased; }
a { color: var(--brand-ink); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* ── shell ── */
.shell { display: grid; grid-template-columns: 236px 1fr; height: 100vh; }
.nav { background: var(--nav); color: var(--nav-ink); display: flex; flex-direction: column; padding: 18px 12px 14px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 22px; color: #fff; }
.brand-mark { width: 30px; height: 30px; }
.brand-name { font-size: 17px; font-weight: 650; letter-spacing: .2px; }
.brand-sub { font-size: 12px; color: var(--nav-muted); line-height: 1.2; }
.nav-group { margin: 14px 8px 6px; font-size: 12px; color: var(--nav-muted); }
.nav a { display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: 7px; color: var(--nav-ink); position: relative; text-decoration: none; }
.nav a:hover { background: var(--nav-2); color: #fff; }
.nav a.active { background: var(--nav-2); color: #fff; }
.nav a.active::before { content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: #35c2ae; }
.nav a .count { margin-left: auto; font-size: 12px; min-width: 20px; padding: 0 6px; border-radius: 10px; background: #3b2620; color: #f2a493; text-align: center; }
.nav-foot { margin-top: auto; padding: 12px 10px 0; border-top: 1px solid var(--nav-2); font-size: 12px; color: var(--nav-muted); }
.nav-foot strong { color: var(--nav-ink); font-weight: 600; display: block; font-size: 13px; }
.core-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #35c2ae; margin-right: 6px; box-shadow: 0 0 0 3px rgba(53, 194, 174, .18); }
.main { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.topbar { height: 56px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 28px; background: var(--surface); border-bottom: 1px solid var(--line); }
.search { position: relative; width: min(420px, 40vw); }
.search input { width: 100%; height: 34px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 0 12px 0 34px; }
.search svg { position: absolute; left: 10px; top: 8px; color: var(--faint); }
.search-results { position: absolute; top: 40px; left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-pop); z-index: 30; padding: 6px; }
.search-results a { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 6px; color: var(--ink); }
.search-results a:hover, .search-results a.on { background: var(--hover); text-decoration: none; }
.topbar .spacer { flex: 1; }
.icon-btn { width: 34px; height: 34px; display: inline-grid; place-items: center; border: 0; background: transparent; border-radius: 8px; color: var(--ink-2); cursor: pointer; position: relative; }
.icon-btn:hover { background: var(--hover); }
.icon-btn .badge { position: absolute; top: 5px; right: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); border: 2px solid var(--surface); }
/* running tasks indicator and its popover */
.run-chip { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border: 1px solid color-mix(in srgb, var(--info) 28%, transparent); background: var(--info-tint); color: var(--info); border-radius: 16px; font-weight: 550; font-size: 13px; cursor: pointer; white-space: nowrap; }
.run-chip:hover, .run-chip.on { border-color: var(--info); }
.run-chip small { font-weight: 500; opacity: .85; font-size: 12.5px; }
.run-chip .spin { width: 13px; height: 13px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--info) 30%, transparent); border-top-color: var(--info); animation: spin .9s linear infinite; flex: none; }
.run-chip .mini-bar { width: 54px; height: 5px; border-radius: 3px; background: color-mix(in srgb, var(--info) 18%, transparent); overflow: hidden; }
.run-chip .mini-bar span { display: block; height: 100%; background: var(--info); border-radius: 3px; transition: width .4s ease; }
.run-chip b { font-variant-numeric: tabular-nums; min-width: 32px; text-align: right; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .run-chip .spin { animation: none; border-top-color: color-mix(in srgb, var(--info) 30%, transparent); background: var(--info); } }
.jobs-pop { position: fixed; z-index: 45; width: min(420px, calc(100vw - 24px)); max-height: min(520px, calc(100vh - 80px)); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-pop); animation: rise .14s ease; }
.jobs-pop-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.jobs-pop-list { overflow-y: auto; padding: 6px; }
.jobs-pop-item { display: flex; flex-direction: column; gap: 5px; width: 100%; text-align: left; border: 0; background: transparent; padding: 10px; border-radius: 8px; cursor: pointer; color: inherit; font: inherit; }
.jobs-pop-item:hover { background: var(--hover); }
.jobs-pop-item .t { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.jobs-pop-item .t b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
.jobs-pop-item .p { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--info); }
.jobs-pop-item .m { color: var(--ink-2); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user-chip { display: flex; align-items: center; gap: 9px; padding: 4px 10px 4px 4px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--brand-tint); color: var(--brand-ink); font-weight: 650; font-size: 13px; }
.user-chip small { color: var(--muted); }
.content { flex: 1; overflow-y: auto; padding: 26px 28px 48px; }
.page { max-width: 1480px; margin: 0 auto; }

/* ── page header ── */
.page-head { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.page-head h1 { font-size: 24px; line-height: 1.25; font-weight: 600; margin: 0; letter-spacing: -.2px; }
.page-head p { margin: 4px 0 0; color: var(--muted); max-width: 72ch; }
.page-head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.crumbs { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; margin-bottom: 6px; }
.crumbs a { color: var(--muted); }

/* ── buttons & inputs ── */
.btn { display: inline-flex; align-items: center; justify-content: center; vertical-align: middle; gap: 7px; height: 34px; line-height: 1; box-sizing: border-box; text-decoration: none; padding: 0 14px; border-radius: var(--radius-sm); border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-weight: 550; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--hover); text-decoration: none; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-ink); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); }
.btn.danger.solid { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--hover); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn svg.i { width: 16px; height: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field > label, .field > .label { font-weight: 550; font-size: 13px; color: var(--ink-2); }
.field .hint { font-size: 12.5px; color: var(--muted); }
.field .error { font-size: 12.5px; color: var(--danger); }
.input, select.input, textarea.input { height: 36px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--radius-sm); padding: 0 11px; width: 100%; }
textarea.input { height: auto; min-height: 80px; padding: 8px 11px; resize: vertical; }
input.input[type=file] { display: block; box-sizing: border-box; padding: 4px 11px 4px 4px; line-height: 26px; font-size: 13.5px; color: var(--ink-2); cursor: pointer; }
input.input[type=file]::file-selector-button { height: 26px; margin: 0 10px 0 0; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface-2, var(--hover)); color: var(--ink); font: inherit; font-size: 13px; font-weight: 550; cursor: pointer; vertical-align: middle; }
input.input[type=file]::file-selector-button:hover { background: var(--hover); }
.input:focus { outline: 2px solid color-mix(in srgb, var(--brand) 45%, transparent); outline-offset: 0; border-color: var(--brand); }
.input.mono { font-family: "Cascadia Mono", Consolas, monospace; font-size: 13px; letter-spacing: .3px; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
.check { display: flex; align-items: flex-start; gap: 9px; cursor: pointer; margin: 4px 0 12px; }
.check input { margin-top: 3px; accent-color: var(--brand); width: 16px; height: 16px; }
.check small { display: block; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 14px; cursor: pointer; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--brand-tint); color: var(--brand-ink); font-weight: 600; }
.days { display: flex; gap: 6px; }
.days button { width: 36px; height: 32px; border-radius: var(--radius-sm); border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; }
.days button.on { background: var(--brand); border-color: var(--brand); color: #fff; }

/* ── panels ── */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
.panel-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.panel-head h2 { font-size: 15px; font-weight: 600; margin: 0; }
.panel-head .sub { color: var(--muted); font-size: 13px; }
.panel-head .end { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.panel-body { padding: 16px 18px; }
.panel-body.flush { padding: 0; }
.grid { display: grid; gap: 18px; }
.grid.dash { grid-template-columns: minmax(0, 1.65fr) minmax(320px, 1fr); }
.grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.stack { display: flex; flex-direction: column; gap: 18px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 12.5px; }
.nowrap { white-space: nowrap; }
.mono { font-family: "Cascadia Mono", Consolas, monospace; font-size: 12.5px; }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); }
.empty h3 { color: var(--ink); font-size: 16px; margin: 10px 0 4px; font-weight: 600; }
.empty .btn { margin-top: 14px; }

/* ── status ── */
.pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 11px; font-size: 12.5px; font-weight: 550; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--brand-tint); color: var(--brand-ink); }
.pill.warn { background: var(--warn-tint); color: var(--warn); }
.pill.err { background: var(--danger-tint); color: var(--danger); }
.pill.off { background: var(--offline-tint); color: var(--offline); }
.pill.info { background: var(--info-tint); color: var(--info); }
.pill.run { background: var(--info-tint); color: var(--info); }
.pill.run::before { animation: pulse 1.4s ease-in-out infinite; }
.pill.plain::before { display: none; }
.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.tag.brand { background: var(--brand-tint); border-color: var(--brand-line); color: var(--brand-ink); }
@keyframes pulse { 50% { opacity: .35; } }

/* ── protection overview (dashboard hero) ── */
.overview { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 0; }
.overview-lead { padding: 20px 22px; border-right: 1px solid var(--line); }
.overview-lead .figure { font-size: 40px; font-weight: 650; line-height: 1.1; letter-spacing: -.5px; }
.overview-lead .figure small { font-size: 16px; font-weight: 500; color: var(--muted); margin-left: 4px; }
.overview-lead p { margin: 6px 0 16px; color: var(--muted); }
.statebar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--surface-2); gap: 2px; }
.statebar span { display: block; min-width: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px; font-size: 13px; }
.legend a, .legend span { display: inline-flex; align-items: center; gap: 7px; color: var(--ink-2); }
.legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.overview-facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.fact { padding: 20px 20px; border-right: 1px solid var(--line); }
.fact:last-child { border-right: 0; }
.fact .k { color: var(--muted); font-size: 13px; }
.fact .v { font-size: 22px; font-weight: 600; margin-top: 4px; }
.fact .d { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.fact .v.err { color: var(--danger); }

/* ── tables ── */
.table { width: 100%; border-collapse: collapse; }
.table-wrap { overflow-x: auto; border-bottom-left-radius: var(--radius); border-bottom-right-radius: var(--radius); }
.table th { text-align: left; font-weight: 550; font-size: 12.5px; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; position: sticky; top: 0; z-index: 1; }
.table td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table tr:last-child td { border-bottom: 0; }
.table tbody tr.click { cursor: pointer; }
.table tbody tr.click:hover td { background: var(--hover); }
.table .num { text-align: right; white-space: nowrap; }
.table td.actions-cell { text-align: right; white-space: nowrap; width: 1%; }
.machine-cell { display: flex; align-items: center; gap: 12px; min-width: 220px; }
.os-icon { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); flex: none; }
.machine-cell strong { display: block; font-weight: 600; }
.machine-cell small { color: var(--muted); display: block; }
.clip { min-width: 0; max-width: 300px; }
.clip small, .clip-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toolbar { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.toolbar .input { width: 240px; height: 32px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { height: 28px; padding: 0 11px; border-radius: 14px; border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; font-size: 13px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.chip b { font-weight: 600; }

/* ── disk layout strip (signature element) ── */
.disks { display: flex; flex-direction: column; gap: 4px; min-width: 180px; }
.disk-strip { display: flex; height: 9px; border-radius: 3px; overflow: hidden; background: var(--surface-2); outline: 1px solid var(--line); gap: 1px; }
.disk-strip span { height: 100%; position: relative; }
.disk-strip span .used { position: absolute; inset: 0 auto 0 0; background: rgba(255, 255, 255, .0); }
.disk-map { display: flex; flex-direction: column; gap: 18px; }
.disk-row-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
.disk-row-head strong { font-weight: 600; }
.disk-bar { display: flex; gap: 3px; }
.part { min-width: 30px; display: flex; flex-direction: column; gap: 6px; }
.part .blk { height: 30px; border-radius: 5px; position: relative; overflow: hidden; background: color-mix(in srgb, var(--pc) 30%, var(--surface)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--pc) 55%, transparent); }
.part .blk .fill { position: absolute; inset: 0 auto 0 0; width: var(--used, 100%); background: var(--pc); }
.part b, .part em { font-style: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.25; }
.part b { font-size: 13px; font-weight: 600; }
.part em { font-size: 12px; color: var(--muted); }
.part.tiny b, .part.tiny em { visibility: hidden; }
.part.excluded .blk { background: repeating-linear-gradient(135deg, var(--surface-2) 0 5px, var(--line) 5px 10px); box-shadow: inset 0 0 0 1px var(--line-strong); }
.part.excluded .blk .fill { display: none; }
.role-key { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.role-key span { display: inline-flex; align-items: center; gap: 6px; }
.role-key i { width: 10px; height: 10px; border-radius: 3px; background: var(--pc); display: inline-block; }

/* ── recovery point chain timeline ── */
.timeline { position: relative; padding: 18px 8px 6px; }
.tl-track { position: relative; height: 54px; }
.tl-axis { position: absolute; left: 0; right: 0; top: 26px; height: 2px; background: var(--line); }
.tl-chain { position: absolute; top: 24px; height: 6px; border-radius: 3px; background: var(--brand-line); }
.tl-pt { position: absolute; top: 20px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--surface); border: 2px solid var(--brand); cursor: pointer; padding: 0; }
.tl-pt.base { width: 18px; height: 18px; margin-left: -9px; top: 18px; background: var(--brand); border-color: var(--brand-ink); }
.tl-pt.sel { box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 30%, transparent); }
.tl-pt.bad { border-color: var(--danger); }
.tl-labels { position: relative; height: 18px; font-size: 12px; color: var(--muted); }
.tl-labels span { position: absolute; transform: translateX(-50%); white-space: nowrap; }

/* ── progress ── */
.bar { height: 6px; border-radius: 3px; background: var(--surface-2); outline: 1px solid var(--line); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--info); border-radius: 3px; transition: width .6s ease; }
.bar.ok > span { background: var(--brand); }
.bar.warn > span { background: var(--warn); }
.bar.err > span { background: var(--danger); }
.bar.lg { height: 10px; border-radius: 5px; }
.job-line { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 18px; border-bottom: 1px solid var(--line); }
.job-line:last-child { border-bottom: 0; }
.job-line .t { font-weight: 550; }
.job-line .m { grid-column: 1 / -1; color: var(--muted); font-size: 12.5px; }
.job-line .bar { grid-column: 1 / -1; }

/* ── list rows ── */
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; gap: 12px; align-items: flex-start; padding: 11px 18px; border-bottom: 1px solid var(--line); }
.list li > div, .list li > span:not(.when):not(.pill):not(.sev) { min-width: 0; flex: 1 1 auto; }
.list li > .pill { flex: none; }
.list li:last-child { border-bottom: 0; }
.list .sev { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; flex: none; }
.sev.Info { background: var(--brand); } .sev.Warning { background: var(--warn); } .sev.Error { background: var(--danger); }
.list .when { margin-left: auto; color: var(--faint); font-size: 12.5px; white-space: nowrap; padding-left: 12px; }

/* ── charts ── */
.chart { width: 100%; height: 200px; display: block; }
.chart text { font-size: 11px; fill: var(--muted); }
.chart .gridline { stroke: var(--line); stroke-width: 1; }
.chart .ok { fill: var(--brand); }
.chart .fail { fill: var(--danger); }
.chart rect.hit { fill: transparent; }
.chart rect.hit:hover { fill: color-mix(in srgb, var(--ink) 6%, transparent); }
.chart .change { fill: var(--brand); }
.chart .change.high { fill: var(--warn); }
.chart .change.partial { opacity: .55; }
.chart .none { fill: var(--line-strong); }
.all-clear { display: flex; align-items: center; gap: 10px; padding: 14px 18px; color: var(--ink-2); font-size: 13.5px; }
.all-clear svg { color: var(--ok, var(--brand)); flex: none; }
.change-alerts { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.change-alerts li { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.change-alerts li .when { margin-left: auto; color: var(--muted); white-space: nowrap; }
.tip { position: fixed; z-index: 90; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 12.5px; padding: 6px 9px; border-radius: 6px; white-space: nowrap; }

/* ── capacity ── */
.capacity { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--surface-2); outline: 1px solid var(--line); }
.capacity .repo { background: var(--brand); }
.capacity .other { background: var(--line-strong); }
.repo-line { padding: 14px 18px; border-bottom: 1px solid var(--line); }
.repo-line:last-child { border-bottom: 0; }
.repo-line .top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.repo-line .top strong { font-weight: 600; }
.repo-line .top .end { margin-left: auto; color: var(--muted); font-size: 13px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 8px 22px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

/* ── tabs ── */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.tabs a { padding: 10px 14px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 550; }
.tabs a:hover { color: var(--ink); text-decoration: none; }
.tabs a.on { color: var(--ink); border-bottom-color: var(--brand); }

/* ── modal / drawer ── */
.overlay { position: fixed; inset: 0; background: rgba(12, 22, 28, .46); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 24px; animation: fade .16s ease; }
.modal { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-pop); width: min(640px, 100%); max-height: calc(100vh - 48px); display: flex; flex-direction: column; animation: rise .18s ease; }
.modal.wide { width: min(980px, 100%); }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 18px 22px 14px; }
.modal-head h2 { margin: 0; font-size: 18px; font-weight: 600; }
.modal-head .icon-btn { margin-left: auto; }
.modal-body { padding: 4px 22px 18px; overflow-y: auto; }
.modal-foot { display: flex; gap: 8px; justify-content: flex-end; align-items: center; padding: 14px 22px; border-top: 1px solid var(--line); }
.modal-foot .left { margin-right: auto; color: var(--muted); font-size: 13px; }
.drawer-overlay { justify-content: flex-end; padding: 0; }
.drawer { background: var(--surface); width: min(720px, 100%); height: 100%; display: flex; flex-direction: column; box-shadow: var(--shadow-pop); animation: slide .2s ease; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(10px); opacity: 0; } }
@keyframes slide { from { transform: translateX(30px); opacity: 0; } }

/* ── wizard ── */
.wizard { display: grid; grid-template-columns: 220px 1fr; min-height: 520px; max-height: calc(100vh - 48px); min-width: 0; }
.wizard-steps { background: var(--surface-2); border-right: 1px solid var(--line); padding: 20px 14px; border-radius: 14px 0 0 0; }
.wizard-steps ol { list-style: none; padding: 0; margin: 0; counter-reset: s; }
.wizard-steps li { display: flex; gap: 10px; align-items: center; padding: 9px 8px; color: var(--muted); counter-increment: s; }
.wizard-steps li::before { content: counter(s); width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--line-strong); font-size: 12px; font-weight: 600; background: var(--surface); flex: none; }
.wizard-steps li.on { color: var(--ink); font-weight: 600; }
.wizard-steps li.on::before { border-color: var(--brand); color: var(--brand-ink); }
.wizard-steps li.done::before { content: "✓"; background: var(--brand); border-color: var(--brand); color: #fff; }
.wizard-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; max-height: calc(100vh - 48px); }
.wizard-main .modal-body { flex: 1; padding-top: 18px; min-height: 0; overflow-y: auto; }
.wizard-title { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
.wizard-lead { color: var(--muted); margin: 0 0 18px; }
.fingerprint { font-family: "Cascadia Mono", Consolas, monospace; font-size: 14px; letter-spacing: .5px; line-height: 1.8; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; word-break: normal; overflow-wrap: anywhere; }
.callout { display: flex; gap: 12px; padding: 12px 14px; border-radius: 8px; background: var(--info-tint); color: var(--ink-2); margin: 12px 0; }
.callout svg { color: var(--info); margin-top: 1px; }
.callout.warn { background: var(--warn-tint); } .callout.warn svg { color: var(--warn); }
.callout.err { background: var(--danger-tint); } .callout.err svg { color: var(--danger); }
.callout.ok { background: var(--brand-tint); } .callout.ok svg { color: var(--brand); }
.choice { display: grid; gap: 10px; }
.choice label { display: flex; gap: 12px; padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: 9px; cursor: pointer; align-items: flex-start; }
.choice label:hover { background: var(--hover); }
.choice label.on { border-color: var(--brand); background: var(--brand-tint); }
.choice input { margin-top: 3px; accent-color: var(--brand); }
.choice strong { display: block; font-weight: 600; }
.choice small { color: var(--muted); }

/* ── toast ── */
.toasts { position: fixed; right: 22px; bottom: 22px; z-index: 100; display: flex; flex-direction: column; gap: 8px; }
.toast { display: flex; gap: 10px; align-items: flex-start; background: var(--ink); color: var(--surface); padding: 11px 14px; border-radius: 9px; box-shadow: var(--shadow-pop); max-width: 420px; animation: rise .2s ease; }
.toast.err { background: var(--danger); color: #fff; }

/* ── auth ── */
.auth { min-height: 100vh; display: grid; grid-template-columns: minmax(380px, 520px) 1fr; background: var(--surface); }
.auth-form { padding: 56px 56px; display: flex; flex-direction: column; justify-content: center; }
.auth-form h1 { font-size: 26px; margin: 26px 0 6px; font-weight: 600; }
.auth-form p { color: var(--muted); margin: 0 0 24px; }
.auth-art { background: var(--nav); color: var(--nav-ink); padding: 56px; display: flex; flex-direction: column; justify-content: flex-end; position: relative; overflow: hidden; }
.auth-art svg.art { position: absolute; inset: 0; width: 100%; height: 100%; }
.auth-art blockquote { position: relative; margin: 0; font-size: 22px; line-height: 1.5; color: #fff; max-width: 30ch; font-weight: 500; }
.auth-art small { position: relative; display: block; margin-top: 14px; color: var(--nav-muted); }

.log { font-family: "Cascadia Mono", Consolas, monospace; font-size: 12.5px; line-height: 1.7; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; max-height: 420px; overflow: auto; }
.log div { display: grid; grid-template-columns: 74px 1fr; gap: 10px; }
.log .t { color: var(--faint); }
.log .Warning { color: var(--warn); } .log .Error { color: var(--danger); }
.steps { counter-reset: st; list-style: none; padding: 0; margin: 0; }
.steps li { counter-increment: st; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.steps li > div { min-width: 0; }
.steps li:last-child { border-bottom: 0; }
.steps li::before { content: counter(st); width: 24px; height: 24px; border-radius: 50%; background: var(--brand-tint); color: var(--brand-ink); display: grid; place-items: center; font-weight: 600; font-size: 12.5px; }
.steps strong { display: block; font-weight: 600; }
.steps span { color: var(--muted); font-size: 13px; }
.steps span b { color: var(--ink-2); font-weight: 600; }

@media (max-width: 1180px) {
  .grid.dash, .grid.two { grid-template-columns: minmax(0, 1fr); }
  .overview { grid-template-columns: 1fr; }
  .overview-lead { border-right: 0; border-bottom: 1px solid var(--line); }
}
@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .nav { display: none; }
  .overview-facts { grid-template-columns: repeat(2, 1fr); }
  .fact:nth-child(2) { border-right: 0; }
  .wizard { grid-template-columns: 1fr; }
  .wizard-steps { display: none; }
  .auth { grid-template-columns: 1fr; } .auth-art { display: none; }
  .content { padding: 18px 14px 40px; }
  .topbar { padding: 0 14px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }

/* ── backup scope editor ── */
.scope-editor .choice { margin-bottom: 4px; }
.part-pick { margin-top: 12px; display: flex; flex-direction: column; gap: 12px; }
.part-disk { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.part-disk-head { display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.part-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; cursor: pointer; border-top: 1px solid var(--line); }
.part-row:first-of-type { border-top: 0; }
.part-row:hover { background: var(--hover); }
.part-row.off { cursor: default; opacity: .55; }
.part-row input { accent-color: var(--brand); width: 16px; height: 16px; margin: 0; }
.part-row i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.part-row b { font-weight: 600; min-width: 92px; }
.part-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ── file browser ── */
.path-bar { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; min-width: 0; }
.path-seg { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border-radius: 6px; border: 0; background: none; color: var(--ink-2); cursor: pointer; font: inherit; font-size: 13px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.path-seg:hover { background: var(--hover); }
.path-seg.on { color: var(--ink); font-weight: 600; }
.selbar { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.table.files td { padding-top: 7px; padding-bottom: 7px; }
.table.files .fname { display: flex; align-items: center; gap: 9px; min-width: 260px; }
.table.files .fname svg { flex: none; color: var(--muted); }
.table.files .fname span:first-of-type { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 560px; }
.table.files tr[data-dir="1"] .fname svg { color: var(--brand); }
.table.files tr.sel td { background: var(--brand-tint); }
.table.files tr.dim .fname span { color: var(--muted); }
.table.files input[type=checkbox] { accent-color: var(--brand); width: 15px; height: 15px; }
.copy-line { display: flex; gap: 8px; align-items: center; }
.copy-line code { flex: 1; min-width: 0; padding: 8px 10px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); overflow-x: auto; white-space: nowrap; }

/* file-level backup scope */
.file-pick { margin-top: 12px; display: flex; flex-direction: column; gap: 12px; }
.path-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line-strong); border-radius: 9px; overflow: hidden; }
.path-list li { display: flex; align-items: center; gap: 10px; padding: 7px 8px 7px 12px; border-top: 1px solid var(--line); }
.path-list li:first-child { border-top: 0; }
.path-list li .mono { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.path-list li.empty-row { color: var(--muted); font-size: 13px; }
.path-add { display: flex; gap: 8px; }
.path-add .input { flex: 1; }
.picker-list { max-height: 360px; overflow: auto; border: 1px solid var(--line-strong); border-radius: 9px; }
.picker-list .part-row b { min-width: 0; flex: 1; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.picker-list .part-row button { flex: none; }
td.pick, th.pick { width: 34px; }

/* ── page heads: one-line summary, explanations folded behind "?" ── */
.page-title { min-width: 0; flex: 1 1 420px; }
.page-title h1, .page-title h2 { display: flex; align-items: center; gap: 6px; }
.section-head { display: flex; align-items: flex-end; gap: 16px; margin: 30px 0 14px; flex-wrap: wrap; }
.section-head h2 { font-size: 19px; font-weight: 600; margin: 0; }
.section-head p { margin: 4px 0 0; color: var(--muted); max-width: 80ch; }
.section-head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.help-btn { width: 26px; height: 26px; display: inline-grid; place-items: center; border: 0; border-radius: 50%; background: transparent; color: var(--faint); cursor: pointer; flex: none; }
.help-btn:hover, .help-btn[aria-expanded="true"] { color: var(--brand); background: var(--brand-tint); }
.help-body { margin-top: 10px; padding: 12px 16px; border-left: 3px solid var(--brand-line); background: var(--surface); border-radius: 0 8px 8px 0; color: var(--ink-2); max-width: 90ch; font-size: 13.5px; }
.help-body p { margin: 0 0 6px; color: var(--ink-2); max-width: none; }
.help-body p:last-child { margin-bottom: 0; }
.callout.banner { margin: 0 0 16px; align-items: flex-start; }
.callout.banner a { margin-left: 6px; font-weight: 550; }

/* ── "⋯" menus ── */
.menu-wrap { position: relative; display: inline-flex; vertical-align: middle; }
.menu-toggle { padding: 0 8px; }
.menu-list { position: absolute; right: 0; top: 100%; z-index: 60; min-width: 180px; padding: 5px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-pop); display: flex; flex-direction: column; text-align: left; }
.menu-list[hidden] { display: none; }
.menu-list button, .menu-list a { display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 10px; border: 0; background: none; border-radius: 6px; color: var(--ink); font: inherit; font-size: 13.5px; cursor: pointer; white-space: nowrap; text-decoration: none; }
.menu-list button:hover:not([disabled]), .menu-list a:hover, .menu-list button:focus-visible { background: var(--hover); }
.menu-list button[disabled] { color: var(--faint); cursor: default; }
.menu-list .danger { color: var(--danger); }
.menu-list svg { color: var(--muted); flex: none; }
.menu-list .danger svg { color: var(--danger); }
.menu-sep { height: 1px; background: var(--line); margin: 4px 2px; }
.actions-cell { white-space: nowrap; text-align: right; }

/* ── dashboard ── */
a.fact { color: inherit; text-decoration: none; }
a.fact:hover { background: var(--hover); }
.fact .v .unit { font-size: 14px; font-weight: 500; color: var(--muted); }
.fact .v.warn { color: var(--warn); }
.warn-text { color: var(--warn); font-weight: 550; }
.err-text { color: var(--danger); }
.legend i.line { height: 3px; width: 14px; border-radius: 2px; }
.chart .fail { opacity: .85; }
.chip.warn { border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); color: var(--warn); }
.chip.warn.on { background: var(--warn); border-color: var(--warn); color: #fff; }
.pill svg { width: 12px; height: 12px; margin-right: 2px; vertical-align: -1px; }

/* ── lists and tables ── */
.toolbar-end { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.toolbar.filters .input { width: auto; min-width: 140px; }
.toolbar-end input.input { width: 220px; }
.table-wrap { overflow-x: auto; }
.status-msg { max-width: 260px; margin-top: 4px; }
.clip-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.vol-tags { display: flex; gap: 4px; flex-wrap: wrap; }
.timeline-body { border-bottom: 1px solid var(--line); }
.repo-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 28px; }
.tiers { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
.tier { display: inline-flex; gap: 5px; align-items: baseline; padding: 2px 8px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
.tier b { color: var(--ink); font-weight: 600; }

/* ── restore wizard ── */
.stepper { display: flex; list-style: none; padding: 0; margin: 0 0 18px; gap: 0; counter-reset: step; overflow-x: auto; }
.stepper li { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13.5px; white-space: nowrap; counter-increment: step; }
.stepper li + li::before { content: ""; width: 34px; height: 1px; background: var(--line-strong); margin: 0 10px; }
.stepper li > *::before { content: counter(step); display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line-strong); margin-right: 8px; font-size: 12px; }
.stepper li.on { color: var(--ink); font-weight: 600; }
.stepper li.on > *::before { background: var(--brand); border-color: var(--brand); color: #fff; }
.stepper li.done > *::before { content: "✓"; background: var(--brand-tint); border-color: var(--brand-line); color: var(--brand-ink); }
.stepper button { border: 0; background: none; color: var(--brand-ink); font: inherit; cursor: pointer; padding: 0; }
.kind-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.kind-card { display: flex; flex-direction: column; gap: 8px; text-align: left; padding: 18px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font: inherit; cursor: pointer; }
.kind-card:hover, .kind-card.on { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-tint); }
.kind-card strong { color: var(--ink); font-size: 16px; }
.kind-card span { font-size: 13px; line-height: 1.55; }
.kind-icon { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; background: var(--brand-tint); color: var(--brand); }
.pick-list { display: flex; flex-direction: column; max-height: 560px; overflow-y: auto; }
.pick-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; font: inherit; color: var(--ink); cursor: pointer; }
.pick-row:first-child { border-top: 0; }
.pick-row:hover:not([disabled]) { background: var(--hover); }
.pick-row.on { background: var(--brand-tint); }
.pick-row.off { opacity: .5; cursor: default; }
.pick-row .clip { flex: 1 1 auto; min-width: 0; max-width: none; }
.pick-row > .pill { margin-left: auto; flex: none; }
.pick-row .clip small { display: block; }
.pick-row > svg:last-child { color: var(--faint); }
.pick-row .radio { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line-strong); flex: none; }
.pick-row.on .radio { border-color: var(--brand); box-shadow: inset 0 0 0 3px var(--surface); background: var(--brand); }

/* ── notification settings ── */

        <label class="${state.mode === 'files' ? 'on' : ''}${linux ? ' off' : ''}" title="${linux ? 'Linux 计算机暂不支持文件级备份' : ''}"><input type="radio" name="scope-mode" value="files" ${state.mode === 'files' ? 'checked' : ''} ${linux ? 'disabled' : dis}><span><strong>文件和文件夹</strong><small>${linux ? 'Linux 计算机暂不支持文件级备份（可选“指定分区”只备份 /home 等分区）。' : ''}文件级备份：只备份所选文件夹（例如 C:\\Users），可按名称或路径排除；恢复点可浏览、下载或写回文件，不能裸机恢复</small></span></label>
      </div>
      ${state.mode === 'files' ? h`<div class="file-pick">
        <div class="field" style="margin:0"><span class="label">要备份的文件夹或文件</span>
          <ul class="path-list">${files.include.length ? files.include.map((p) => h`<li><span class="mono" title="${p}">${p}</span>${editable === false ? '' : h`<button type="button" class="icon-btn" data-fs-remove="${p}" aria-label="${'移除 ' + p}">${icon('close', 14)}</button>`}</li>`)
            : h`<li class="empty-row">还没有选择文件夹</li>`}</ul>
          ${editable === false ? '' : h`<div class="path-add" style="margin-top:8px"><input class="input mono" data-fs-input placeholder="输入路径后添加，例如 D:\\Projects" aria-label="要添加的路径">
            <button type="button" class="btn" data-fs-add>${icon('plus')}添加</button>${state.machineId ? h`<button type="button" class="btn" data-fs-browse>${icon('folder')}浏览…</button>` : ''}</div>
          <div class="part-actions" style="margin-top:8px">${fileVolumes(layout).filter((p) => p.volume.driveLetter.toUpperCase() === 'C').length ? h`<button type="button" class="btn sm" data-fs-preset="C:\\Users">用户文件夹 C:\\Users</button>` : ''}
            ${fileVolumes(layout).filter((p) => p.role === 'Data').map((p) => h`<button type="button" class="btn sm" data-fs-preset="${p.volume.driveLetter.toUpperCase() + ':\\'}">${'整个 ' + partName(p)}</button>`)}</div>`}
        </div>
        <div class="field" style="margin:0"><label for="fs-exclude">排除规则（每行一条，可选）</label>
          <textarea class="input mono" id="fs-exclude" data-fs-exclude rows="4" ${dis} placeholder="${'*.tmp\nnode_modules\nC:\\Users\\*\\AppData\\Local\\Temp'}">${files.exclude.join('\n')}</textarea>
          <span class="hint">不含 \\ 的规则按文件或文件夹名称匹配（支持 * 和 ?），如 *.tmp、node_modules；含 \\ 的规则按完整路径匹配并排除其下全部内容，如 C:\\Users\\*\\AppData\\Local\\Temp。页面文件、休眠文件、System Volume Information 和回收站始终排除；联接点和符号链接不跟随。</span>
        </div>
        ${files.include.length ? h`<div class="callout">${icon('info')}<div>NTFS / ReFS 卷使用 VSS 快照读取；之后的备份只读取大小或修改时间变化的文件。文件级恢复点可以挂载浏览、下载或写回原位置，不能用于裸机恢复。</div></div>`
          : h`<div class="callout warn">${icon('warn')}<div>请至少选择一个文件夹或文件。</div></div>`}
      </div>` : ''}
      ${state.mode === 'parts' ? h`<div class="part-pick">
        ${disks.map((d) => h`<div class="part-disk">
          <div class="part-disk-head">${icon('disk')}<b>磁盘 ${d.number}</b><span class="muted small">${d.friendlyName} · ${bytes(d.size)} · ${d.partitionStyle}</span>${d.isBoot || d.isSystem ? h`<span class="tag brand">系统磁盘</span>` : ''}${d.supported === false ? h`<span class="tag">${d.unsupportedReason || '不受支持'}</span>` : ''}</div>
          ${(d.partitions || []).map((p) => {
            const v = p.volume || {};
            const off = d.supported === false || p.capture === 'LayoutOnly';
            return h`<label class="${'part-row' + (off ? ' off' : '')}"><input type="checkbox" data-part="${p.key}" ${state.included.includes(p.key) ? 'checked' : ''} ${off || editable === false ? 'disabled' : ''}>
              <i style="${'background:' + roleColor(p.role)}"></i><b>${partName(p)}</b>
              <span class="muted small">${roleName(p.role)} · ${bytes(p.size)}${v.fileSystem ? ' · ' + v.fileSystem : ''}${v.size ? ' · 已用 ' + bytes(v.size - v.free) : ''}${p.capture === 'LayoutOnly' ? ' · 只记录布局' : ''}</span></label>`;
          })}
        </div>`)}
        ${editable === false ? '' : h`<div class="part-actions"><button type="button" class="btn sm" data-preset="boot">勾选系统与引导分区</button><button type="button" class="btn sm" data-preset="data">只选数据分区</button><button type="button" class="btn sm ghost" data-preset="none">全部取消</button></div>`}
        ${!state.included.length ? h`<div class="callout warn">${icon('warn')}<div>请至少选择一个分区。</div></div>`
          : ready ? h`<div class="callout ok">${icon('shield')}<div>已包含${sys}，恢复点仍可用于裸机恢复。</div></div>`
          : h`<div class="callout warn">${icon('info')}<div>所选分区不含完整的${sys}：恢复点可以${linux ? '下载分区映像' : '挂载浏览、恢复文件'}，或在恢复控制台按卷写回，但不能裸机恢复为可启动系统。</div></div>`}
      </div>` : ''}
    </div>`;
  }
  // Wires a rendered scopeEditor; calls redraw() after every change.
  function bindScope(root, layout, state, redraw) {
    const files = state.files || (state.files = { include: [], exclude: [] });
    root.querySelectorAll('input[name=scope-mode]').forEach((r) => r.addEventListener('change', () => {
      state.mode = r.value;
      if (state.mode === 'parts' && !state.included.length) state.included = allParts(layout).filter((p) => p.disk.supported !== false && p.capture !== 'LayoutOnly' && p.volume && (p.volume.driveLetter || p.volume.mountPoint || p.role === 'Lvm')).map((p) => p.key);
      if (state.mode === 'files' && !files.include.length) files.include = fileDefaults(layout);
      redraw();
    }));
    const addPaths = (paths) => {
      const bad = [];
      paths.forEach((raw) => {
        const p = normPath(raw);
        if (!p) { bad.push(raw); return; }
        if (!files.include.some((x) => x.toLowerCase() === p.toLowerCase())) files.include = files.include.concat(p);
      });
      if (bad.length) toast('不是本地绝对路径：' + bad.join('、'), 'err');
      redraw();
    };
    const input = root.querySelector('[data-fs-input]');
    const add = root.querySelector('[data-fs-add]');
    if (add) add.addEventListener('click', () => { if (input.value.trim()) addPaths([input.value]); });
    if (input) input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); if (input.value.trim()) addPaths([input.value]); } });
    root.querySelectorAll('[data-fs-remove]').forEach((b) => b.addEventListener('click', () => { files.include = files.include.filter((x) => x !== b.dataset.fsRemove); redraw(); }));
    root.querySelectorAll('[data-fs-preset]').forEach((b) => b.addEventListener('click', () => addPaths([b.dataset.fsPreset])));
    const browse = root.querySelector('[data-fs-browse]');
    if (browse) browse.addEventListener('click', () => folderPicker(state.machineId, addPaths));
    const exclude = root.querySelector('[data-fs-exclude]');
    // Updates state without redrawing, so typing keeps the caret.
    if (exclude) exclude.addEventListener('input', () => { files.exclude = exclude.value.split('\n').map((x) => x.trim()).filter(Boolean); });
    root.querySelectorAll('[data-part]').forEach((c) => c.addEventListener('change', () => {
      state.included = c.checked ? state.included.concat(c.dataset.part) : state.included.filter((k) => k !== c.dataset.part);
      redraw();
    }));
    root.querySelectorAll('[data-preset]').forEach((b) => b.addEventListener('click', () => {
      const usable = allParts(layout).filter((p) => p.disk.supported !== false && p.capture !== 'LayoutOnly');
      if (b.dataset.preset === 'boot') state.included = [...new Set(state.included.concat(bootKeys(layout)))];
      if (b.dataset.preset === 'data') state.included = usable.filter((p) => p.role === 'Data').map((p) => p.key);
      if (b.dataset.preset === 'none') state.included = [];
      redraw();
    }));
  }
  function scopeSummary(layout, included, files, scope) {
    if (files && files.include && files.include.length) return '文件和文件夹：' + files.include.join('、') + (files.exclude && files.exclude.length ? `（排除 ${files.exclude.length} 条规则）` : '');
    if (!included || !included.length) return scope === 'SystemDisks' ? '仅系统磁盘' : '整机';
    const names = allParts(layout).filter((p) => included.includes(p.key)).map(partName);
    return '指定分区：' + (names.length ? names.join('、') : included.length + ' 个');
  }

  // Scope editor state of a machine (from the API view) and back to the fields of PUT /machines/{id}.
  function scopeStateOf(m) {
    const files = m.fileSelection && m.fileSelection.include && m.fileSelection.include.length ? m.fileSelection : null;
    return {
      mode: files ? 'files' : m.includedPartitions && m.includedPartitions.length ? 'parts' : m.scope === 'SystemDisks' ? 'system' : 'machine',
      included: (m.includedPartitions || []).slice(),
      files: { include: files ? files.include.slice() : [], exclude: files ? (files.exclude || []).slice() : [] }, machineId: m.archived ? null : m.id
    };
  }
  function scopePayload(state) {
    if (state.mode === 'parts' && !state.included.length) throw new Error('请至少选择一个要备份的分区。');
    if (state.mode === 'files' && !state.files.include.length) throw new Error('请至少选择一个要备份的文件夹。');
    return { scope: state.mode === 'system' ? 'SystemDisks' : 'Machine', includedPartitions: state.mode === 'parts' ? state.included : [], files: state.mode === 'files' ? state.files : null };
  }
  // Repository picker of a machine: local and network repositories (offline drives are filled by their own sync).
  function repoOptions(repositories, selected) {
    return repositories.filter((r) => r.kind !== 'Offline').map((r) => h`<option value="${r.id}" ${r.id === selected ? 'selected' : ''}>${r.name}${r.kind === 'Network' ? '（网络共享）' : ''}${r.status === 'Online' ? '' : ' · 离线'}</option>`);
  }

  // ── folder picker on the live file system of a protected machine (file-level backup scope) ──
  function folderPicker(machineId, onPick) {
    const s = { path: '', listing: null, selected: new Set(), error: '', loading: true };
    const m = modal({ title: '选择要备份的文件夹', wide: true, body: '' });
    async function load(path) {
      s.loading = true; s.error = ''; draw();
      try { s.listing = await R.api.get('/machines/' + machineId + '/files?path=' + encodeURIComponent(path)); s.path = s.listing.path || ''; }
      catch (e) { s.error = e.message; }
      s.loading = false; draw();
    }
    function draw() {
      const segs = s.path ? s.path.replace(/\\$/, '').split('\\') : [];
      const entries = s.listing ? s.listing.entries : [];
      m.set(h`<p style="margin-top:0" class="muted small">列出的是客户端当前的文件系统。勾选文件夹或文件后点“添加所选”；文件夹会连同其下全部内容一起备份。</p>
        <nav class="path-bar" aria-label="路径" style="margin-bottom:8px">
          <button class="${'path-seg' + (segs.length ? '' : ' on')}" data-go="">${icon('machines', 14)}此电脑</button>
          ${segs.map((seg, i) => h`${icon('chevron', 12)}<button class="${'path-seg' + (i === segs.length - 1 ? ' on' : '')}" data-go="${segs.slice(0, i + 1).join('\\') + (i === 0 ? '\\' : '')}">${seg}</button>`)}
        </nav>
        ${s.error ? h`<div class="callout err">${icon('error')}<div>${s.error}</div></div>` : ''}
        <div class="picker-list">${s.loading ? h`<div class="empty small">正在读取…</div>` : entries.length ? entries.map((e) => h`<label class="part-row">
            <input type="checkbox" data-pick="${e.path}" ${s.selected.has(e.path) ? 'checked' : ''}>${icon(e.directory ? (s.path ? 'folder' : 'disk') : 'file', 16)}
            <b title="${e.path}">${e.name}${e.label ? ' ' + e.label : ''}</b>
            <span class="muted small">${e.total ? (e.fileSystem || '') + ' · 可用 ' + bytes(e.free) + ' / ' + bytes(e.total) : e.directory ? '' : bytes(e.size)}</span>
            ${e.directory ? h`<button type="button" class="btn sm ghost" data-go="${e.path}">打开${icon('chevron', 12)}</button>` : ''}</label>`)
          : h`<div class="empty small">此文件夹为空</div>`}</div>
        ${s.listing && s.listing.truncated ? h`<p class="small muted">文件夹过大，只显示前 5000 项。可以直接在输入框中输入路径。</p>` : ''}
        <div class="modal-foot" style="padding:12px 0 0"><span class="left muted small">${s.selected.size ? '已选择 ' + s.selected.size + ' 项' : ''}</span>
          ${s.path ? h`<button class="btn" data-current>添加当前文件夹</button>` : ''}<button class="btn" data-close>取消</button><button class="btn primary" data-add ${s.selected.size ? '' : 'disabled'}>添加所选</button></div>`);
      m.el.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); load(b.dataset.go); }));
      m.el.querySelectorAll('[data-pick]').forEach((c) => c.addEventListener('change', () => { if (c.checked) s.selected.add(c.dataset.pick); else s.selected.delete(c.dataset.pick); draw(); }));
      const cur = m.el.querySelector('[data-current]');
      if (cur) cur.addEventListener('click', () => { m.close(); onPick([s.path]); });
      const addBtn = m.el.querySelector('[data-add]');
      if (addBtn) addBtn.addEventListener('click', () => { m.close(); onPick([...s.selected]); });
    }
    load('');
  }

  // Tag for recovery points copied to an offline drive.
  function originTag(p) {
    if (p.origin === 'Standalone') return h` <span class="tag brand" title="手动复制到离线盘的独立完整恢复点：不依赖其他恢复点，单独即可恢复，不参与保留策略">独立完整</span>`;
    if (p.origin === 'Copy') return h` <span class="tag" title="从存储库复制到离线盘">副本</span>`;
    return '';
  }

  // ── recovery point chain timeline ──
  function timeline(points, selected) {
    if (!points.length) return h`<div class="empty">还没有恢复点</div>`;
    const sorted = points.slice().sort((a, b) => a.created - b.created);
    const t0 = sorted[0].created, t1 = Math.max(sorted[sorted.length - 1].created, t0 + 3600e3);
    // Power scale: recent points (dense) get more room than old ones (sparse after retention).
    const k = 0.4;
    const x = (t) => 2 + (1 - Math.pow(Math.max(0, (t1 - t) / (t1 - t0)), k)) * 96;
    const at = (f) => t1 - Math.pow(1 - f, 1 / k) * (t1 - t0);
    const chains = {};
    sorted.forEach((p) => { (chains[p.chainId] = chains[p.chainId] || []).push(p); });
    const ticks = [];
    for (let i = 0; i <= 4; i++) ticks.push(at(i / 4));
    return h`<div class="timeline">
      <div class="tl-track">
        <div class="tl-axis"></div>
        ${Object.values(chains).map((c) => h`<div class="tl-chain" style="${'left:' + x(c[0].created) + '%;width:' + Math.max(0.4, x(c[c.length - 1].created) - x(c[0].created)) + '%'}"></div>`)}
        ${sorted.map((p) => h`<button class="${'tl-pt' + (p.kind === 'Base' ? ' base' : '') + (p.id === selected ? ' sel' : '') + (p.verifyStatus === 'Failed' ? ' bad' : '')}" style="${'left:' + x(p.created) + '%'}" data-action="select-point" data-id="${p.id}" title="${(p.kind === 'Base' ? '基准 · ' : '增量 · ') + dateTime(p.created) + ' · 变化 ' + bytes(p.changedBytes)}" aria-label="${dateTime(p.created)}"></button>`)}
      </div>
      <div class="tl-labels">${ticks.map((t, i) => h`<span style="${'left:' + x(t) + '%;' + (i === 0 ? 'transform:none' : i === 4 ? 'transform:translateX(-100%)' : '')}">${i === 4 ? dateTime(t) : ago(t)}</span>`)}</div>
    </div>`;
  }

  // ── 14-day activity chart (stacked bars) ──
  function activityChart(history) {
    const W = 640, H = 200, L = 30, B = 22, T = 10;
    const max = Math.max(4, ...history.map((d) => d.succeeded + d.failed));
    const raw4 = max / 4, mag = Math.pow(10, Math.floor(Math.log10(raw4)));
    const step = [1, 2, 2.5, 5, 10].map((f) => f * mag).find((v) => v >= raw4 && Number.isInteger(v)) || Math.ceil(raw4);
    const top = step * 4;
    const bw = (W - L) / history.length;
    const y = (v) => T + (H - T - B) * (1 - v / top);
    let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="近 14 天备份作业">`;
    for (let i = 0; i <= 4; i++) s += `<line class="gridline" x1="${L}" x2="${W}" y1="${y(i * step)}" y2="${y(i * step)}"/><text x="${L - 6}" y="${y(i * step) + 4}" text-anchor="end">${i * step}</text>`;
    history.forEach((d, i) => {
      const x0 = L + i * bw + bw * 0.22, w = bw * 0.56;
      const okTop = y(d.succeeded), failTop = y(d.succeeded + d.failed);
      if (d.succeeded) s += `<rect class="ok" x="${x0}" y="${okTop}" width="${w}" height="${y(0) - okTop}" rx="2"/>`;
      if (d.failed) s += `<rect class="fail" x="${x0}" y="${failTop}" width="${w}" height="${Math.max(1.5, okTop - failTop - (d.succeeded ? 1.5 : 0))}" rx="2"/>`;
      const label = d.date.slice(5).replace('-', '/');
      if (i % 2 === history.length % 2 || i === history.length - 1) s += `<text x="${x0 + w / 2}" y="${H - 6}" text-anchor="middle">${i === history.length - 1 ? '今天' : label}</text>`;
      s += `<rect class="hit" x="${L + i * bw}" y="${T}" width="${bw}" height="${H - T - B}" data-tip="${esc(label + '：成功 ' + d.succeeded + '，失败 ' + d.failed)}"/>`;
    });
    return raw(s + '</svg>');
  }

  // ── 14-day data change (bars) ──
  // What incremental backups changed per day. A day far above the usual is drawn in the warning color; today is still
  // accumulating, so it is drawn lighter instead of reading as a drop.
  function changeChart(days, alertToday) {
    const W = 640, H = 200, L = 52, B = 22, T = 10;
    // One unit for the whole axis (the largest that keeps the top value at 1 or more), so labels never mix "1000 GB" and "1 TB".
    const max = Math.max(1, ...days.map((d) => d.bytes));
    let ui = 0; while (max / 1024 ** (ui + 1) >= 1 && ui < units.length - 1) ui++;
    const u = 1024 ** ui, raw4 = max / u / 4, mag = Math.pow(10, Math.floor(Math.log10(raw4)));
    const step = [1, 2, 2.5, 5, 10].map((f) => f * mag).find((v) => v >= raw4) * u;
    const axis = (v) => +(v / u).toFixed(2) + ' ' + units[ui];
    const top = step * 4;
    const done = days.slice(0, -1).map((d) => d.bytes).filter((v) => v > 0).sort((x, y) => x - y);
    const usual = done.length >= 3 ? done[Math.floor(done.length / 2)] : 0;
    const bw = (W - L) / days.length;
    const y = (v) => T + (H - T - B) * (1 - v / top);
    let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="近 14 天每天的数据变化量">`;
    for (let i = 0; i <= 4; i++) s += `<line class="gridline" x1="${L}" x2="${W}" y1="${y(i * step)}" y2="${y(i * step)}"/><text x="${L - 6}" y="${y(i * step) + 4}" text-anchor="end">${i ? axis(i * step) : '0'}</text>`;
    days.forEach((d, i) => {
      const x0 = L + i * bw + bw * 0.22, w = bw * 0.56, last = i === days.length - 1;
      const high = (last && alertToday) || (usual > 0 && d.bytes >= usual * 2 && d.bytes - usual >= 2 ** 30);
      const label = d.date.slice(5).replace('-', '/');
      if (d.bytes) s += `<rect class="${'change' + (high ? ' high' : '') + (last ? ' partial' : '')}" x="${x0}" y="${y(d.bytes)}" width="${w}" height="${Math.max(1.5, y(0) - y(d.bytes))}" rx="2"/>`;
      else if (d.points === 0) s += `<circle class="none" cx="${x0 + w / 2}" cy="${y(0) - 3}" r="2"/>`;
      if (i % 2 === days.length % 2 || last) s += `<text x="${x0 + w / 2}" y="${H - 6}" text-anchor="middle">${last ? '今天' : label}</text>`;
      const tip = d.points ? `${label}${last ? '（截至现在）' : ''}：变化 ${bytes(d.bytes)}，${d.points} 次增量备份${high && usual ? (last && alertToday ? '，有计算机变化量异常' : `，约为平时的 ${(d.bytes / usual).toFixed(1)} 倍`) : ''}` : `${label}：没有增量备份`;
      s += `<rect class="hit" x="${L + i * bw}" y="${T}" width="${bw}" height="${H - T - B}" data-tip="${esc(tip)}"/>`;
    });
    return raw(s + '</svg>');
  }

  // ── "⋯" action menus ──
  // items: [{ action, id, label, icon, danger, disabled, title, href }] or '-' for a separator. Items carry data-action, so
  // the current page's actions handle them like any other button.
  function menu(items, label) {

    const first = new Date(p.from); first.setHours(0, 0, 0, 0);
    const last = new Date(p.to - 1); last.setHours(0, 0, 0, 0);
    for (const d = new Date(first); d <= last; d.setDate(d.getDate() + 1)) {

      r.failures.push({ jobId: j.id, time: j.ended, machineId: j.machineId, machine: nameOf(j), message: j.message || '', category: c.category, categoryLabel: c.label, recovered: at != null, recoveredAt: at }); });

    r.machines.filter((m) => m.unrecovered > 0).forEach((m) => r.issues.push({ severity: 'Error', text: `${m.name} 有 ${m.unrecovered} 次失败之后还没有成功的备份：${m.lastFailure}`, machineId: m.machineId, link: 'machines/' + m.machineId }));
