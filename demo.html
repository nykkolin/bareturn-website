              <div class="field"><label>收件人</label><input class="input mono" name="emailTo" value="${(em.to || []).join(', ')}" placeholder="ops@corp.local, it@corp.local" ${dis}><span class="hint">多个地址用逗号分隔</span></div></div>
            ${can('admin') ? h`<button type="button" class="btn sm" data-action="testChannel" data-channel="email">${icon('mail')}保存并发送测试邮件</button>` : ''}${err('邮件')}
          </div></section>
          <section class="panel"><div class="panel-head">${icon('link')}<h2>Webhook / 机器人</h2><div class="end">${can('admin') ? h`<button type="button" class="btn sm" data-action="addHook">${icon('plus')}添加</button>` : ''}</div></div>
            ${nf.hooks.length ? h`<ul class="list">${nf.hooks.map((w) => h`<li>
              <span class="${'pill ' + (w.enabled ? 'ok' : 'off')}">${w.enabled ? '启用' : '停用'}</span>
              <div><b>${w.name}</b><div class="small muted">${HOOK_KINDS[w.kind] || w.kind} · <span class="mono">${w.url ? w.url.replace(/^(https?:\/\/[^/]+).*$/, '$1/…') : w.urlHint || ''}</span>${w.secretSet || w.secret ? ' · 已加签' : ''}</div>${err(w.name)}</div>
              <span class="when">${can('admin') ? h`${w.id ? h`<button type="button" class="btn sm" data-action="testChannel" data-channel="${'webhook:' + w.id}">测试</button>` : ''}${R.menu([{ action: 'editHook', id: w.id || w.tmp, label: '编辑…', icon: 'settings' }, { action: 'removeHook', id: w.id || w.tmp, label: '删除', icon: 'trash', danger: true }])}` : ''}</span></li>`)}</ul>`
              : h`<div class="empty small">把告警发到企业微信、钉钉、飞书或 Slack 群，或发给任意接收 JSON 的地址。</div>`}
          </section>
          <section class="panel"><div class="panel-head">${icon('audit')}<h2>Syslog</h2><label class="check end" style="margin:0"><input type="checkbox" name="syslogEnabled" ${sy.enabled ? 'checked' : ''} ${dis}><span>启用</span></label></div><div class="panel-body">
            <div class="row" style="grid-template-columns:2fr 1fr 1fr"><div class="field"><label>服务器</label><input class="input mono" name="syslogHost" value="${sy.host}" placeholder="siem.corp.local" ${dis}></div>
              <div class="field"><label>端口</label><input class="input" type="number" name="syslogPort" value="${sy.port}" ${dis}></div>
              <div class="field"><label>协议</label><select class="input" name="syslogProtocol" ${dis}>${['Udp', 'Tcp'].map((k) => h`<option value="${k}" ${sy.protocol === k ? 'selected' : ''}>${k.toUpperCase()}</option>`)}</select></div></div>
            <p class="small muted" style="margin:0 0 10px">RFC 5424 格式，设施 local0，应用名 BareTurn。</p>
            ${can('admin') ? h`<button type="button" class="btn sm" data-action="testChannel" data-channel="syslog">保存并发送测试消息</button>` : ''}${err('Syslog')}
          </div></section>
        </div>
        <div class="stack">
          <section class="panel"><div class="panel-head">${icon('bell')}<h2>告警规则</h2></div><div class="panel-body rules">
            ${rule('jobFailed', r.jobFailed, '作业失败（备份、校验、异地复制、恢复等）')}
            ${rule('jobWarning', r.jobWarning, '作业完成但有警告')}
            ${rule('rpoOverdue', r.rpoOverdue, '计算机未按计划备份', h`<span class="small muted">宽限</span>${num('rpoGraceMinutes', r.rpoGraceMinutes, 0, 10080, '分钟（0 = 自动）')}`)}
            ${rule('machineOffline', r.machineOffline, '计算机离线超过', num('offlineMinutes', r.offlineMinutes, 0, 10080, '分钟'))}
            ${rule('repositoryLow', r.repositoryLow, '存储库所在磁盘剩余低于', num('repositoryFreePercent', r.repositoryFreePercent, 1, 90, '%'))}
            ${rule('repositoryUnreachable', r.repositoryUnreachable, '存储库无法访问（含 NAS 断线）')}
            ${rule('integrityFailed', r.integrityFailed, '恢复点完整性检查失败')}
            ${rule('offlineDriveStale', r.offlineDriveStale, '离线盘未更新超过', num('offlineDriveDays', r.offlineDriveDays, 1, 365, '天'))}
            ${rule('offsiteStale', r.offsiteStale, '异地副本未成功复制超过', num('offsiteHours', r.offsiteHours, 1, 2160, '小时'))}
            <div class="rule-sep"></div>
            <div class="rule"><span>问题持续时每</span>${num('repeatHours', r.repeatHours, 0, 720, '小时提醒一次（0 = 只通知一次）')}</div>
            ${rule('resolved', r.resolved, '问题解决后发送“已恢复”通知')}
          </div></section>
          <section class="panel"><div class="panel-head">${icon('clock')}<h2>保护摘要</h2><label class="check end" style="margin:0"><input type="checkbox" name="digestEnabled" ${dg.enabled ? 'checked' : ''} ${dis}><span>启用</span></label></div><div class="panel-body">
            <div class="row" style="grid-template-columns:1fr 1fr 1fr"><div class="field"><label>频率</label><select class="input" name="digestFrequency" ${dis}><option value="Daily" ${dg.frequency === 'Daily' ? 'selected' : ''}>每天</option><option value="Weekly" ${dg.frequency === 'Weekly' ? 'selected' : ''}>每周</option></select></div>
              <div class="field"><label>星期（每周）</label><select class="input" name="digestDay" ${dis}>${['日', '一', '二', '三', '四', '五', '六'].map((d, i) => h`<option value="${i}" ${dg.day === i ? 'selected' : ''}>星期${d}</option>`)}</select></div>
              <div class="field"><label>时间</label><input class="input" type="time" name="digestTime" value="${dg.time}" ${dis}></div></div>
            <p class="small muted" style="margin:0">计算机状态、按计划备份达标情况、备份成功与失败次数、存储库空间、离线盘与异地副本。</p>
          </div></section>
          <section class="panel"><div class="panel-head"><h2>通知中的链接</h2></div><div class="panel-body">
            <div class="field" style="margin:0"><label>控制台地址（可选）</label><input class="input mono" name="consoleUrl" value="${n.consoleUrl || ''}" placeholder="${location.origin + '/'}" ${dis}><span class="hint">通知中的“在控制台中查看”链接使用此地址；留空时使用 Core 服务器的主机名与端口。</span></div>
          </div></section>
        </div>
      </div>
      ${can('admin') ? h`<div class="sticky-save"><button type="button" class="btn primary" data-action="saveNotifications">保存通知设置</button>${nf.dirty ? h`<span class="small muted">有未保存的修改</span>` : ''}</div>` : ''}
    </form>`;
  }

  // Keeps typed but unsaved values when the tab is redrawn (adding or editing a webhook).
  function keepForm(ctx) {
    const form = document.getElementById('notify-form');
    if (!form || !ctx.state.data.notifications) return;
    const b = readForm(form), n = ctx.state.data.notifications.settings;
    Object.assign(n.email, b.email, { password: undefined }); n.syslog = b.syslog; n.rules = b.rules; n.digest = b.digest; n.consoleUrl = b.consoleUrl;
  }

  async function saveNotifications() {
    const saved = await R.api.put('/settings/notifications', readForm(document.getElementById('notify-form')));
    nf.hooks = saved.webhooks.map((w) => Object.assign({}, w));
    nf.dirty = false;
  }

  function readForm(form) {
    const f = R.formData(form);
    const body = {
      email: { enabled: f.emailEnabled, host: f.emailHost, port: f.emailPort || 587, security: f.emailSecurity, userName: f.emailUser || null, password: f.emailPassword ? f.emailPassword : null, from: f.emailFrom, to: (f.emailTo || '').split(/[,;\s]+/).filter(Boolean) },
      webhooks: nf.hooks.map((w) => ({ id: w.id || null, name: w.name, kind: w.kind, enabled: w.enabled, url: w.url || null, secret: w.secret === undefined ? null : w.secret })),
      syslog: { enabled: f.syslogEnabled, host: f.syslogHost, port: f.syslogPort || 514, protocol: f.syslogProtocol },
      rules: { jobFailed: f.jobFailed, jobWarning: f.jobWarning, rpoOverdue: f.rpoOverdue, rpoGraceMinutes: f.rpoGraceMinutes || 0, machineOffline: f.machineOffline, offlineMinutes: f.offlineMinutes ?? 30,
        repositoryLow: f.repositoryLow, repositoryFreePercent: f.repositoryFreePercent || 10, repositoryUnreachable: f.repositoryUnreachable, offlineDriveStale: f.offlineDriveStale, offlineDriveDays: f.offlineDriveDays || 14,
        integrityFailed: f.integrityFailed, offsiteStale: f.offsiteStale, offsiteHours: f.offsiteHours || 48, repeatHours: f.repeatHours ?? 24, resolved: f.resolved },
      digest: { enabled: f.digestEnabled, frequency: f.digestFrequency, time: f.digestTime || '08:00', day: Number(f.digestDay) },
      consoleUrl: f.consoleUrl || null
    };
    return body;
  }

  function hookDialog(hook, ctx) {
    const s = Object.assign({ name: '', kind: 'WeCom', enabled: true, url: '', secret: undefined }, hook || {});
    const m = R.modal({ title: hook ? '编辑 Webhook' : '添加 Webhook', body: '' });
    function draw() {
      const signed = s.kind === 'DingTalk' || s.kind === 'Feishu';
      m.set(h`<form id="hook-form">
        <div class="row"><div class="field"><label>名称</label><input class="input" name="name" value="${s.name}" placeholder="运维群"></div>
          <div class="field"><label>类型</label><select class="input" name="kind" id="hook-kind">${Object.entries(HOOK_KINDS).map(([k, l]) => h`<option value="${k}" ${s.kind === k ? 'selected' : ''}>${l}</option>`)}</select></div></div>
        <div class="field"><label>Webhook 地址</label><input class="input mono" name="url" value="${s.url || ''}" placeholder="${hook && hook.urlHint ? '已设置（' + hook.urlHint + '），不修改请留空' : s.kind === 'WeCom' ? 'https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=…' : s.kind === 'DingTalk' ? 'https://oapi.dingtalk.com/robot/send?access_token=…' : s.kind === 'Feishu' ? 'https://open.feishu.cn/open-apis/bot/v2/hook/…' : 'https://…'}"><span class="hint">地址中包含机器人的访问令牌，以 DPAPI 加密保存，不会再显示。</span></div>
        ${signed ? h`<div class="field"><label>加签密钥（可选）</label><input class="input mono" name="secret" type="password" placeholder="${hook && hook.secretSet ? '已设置，不修改请留空' : 'SEC…'}" autocomplete="new-password"><span class="hint">机器人安全设置中启用了“加签”时填写。</span></div>` : ''}
        <label class="check"><input type="checkbox" name="enabled" ${s.enabled ? 'checked' : ''}><span>启用</span></label>
      </form>`);
      m.el.querySelector('#hook-kind').addEventListener('change', (e) => { Object.assign(s, R.formData(m.el.querySelector('#hook-form'))); s.kind = e.target.value; draw(); });
    }
    draw();
    const foot = document.createElement('div');
    foot.className = 'modal-foot';
    foot.innerHTML = String(h`<span class="left small muted">保存通知设置后生效</span><button class="btn" data-close>取消</button><button class="btn primary" data-ok>确定</button>`);
    m.el.querySelector('.modal').appendChild(foot);
    foot.querySelector('[data-ok]').addEventListener('click', () => {
      const f = R.formData(m.el.querySelector('#hook-form'));
      if (!f.name || !f.name.trim()) { R.toast('请填写名称', 'err'); return; }
      if (!hook && !f.url) { R.toast('请填写 Webhook 地址', 'err'); return; }
      const next = Object.assign(hook || { tmp: 'new-' + Date.now() }, { name: f.name.trim(), kind: f.kind, enabled: f.enabled });
      if (f.url) next.url = f.url.trim();
      if (f.secret) next.secret = f.secret;
      if (!hook) nf.hooks.push(next);
      nf.dirty = true;
      m.close(); ctx.redraw();
    });
  }

  function general(s, can) {
    const dis = can('admin') ? '' : 'disabled';
    return h`<div class="grid two"><section class="panel"><div class="panel-head"><h2>Core</h2></div><div class="panel-body"><form id="settings-form">
      <div class="field"><label>Core 名称</label><input class="input" name="coreName" value="${s.coreName}" ${dis}></div>
      <div class="row"><div class="field"><label>夜间维护时间</label><input class="input" type="time" name="nightlyTime" value="${s.nightlyTime}" ${dis}><span class="hint">保留策略汇总、完整性检查与空间回收。上次运行：${s.lastNightly ? ago(s.lastNightly) : '尚未运行'}</span></div>
      <div class="field"><label>同时运行的作业数</label><select class="input" name="maxConcurrentJobs" ${dis}>${[1, 2, 3, 4, 6, 8].map((n) => h`<option ${s.maxConcurrentJobs === n ? 'selected' : ''}>${n}</option>`)}</select><span class="hint">同一台计算机的作业始终依次执行。</span></div></div>
      ${can('admin') ? h`<button type="button" class="btn primary" data-action="saveGeneral">保存</button>` : ''}
    </form></div></section>
    <section class="panel"><div class="panel-head"><h2>运行环境</h2></div><div class="panel-body"><dl class="kv">
      <dt>时区</dt><dd>${s.timeZone}</dd><dt>HTTPS 端口</dt><dd>${s.port}</dd><dt>数据目录</dt><dd class="mono">${s.dataPath}</dd>
    </dl></div></section></div>`;
  }

  function performance(t, can) {
    const dis = can('admin') ? '' : 'disabled';
    const check = (name, on, label, hint) => h`<label class="check"><input type="checkbox" name="${name}" ${on ? 'checked' : ''} ${dis}><span>${label}</span></label>${hint ? h`<span class="hint">${hint}</span>` : ''}`;
    const opts = (values, current, label) => values.map((v) => h`<option value="${v}" ${String(current) === String(v) ? 'selected' : ''}>${label ? label(v) : v}</option>`);
    return h`<form id="tuning-form" class="grid two">
      <section class="panel"><div class="panel-head"><h2>传输与存储</h2></div><div class="panel-body">
        <div class="row"><div class="field"><label>压缩级别</label><select class="input" name="zstdLevel" ${dis}>${opts([1, 2, 3, 5, 7, 9], t.zstdLevel || 1)}</select><span class="hint">1 最快；级别越高压缩率越高，客户端 CPU 占用越多。</span></div>
        <div class="field"><label>每次备份的连接数</label><select class="input" name="streams" ${dis}>${opts([1, 2, 4, 6, 8], t.streams || 4)}</select><span class="hint">整机/分区备份把数据块分到多条 HTTPS 连接，适合万兆网络或高延迟链路。</span></div></div>
        <div class="row"><div class="field"><label>带宽上限（Mbps）</label><input class="input" type="number" min="0" name="bandwidthMbps" value="${t.bandwidthMbps || 0}" ${dis}><span class="hint">0 表示不限制。</span></div><div></div></div>
        ${check('sourceDedup', t.sourceDedup !== false, '源端去重', '客户端先询问 Core 哪些数据块已在存储库中（来自任何计算机），只传输缺少的块。')}
      </div></section>
      <section class="panel"><div class="panel-head"><h2>扫描与一致性</h2></div><div class="panel-body">
        ${check('changeTracking', t.changeTracking !== false, 'NTFS 变化跟踪', '按 USN 日志与 MFT 判断哪些块可能变化，增量备份只读取这些块；无法确认时自动完整扫描。')}
        <div class="row"><div class="field"><label>定期完整扫描（天）</label><input class="input" type="number" min="0" max="365" name="fullScanDays" value="${t.fullScanDays ?? 7}" ${dis}><span class="hint">0 表示不定期完整扫描（不推荐）。</span></div>
        <div class="field"><label>读取线程</label><select class="input" name="readThreads" ${dis}>${opts([0, 1, 2, 3, 4, 6, 8], t.readThreads || 0, (v) => v === 0 ? '自动（SSD 3 路，机械盘 1 路）' : v)}</select></div></div>
        ${check('verify', (t.verifySampleRate ?? 64) > 0, '抽样校验变化跟踪', '每次增量前抽读约 1/64 被跳过的块与缓存比对，发现不一致即改为完整扫描。')}
        ${check('excludeSystemFiles', t.excludeSystemFiles !== false, '页面文件与休眠文件以零保存', 'pagefile.sys、hiberfil.sys、swapfile.sys 的内容不读取不传输，Windows 启动时重建。')}
        ${check('vssWriters', t.vssWriters !== false, '应用一致（VSS 写入器）', 'SQL Server、Exchange、Hyper-V 等写入器在快照前冻结数据。仅复制备份，不截断日志。')}
        ${check('lowPriority', !!t.lowPriority, '客户端后台低优先级', '降低备份时客户端的 CPU 与磁盘优先级，备份会变慢。')}
      </div></section>
      ${can('admin') ? h`<div><button type="button" class="btn primary" data-action="saveTuning">保存</button></div>` : ''}
    </form>`;
  }

  function usersTab(users) {
    return h`<section class="panel"><div class="panel-head"><h2>用户</h2><span class="sub">管理员可管理全部设置；操作员可添加计算机、发起备份与恢复；只读用户只能查看。</span><div class="end"><button class="btn sm primary" data-action="addUser">${icon('plus')}添加用户</button></div></div>
      <table class="table"><thead><tr><th>用户</th><th>角色</th><th>状态</th><th>双因素认证</th><th>上次登录</th><th></th></tr></thead><tbody>
      ${users.map((u) => h`<tr><td><div class="machine-cell" style="min-width:0"><span class="avatar">${R.initials(u.displayName)}</span><div><strong>${u.displayName}</strong><small>${u.userName}</small></div></div></td>
        <td>${R.roles[u.role]}</td><td>${u.disabled ? h`<span class="pill off">已停用</span>` : h`<span class="pill ok">启用</span>`}</td>
        <td><span class="pill ${u.mfaEnabled ? 'ok' : 'off'}">${u.mfaEnabled ? '已启用' : '未启用'}</span></td>
        <td>${u.lastLogin ? ago(u.lastLogin) : '从未'}</td>
        <td class="actions-cell"><button class="btn sm" data-action="editUser" data-id="${u.id}">编辑</button> <button class="btn sm ghost" data-action="deleteUser" data-id="${u.id}" aria-label="删除">${icon('trash')}</button></td></tr>`)}
      </tbody></table></section>`;
  }

  function auditTab(rows) {
    return h`<section class="panel"><div class="panel-head"><h2>审计日志</h2><span class="sub">所有登录与修改操作</span></div>
      <table class="table"><thead><tr><th>时间</th><th>用户</th><th>操作</th><th>对象</th><th>来源地址</th></tr></thead><tbody>
      ${rows.map((a) => h`<tr><td class="nowrap">${dateTime(a.time, true)}</td><td>${a.userName}</td><td>${a.action}</td><td>${a.target || ''}</td><td class="mono">${a.address || ''}</td></tr>`)}
      </tbody></table></section>`;
  }

  function about(s) {
    return h`<section class="panel" style="max-width:820px"><div class="panel-head"><h2>应用信息</h2></div><div class="panel-body">
      <dl class="kv"><dt>应用</dt><dd>BareTurn Core</dd><dt>版本</dt><dd>${s.version}</dd><dt>服务器名称</dt><dd>${s.coreName}</dd></dl>
    </div></section>`;
  }

  function configuration(s) {
    return h`<div class="grid two">
      <section class="panel"><div class="panel-head"><h2>备份服务器配置</h2></div><div class="panel-body">
        <p style="margin-top:0">将服务器设置、用户与角色、保护计划、计算机配对信息及存储库连接配置保存为加密文件。</p>
        <p class="muted">不包含备份数据、恢复点目录、作业与审计记录，也不包含 HTTPS 端口和服务器证书。请单独保管备份文件与密码。</p>
        <button type="button" class="btn primary" data-action="backupConfiguration">${icon('download')}备份配置</button>
      </div></section>
      <section class="panel"><div class="panel-head"><h2>恢复服务器配置</h2></div><div class="panel-body">
        <p style="margin-top:0">上传配置备份并输入备份密码。恢复将在下次重启 Core 服务时替换当前配置，不修改存储库中的备份数据。</p>
        <p class="muted">重启前请结束运行中的作业。恢复后需用备份中的账户重新登录；迁移到新服务器时，请确认存储库路径可访问，并在存储库中导入恢复点。</p>
        ${s.configurationRestorePending ? h`<div class="callout warn">${icon('warn')}<div>配置已准备恢复。请在服务器的 Windows“服务”中重启 BareTurnCore，重启后生效。</div></div>
          <button type="button" class="btn" data-action="cancelConfigurationRestore">取消待恢复配置</button>` : h`<button type="button" class="btn" data-action="restoreConfiguration">${icon('restore')}恢复配置</button>`}
      </div></section>
    </div>`;
  }

  function configurationDialog(restore, ctx) {
    const m = R.modal({
      title: restore ? '恢复服务器配置' : '备份服务器配置',
      body: h`<form id="configuration-form">
        ${restore ? h`<div class="field"><label for="configuration-file">配置备份文件</label><input class="input" id="configuration-file" name="file" type="file" accept=".bareturnconfig" required><span class="hint">BareTurn 配置备份文件，最大 2 MB。</span></div>` : ''}
        <div class="field"><label for="configuration-password">${restore ? '备份密码' : '设置备份密码'}</label><input class="input" id="configuration-password" name="password" type="password" minlength="12" maxlength="256" autocomplete="${restore ? 'off' : 'new-password'}" required><span class="hint">12–256 个字符。${restore ? '使用备份时设置的密码。' : '密码用于加密配置文件，遗失后无法恢复。'}</span></div>
        ${restore ? '' : h`<div class="field"><label for="configuration-confirm">确认备份密码</label><input class="input" id="configuration-confirm" name="confirmPassword" type="password" minlength="12" maxlength="256" autocomplete="new-password" required></div>`}
        ${restore ? h`<div class="callout warn">${icon('warn')}<div>重启 Core 服务后，当前设置、用户、计划及连接配置将被替换，原有排队作业将被取消。HTTPS 端口与证书保持当前服务器的配置。</div></div>` : ''}
      </form>`,
      foot: h`<button class="btn" data-close>取消</button><button class="btn primary" data-save>${restore ? '准备恢复' : '下载加密备份'}</button>`
    });
    const button = m.el.querySelector('[data-save]');
    button.addEventListener('click', async () => {
      const form = m.el.querySelector('form');
      if (!form.reportValidity()) return;
      const password = form.elements.password.value;
      if (!restore && password !== form.elements.confirmPassword.value) { R.toast('两次输入的备份密码不一致', 'err'); return; }
      const file = restore ? form.elements.file.files[0] : null;
      if (restore && (!file || file.size === 0 || file.size > 2 * 1024 * 1024)) { R.toast('请选择有效的配置备份文件（最大 2 MB）', 'err'); return; }
      button.disabled = true;
      try {
        if (restore) {
          if (!await R.confirm({ title: '确认恢复配置', message: `准备恢复“${file.name}”？当前配置将在下次重启 Core 服务时被替换。`, ok: '准备恢复', danger: true })) return;
          const content = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(String(reader.result).split(',')[1]);
            reader.onerror = () => reject(new Error('无法读取配置文件，请重新选择。'));
            reader.readAsDataURL(file);
          });
          await R.api.post('/settings/configuration/restore', { password, content });
          m.close(); R.toast('配置已准备恢复，重启 Core 服务后生效'); ctx.reload();
        } else {
          const result = await R.api.post('/settings/configuration/backup', { password });
          const data = Uint8Array.from(atob(result.content), (c) => c.charCodeAt(0));
          const url = URL.createObjectURL(new Blob([data], { type: 'application/octet-stream' }));
          const link = document.createElement('a'); link.href = url; link.download = result.fileName;
          document.body.appendChild(link); link.click(); link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 60000);
          m.close(); R.toast('加密配置备份已下载');
        }
      } catch (err) { R.toast(err.message, 'err'); }
      finally { button.disabled = false; }
    });
  }

  function userDialog(user, ctx) {
    const m = R.modal({
      title: user ? '编辑用户' : '添加用户',
      body: h`<form id="user-form">
        <div class="row"><div class="field"><label>用户名</label><input class="input" name="userName" value="${user ? user.userName : ''}" ${user ? 'disabled' : ''}></div>
        <div class="field"><label>显示名称</label><input class="input" name="displayName" value="${user ? user.displayName : ''}"></div></div>
        <div class="field"><label>角色</label><select class="input" name="role">${Object.entries(R.roles).map(([k, l]) => h`<option value="${k}" ${user && user.role === k ? 'selected' : ''}>${l}</option>`)}</select></div>
        <div class="field"><label>${user ? '新密码（不修改请留空）' : '密码'}</label><input class="input" name="password" type="password" autocomplete="new-password"><span class="hint">至少 10 个字符，包含大写字母、小写字母、数字、符号中的三类。</span></div>
        ${user ? h`<label class="check"><input type="checkbox" name="disabled" ${user.disabled ? 'checked' : ''}><span>停用此账户</span></label>` : ''}
      </form>`,
      foot: h`<button class="btn" data-close>取消</button><button class="btn primary" data-save>${user ? '保存' : '添加用户'}</button>`
    });
    m.el.querySelector('[data-save]').addEventListener('click', async () => {
      const f = R.formData(m.el.querySelector('#user-form'));
      const body = { userName: user ? user.userName : f.userName, displayName: f.displayName || f.userName, role: f.role, password: f.password || null, disabled: !!f.disabled };
      try { user ? await R.api.put('/users/' + user.id, body) : await R.api.post('/users', body); m.close(); R.toast('用户已保存'); ctx.reload(); }
      catch (err) { R.toast(err.message, 'err'); }
    });
  }

  // ───────────── license ─────────────
  const LIC_STATES = {
    TrialActive: ['info', '试用中'],
    TrialExpiring: ['warn', '试用即将到期'],
    TrialExpired: ['err', '试用已到期'],
    Licensed: ['ok', '永久已授权'],
    MigrationGrace: ['warn', '硬件迁移宽限期'],
    OverAllocatedGrace: ['warn', '席位超额宽限期'],
    OverAllocatedEnforced: ['err', '席位不足'],
    MaintenanceRequired: ['err', '超出维护更新期'],
    Restricted: ['err', '许可受限']
  };

  function seatBar(label, used, total, note) {
    const pct = total > 0 ? Math.min(100, Math.round(used * 100 / total)) : (used > 0 ? 100 : 0);
    const over = used > total;
    return h`<div class="lic-seat-row">
      <div class="lic-seat-head"><strong>${label}</strong><span><b>${used}</b> / ${total}${note ? h` <small class="muted">（${note}）</small>` : ''}</span></div>
      <div class="${'lic-bar' + (over ? ' over' : pct >= 85 ? ' warn' : '')}"><span style="${'width:' + pct + '%'}"></span></div>
    </div>`;
  }

  function licenseTab(lic, can) {
    if (!lic) return h`<div class="empty">无法读取许可状态。</div>`;
    const [pillCls, stateLabel] = LIC_STATES[lic.state] || ['off', lic.state];
    const seats = lic.seats || { workstationTotal: 0, workstationUsed: 0, serverTotal: 0, serverUsed: 0, serverBorrowedForWorkstations: 0, assignments: [] };
    const portalBuy = `${lic.portalUrl || 'https://bareturn-licensing-portal.nykko-lin.workers.dev'}/?coreId=${encodeURIComponent(lic.coreId)}&ws=${seats.workstationTotal}&srv=${seats.serverTotal}`;
    const admin = can('admin');
    return h`<div class="stack">
      ${lic.banner ? h`<div class="${'callout ' + (lic.banner.severity === 'err' ? 'err' : 'warn')}" style="margin-top:0">${icon(lic.banner.severity === 'err' ? 'error' : 'warn')}<div><strong>${lic.banner.title}</strong><div>${lic.banner.message}</div></div></div>` : ''}
      ${lic.clockRollbackDetected ? h`<div class="callout warn" style="margin-top:0">${icon('warn')}<div>检测到服务器系统时间大幅回退，请校准系统时钟或配置内网 NTP。</div></div>` : ''}
      <div class="grid two">
        <section class="panel"><div class="panel-head">${icon('key')}<h2>许可状态</h2><span class="${'pill end ' + pillCls}">${stateLabel}</span></div><div class="panel-body">
          <dl class="kv">
            <dt>授权类型</dt><dd>${lic.isPerpetual ? '永久许可 · 终身免费更新（Lifetime Updates，无续费）' : '30 天全功能评估试用'}</dd>
            <dt>被授权方</dt><dd>${lic.customerName || '—'}</dd>
            ${lic.isTrial ? h`<dt>试用剩余</dt><dd>${lic.trialDaysRemaining ?? 0} 天${lic.trialEndsAt ? `（至 ${dateTime(lic.trialEndsAt)}）` : ''}</dd>` : ''}
            ${lic.isPerpetual ? h`<dt>版本更新</dt><dd>${lic.lifetimeUpdates || !lic.maintenanceUntil ? h`<span class="pill ok">终身免费更新（Lifetime Updates）</span>` : h`${lic.maintenanceUntil} ${lic.maintenanceActive ? h`<span class="pill ok">维护期内</span>` : h`<span class="pill off">当前版本永久运行</span>`}`}</dd>` : ''}
            <dt>Core 标识</dt><dd class="mono small">${lic.coreId}</dd>
            <dt>软件构建日期</dt><dd class="mono small">${lic.productVersion}（${lic.buildDateUtc}）</dd>
          </dl>
          <p class="small muted" style="margin:12px 0 0">恢复保障：无论试用或授权状态如何，历史恢复点的裸机恢复、分区恢复、挂载与文件恢复始终可用。</p>
          ${admin ? h`<div class="lic-actions">
            <button type="button" class="btn primary" data-action="activateLicense">${icon('key')}输入激活码</button>
            <button type="button" class="btn" data-action="importLicense">${icon('plus')}导入离线许可</button>
            <button type="button" class="btn" data-action="exportRequestCode">${icon('download')}导出请求码</button>
            <a class="btn" href="${portalBuy}" target="_blank" rel="noopener noreferrer">购买 / 增购席位</a>
          </div>` : ''}
        </div></section>
        <section class="panel"><div class="panel-head">${icon('machines')}<h2>席位配额</h2><span class="sub">服务器席位可向下兼容保护工作站；已归档计算机不占席位</span></div><div class="panel-body">
          ${seatBar('服务器席位（Server）', seats.serverUsed, seats.serverTotal, seats.serverBorrowedForWorkstations ? `含 ${seats.serverBorrowedForWorkstations} 个兼容保护工作站` : '')}
          ${seatBar('工作站席位（Workstation）', seats.workstationUsed, seats.workstationTotal, '')}
          ${(seats.assignments || []).length ? h`<table class="table" style="margin-top:12px"><thead><tr><th>计算机</th><th>类型</th><th>占用池</th><th>状态</th></tr></thead><tbody>
            ${seats.assignments.map((a) => h`<tr><td><strong>${a.name}</strong></td><td>${a.osRole === 'Workstation' ? '工作站' : '服务器'}</td>
              <td>${a.assignedPool === 'Server' ? (a.borrowedServerSeat ? '服务器（向下兼容）' : '服务器') : a.assignedPool === 'Workstation' ? '工作站' : '超出配额'}</td>
              <td>${a.covered ? h`<span class="pill ok">已授权</span>` : h`<span class="pill err">超出配额</span>`}</td></tr>`)}
          </tbody></table>` : h`<div class="empty small" style="padding:18px 0">暂无活跃受保护计算机。</div>`}
        </div></section>
      </div>
      <section class="panel"><div class="panel-head"><h2>已安装许可</h2><span class="sub">多份绑定到本 Core 的永久许可自动叠加席位</span>
        ${admin && (lic.licenses || []).length ? h`<div class="end"><button type="button" class="btn sm danger" data-action="deactivateLicense">停用并迁移许可…</button></div>` : ''}</div>
        ${(lic.licenses || []).length ? h`<table class="table"><thead><tr><th>许可编号</th><th>类型</th><th>客户</th><th>席位</th><th>维护截止</th><th>硬件绑定</th><th>导入时间</th></tr></thead><tbody>
          ${lic.licenses.map((x) => h`<tr><td class="mono small">${x.licenseId}</td>
            <td>${x.type === 'Perpetual' ? '永久许可' : '试用延期'}</td>
            <td><strong>${x.customerName}</strong>${x.orderRef ? h`<div class="small muted mono">${x.orderRef}</div>` : ''}</td>
            <td>${x.serverSeats} 服务器 · ${x.workstationSeats} 工作站</td>
            <td class="mono small">${x.type === 'Perpetual' ? (x.lifetimeUpdates || !x.maintenanceUntil ? '终身免费更新' : x.maintenanceUntil) : (x.expiresAt ? dateTime(x.expiresAt) : '—')}</td>
            <td>${x.hardwareMatched ? h`<span class="pill ok">匹配</span>` : h`<span class="pill warn">硬件已变更</span>`}</td>
            <td class="small muted">${dateTime(x.installedAt)}</td></tr>`)}
        </tbody></table>` : h`<div class="empty small">尚未导入任何许可文件，当前运行于开箱即用 30 天全功能试用（5 工作站 + 1 服务器）。</div>`}
      </section>
    </div>`;
  }

  function activateLicenseDialog(ctx) {
    const m = R.modal({
      title: '在线激活永久许可',
      body: h`<form id="lic-activate-form">
        <div class="field"><label for="lic-code">激活码</label><input class="input mono" id="lic-code" name="code" placeholder="BT-XXXX-XXXX-XXXX-XXXX" autocomplete="off" required><span class="hint">通过 Creem 购买后由 BareTurn 门户发放的激活码。激活仅联网一次，完成后永久离线运行。</span></div>
      </form>`,
      foot: h`<button class="btn" data-close>取消</button><button class="btn primary" data-save>激活</button>`
    });
    const btn = m.el.querySelector('[data-save]');
    btn.addEventListener('click', async () => {
      const form = m.el.querySelector('form');
      if (!form.reportValidity()) return;
      btn.disabled = true;
      try {
        await R.api.post('/license/activate', { code: form.elements.code.value.trim() });
        m.close(); R.toast('永久许可已激活并永久离线生效');
        await R.refreshLicenseBanner?.(); ctx.reload();
      } catch (err) { R.toast(err.message, 'err'); }
      finally { btn.disabled = false; }
    });
  }

  function importLicenseDialog(ctx) {
    let previewed = null;
    const m = R.modal({
      title: '导入离线许可文件（.bareturnlic）',
      body: h`<form id="lic-import-form">
        <div class="field"><label for="lic-file">选择 .bareturnlic 文件</label><input class="input" id="lic-file" type="file" accept=".bareturnlic,.json,.txt"></div>
        <div class="field"><label for="lic-text">或直接粘贴许可内容</label><textarea class="input mono" id="lic-text" name="content" rows="6" placeholder='{"format":"BareTurn.License",...}'></textarea></div>
        <div id="lic-preview"></div>
      </form>`,
      foot: h`<button class="btn" data-close>取消</button><button class="btn" data-preview>校验预览</button><button class="btn primary" data-save>导入并生效</button>`
    });
    const fileEl = m.el.querySelector('#lic-file');
    const textEl = m.el.querySelector('#lic-text');
    const prevBox = m.el.querySelector('#lic-preview');
    fileEl.addEventListener('change', async () => {
      const f = fileEl.files[0];
      if (!f) return;
      textEl.value = await f.text();
    });
    m.el.querySelector('[data-preview]').addEventListener('click', async () => {
      try {
        const p = await R.api.post('/license/preview', { content: textEl.value });
        previewed = p;
        prevBox.innerHTML = String(h`<div class="${'callout ' + (p.coreMatches && p.maintenanceCoversBuild ? 'info' : 'warn')}">
          <div><strong>${p.customerName}</strong>（${p.type === 'Perpetual' ? '永久许可' : '试用延期'} · ${p.serverSeats} 服务器 + ${p.workstationSeats} 工作站）
          <div class="small">版本更新：${p.lifetimeUpdates || !p.maintenanceUntil ? '终身免费更新' : p.maintenanceUntil} · Core 匹配：${p.coreMatches ? '是' : '否（CoreId 不一致）'} · 硬件匹配：${p.hardwareMatched ? '是' : '变更（导入后进入 30 天迁移宽限）'}</div></div></div>`);
      } catch (err) { prevBox.innerHTML = ''; R.toast(err.message, 'err'); }
    });
    const btn = m.el.querySelector('[data-save]');
    btn.addEventListener('click', async () => {
      if (!textEl.value.trim()) { R.toast('请选择许可文件或粘贴许可内容', 'err'); return; }
      btn.disabled = true;
      try {
        await R.api.post('/license/import', { content: textEl.value });
        m.close(); R.toast('许可已导入并立即生效');
        await R.refreshLicenseBanner?.(); ctx.reload();
      } catch (err) { R.toast(err.message, 'err'); }
      finally { btn.disabled = false; }
    });
  }

  function requestCodeDialog(res) {
    const m = R.modal({
      title: '导出离线激活请求码（.req）',
      body: h`<div>
        <p style="margin-top:0">适用于隔离内网服务器。将下方请求码复制或下载为文件，在外网浏览器打开 BareTurn 许可门户即可兑换绑定本机的 <code class="mono">.bareturnlic</code> 文件。</p>
        <div class="field"><label>CoreId</label><input class="input mono" value="${res.coreId}" readonly></div>
        <div class="field"><label>请求码</label><textarea class="input mono" id="req-code-box" rows="5" readonly>${res.requestCode}</textarea></div>
      </div>`,
      foot: h`<button class="btn" data-close>关闭</button><button class="btn" data-copy>复制请求码</button><button class="btn primary" data-dl>${icon('download')}下载 .req 文件</button>`
    });
    m.el.querySelector('[data-copy]').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(res.requestCode); R.toast('请求码已复制'); }
      catch { m.el.querySelector('#req-code-box').select(); document.execCommand('copy'); R.toast('请求码已复制'); }
    });
    m.el.querySelector('[data-dl]').addEventListener('click', () => {
      const url = URL.createObjectURL(new Blob([res.requestCode], { type: 'text/plain;charset=utf-8' }));
      const a = document.createElement('a'); a.href = url; a.download = res.fileName;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    });
  }

  function deactivateLicenseDialog(ctx) {
    const m = R.modal({
      title: '停用本机许可并生成迁移回执',
      body: h`<form id="lic-deact-form">
        <div class="callout warn" style="margin-top:0">${icon('warn')}<div>停用后本服务器将移除已安装的永久许可并生成 <code class="mono">.deact</code> 迁移回执（历史恢复点仍可恢复）。将回执与新服务器的 <code class="mono">.req</code> 提交到许可门户即可自助换绑。</div></div>
        <div class="field"><label for="deact-pw">确认当前管理员密码</label><input class="input" id="deact-pw" name="password" type="password" autocomplete="current-password" required></div>
      </form>`,
      foot: h`<button class="btn" data-close>取消</button><button class="btn danger" data-save>停用并下载回执</button>`
    });
    const btn = m.el.querySelector('[data-save]');
    btn.addEventListener('click', async () => {
      const form = m.el.querySelector('form');
      if (!form.reportValidity()) return;
      btn.disabled = true;
      try {
        const res = await R.api.post('/license/deactivate', { password: form.elements.password.value });
        const url = URL.createObjectURL(new Blob([res.receipt], { type: 'application/json;charset=utf-8' }));
        const a = document.createElement('a'); a.href = url; a.download = res.fileName;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
        m.close(); R.toast('本机许可已停用，迁移回执已下载');
        await R.refreshLicenseBanner?.(); ctx.reload();
      } catch (err) { R.toast(err.message, 'err'); }
      finally { btn.disabled = false; }
    });
  }
})(window.R = window.R || {});

</script>
  <script>
/* Reports: protection status, jobs / SLA and scheduled report emails. Print styles turn a report into a PDF. */
(function (R) {
  'use strict';
  const { h, icon, dateTime, pill, esc, raw } = R;
  const ui = { range: '7d', from: '', to: '', filter: 'all', allIssues: false, allMachines: false };
  const TABS = [['protection', '保护状态'], ['jobs', '作业与 SLA'], ['schedule', '定时发送']];
  const RANGES = [['24h', '近 24 小时'], ['7d', '近 7 天'], ['30d', '近 30 天'], ['thisMonth', '本月'], ['lastMonth', '上月'], ['custom', '自定义']];
  const TABLES = [['activity', '备份与恢复记录'], ['machines', '按计算机统计'], ['failures', '失败明细'], ['causes', '失败原因'], ['days', '每日统计']];
  const SEV = { Error: ['err', '错误'], Warning: ['warn', '警告'] };
  const RPO = { Ok: ['ok', '达标'], Late: ['warn', '未达标'], None: ['off', '不适用'] };
  const ACTIVITY_STATUS = { ...R.jobStatus, Online: ['run', '正在后台回写'], Hydrated: ['warn', '等待切换到本地分区'] };
  const KINDS = { protection: '保护状态', jobs: '作业与 SLA' };
  const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
  const ISSUE_LIMIT = 30, MACHINE_LIMIT = 200, FAILURE_LIMIT = 50;

  const pct = (v) => v == null ? '—' : v.toFixed(1) + '%';
  const num = (v) => (v || 0).toLocaleString('zh-CN');
  const at = (ms) => ms ? dateTime(ms, true) : '—';
  const dur = (ms) => ms == null ? '—' : R.duration(ms);
  const rateClass = (v) => v == null ? '' : v < 95 ? 'err-text' : v < 99 ? 'warn-text' : '';
  const pad = (n) => String(n).padStart(2, '0');
  const day = (offset) => { const d = new Date(); d.setDate(d.getDate() + (offset || 0)); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  const coreName = () => (R.app.state.session && R.app.state.session.core && R.app.state.session.core.name) || '';
  const frequency = (s) => s.frequency === 'Daily' ? `每天 ${s.time}` : s.frequency === 'Monthly' ? `每月 ${s.day} 日 ${s.time}` : `每周${WEEK[s.day] || ''} ${s.time}`;

  function query() {
    const q = new URLSearchParams({ range: ui.range });
    if (ui.range === 'custom') {
      if (!ui.from) ui.from = day(-7);
      if (!ui.to) ui.to = day(0);
      q.set('from', String(new Date(ui.from + 'T00:00').getTime()));
      q.set('to', String(new Date(ui.to + 'T00:00').getTime() + 86400e3));
    }
    return q.toString();
  }

  // ── building blocks ──
  function fact(label, value, sub, tone) {
    return h`<div class="fact"><div class="k">${label}</div><div class="${'v' + (tone ? ' ' + tone : '')}">${value}</div>${sub ? h`<div class="d">${sub}</div>` : ''}</div>`;
  }
  // Change against the previous period; "good" says which direction is an improvement.
  function delta(now, before, unit, good) {
    if (now == null || before == null) return '';
    const d = Math.round((now - before) * 10) / 10;
    if (!d) return h`<span class="delta">与上一周期持平</span>`;
    const tone = !good ? '' : (good === 'down' ? d < 0 : d > 0) ? ' better' : ' worse';
    return h`<span class="${'delta' + tone}">${d > 0 ? '↑' : '↓'} ${Math.abs(d).toLocaleString('zh-CN')}${unit} · 上一周期 ${unit === ' 个百分点' ? pct(before) : num(before)}</span>`;
  }

  function head(r, sub) {
    const tone = r.issues.some((i) => i.severity === 'Error') ? 'err' : r.issues.length ? 'warn' : 'ok';
    return h`<header class="report-head">
        <div><div class="report-brand print-only">BareTurn · ${coreName()}</div><h2>${r.title}</h2><p>${sub}</p></div>
        <dl class="report-meta"><dt>生成时间</dt><dd>${dateTime(r.generated, true)}</dd><dt>生成人</dt><dd>${r.generatedBy || '—'}</dd>${coreName() ? h`<dt>Core</dt><dd>${coreName()}</dd>` : ''}</dl>
      </header>
      <div class="${'report-conclusion ' + tone}">${icon(tone === 'ok' ? 'check' : tone === 'err' ? 'error' : 'warn')}<p>${r.conclusion}</p></div>`;
  }

  function issues(list) {
    if (!list.length) return h`<section class="panel report-block"><div class="panel-head"><h2>需处理</h2></div><div class="panel-body ok-text">${icon('check')} 没有需要处理的问题。</div></section>`;
    const shown = ui.allIssues ? list : list.slice(0, ISSUE_LIMIT);
    return h`<section class="panel report-block"><div class="panel-head"><h2>需处理</h2><span class="sub">${list.length} 项，错误在前</span></div>
      <ol class="issue-list">${shown.map((i) => h`<li>${pill(SEV, i.severity)}<span class="t">${i.text}</span>${i.link ? h`<a class="no-print small" href="${'#/' + i.link}">查看</a>` : ''}</li>`)}</ol>
      ${list.length > shown.length ? h`<div class="panel-body no-print" style="padding-top:0"><button class="btn sm ghost" data-action="allIssues">显示全部 ${list.length} 项</button></div>` : ''}</section>`;
  }

  function notes(r) {
    return h`<section class="report-notes"><h3>统计口径</h3><ul>${r.notes.map((n) => h`<li>${n}</li>`)}</ul>
      ${r.fingerprint ? h`<p>数据指纹（主表 SHA-256）：<code>${r.fingerprint}</code><br><span class="faint">与同一时间导出的 CSV 主表一致；数据变化后指纹会改变。</span></p>` : ''}</section>`;
  }

  function block(title, sub, body, extra) {
    return h`<section class="panel report-block"><div class="panel-head"><h2>${title}</h2>${sub ? h`<span class="sub">${sub}</span>` : ''}${extra ? h`<div class="end">${extra}</div>` : ''}</div>${body}</section>`;
  }

  // Daily success rate: the axis starts near the lowest day, so a bad day stands out instead of a thin line on a tall bar.
  function dayChart(days) {
    if (!days.length || !days.some((d) => d.runs)) return '';
    const W = 640, H = 170, L = 40, B = 22, T = 10;
    const rates = days.filter((d) => d.rate != null).map((d) => d.rate);
    const min = Math.min(...rates);
    const floor = min >= 99 ? 95 : min >= 95 ? 90 : Math.max(0, Math.floor((min - 5) / 10) * 10);
    const y = (v) => T + (H - T - B) * (1 - (v - floor) / (100 - floor));
    const bw = (W - L) / days.length;
    const every = Math.max(1, Math.ceil(days.length / 10));
    let s = `<svg class="chart report-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="每日备份成功率">`;
    for (let i = 0; i <= 4; i++) {
      const v = floor + (100 - floor) * i / 4;
      s += `<line class="gridline" x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${Math.round(v)}%</text>`;
    }
    days.forEach((d, i) => {
      const x0 = L + i * bw + bw * 0.18, w = bw * 0.64;
      if (d.rate != null) {
        const top = y(Math.max(floor, d.rate));
        s += `<rect class="${d.rate < 95 ? 'fail' : d.rate < 99 ? 'warnbar' : 'ok'}" x="${x0}" y="${top}" width="${w}" height="${Math.max(1.5, y(floor) - top)}" rx="2"/>`;
      }
      if (i % every === 0 || i === days.length - 1) s += `<text x="${x0 + w / 2}" y="${H - 6}" text-anchor="middle">${d.day.slice(5).replace('-', '/')}</text>`;
      s += `<rect class="hit" x="${L + i * bw}" y="${T}" width="${bw}" height="${H - T - B}" data-tip="${esc(d.day + '：备份 ' + d.runs + ' 次，失败 ' + d.failed + ' 次' + (d.rate == null ? '' : '，成功率 ' + pct(d.rate)))}"/>`;
    });
    return raw(s + '</svg>');
  }

  // ── protection status ──
  const attention = (r) => r.rpo === 'Late' || r.consecutiveFailures > 0 || r.gaps.length > 0 || r.status === 'Error' || r.status === 'Offline';
  const FILTERS = [['all', '全部', () => true], ['attention', '需关注', attention], ['late', '未按计划', (r) => r.rpo === 'Late'], ['failing', '最近失败', (r) => r.consecutiveFailures > 0 || r.status === 'Error'], ['gaps', '有保护缺口', (r) => r.gaps.length > 0]];

  function protection(r) {
    const s = r.summary;
    const filter = (FILTERS.find((f) => f[0] === ui.filter) || FILTERS[0])[2];
    const rows = r.rows.filter(filter);
    const shown = ui.allMachines ? rows : rows.slice(0, MACHINE_LIMIT);
    return h`<div class="report" id="report">
      ${head(r, `截至 ${dateTime(r.generated, true)} 的保护状态，共 ${s.machines} 台计算机`)}
      <section class="panel report-facts">
        ${fact('按计划完成', h`${s.onSchedule}<span class="unit"> / ${s.scheduled} 台</span>`, s.scheduled < s.machines ? `另有 ${s.machines - s.scheduled} 台没有生效的计划` : '全部计算机都有生效的计划')}
        ${fact('未按计划备份', h`${s.late}<span class="unit"> 台</span>`, s.late ? '超过计划要求的时间仍未备份' : '没有超时的计算机', s.late ? 'warn' : '')}
        ${fact('最近一次失败', h`${s.failing}<span class="unit"> 台</span>`, s.failing ? '最近一次备份没有成功' : '最近一次备份都成功', s.failing ? 'err' : '')}
        ${fact('保护缺口', h`${s.gaps}<span class="unit"> 项</span>`, s.gaps ? `涉及 ${s.withGaps} 台计算机` : '没有发现保护缺口', s.gaps ? 'warn' : '')}
        ${fact('近 7 天成功率', pct(s.rate7), `近 30 天 ${pct(s.rate30)}`, rateClass(s.rate7) ? (s.rate7 < 95 ? 'err' : 'warn') : '')}
      </section>
      ${issues(r.issues)}
      <section class="panel report-block">
        <div class="panel-head"><h2>计算机明细</h2><span class="sub">${rows.length === r.rows.length ? `${r.rows.length} 台` : `${rows.length} / ${r.rows.length} 台`}</span>
          <div class="end chips no-print">${FILTERS.map(([k, l, f]) => h`<button class="${'chip' + (ui.filter === k ? ' on' : '')}" data-action="filter" data-v="${k}">${l} <b>${r.rows.filter(f).length}</b></button>`)}</div></div>
        ${rows.length ? h`<div class="table-wrap"><table class="table cards report-table">
          <thead><tr><th>计算机</th><th>状态</th><th>RPO</th><th>上次成功备份</th><th>最早可恢复</th><th class="num">恢复点</th><th class="num">近 7 天</th><th class="num">近 30 天</th><th>备份范围</th><th>保护缺口</th></tr></thead>
          <tbody>${shown.map((x) => h`<tr>
            <td data-label="计算机" class="who"><a href="${'#/machines/' + x.machineId}"><b>${x.name}</b></a><small class="muted" title="${[x.host, x.osName].filter(Boolean).join(' · ')}">${[x.host, x.osName].filter(Boolean).join(' · ')}</small>${x.planName ? h`<small class="faint" title="${x.planName}">${x.planName}${x.repositoryName ? ' → ' + x.repositoryName : ''}</small>` : ''}</td>
            <td data-label="状态">${pill(R.machineStatus, x.status)}${x.consecutiveFailures ? h`<br><small class="err-text">连续失败 ${x.consecutiveFailures} 次</small>` : ''}${x.lastError ? h`<br><small class="muted clip-2" title="${x.lastError}">${x.lastError}</small>` : ''}</td>
            <td data-label="RPO">${pill(RPO, x.rpo)}${x.rpo === 'Late' && x.dueAt ? h`<br><small class="muted">应在 ${dateTime(x.dueAt)} 前</small>` : ''}</td>
            <td data-label="上次成功备份" class="nowrap">${x.lastBackup ? h`${at(x.lastBackup)}<br><small class="muted">${R.ago(x.lastBackup)}</small>` : h`<span class="err-text">从未</span>`}</td>
            <td data-label="最早可恢复" class="nowrap">${x.oldestPoint ? dateTime(x.oldestPoint, true) : '—'}</td>
            <td data-label="恢复点" class="num">${num(x.points)}</td>
            <td data-label="近 7 天" class="num"><span class="${rateClass(x.rate7)}">${pct(x.rate7)}</span><br><small class="muted">${x.runs7} 次${x.failed7 ? ' · 失败 ' + x.failed7 : ''}</small></td>
            <td data-label="近 30 天" class="num"><span class="${rateClass(x.rate30)}">${pct(x.rate30)}</span><br><small class="muted">${x.runs30} 次${x.failed30 ? ' · 失败 ' + x.failed30 : ''}</small></td>
            <td data-label="备份范围" class="small">${x.coverage}${x.notIncluded.length ? h`<br><small class="muted">未包含：${x.notIncluded.join('；')}</small>` : ''}</td>
            <td data-label="保护缺口" class="small">${x.gaps.length ? h`<ul class="gap-list">${x.gaps.map((g) => h`<li>${g}</li>`)}</ul>` : h`<span class="faint">—</span>`}</td>
          </tr>`)}</tbody></table></div>
          ${rows.length > shown.length ? h`<div class="panel-body no-print"><button class="btn sm ghost" data-action="allMachines">显示全部 ${rows.length} 台</button></div>` : ''}`
        : h`<div class="empty small">没有符合条件的计算机</div>`}
      </section>
      ${notes(r)}
    </div>`;
  }

  // ── jobs / SLA ──
  function rangeBar() {
    return h`<div class="toolbar panel filters no-print report-range">
      <div class="chips">${RANGES.map(([k, l]) => h`<button class="${'chip' + (ui.range === k ? ' on' : '')}" data-action="range" data-v="${k}">${l}</button>`)}</div>
      ${ui.range === 'custom' ? h`<div class="toolbar-end"><label class="small muted" for="rep-from">从</label><input class="input" type="date" id="rep-from" value="${ui.from || day(-7)}" max="${day(0)}" data-input="from">
        <label class="small muted" for="rep-to">到</label><input class="input" type="date" id="rep-to" value="${ui.to || day(0)}" max="${day(0)}" data-input="to"><button class="btn sm primary" data-action="apply">查看</button></div>` : ''}
    </div>`;
  }

  function activityComputer(machine, label) {
    if (!machine) return '';
    const details = [machine.host, machine.osName].filter(Boolean).join(' · ');
    return h`<div>${label ? h`<small class="muted">${label} </small>` : ''}<b>${machine.name}</b>
      ${details ? h`<small class="muted">${details}</small>` : ''}</div>`;
  }

  function activityTable(shown, counts, isRestore, formatTime) {
    const title = isRestore ? '恢复记录' : '备份记录';
    const count = Object.values(counts).reduce((sum, n) => sum + n, 0);
    const summary = ['Succeeded', 'Warning', 'Failed', 'Cancelled', 'Online', 'Hydrated'].map((status) => {
      return counts[status] ? `${ACTIVITY_STATUS[status][1]} ${num(counts[status])}` : '';
    }).filter(Boolean).join(' · ');
    const total = shown.length < count ? `显示最近 ${shown.length} 条，共 ${num(count)} 条` : `${num(count)} 条`;
    return block(title, count ? [total, summary].filter(Boolean).join(' · ') : '',
      shown.length ? h`<div class="table-wrap"><table class="table cards report-table report-activity">
        <thead><tr><th>作业</th><th>计算机</th><th>恢复点</th><th>执行时间</th><th>结果</th></tr></thead>
        <tbody>${shown.map((a) => h`<tr>
          <td data-label="作业"><a href="${'#/jobs?open=' + a.jobId}"><b>${a.label}</b></a><small class="muted">${a.title}</small></td>
          <td data-label="计算机">${activityComputer(a.source, isRestore ? '来源' : '')}${activityComputer(a.target, '目标')}
            ${!a.source && !a.target ? h`<span class="faint">—</span>` : ''}</td>
          <td data-label="恢复点"><span class="nowrap">${formatTime(a.dataTime)}</span>
            ${a.dataScope ? h`<small class="muted">${a.dataScope}${a.dataBytes != null ? ' · ' + R.bytes(a.dataBytes) : ''}</small>` : ''}
            ${a.repository ? h`<small class="muted">${a.repository}</small>` : ''}</td>
          <td data-label="执行时间" class="small nowrap">
            ${a.started != null ? h`<div><span class="muted">开始</span> ${formatTime(a.started)}</div>` : ''}
            <div><span class="muted">结束</span> ${formatTime(a.ended)}</div>
            ${a.started != null && a.ended >= a.started ? h`<small class="muted">${dur(a.ended - a.started)}</small>` : ''}</td>
          <td data-label="结果">${pill(ACTIVITY_STATUS, a.status)}
            ${a.message ? h`<small class="muted">${a.message}</small>` : ''}
            ${a.restoreEnded != null && a.restoreEnded > a.ended ? h`<small class="muted">恢复会话结束 ${formatTime(a.restoreEnded)}</small>` : ''}
            ${a.bytesDone != null ? h`<small class="faint">作业已处理 ${R.bytes(a.bytesDone)}</small>` : ''}</td>
        </tr>`)}</tbody></table></div>` : h`<div class="empty small">此时段没有已结束的${isRestore ? '恢复' : '备份'}作业。</div>`,
      shown.length < count ? h`<button class="btn sm ghost no-print" data-action="csv" data-id="activity">导出全部记录</button>` : '');
  }

  function jobs(r) {
    const s = r.summary, p = r.previous;
    const failing = r.machines.filter((m) => m.failed > 0 || m.slower || m.outsideWindow > 0);
    const rest = r.machines.length - failing.length;
    const machineRows = ui.allMachines ? r.machines : failing;
    const activity = r.recentActivity || [];
    const clock = new Intl.DateTimeFormat('sv-SE', { timeZone: r.timeZoneId || undefined, dateStyle: 'short', timeStyle: 'medium', hourCycle: 'h23' });
    const formatTime = (ms) => ms == null ? '—' : clock.format(ms);
    return h`${rangeBar()}<div class="report" id="report">
      ${head(r, h`${r.periodLabel}：${at(r.from)} 至 ${at(r.to)}<span class="faint"> · 对比上一周期 ${at(r.previousFrom)} 至 ${at(r.previousTo)}</span>`)}
      <section class="panel report-facts">
        ${fact('备份次数', num(s.runs), h`${s.machines} 台计算机 · ${delta(s.runs, p.runs, ' 次')}`)}
        ${fact('成功率', pct(s.rate), delta(s.rate, p.rate, ' 个百分点', 'up'), s.rate == null ? '' : s.rate < 95 ? 'err' : s.rate < 99 ? 'warn' : '')}
        ${fact('失败', h`${s.failed}<span class="unit"> 次</span>`, h`涉及 ${s.machinesWithFailures} 台 · ${delta(s.failed, p.failed, ' 次', 'down')}`, s.failed ? 'err' : '')}
        ${fact('失败后备份成功', h`${s.recovered}<span class="unit"> 次</span>`)}
        ${fact('仍有备份失败', h`${s.machinesStillFailing}<span class="unit"> 台</span>`, s.unrecovered ? `${s.unrecovered} 次失败之后还没有成功的备份` : '', s.unrecovered ? 'err' : '')}
      </section>
      ${activityTable(activity.filter((a) => a.isRestore), r.restoreActivityCounts || {}, true, formatTime)}
      ${activityTable(activity.filter((a) => !a.isRestore), r.backupActivityCounts || {}, false, formatTime)}
      ${r.days.length > 1 ? block('每日成功率', '柱越低越需要关注；悬停查看次数', h`<div class="panel-body">${dayChart(r.days)}</div>`) : ''}
      ${issues(r.issues)}
      ${r.causes.length ? block('失败原因', `${s.failed} 次失败，按错误信息归类`, h`<div class="table-wrap"><table class="table cards report-table">
        <thead><tr><th>原因</th><th class="num">次数</th><th class="num">仍未恢复</th><th>涉及计算机</th><th>建议</th></tr></thead>
        <tbody>${r.causes.map((c) => h`<tr><td data-label="原因"><b>${c.label}</b><br><small class="muted clip-2" title="${c.example}">例：${c.example}</small></td><td data-label="次数" class="num">${c.count}</td>
          <td data-label="仍未恢复" class="num ${c.unrecovered ? 'err-text' : ''}">${c.unrecovered}</td><td data-label="涉及计算机" class="small">${c.machines.slice(0, 8).join('、')}${c.machines.length > 8 ? ` 等 ${c.machines.length} 台` : ''}</td><td data-label="建议" class="small">${c.advice}</td></tr>`)}</tbody></table></div>`) : ''}
      ${block('按计算机', ui.allMachines ? `${r.machines.length} 台` : `有失败、变慢或超出时段的 ${failing.length} 台${rest ? `，其余 ${rest} 台全部成功` : ''}`,
        machineRows.length ? h`<div class="table-wrap"><table class="table cards report-table">
          <thead><tr><th>计算机</th><th class="num">次数</th><th class="num">失败</th><th class="num">已恢复</th><th class="num">仍未恢复</th><th class="num">成功率</th><th class="num">中位耗时</th><th class="num">最近 3 次</th><th class="num">超出时段</th><th>最近一次失败</th></tr></thead>
          <tbody>${machineRows.map((m) => h`<tr>
            <td data-label="计算机" class="who"><a href="${'#/jobs?machine=' + m.machineId}"><b>${m.name}</b></a>${m.planName ? h`<small class="faint">${m.planName}</small>` : ''}</td>
            <td data-label="次数" class="num">${num(m.runs)}</td><td data-label="失败" class="num ${m.failed ? 'err-text' : ''}">${m.failed}</td><td data-label="已恢复" class="num">${m.recovered}</td>
            <td data-label="仍未恢复" class="num ${m.unrecovered ? 'err-text' : ''}">${m.unrecovered}</td><td data-label="成功率" class="num"><span class="${rateClass(m.rate)}">${pct(m.rate)}</span></td>
            <td data-label="中位耗时" class="num">${dur(m.medianMs)}</td><td data-label="最近 3 次" class="num">${dur(m.recentMs)}${m.slower ? h`<br><span class="pill warn plain">变慢</span>` : ''}</td>
            <td data-label="超出时段" class="num ${m.outsideWindow ? 'warn-text' : ''}">${m.outsideWindow || '—'}</td>
            <td data-label="最近一次失败" class="small">${m.lastFailure ? h`<span class="muted">${dateTime(m.lastFailureTime)}</span> <span class="clip-2" title="${m.lastFailure}">${m.lastFailure}</span>` : h`<span class="faint">—</span>`}</td></tr>`)}</tbody></table></div>`
          : h`<div class="panel-body ok-text">${icon('check')} 全部 ${r.machines.length} 台计算机在此期间的备份都成功。</div>`,
        r.machines.length > failing.length || ui.allMachines ? h`<button class="btn sm ghost no-print" data-action="allMachines">${ui.allMachines ? '只看需关注的' : `显示全部 ${r.machines.length} 台`}</button>` : '')}
      ${r.plans.length > 1 ? block('按保护计划', '按计算机当前所属的计划', h`<div class="table-wrap"><table class="table cards report-table">
        <thead><tr><th>保护计划</th><th class="num">计算机</th><th class="num">备份次数</th><th class="num">失败</th><th class="num">成功率</th></tr></thead>
        <tbody>${r.plans.map((x) => h`<tr><td data-label="保护计划"><b>${x.name}</b></td><td data-label="计算机" class="num">${x.machines}</td><td data-label="备份次数" class="num">${num(x.runs)}</td>
          <td data-label="失败" class="num ${x.failed ? 'err-text' : ''}">${x.failed}</td><td data-label="成功率" class="num"><span class="${rateClass(x.rate)}">${pct(x.rate)}</span></td></tr>`)}</tbody></table></div>`) : ''}
      ${r.failures.length ? block('失败明细', r.failures.length > FAILURE_LIMIT ? `最近 ${FAILURE_LIMIT} 次，共 ${r.failures.length} 次；完整列表请导出“失败明细”` : `${r.failures.length} 次`, h`<div class="table-wrap"><table class="table cards report-table">
        <thead><tr><th>时间</th><th>计算机</th><th>原因</th><th>错误信息</th><th>之后</th></tr></thead>
        <tbody>${r.failures.slice(0, FAILURE_LIMIT).map((f) => h`<tr><td data-label="时间" class="nowrap"><a href="${'#/jobs?open=' + f.jobId}">${dateTime(f.time)}</a></td><td data-label="计算机">${f.machine}</td>
          <td data-label="原因" class="small">${f.categoryLabel}</td><td data-label="错误信息" class="small"><span class="clip-2" title="${f.message}">${f.message}</span></td>
          <td data-label="之后" class="nowrap small">${f.recovered ? h`<span class="ok-text">${dateTime(f.recoveredAt)} 恢复</span>` : h`<span class="err-text">仍未恢复</span>`}</td></tr>`)}</tbody></table></div>`) : ''}
      ${r.window.length ? block('超出备份时段', '按计划设置的备份时段判断', h`<div class="table-wrap"><table class="table cards report-table">
        <thead><tr><th>计算机</th><th>计划时段</th><th>开始</th><th>结束</th><th class="num">耗时</th></tr></thead>
        <tbody>${r.window.slice(0, FAILURE_LIMIT).map((w) => h`<tr><td data-label="计算机"><a href="${'#/jobs?open=' + w.jobId}">${w.machine}</a><br><small class="faint">${w.planName}</small></td><td data-label="计划时段">${w.window}</td>
          <td data-label="开始" class="nowrap">${dateTime(w.started)}</td><td data-label="结束" class="nowrap">${dateTime(w.ended)}</td><td data-label="耗时" class="num">${dur(w.ended - w.started)}</td></tr>`)}</tbody></table></div>`) : ''}
      ${r.other.length ? block('其他作业', '校验、空间回收、离线盘、异地复制等', h`<div class="table-wrap"><table class="table cards report-table">
        <thead><tr><th>作业类型</th><th class="num">次数</th><th class="num">失败</th><th class="num">有警告</th></tr></thead>
        <tbody>${r.other.map((o) => h`<tr><td data-label="作业类型"><a href="${'#/jobs?type=' + o.type}">${o.label}</a></td><td data-label="次数" class="num">${num(o.runs)}</td>
          <td data-label="失败" class="num ${o.failed ? 'err-text' : ''}">${o.failed}</td><td data-label="有警告" class="num">${o.warnings}</td></tr>`)}</tbody></table></div>`) : ''}
      ${notes(r)}
    </div>`;
  }

  // ── scheduled emails ──
  function schedule(d, admin) {
    const email = d.email || {};
    const list = d.subscriptions || [];
    return h`${email.configured
        ? h`<div class="callout">${icon('mail')}<div>定时报告通过“设置 → 通知”中的邮件服务器发送（发件人 ${email.from}）。没有填写收件人的报告发送给通知收件人${email.to && email.to.length ? `：${email.to.join('、')}` : '（尚未设置）'}。邮件正文是报告摘要，完整表格作为 CSV 附件。</div></div>`
        : h`<div class="callout warn">${icon('warn')}<div>尚未设置邮件服务器，定时报告无法发送。${admin ? h` <a href="#/settings/notifications">前往“设置 → 通知”</a>填写 SMTP 服务器和发件人。` : '请联系管理员在“设置 → 通知”中设置。'}</div></div>`}
      <section class="panel">
        <div class="panel-head"><h2>定时报告</h2><span class="sub">${list.length ? `${list.length} 个` : ''}</span>${admin ? h`<div class="end"><button class="btn sm primary" data-action="newSub">${icon('plus')}新建定时报告</button></div>` : ''}</div>
        ${list.length ? h`<div class="table-wrap"><table class="table cards">
          <thead><tr><th>名称</th><th>内容</th><th>发送时间</th><th>收件人</th><th>上次发送</th>${admin ? h`<th></th>` : ''}</tr></thead>
          <tbody>${list.map((s) => h`<tr>
            <td data-label="名称"><b>${s.name}</b>${s.enabled ? '' : h` <span class="pill off plain">已停用</span>`}${s.onlyProblems ? h`<br><small class="muted">只在有需处理的问题时发送</small>` : ''}</td>
            <td data-label="内容">${s.reports.map((k) => KINDS[k] || k).join('、')}</td>
            <td data-label="发送时间" class="nowrap">${frequency(s)}<br><small class="muted">${s.frequency === 'Monthly' ? '统计上一个自然月' : s.frequency === 'Daily' ? '统计近 24 小时' : '统计近 7 天'}</small></td>
            <td data-label="收件人" class="small">${s.to.length ? s.to.join('、') : h`<span class="muted">通知收件人</span>`}</td>
            <td data-label="上次发送" class="small">${s.lastError ? h`<span class="err-text">${s.lastError}</span>` : s.lastResult ? h`<span class="muted">${s.lastResult}</span>` : ''}${s.lastSent ? h`<br><small class="faint">${dateTime(s.lastSent, true)}</small>` : s.lastError || s.lastResult ? '' : h`<span class="faint">尚未发送</span>`}</td>
            ${admin ? h`<td class="actions-cell"><button class="btn sm" data-action="sendSub" data-id="${s.id}" ${email.configured ? '' : 'disabled'}>${icon('mail')}立即发送</button><button class="btn sm ghost" data-action="editSub" data-id="${s.id}">${icon('edit')}编辑</button><button class="btn sm ghost danger" data-action="deleteSub" data-id="${s.id}" aria-label="删除">${icon('trash')}</button></td>` : ''}
          </tr>`)}</tbody></table></div>`
        : h`<div class="empty">${icon('mail', 28)}<h3>还没有定时报告</h3><p>例如：每周一 08:00 把上周的保护状态和作业 SLA 报告发给运维组，每月 1 日把上月报告发给负责人。</p>${admin ? h`<button class="btn primary" data-action="newSub">${icon('plus')}新建定时报告</button>` : ''}</div>`}
      </section>`;
  }

  const toRequest = (s) => ({ id: s.id || null, name: s.name, enabled: s.enabled, reports: s.reports, frequency: s.frequency, day: s.day, time: s.time, to: s.to, onlyProblems: s.onlyProblems });

  async function saveSubs(list) {
    return R.api.put('/reports/subscriptions', { subscriptions: list.map(toRequest) });
  }

  function editSub(data, existing, ctx) {
    const s = existing || { name: '每周报告', enabled: true, reports: ['protection', 'jobs'], frequency: 'Weekly', day: 1, time: '08:00', to: [], onlyProblems: false };
    const m = R.modal({
      title: existing ? '编辑定时报告' : '新建定时报告',
      body: h`<form id="sub-form">
        <div class="field"><label for="sub-name">名称</label><input class="input" id="sub-name" name="name" value="${s.name}" maxlength="60" required></div>
        <div class="field"><span class="label">报告</span>
          ${Object.entries(KINDS).map(([k, l]) => h`<label class="check"><input type="checkbox" name="${'kind-' + k}" ${s.reports.includes(k) ? 'checked' : ''}><span>${l}<small>${k === 'protection' ? '发送时的状态：每台计算机是否按计划备份、保护缺口' : '统计时段内的备份成功率、失败原因、仍未恢复的计算机'}</small></span></label>`)}</div>
        <div class="row" style="grid-template-columns:1fr 1fr 1fr">
          <div class="field"><label for="sub-freq">频率</label><select class="input" id="sub-freq" name="frequency">${[['Daily', '每天'], ['Weekly', '每周'], ['Monthly', '每月']].map(([k, l]) => h`<option value="${k}" ${s.frequency === k ? 'selected' : ''}>${l}</option>`)}</select></div>
          <div class="field" data-when="Weekly"><label for="sub-week">星期</label><select class="input" id="sub-week" name="week">${WEEK.map((d, i) => h`<option value="${i}" ${s.frequency === 'Weekly' && s.day === i ? 'selected' : ''}>星期${d}</option>`)}</select></div>
          <div class="field" data-when="Monthly"><label for="sub-month">日期</label><select class="input" id="sub-month" name="month">${Array.from({ length: 28 }, (_, i) => i + 1).map((d) => h`<option value="${d}" ${s.frequency === 'Monthly' && s.day === d ? 'selected' : ''}>${d} 日</option>`)}</select></div>
          <div class="field"><label for="sub-time">时间</label><input class="input" type="time" id="sub-time" name="time" value="${s.time}" required></div>
        </div>
        <p class="hint small muted" id="sub-period" style="margin:-6px 0 14px"></p>
        <div class="field"><label for="sub-to">收件人</label><textarea class="input" id="sub-to" name="to" rows="3" placeholder="每行一个邮箱地址；留空则发送给通知收件人">${s.to.join('\n')}</textarea></div>
        <label class="check"><input type="checkbox" name="onlyProblems" ${s.onlyProblems ? 'checked' : ''}><span>只在有需处理的问题时发送<small>报告里没有错误、警告或失败时跳过这一次</small></span></label>
        <label class="check"><input type="checkbox" name="enabled" ${s.enabled ? 'checked' : ''}><span>启用</span></label>
      </form>`,
      foot: h`<button class="btn" data-close>取消</button><button class="btn primary" data-save>保存</button>`
    });
    const form = m.el.querySelector('#sub-form');
    const sync = () => {
      const f = form.querySelector('[name=frequency]').value;
      form.querySelectorAll('[data-when]').forEach((el) => { el.hidden = el.dataset.when !== f; });
      form.querySelector('#sub-period').textContent = f === 'Monthly' ? '每月统计上一个自然月的作业；保护状态为发送时的状态。' : f === 'Daily' ? '每天统计近 24 小时的作业；保护状态为发送时的状态。' : '每周统计近 7 天的作业；保护状态为发送时的状态。';
    };
    form.querySelector('[name=frequency]').addEventListener('change', sync);
    sync();
    m.el.querySelector('[data-save]').onclick = async () => {
      const f = R.formData(form);
      const next = {
        id: existing ? existing.id : null, name: f.name.trim(), enabled: f.enabled, onlyProblems: f.onlyProblems, frequency: f.frequency, time: f.time,
        day: f.frequency === 'Weekly' ? Number(f.week) : f.frequency === 'Monthly' ? Number(f.month) : 1,
        reports: Object.keys(KINDS).filter((k) => f['kind-' + k]),
        to: f.to.split(/[\s,;，；]+/).map((x) => x.trim()).filter(Boolean)
      };
      const list = data.subscriptions.map((x) => x.id === next.id ? next : x);
      if (!existing) list.push(next);
      try { await saveSubs(list); m.close(); R.toast('定时报告已保存'); ctx.reload(); }
      catch (e) { R.toast(e.message, 'err'); }
    };
  }

  // ── export ──
  function download(name, text) {
    const url = URL.createObjectURL(new Blob(['﻿' + text], { type: 'text/csv;charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
  }
  async function exportCsv(kind, table) {
    const q = kind === 'jobs' ? query() + (table ? '&table=' + table : '') : '';
    if (R.demo && R.demo.enabled) {
      const file = await R.demo.reportCsv(kind, table, q);
      download(file.name, file.text);
      return;
    }
    const a = document.createElement('a');
    a.href = '/api/reports/' + kind + '/csv' + (q ? '?' + q : '');
    a.setAttribute('download', '');
    document.body.appendChild(a); a.click(); a.remove();
  }
  function print(report) {
    const title = document.title;
    const stamp = new Date(report.generated);
    document.title = `BareTurn ${report.title} ${stamp.getFullYear()}-${pad(stamp.getMonth() + 1)}-${pad(stamp.getDate())}`;
    const restore = () => { document.title = title; window.removeEventListener('afterprint', restore); };
    window.addEventListener('afterprint', restore);
    window.print();
    setTimeout(restore, 2000);
  }

  R.pages.reports = {
    title: '报告',
    async load(params) {
      const tab = TABS.some(([k]) => k === params.id) ? params.id : 'protection';
      if (params.range && RANGES.some(([k]) => k === params.range)) { ui.range = params.range; history.replaceState(null, '', '#/reports/' + tab); }
      if (tab === 'schedule') return { tab, subs: await R.api.get('/reports/subscriptions') };
      return { tab, report: await R.api.get(tab === 'jobs' ? '/reports/jobs?' + query() : '/reports/protection') };
    },
    view(data, _, { can }) {
      const { tab, report } = data;
      const actions = report ? h`
        ${tab === 'jobs' ? h`<span class="menu-wrap"><button type="button" class="btn" data-menu-toggle aria-haspopup="menu" aria-expanded="false">${icon('download')}导出 CSV</button>
          <span class="menu-list" role="menu" hidden>${TABLES.map(([k, l]) => h`<button type="button" role="menuitem" data-action="csv" data-id="${k}"><span>${l}</span></button>`)}</span></span>`
          : h`<button class="btn" data-action="csv">${icon('download')}导出 CSV</button>`}
        <button class="btn" data-action="print" title="在打印对话框中选择“另存为 PDF”">${icon('file')}打印 / 导出 PDF</button>
        ${can('admin') ? h`<a class="btn ghost" href="#/reports/schedule">${icon('mail')}定时发送</a>` : ''}` : '';
      return h`${R.pageHead({ title: '报告', key: 'reports', sub: '查看计算机保护状态、备份与恢复记录，以及时段内的备份表现。', actions,
          help: h`<p><b>保护状态</b>是生成时的快照：每台计算机是否按计划完成备份、最早能恢复到哪天、最近的成功率，以及会导致数据没有被备份的保护缺口。</p>
            <p><b>作业与 SLA</b>列出时段内已结束的备份与恢复作业。恢复点时间表示数据所属的时间，执行时间表示实际作业的开始和结束。操作系统和地址取自当前计算机记录。</p>
            <p>导出 PDF：点击“打印 / 导出 PDF”，在打印对话框中选择“另存为 PDF”。报告底部的数据指纹可以用来核对 PDF 与 CSV 是否来自同一份数据。</p>` })}
        <nav class="tabs no-print">${TABS.filter(([k]) => k !== 'schedule' || can('admin') || data.subs).map(([k, l]) => h`<a href="${'#/reports/' + k}" class="${tab === k ? 'on' : ''}">${l}</a>`)}</nav>
        ${tab === 'schedule' ? schedule(data.subs, can('admin')) : tab === 'jobs' ? jobs(report) : protection(report)}`;
    },
    actions: {
      range(el, e, ctx) {
        ui.range = el.dataset.v; ui.allMachines = false; ui.allIssues = false;
        if (ui.range !== 'custom') { ctx.reload(); return; }
        ui.from = ui.from || day(-7); ui.to = ui.to || day(0);
        ctx.redraw();
      },
      from(el) { ui.from = el.value; },
      to(el) { ui.to = el.value; },
      apply(el, e, ctx) {
        if (!ui.from || !ui.to || ui.to < ui.from) { R.toast('请选择有效的开始和结束日期', 'err'); return; }
        ctx.reload();
      },
      filter(el, e, ctx) { ui.filter = el.dataset.v; ui.allMachines = false; ctx.redraw(); },
      allIssues(el, e, ctx) { ui.allIssues = true; ctx.redraw(); },
      allMachines(el, e, ctx) { ui.allMachines = !ui.allMachines; ctx.redraw(); },
      async csv(el, e, ctx) { await exportCsv(ctx.state.data.tab, el.dataset.id || null); },
      print(el, e, ctx) { print(ctx.state.data.report); },
      newSub(el, e, ctx) { editSub(ctx.state.data.subs, null, ctx); },
      editSub(el, e, ctx) { editSub(ctx.state.data.subs, ctx.state.data.subs.subscriptions.find((s) => s.id === el.dataset.id), ctx); },
      async deleteSub(el, e, ctx) {
        const subs = ctx.state.data.subs.subscriptions;
        const s = subs.find((x) => x.id === el.dataset.id);
        if (!s || !(await R.confirm({ title: '删除定时报告', message: `删除“${s.name}”？之后不会再发送这份报告。`, ok: '删除', danger: true }))) return;
        await saveSubs(subs.filter((x) => x.id !== s.id));
        R.toast('已删除'); ctx.reload();
      },
      async sendSub(el, e, ctx) {
        el.disabled = true;
        try { const r = await R.api.post('/reports/subscriptions/' + encodeURIComponent(el.dataset.id) + '/send'); R.toast(r.result || '已发送'); }
        catch (error) { R.toast(error.message, 'err'); }
        ctx.reload();
      }
    }
  };
})(window.R = window.R || {});

</script>
</body>
</html>
