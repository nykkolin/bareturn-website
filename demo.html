          <div class="panel-body"><ul class="path-list">${m.fileSelection.include.map((p) => h`<li>${icon('folder', 16)}<span class="mono">${p}</span></li>`)}</ul>
          ${(m.fileSelection.exclude || []).length ? h`<p class="small muted" style="margin:10px 0 0">排除：<span class="mono">${m.fileSelection.exclude.join('  ')}</span></p>` : ''}</div></section>` : ''}
        <section class="panel"><div class="panel-head"><h2>磁盘布局</h2><span class="sub">${lp.length} 块磁盘 · ${layout.firmware || ''} 启动</span></div>
          <div class="panel-body">${R.diskMap(layout, m.excludedDisks, m.includedPartitions)}</div></section>
        <section class="panel"><div class="panel-head"><h2>恢复点链</h2><span class="sub">实心为基准，空心为增量；点击查看详情</span><div class="end"><a class="btn sm ghost" href="${'#/machines/' + m.id + '/points'}">全部恢复点</a></div></div>
          <div class="panel-body">${R.timeline(points.slice(0, 200), sel && sel.id)}
          ${sel ? h`<div style="display:flex;gap:18px;align-items:center;margin-top:12px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line)">
            <div><b>${dateTime(sel.created, true)}</b> <span class="tag">${isFiles(sel) ? '文件级' : sel.kind === 'Base' ? '基准' : '增量'}</span></div>
            <span class="muted small">变化 ${bytes(sel.changedBytes)} · 新增存储 ${bytes(sel.storedBytes)} · 耗时 ${R.duration(sel.durationMs)}</span>
            <span class="muted small">${sel.verifyStatus === 'Ok' ? '已校验 ' + ago(sel.verified) : sel.verifyStatus === 'Failed' ? '校验失败' : '未校验'}</span>
            <div style="margin-left:auto;display:flex;gap:8px"><a class="btn sm primary" href="${'#/restore?point=' + sel.id}">${icon('wand')}恢复…</a>${R.menu([
              { action: 'mount', id: sel.id, label: isFiles(sel) ? '浏览文件' : '挂载浏览', icon: 'mount' },
              sel.bareMetal !== false && !isFiles(sel) ? { action: 'restore', id: sel.id, label: isVm(sel) ? '整机恢复' : '裸机恢复步骤', icon: 'restore' } : null,
              { action: 'verify', id: sel.id, label: '校验', icon: 'check' }])}</div>
          </div>` : ''}</div></section>
      </div>
      <div class="stack">
        <section class="panel"><div class="panel-head"><h2>保护</h2></div><div class="panel-body"><dl class="kv">
          ${kvRow('保护计划', plan ? h`<a href="#/plans">${plan.name}</a>` : h`<span class="faint">未分配</span>`)}
          ${plan ? kvRow('计划', R.pages.plans.describe(plan)) : ''}
          ${kvRow('备份范围', R.scopeSummary(layout, m.includedPartitions, m.fileSelection, m.scope))}
          ${kvRow('上次备份', m.lastBackup ? `${dateTime(m.lastBackup, true)}（${ago(m.lastBackup)}）` : '从未')}
          ${kvRow('下次备份', m.paused ? '已暂停' : m.nextRun ? dateTime(m.nextRun) : '—')}
          ${kvRow('恢复点', `${m.pointCount} 个`)}
          ${kvRow('受保护数据', bytes(m.protectedBytes))}
          ${kvRow('存储库', m.repositoryName ? h`<a href="#/repositories">${m.repositoryName}</a>` : h`<span class="faint">未选择</span>`)}
        </dl></div></section>
        <section class="panel"><div class="panel-head"><h2>系统</h2></div><div class="panel-body"><dl class="kv">
          ${kvRow('操作系统', `${layout.osName || m.osName || '—'}${layout.osBuild ? '（版本 ' + layout.osBuild + '）' : ''}`)}
          ${kvRow('硬件', [layout.manufacturer, layout.model].filter(Boolean).join(' ') || '—')}
          ${kvRow('处理器', layout.cpuName ? `${layout.cpuName}（${layout.processors} 线程）` : '—')}
          ${kvRow('内存', layout.memoryBytes ? bytes(layout.memoryBytes, 0) : '—')}
          ${kvRow('网络', (layout.networks || []).map((n) => (n.addresses || []).filter((a) => a && a.includes('.')).join(', ')).filter(Boolean).join('；') || '—')}
          ${kvRow('Agent', m.agentVersion || '—')}
          ${m.fingerprint ? kvRow('证书', h`<span class="mono">${m.fingerprint.slice(0, 16)}…</span>`) : ''}
        </dl></div></section>
      </div></div>`;
  }

  function pointsTab(d, can) {
    if (!d.points.length) return h`<section class="panel"><div class="empty">${icon('points', 28)}<h3>还没有恢复点</h3><p>首次备份完成后，恢复点会显示在这里。</p></div></section>`;
    const sel = pickSet(d.machine.id);
    [...sel].forEach((id) => { if (!d.points.some((p) => p.id === id)) sel.delete(id); });
    const admin = can('admin');
    return h`<section class="panel">
      ${admin ? h`<div class="selbar"><span class="muted small">${sel.size ? `已选择 ${sel.size} 个恢复点` : '勾选恢复点后可以批量删除。较早的恢复点删除时会合并到其后的恢复点，后续恢复点仍可完整恢复。'}</span>
        <div style="margin-left:auto;display:flex;gap:8px">${sel.size ? h`<button class="btn sm ghost" data-action="pt-clear">取消选择</button>` : ''}<button class="btn sm danger" data-action="delete-points" ${sel.size ? '' : 'disabled'}>${icon('trash')}删除所选</button></div></div>` : ''}
      <div style="overflow-x:auto"><table class="table">
      <thead><tr>${admin ? h`<th class="pick"><input type="checkbox" data-action="pt-all" aria-label="全选" ${sel.size === d.points.length ? 'checked' : ''}></th>` : ''}<th>时间</th><th>类型</th><th class="num">变化数据</th><th class="num">新增存储</th><th class="num">已用数据</th><th>耗时</th><th>校验</th><th></th></tr></thead>
      <tbody>${d.points.map((p) => h`<tr class="${sel.has(p.id) ? 'sel' : ''}">
        ${admin ? h`<td class="pick"><input type="checkbox" data-action="pt-pick" data-id="${p.id}" ${sel.has(p.id) ? 'checked' : ''} aria-label="${'选择 ' + dateTime(p.created, true)}"></td>` : ''}
        <td class="nowrap"><b>${dateTime(p.created, true)}</b><br><small class="muted">${ago(p.created)}</small></td>
        <td>${isFiles(p) ? h`<span class="tag brand">文件级</span>` : p.kind === 'Base' ? h`<span class="tag brand">基准</span>` : h`<span class="tag">增量</span>`}${isFiles(p) ? '' : pointTag(p)}</td>
        <td class="num">${bytes(p.changedBytes)}</td><td class="num">${bytes(p.storedBytes)}</td><td class="num">${bytes(p.usedBytes)}</td>
        <td class="nowrap">${R.duration(p.durationMs)}</td>
        <td>${p.verifyStatus === 'Ok' ? pill({ ok: ['ok', '通过'] }, 'ok') : p.verifyStatus === 'Failed' ? pill({ e: ['err', '失败'] }, 'e') : h`<span class="faint">未校验</span>`}</td>
        <td class="actions-cell">${can('operate') ? h`<a class="btn sm" href="${'#/restore?point=' + p.id}">${icon('wand')}恢复…</a>` : ''}${R.menu([
          can('operate') ? { action: 'mount', id: p.id, label: isFiles(p) ? '浏览文件' : '挂载浏览', icon: 'mount' } : null,
          p.bareMetal !== false && !isFiles(p) ? { action: 'restore', id: p.id, label: isVm(p) ? '整机恢复' : '裸机恢复步骤', icon: 'restore' } : null,
          isVm(p) && can('operate') ? { action: 'instant', id: p.id, label: '即时恢复', icon: 'play' } : null,
          can('operate') ? { action: 'verify', id: p.id, label: '校验', icon: 'check' } : null,
          admin ? '-' : null,
          admin ? { action: 'delete-point', id: p.id, label: '删除…', icon: 'trash', danger: true } : null])}</td>
      </tr>`)}</tbody></table></div></section>`;
  }

  function settingsTab(d, m, can) {
    const layout = m.layout || { disks: [] };
    return h`<div class="grid two">
      <section class="panel"><div class="panel-head"><h2>保护设置</h2></div><div class="panel-body"><form id="machine-settings">
        <div class="field"><label for="ms-name">显示名称</label><input class="input" id="ms-name" name="name" value="${m.name}" ${can('operate') ? '' : 'disabled'}></div>
        <div class="row" style="grid-template-columns:1fr 1fr">
          <div class="field"><label for="ms-repo">存储库</label><select class="input" id="ms-repo" name="repositoryId" ${can('operate') && !m.archived ? '' : 'disabled'}><option value="">未选择</option>${R.repoOptions(d.repositories, m.repositoryId)}</select><span class="hint">备份数据存放的位置</span></div>
          <div class="field"><label for="ms-plan">保护计划</label><select class="input" id="ms-plan" name="planId" ${can('operate') && !m.archived ? '' : 'disabled'}><option value="">未分配</option>${d.plans.map((p) => h`<option value="${p.id}" ${p.id === m.planId ? 'selected' : ''}>${p.name}</option>`)}</select><span class="hint">备份时间与保留策略</span></div>
        </div>
        <div class="field"><span class="label">备份范围</span><div id="scope-panel"></div></div>
        <div class="field" id="disk-include"><span class="label">包含的磁盘</span>${layout.disks.map((disk) => {
          const system = disk.isBoot || disk.isSystem;
          return h`<label class="check"><input type="checkbox" data-disk="${disk.uniqueId}" ${m.excludedDisks.includes(disk.uniqueId) ? '' : 'checked'} ${system || !disk.supported || !can('operate') ? 'disabled' : ''}><span>磁盘 ${disk.number} · ${disk.friendlyName} · ${bytes(disk.size)}<small>${system ? '系统磁盘，始终包含' : disk.supported ? disk.partitionStyle : disk.unsupportedReason}</small></span></label>`;
        })}</div>
        ${can('operate') ? h`<button type="button" class="btn primary" data-action="save">保存设置</button>` : ''}
      </form></div></section>
      ${m.archived ? h`<div class="stack">
        ${can('operate') ? h`<section class="panel"><div class="panel-head"><h2>恢复保护</h2></div><div class="panel-body">
          <p style="margin-top:0">重新与这台计算机上的 BareTurn Agent 配对（Agent 重装过也可以），沿用此计算机的名称、恢复点和历史记录，并重新分配保护计划。下次备份会完整扫描一次，之后继续增量。</p>
          <button class="btn primary" data-action="reprotect">${icon('shield')}恢复保护…</button></div></section>` : ''}
        ${can('admin') ? h`<section class="panel"><div class="panel-head"><h2>删除计算机</h2></div><div class="panel-body">
          <p style="margin-top:0">从控制台删除此计算机。可以选择把恢复点数据留在存储库中（之后可在“存储库”中重新导入，恢复控制台也能直接从存储库磁盘读取），或同时永久删除恢复点并回收空间。</p>
          <button class="btn danger" data-action="remove-archived">${icon('trash')}删除计算机…</button></div></section>` : ''}
      </div>` : can('admin') ? h`<section class="panel"><div class="panel-head"><h2>停止或删除</h2></div><div class="panel-body">
        <p style="margin-top:0">停止保护会解除配对并停止计划备份，现有恢复点保留，仍可用于裸机恢复。停止后计算机显示为“已归档”，可以随时恢复保护。</p>
        <button class="btn danger" data-action="stop">停止保护</button>
        <p>删除计算机会永久删除它的所有恢复点并回收存储库空间。</p>
        <button class="btn danger solid" data-action="remove">${icon('trash')}删除计算机及恢复点</button>
      </div></section>` : ''}
    </div>`;
  }

  // ───────────── delete recovery points ─────────────
  // Returns true when the delete job was queued. Older points are merged into their successor; the newest is removed.
  async function deletePoints(machine, chosen, all) {
    if (!chosen.length) return false;
    const newest = all.filter((p) => !isFiles(p)).sort((a, b) => b.created - a.created)[0];
    const everything = chosen.length === all.length;
    const lines = chosen.length === 1 ? `${dateTime(chosen[0].created, true)} 的${isFiles(chosen[0]) ? '文件级' : chosen[0].kind === 'Base' ? '基准' : '增量'}恢复点` : `${chosen.length} 个恢复点`;
    const notes = [];
    if (chosen.some((p) => !isFiles(p) && p !== newest)) notes.push('较早的恢复点会合并到其后的恢复点：后续恢复点所需的数据会保留，仍可完整恢复。');
    if (newest && chosen.includes(newest)) notes.push('删除最新的整机/分区恢复点后，下次备份会完整扫描一次（仍按增量存储）。');
    if (everything) notes.push(`这会删除 ${machine.name} 的全部恢复点。`);
    notes.push('不再被引用的数据会在下次空间回收（夜间维护）时释放。此操作不可撤销。');
    if (!await R.confirm({ title: '删除恢复点', message: `删除 ${machine.name} ${lines}？${notes.join('')}`, ok: '删除', danger: true, typed: everything || chosen.length > 10 ? machine.name : null })) return false;
    try {
      const job = await R.api.post('/points/delete', { ids: chosen.map((p) => p.id) });
      R.toast('删除作业已加入队列'); return !!job;
    } catch (error) { R.toast(error.message, 'err'); return false; }
  }

  R.deletePoints = deletePoints;

  // ───────────── archived machines: resume protection / delete ─────────────
  function reprotectDialog(machine, plans, repositories, done) {
    const targets = (repositories || []).filter((r) => r.kind !== 'Offline');
    const ip = ((machine.layout && machine.layout.networks) || []).flatMap((n) => n.addresses || []).find((a) => /^\d+\.\d+\.\d+\.\d+$/.test(a)) || '';
    const s = { step: 0, host: machine.host || ip, port: machine.port || 9803, cert: null, user: '', planId: plans[0] ? plans[0].id : '',
      repositoryId: targets.some((r) => r.id === machine.repositoryId) ? machine.repositoryId : (targets[0] || {}).id || '', startNow: true, confirm: null, allowName: false, busy: false, error: '' };
    const m = R.modal({ title: '恢复保护 ' + machine.name, body: '' });
    function draw() {
      const body = s.step === 0 ? h`<p style="margin-top:0">确认这台计算机上已安装并运行 BareTurn Agent，然后输入它当前的地址。此步骤只建立 TLS 连接、读取证书，不发送账户信息。</p>
          <div class="row" style="grid-template-columns:1fr 120px"><div class="field"><label for="rp-host">主机名或 IP 地址</label><input class="input" id="rp-host" value="${s.host}" placeholder="例如 10.20.1.21"></div>
          <div class="field"><label for="rp-port">端口</label><input class="input" id="rp-port" type="number" min="1" max="65535" value="${s.port}"></div></div>`
        : h`<div class="callout ok" style="margin-top:0">${icon('lock')}<div>已连接 ${s.host}:${s.port}（${s.cert.subject}）<br><span class="mono small">${s.cert.fingerprint.match(/.{1,4}/g).join(' ')}</span><br><span class="small">请与客户端安装完成页或 connection-info.txt 中的指纹核对。</span></div></div>
          <div class="field"><label for="rp-user">管理员账户</label><input class="input" id="rp-user" value="${s.user}" placeholder="Windows：CORP\\backup-admin；Linux：root 或 sudo 用户" autocomplete="off"></div>
          <div class="field"><label for="rp-pass">密码</label><input class="input" id="rp-pass" type="password" autocomplete="new-password"><span class="hint">只用于本次配对，Core 不保存。</span></div>
          <div class="row" style="grid-template-columns:1fr 1fr">
            <div class="field"><label for="rp-repo">存储库</label><select class="input" id="rp-repo"><option value="">稍后选择</option>${R.repoOptions(targets, s.repositoryId)}</select>${machine.repositoryId && s.repositoryId === machine.repositoryId ? h`<span class="hint">原恢复点所在的存储库，继续原有链</span>` : ''}</div>
            <div class="field"><label for="rp-plan">保护计划</label><select class="input" id="rp-plan"><option value="">稍后分配</option>${plans.map((p) => h`<option value="${p.id}" ${p.id === s.planId ? 'selected' : ''}>${p.name}</option>`)}</select></div>
          </div>
          <label class="check"><input type="checkbox" id="rp-start" ${s.startNow ? 'checked' : ''}><span>完成后立即备份<small>沿用原有恢复点链；客户端变化缓存不同，首次会完整扫描。</small></span></label>
          ${s.confirm ? h`<div class="callout warn">${icon('warn')}<div>${s.confirm}<label class="check" style="margin:8px 0 0"><input type="checkbox" id="rp-allow" ${s.allowName ? 'checked' : ''}><span>我确认这是同一台计算机</span></label></div></div>` : ''}`;
      m.set(h`${body}${s.error ? h`<div class="callout err" role="alert">${icon('error')}<div>${s.error}</div></div>` : ''}
        <div class="modal-foot" style="padding:12px 0 0">${s.step === 1 ? h`<button class="btn" data-back>上一步</button>` : ''}<button class="btn" data-close>取消</button>
          <button class="btn primary" data-next ${s.busy ? 'disabled' : ''}>${s.busy ? '请稍候…' : s.step === 0 ? '连接' : '配对并恢复保护'}</button></div>`);
      const bind = (sel, ev, fn) => { const el = m.el.querySelector(sel); if (el) el.addEventListener(ev, fn); };
      bind('[data-next]', 'click', next);
      bind('[data-back]', 'click', () => { s.step = 0; s.error = ''; s.confirm = null; draw(); });
      bind('#rp-plan', 'change', (e) => { s.planId = e.target.value; });
      bind('#rp-repo', 'change', (e) => { s.repositoryId = e.target.value; });
      bind('#rp-start', 'change', (e) => { s.startNow = e.target.checked; });
      bind('#rp-allow', 'change', (e) => { s.allowName = e.target.checked; });
      bind('#rp-user', 'input', (e) => { s.user = e.target.value; });
      m.el.querySelectorAll('input:not([type=checkbox])').forEach((i) => i.addEventListener('keydown', (e) => { if (e.key === 'Enter') next(); }));
      const first = m.el.querySelector(s.step === 0 ? '#rp-host' : s.user ? '#rp-pass' : '#rp-user');
      if (first) first.focus();
    }
    async function next() {
      if (s.busy) return;
      s.error = '';
      const v = (id) => { const el = m.el.querySelector('#' + id); return el ? el.value.trim() : ''; };
      try {
        if (s.step === 0) {
          s.host = v('rp-host'); s.port = Number(v('rp-port')) || 9803;
          if (!s.host) throw new Error('请输入主机名或 IP 地址。');
          s.busy = true; draw();
          s.cert = await R.api.post('/machines/discover', { host: s.host, port: s.port });
          s.step = 1;
        } else {
          s.user = v('rp-user');
          const password = m.el.querySelector('#rp-pass').value;
          if (!s.user || !password) throw new Error('请输入用户名和密码。');
          if (s.confirm && !s.allowName) throw new Error('请先确认这是同一台计算机。');
          if (s.planId && !s.repositoryId) throw new Error('分配保护计划前请先选择存储库。');
          s.busy = true; draw();
          try {
            await R.api.post('/machines/' + machine.id + '/reprotect', { host: s.host, port: s.port, fingerprint: s.cert.fingerprint, userName: s.user, password, planId: s.planId || null, repositoryId: s.repositoryId || null, allowNameChange: s.allowName, startNow: s.startNow && !!s.planId });
          } catch (error) {
            if (error.data && error.data.confirm === 'name') { s.confirm = error.message; s.busy = false; draw(); return; }
            throw error;
          }
          m.close();
          R.toast(s.planId && s.startNow ? `已恢复保护 ${machine.name}，备份已排队` : `已恢复保护 ${machine.name}`);
          done();
          return;
        }
      } catch (error) { s.error = error.message; }
      s.busy = false; draw();
    }
    draw();
  }

  function removeArchivedDialog(machine, count, done) {
    const s = { keep: true };
    const m = R.modal({ title: '删除计算机 ' + machine.name, body: '' });
    function draw() {
      m.set(h`<p style="margin-top:0">${machine.name} 已停止保护，有 ${count} 个恢复点。</p>
        <div class="choice">
          <label class="${s.keep ? 'on' : ''}"><input type="radio" name="ra-mode" value="keep" ${s.keep ? 'checked' : ''}><span><strong>保留恢复点数据</strong><small>只从控制台删除此计算机。恢复点仍留在存储库中，不参与保留策略和空间回收；需要时可在“存储库”中导入，恢复控制台也能直接从存储库磁盘读取。</small></span></label>
          <label class="${s.keep ? '' : 'on'}"><input type="radio" name="ra-mode" value="delete" ${s.keep ? '' : 'checked'}><span><strong>同时删除恢复点</strong><small>永久删除全部 ${count} 个恢复点并在存储库中回收空间，不可撤销。</small></span></label>
        </div>
        ${s.keep ? '' : h`<div class="field" style="margin-top:14px"><label>输入 <b>${machine.name}</b> 以确认</label><input class="input" data-typed autocomplete="off"></div>`}
        <div class="modal-foot" style="padding:12px 0 0"><button class="btn" data-close>取消</button><button class="btn danger solid" data-ok ${s.keep ? '' : 'disabled'}>${s.keep ? '删除计算机' : '永久删除计算机及恢复点'}</button></div>`);
      m.el.querySelectorAll('input[name=ra-mode]').forEach((r) => r.addEventListener('change', () => { s.keep = r.value === 'keep'; draw(); }));
      const typed = m.el.querySelector('[data-typed]'), ok = m.el.querySelector('[data-ok]');
      if (typed) typed.addEventListener('input', () => { ok.disabled = typed.value !== machine.name; });
      ok.addEventListener('click', async () => {
        ok.disabled = true;
        try {
          await R.api.del('/machines/' + machine.id + (s.keep ? '?keepPoints=true' : '?deletePoints=true'));
          m.close(); R.toast(s.keep ? '已删除计算机，恢复点数据保留在存储库中' : '删除作业已加入队列'); done();
        } catch (error) { ok.disabled = false; R.toast(error.message, 'err'); }
      });
    }
    draw();
  }

  R.bmrDialog = (machine, point) => restoreDialog(machine, point);
  function restoreDialog(machine, point) {
    if (!point) return;
    R.modal({
      title: '裸机恢复',
      body: h`<p style="margin-top:0">将 <b>${machine.name}</b> 恢复到 <b>${dateTime(point.created, true)}</b> 的状态（${point.kind === 'Base' ? '基准' : '增量'}恢复点，已用数据 ${bytes(point.usedBytes)}）。</p>
        <ol class="steps">
          <li><div><strong>准备恢复介质</strong><span>在“恢复介质”中生成 ISO（需要时注入网卡或 RAID 驱动），刻录到 U 盘或挂载到虚拟机。</span></div></li>
          <li><div><strong>以 ${machine.firmware || '与源系统相同的'} 模式启动目标计算机</strong><span>通用恢复控制台会自动启动，配置网络后连接到此 Core。</span></div></li>
          <li><div><strong>选择此恢复点与目标磁盘</strong><span>使用管理员或操作员账户登录，选择 ${machine.name} 的这个恢复点。控制台会按源分区布局重建并写入目标磁盘。</span></div></li>
          <li><div><strong>修复引导并重启</strong><span>默认重建 BCD 并启用通用存储驱动，异机恢复可同时注入驱动。进度会显示在“任务”中。</span></div></li>
        </ol>`,
      foot: h`<span class="left mono">${point.id.slice(0, 8)}</span><button class="btn" data-close>关闭</button><a class="btn primary" href="#/media" data-close>${icon('media')}前往恢复介质</a>`
    });
  }
})(window.R = window.R || {});

</script>
  <script>
(function (R) {
  'use strict';
  const { h, icon } = R;
  const dayNames = ['日', '一', '二', '三', '四', '五', '六'];

  function describe(p) {
    const s = p.schedule || {};
    let text;
    if (s.mode === 'Interval') {
      const every = s.intervalMinutes % 60 === 0 ? `每 ${s.intervalMinutes / 60} 小时` : `每 ${s.intervalMinutes} 分钟`;
      text = every + (s.windowStart !== s.windowEnd ? `（${s.windowStart}–${s.windowEnd}）` : '');
    } else if (s.mode === 'Daily') text = `每天 ${s.time}`;
    else text = `每周${(s.days || []).map((d) => dayNames[d]).join('、')} ${s.time}`;
    if (s.mode !== 'Weekly' && s.days && s.days.length && s.days.length < 7) text += `，仅周${s.days.map((d) => dayNames[d]).join('、')}`;
    return text;
  }

  function retentionText(r) {
    const parts = [`全部保留 ${r.keepAllHours >= 48 && r.keepAllHours % 24 === 0 ? r.keepAllHours / 24 + ' 天' : r.keepAllHours + ' 小时'}`];
    if (r.hourlyDays) parts.push(`每小时 1 个保留 ${r.hourlyDays} 天`);
    if (r.dailyDays) parts.push(`每天 1 个保留 ${r.dailyDays} 天`);
    if (r.weeklyWeeks) parts.push(`每周 1 个保留 ${r.weeklyWeeks} 周`);
    if (r.monthlyMonths) parts.push(`每月 1 个保留 ${r.monthlyMonths} 个月`);
    return parts.join('，');
  }

  // Approximate number of points kept with continuous backups at this schedule.
  function estimate(p) {
    const s = p.schedule, r = p.retention;
    const perHour = s.mode === 'Interval' ? 60 / s.intervalMinutes : 1 / 24;
    return Math.round(r.keepAllHours * perHour + r.hourlyDays * 24 * Math.min(1, perHour) + r.dailyDays + r.weeklyWeeks + r.monthlyMonths);
  }

  // The tiers as chips: "24 小时 全部 · 7 天 每小时 · 30 天 每天 · 12 周 每周 · 24 月 每月".
  function retentionChips(r) {
    const tiers = [[r.keepAllHours, ' 小时', '全部'], [r.hourlyDays, ' 天', '每小时 1 个'], [r.dailyDays, ' 天', '每天 1 个'], [r.weeklyWeeks, ' 周', '每周 1 个'], [r.monthlyMonths, ' 个月', '每月 1 个']].filter((t) => t[0] > 0);
    return h`<div class="tiers">${tiers.map(([n, unit, what]) => h`<span class="tier" title="${n + unit + '内' + what}"><b>${n}${unit}</b>${what}</span>`)}</div>`;
  }

  R.pages.plans = {
    title: '保护计划',
    describe,
    load: async () => ({ plans: await R.api.get('/plans') }),
    view({ plans }, _, { can }) {
      return h`
        ${R.pageHead({ title: '保护计划', key: 'plans', sub: `${plans.length} 个计划`,

  function editor(plan, ctx, onDone) {

            <div class="field"><label>时间窗口结束</label><input class="input" type="time" name="windowEnd" value="${s.windowEnd}"><span class="hint">开始与结束相同表示全天</span></div></div>`
          : h`<div class="field" style="max-width:200px"><label>开始时间</label><input class="input" type="time" name="time" value="${s.time}"></div>`}
        <div class="field"><span class="label">${s.mode === 'Weekly' ? '星期' : '仅在这些日子运行（不选表示每天）'}</span><div class="days">${[1, 2, 3, 4, 5, 6, 0].map((d) => h`<button type="button" class="${s.days.includes(d) ? 'on' : ''}" data-day="${d}" aria-pressed="${s.days.includes(d)}">${dayNames[d]}</button>`)}</div></div>
        <h3 style="font-size:15px;margin:18px 0 4px">保留策略</h3>
        <p class="muted small" style="margin:0 0 12px">超出保留范围的恢复点会在夜间维护时合并进后续恢复点，链始终保持可恢复。</p>
        <div class="row" style="grid-template-columns:repeat(5,1fr)">
          ${num('keepAllHours', p.retention.keepAllHours, '保留全部', '小时', 1, 8760)}
          ${num('hourlyDays', p.retention.hourlyDays, '之后每小时 1 个', '天', 0, 365)}
          ${num('dailyDays', p.retention.dailyDays, '之后每天 1 个', '天', 0, 3650)}
          ${num('weeklyWeeks', p.retention.weeklyWeeks, '之后每周 1 个', '周', 0, 520)}
          ${num('monthlyMonths', p.retention.monthlyMonths, '之后每月 1 个', '月', 0, 240)}
        </div>
        <div class="callout" style="margin-top:16px">${icon('info')}<div>备份哪些内容（整机、仅系统磁盘、指定分区或文件夹）和存到哪个存储库，在“计算机 › 设置”中为每台计算机单独选择。</div></div>
        <label class="check" style="margin-top:14px"><input type="checkbox" name="enabled" ${p.enabled ? 'checked' : ''}><span>启用计划</span></label>
      </form>`);
      m.el.querySelector('#pe-est').textContent = `按此设置约保留 ${estimate(p)} 个恢复点`;
    }
    function collect() {
      const f = R.formData(m.el.querySelector('#plan-form'));
      p.name = f.name; p.description = f.description; p.enabled = f.enabled;
      if (p.schedule.mode === 'Interval') Object.assign(p.schedule, { intervalMinutes: Number(f.intervalMinutes), windowStart: f.windowStart, windowEnd: f.windowEnd });
      else p.schedule.time = f.time;
      ['keepAllHours', 'hourlyDays', 'dailyDays', 'weeklyWeeks', 'monthlyMonths'].forEach((k) => { p.retention[k] = f[k] == null ? 0 : f[k]; });
    }
    m.el.addEventListener('click', async (e) => {
      const mode = e.target.closest('[data-mode]'), day = e.target.closest('[data-day]');
      if (mode) { collect(); p.schedule.mode = mode.dataset.mode; draw(); }
      if (day) { collect(); const d = Number(day.dataset.day); p.schedule.days = p.schedule.days.includes(d) ? p.schedule.days.filter((x) => x !== d) : p.schedule.days.concat(d); draw(); }
      if (e.target.closest('[data-save]')) {
        collect();
        const body = { name: p.name, description: p.description, schedule: p.schedule, retention: p.retention, enabled: p.enabled };
        try { const saved = plan ? await R.api.put('/plans/' + plan.id, body) : await R.api.post('/plans', body); m.close(); R.toast(plan ? '计划已保存' : '计划已创建'); onDone ? onDone(saved) : ctx.reload(); }
        catch (err) { R.toast(err.message, 'err'); }
      }
    });
    m.el.addEventListener('change', (e) => { if (e.target.closest('#plan-form')) { collect(); draw(); } });
    draw();
  }
  R.planEditor = (onDone) => editor(null, null, onDone);

  R.pages.instant = {
    title: '即时恢复', live: 5000, async load() { const [sessions, platforms] = await Promise.all([R.api.get('/instant'),R.api.get('/hypervisors')]); return sessions.map(s => Object.assign(s, {platformKind:(platforms.find(p=>p.id===s.hypervisorId)||{}).kind})); },
    view(sessions, params, { can }) {

        <div class="stats"><span>开始于 ${dateTime(s.created, true)} · ${ago(s.created)}</span><span> 读取 ${bytes(s.readBytesPerSecond || 0)}/秒 · 写入 ${bytes(s.writeBytesPerSecond || 0)}/秒 · 缓存剩余 ${s.cacheFreeBytes == null ? '—' : bytes(s.cacheFreeBytes)} · 脏数据 ${bytes(s.dirtyBytes)} · 预计切换停机 ${s.estimatedDowntimeSeconds || 0} 秒</span></div>
        <div class="actions" style="margin-top:16px">${can('operate') && s.state === 'Running' ? h`${s.platformKind === 'VCenter' ? h`<button class="btn primary" data-action="migrate" data-id="${s.id}">在线迁移</button>` : ''}<button class="btn" data-action="seed" data-id="${s.id}">预置到生产</button>` : ''}

        <a class="btn ghost" href="${'#/jobs?machineId=' + s.machineId}">查看任务</a></div></div></section>`) : h`<section class="panel"><div class="empty">没有即时恢复会话。到恢复点页面选择一个虚拟机恢复点开始。</div></section>`}`;

      async stop(el, event, ctx) { if (await R.confirm({ title: '停止并丢弃', message: '临时虚拟机及运行期间的全部写入将被丢弃，恢复点保留。', danger: true, ok: '丢弃会话' })) { await R.api.post('/instant/' + el.dataset.id + '/stop'); ctx.reload(); } }

    return h`<section class="panel"><div class="panel-head"><h2>虚拟化与即时恢复</h2></div><div class="panel-body">

      <div class="form-grid">${[['bindAddress','导出绑定 IP',settings.bindAddress],['cachePath','缓存目录',settings.cachePath],['maxSessions','最大会话数',settings.maxSessions],['cacheMiB','每会话内存缓存（MiB）',settings.cacheMiB],['maxCacheGiB','每会话写入缓存上限（GiB）',Math.round(settings.maxCacheBytes / 1024 ** 3)],['nfsPort','NFS 端口',settings.nfsPort],['mountPort','MOUNT 端口',settings.mountPort],['iscsiPort','iSCSI 端口',settings.iscsiPort]].map(([key,label,val]) => h`<label class="field">${label}<input name="${key}" value="${val || ''}"></label>`)}</div></form>
      <div class="callout">仅在可信管理或存储网络开放导出端口。修改绑定地址或端口前请结束所有即时恢复会话，并同步修改主机防火墙规则。</div><button class="btn primary" data-action="saveVirtualization">保存设置</button></div></section>`;

</script>
  <script>
/* Offsite copies: recovery points copied to S3-compatible object storage, optionally under Object Lock (immutable). */
(function (R) {
  'use strict';
  const { h, icon, bytes, ago, dateTime } = R;
  const LOCK = { Compliance: '合规模式（任何人都不能提前删除）', Governance: '治理模式（有特殊权限的账户可提前删除）', None: '不锁定' };
  const statusPill = (t) => t.running ? h`<span class="pill run">${t.running.status === 'Queued' ? '排队中' : '正在复制 ' + Math.round(t.running.progress) + '%'}</span>`
    : t.status === 'Ok' ? h`<span class="pill ok">正常</span>` : t.status === 'Warning' ? h`<span class="pill warn">部分完成</span>` : t.status === 'Error' ? h`<span class="pill err">失败</span>` : h`<span class="pill off">尚未复制</span>`;

  function offsiteSection(targets, repos, can) {
    return h`
      <div class="section-head" id="section-offsite"><div class="page-title"><h2>异地副本${R.helpToggle('offsite')}</h2><p>把恢复点复制到 S3 兼容的对象存储（AWS S3、MinIO、Wasabi、Backblaze B2、Ceph 等），可启用对象锁定成为不可变副本。</p>
        ${R.helpBody('offsite', h`<p>每次复制把每台计算机的最新恢复点作为<b>独立的完整恢复点</b>上传：只上传对象存储中还没有的 1 MiB 块（全局去重），每个块用这个副本自己的密钥以 AES-256-GCM 加密。</p>
          <p>启用<b>对象锁定（Object Lock）</b>后，上传的块和恢复点在锁定期内无法被删除或覆盖——即使 Core 被攻陷、访问密钥泄露。被新恢复点继续引用的块会自动延长锁定期。超过保留天数的副本在锁定到期后自动删除（每台计算机最新的副本始终保留）。</p>
          <p>对象锁定只能在<b>创建存储桶时</b>开启。Core 丢失时，在新的 Core 上“连接现有副本”并输入加密口令，即可把恢复点下载到本地存储库，然后挂载或裸机恢复。</p>`)}</div>
        <div class="actions">${can('admin') ? h`<button class="btn" data-action="offsiteAttach">${icon('link')}连接现有副本</button><button class="btn primary" data-action="offsiteCreate">${icon('plus')}新建异地副本</button>` : ''}</div></div>
      ${targets.length ? h`<div class="stack">${targets.map((t) => h`<section class="panel">
        <div class="panel-head">${icon('cloud')}<h2>${t.name}</h2>${statusPill(t)}${t.lockMode !== 'None' ? h`<span class="tag brand" title="${LOCK[t.lockMode]}">${icon('lock', 12)} 不可变 · 锁定 ${t.lockDays} 天</span>` : h`<span class="tag">未锁定</span>`}<span class="tag">${icon('lock', 12)} AES-256-GCM</span>
          <div class="end">${can('operate') ? h`<button class="btn sm primary" data-action="offsiteRun" data-id="${t.id}" ${t.running ? 'disabled' : ''}>${icon('play')}立即复制</button>` : ''}<button class="btn sm" data-action="offsitePoints" data-id="${t.id}">恢复点 ${t.points}</button>${R.menu([
            can('admin') ? { action: 'offsiteEdit', id: t.id, label: '设置…', icon: 'settings' } : null,
            can('operate') ? { action: 'offsiteRefresh', id: t.id, label: '重新读取存储桶', icon: 'refresh' } : null,
            t.running ? { href: '#/jobs?open=' + t.running.id, label: '查看运行中的作业', icon: 'jobs' } : null,
            can('admin') ? '-' : null,
            can('admin') ? { action: 'offsiteRemove', id: t.id, label: '从此 Core 移除…', icon: 'close', danger: true } : null], '异地副本操作')}</div></div>
        <div class="panel-body">
          ${t.status === 'Error' && t.statusMessage ? h`<div class="callout err" style="margin-top:0">${icon('error')}<div>${t.statusMessage}</div></div>` : ''}
          ${t.running ? h`<div style="margin-bottom:14px"><div class="bar"><span style="${'width:' + t.running.progress + '%'}"></span></div><p class="small muted" style="margin:6px 0 0">${t.running.message || ''}</p></div>` : ''}
          <div class="repo-grid">
            <dl class="kv">
              <dt>位置</dt><dd class="mono">${(t.endpoint || 'AWS S3 ' + t.region).replace(/^https?:\/\//, '')} / ${t.bucket}${t.prefix ? ' / ' + t.prefix : ''}</dd>
              <dt>复制内容</dt><dd>${t.options.machines && t.options.machines.length ? t.machineNames.join('、') : '全部受保护的计算机'} · 每天 ${t.options.time}${t.options.enabled ? '' : h` <span class="tag">计划已停用</span>`}</dd>
              <dt>锁定与保留</dt><dd>${t.lockMode === 'None' ? '不锁定' : `${t.lockMode === 'Compliance' ? '合规模式' : '治理模式'}锁定 ${t.lockDays} 天`} · 保留 ${t.keepDays} 天${t.lockedUntil && t.lockedUntil > Date.now() ? h`<br><span class="small muted">最新副本锁定至 ${dateTime(t.lockedUntil, true)}</span>` : ''}</dd>
            </dl>
            <dl class="kv">
              <dt>上次成功</dt><dd>${t.lastSuccess ? `${dateTime(t.lastSuccess, true)}（${ago(t.lastSuccess)}）` : '从未'}</dd>
              <dt>计算机 / 副本</dt><dd>${t.machines} 台 / ${t.points} 个</dd>
              <dt>已上传</dt><dd>${bytes(t.uploadedBytes)}（最新副本合计 ${bytes(t.logicalBytes)}，${t.blocks.toLocaleString()} 个块）</dd>
            </dl>
          </div>
        </div></section>`)}</div>`
      : h`<section class="panel"><div class="empty">${icon('cloud', 30)}<h3>还没有异地副本</h3><p>准备一个启用了对象锁定（Object Lock）的 S3 存储桶和只授权该存储桶的访问密钥，即可把恢复点自动复制到异地，并在锁定期内防删改。</p>${can('admin') ? h`<button class="btn primary" data-action="offsiteCreate">${icon('plus')}新建异地副本</button>` : ''}</div></section>`}`;
  }

  // ───────────── create / attach / edit ─────────────
  async function targetDialog(ctx, mode, target) {
    const edit = mode === 'edit';
    const machines = (await R.api.get('/machines')).filter((m) => !m.archived);
    const o = (target && target.options) || { enabled: true, machines: [], time: '02:00', parallelism: 8 };
    const s = {
      name: target ? target.name : mode === 'attach' ? '' : '异地副本', endpoint: target ? target.endpoint : '', region: target ? target.region : 'us-east-1', bucket: target ? target.bucket : '', prefix: target ? target.prefix : 'bareturn/',
      pathStyle: target ? target.pathStyle : true, accessKey: target ? target.accessKey : '', secretKey: '', passphrase: '', confirm: '',
      lockMode: target ? target.lockMode : 'Compliance', lockDays: target ? target.lockDays || 30 : 30, keepDays: target ? target.keepDays : 30,
      all: !(o.machines && o.machines.length), machines: new Set(o.machines || []), time: o.time || '02:00', enabled: o.enabled !== false, parallelism: o.parallelism || 8,
      test: null, busy: false, error: ''
    };
    const m = R.modal({ title: edit ? '异地副本设置' : mode === 'attach' ? '连接现有异地副本' : '新建异地副本', wide: true, body: '' });
    const read = () => {
      m.el.querySelectorAll('[data-f]').forEach((el) => { s[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.type === 'number' ? Number(el.value) : el.value; });
    };
    function draw() {
      const t = s.test;
      m.set(h`<form id="offsite-form" autocomplete="off">
        <div class="field"><label for="os-name">名称</label><input class="input" id="os-name" data-f="name" value="${s.name}" placeholder="例如 AWS 法兰克福 · 不可变"></div>
        ${edit ? h`<p class="small muted" style="margin-top:0">位置：<span class="mono">${(s.endpoint || 'AWS S3 ' + s.region)} / ${s.bucket}${s.prefix ? ' / ' + s.prefix : ''}</span>（位置与加密口令创建后不能修改）</p>` : h`
        <div class="row" style="grid-template-columns:2fr 1fr"><div class="field"><label for="os-ep">端点（AWS S3 可留空）</label><input class="input mono" id="os-ep" data-f="endpoint" value="${s.endpoint}" placeholder="https://s3.eu-central-1.wasabisys.com 或 https://minio.corp.local:9000"></div>
          <div class="field"><label for="os-rg">区域</label><input class="input mono" id="os-rg" data-f="region" value="${s.region}"></div></div>
        <div class="row" style="grid-template-columns:1fr 1fr"><div class="field"><label for="os-bk">存储桶</label><input class="input mono" id="os-bk" data-f="bucket" value="${s.bucket}" placeholder="bareturn-immutable"></div>
          <div class="field"><label for="os-px">前缀（文件夹）</label><input class="input mono" id="os-px" data-f="prefix" value="${s.prefix}"><span class="hint">一个存储桶可以按前缀放多个副本</span></div></div>
        <label class="check"><input type="checkbox" data-f="pathStyle" ${s.pathStyle ? 'checked' : ''}><span>路径样式访问<small>MinIO 等自建服务通常需要；AWS S3 可以取消</small></span></label>`}
        <div class="row" style="grid-template-columns:1fr 1fr"><div class="field"><label for="os-ak">访问密钥 ID</label><input class="input mono" id="os-ak" data-f="accessKey" value="${s.accessKey}"></div>
          <div class="field"><label for="os-sk">私有访问密钥</label><input class="input mono" id="os-sk" type="password" data-f="secretKey" value="${s.secretKey}" placeholder="${edit ? '不修改请留空' : ''}" autocomplete="new-password"><span class="hint">只授权这个存储桶；不需要删除存储桶或修改锁定配置的权限</span></div></div>
        ${edit ? '' : h`<div style="display:flex;gap:10px;align-items:center;margin:4px 0 12px"><button type="button" class="btn" data-test ${s.busy ? 'disabled' : ''}>${icon('link')}测试连接</button>
          ${t ? t.error ? h`<span class="small" style="color:var(--danger)">${t.error}</span>` : h`<span class="small">${t.objectLock ? h`<span class="pill ok">已启用对象锁定</span>` : h`<span class="pill warn">未启用对象锁定</span>`} ${t.writable ? '可写入' : h`<span style="color:var(--danger)">不可写入：${t.writeError}</span>`}${t.existing ? h` · <b>此位置已有异地副本</b>（创建于 ${dateTime(new Date(t.existingCreated).getTime(), true)}）${t.registered ? '，已登记在此 Core' : ''}` : ' · 此位置为空'}</span>` : h`<span class="small muted">检查访问权限、对象锁定状态，以及此位置是否已有副本</span>`}</div>`}
        ${!edit && t && t.existing && mode === 'create' ? h`<div class="callout warn">${icon('warn')}<div>此位置已经有异地副本。要继续使用它，请改用“连接现有副本”；要新建，请换一个前缀。</div></div>` : ''}
        ${!edit ? h`<div class="row" style="grid-template-columns:1fr 1fr"><div class="field"><label for="os-pw">${mode === 'attach' ? '副本的加密口令' : '加密口令'}</label><input class="input" id="os-pw" type="password" data-f="passphrase" value="${s.passphrase}" autocomplete="new-password"><span class="hint">${mode === 'attach' ? '创建此副本时设置的口令' : '至少 12 个字符。在另一台 Core 上恢复时需要它，遗失后副本无法解密，请离线保管。'}</span></div>
          ${mode === 'create' ? h`<div class="field"><label for="os-pw2">确认口令</label><input class="input" id="os-pw2" type="password" data-f="confirm" value="${s.confirm}" autocomplete="new-password"></div>` : h`<div></div>`}</div>` : ''}
        <div class="field"><span class="label">对象锁定</span><div class="choice">${Object.entries(LOCK).map(([k, l]) => h`<label class="${s.lockMode === k ? 'on' : ''}"><input type="radio" name="os-lock" value="${k}" ${s.lockMode === k ? 'checked' : ''} ${edit && target.lockMode === 'None' && k !== 'None' ? 'disabled' : ''}><span><strong>${l.split('（')[0]}</strong><small>${l.includes('（') ? l.split('（')[1].replace('）', '') : '副本可以被有权限的账户删除，不防勒索'}</small></span></label>`)}</div>
          ${s.lockMode !== 'None' && t && !t.objectLock ? h`<div class="callout err">${icon('error')}<div>这个存储桶没有启用对象锁定，无法锁定。对象锁定只能在创建存储桶时开启。</div></div>` : ''}</div>
        <div class="row" style="grid-template-columns:1fr 1fr">
          ${s.lockMode !== 'None' ? h`<div class="field"><label for="os-ld">锁定天数</label><input class="input" id="os-ld" type="number" min="1" max="3650" data-f="lockDays" value="${s.lockDays}"><span class="hint">锁定期内任何人都无法删除副本。建议不少于 30 天。</span></div>` : h`<div></div>`}
          <div class="field"><label for="os-kd">保留天数</label><input class="input" id="os-kd" type="number" min="1" max="3650" data-f="keepDays" value="${s.keepDays}"><span class="hint">较早的副本在锁定到期后删除；每台计算机最新的副本始终保留。</span></div>
        </div>
        <div class="field"><span class="label">复制哪些计算机</span>
          <label class="check"><input type="checkbox" data-f="all" ${s.all ? 'checked' : ''}><span>全部受保护的计算机（包括以后添加的）</span></label>
          ${s.all ? '' : h`<div class="picker-list" style="max-height:200px">${machines.map((x) => h`<label class="part-row"><input type="checkbox" data-machine="${x.id}" ${s.machines.has(x.id) ? 'checked' : ''}>${R.osIcon(x.osName)}<b>${x.name}</b><span class="muted small">${x.pointCount} 个恢复点</span></label>`)}</div>`}</div>
        <div class="row" style="grid-template-columns:1fr 1fr 1fr"><div class="field"><label for="os-tm">每天开始时间</label><input class="input" id="os-tm" type="time" data-f="time" value="${s.time}"></div>
          <div class="field"><label for="os-pa">并发上传</label><input class="input" id="os-pa" type="number" min="1" max="32" data-f="parallelism" value="${s.parallelism}"></div>
          <label class="check" style="align-self:end;margin-bottom:12px"><input type="checkbox" data-f="enabled" ${s.enabled ? 'checked' : ''}><span>按计划自动复制</span></label></div>
        ${s.error ? h`<div class="callout err" role="alert">${icon('error')}<div>${s.error}</div></div>` : ''}
        <div class="modal-foot" style="padding:12px 0 0"><button type="button" class="btn" data-close>取消</button><button type="button" class="btn primary" data-save ${s.busy ? 'disabled' : ''}>${s.busy ? '请稍候…' : edit ? '保存' : mode === 'attach' ? '连接' : '创建'}</button></div>
      </form>`);
      m.el.querySelectorAll('input[name=os-lock]').forEach((r) => r.addEventListener('change', () => { read(); s.lockMode = r.value; draw(); }));
      const all = m.el.querySelector('[data-f=all]');
      if (all) all.addEventListener('change', () => { read(); draw(); });
      m.el.querySelectorAll('[data-machine]').forEach((c) => c.addEventListener('change', () => { if (c.checked) s.machines.add(c.dataset.machine); else s.machines.delete(c.dataset.machine); }));
      const test = m.el.querySelector('[data-test]');
      if (test) test.addEventListener('click', async () => {
        read(); s.busy = true; s.error = ''; draw();
        try { s.test = await R.api.post('/offsite/test', { endpoint: s.endpoint, region: s.region, bucket: s.bucket, prefix: s.prefix, pathStyle: s.pathStyle, accessKey: s.accessKey, secretKey: s.secretKey }); }
        catch (e) { s.test = { error: e.message }; }
        s.busy = false; draw();
      });
      m.el.querySelector('[data-save]').addEventListener('click', save);
    }
    async function save() {
      read(); s.error = '';
      const options = { enabled: s.enabled, machines: s.all ? [] : [...s.machines], time: s.time, parallelism: s.parallelism };
      try {
        if (!s.all && !options.machines.length) throw new Error('请至少选择一台计算机，或选择全部。');
        if (mode === 'create' && s.passphrase !== s.confirm) throw new Error('两次输入的口令不一致。');
        s.busy = true; draw();
        if (edit) await R.api.put('/offsite/' + target.id, { name: s.name, accessKey: s.accessKey, secretKey: s.secretKey || null, lockMode: s.lockMode, lockDays: s.lockDays, keepDays: s.keepDays, options });
        else await R.api.post('/offsite', { mode, name: s.name, endpoint: s.endpoint, region: s.region, bucket: s.bucket, prefix: s.prefix, pathStyle: s.pathStyle, accessKey: s.accessKey, secretKey: s.secretKey,
          passphrase: s.passphrase, lockMode: s.lockMode, lockDays: s.lockMode === 'None' ? 0 : s.lockDays, keepDays: s.keepDays, options });
        m.close(); R.toast(edit ? '设置已保存' : mode === 'attach' ? '已连接异地副本' : '异地副本已创建，将在计划时间开始复制'); ctx.reload();
        return;
      } catch (e) { s.error = e.message; }
      s.busy = false; draw();
    }
    draw();
  }

  // ───────────── points of a target ─────────────
  async function pointsDialog(target) {
    const m = R.modal({ title: target.name + ' · 异地恢复点', drawer: true, body: h`<div class="empty small">正在加载…</div>` });
    async function draw() {
      let points;
      try { points = await R.api.get('/offsite/' + target.id + '/points'); } catch (e) { m.set(h`<div class="callout err">${icon('error')}<div>${e.message}</div></div>`); return; }
      const operate = R.app.can('operate');
      m.set(h`<p style="margin-top:0" class="muted">每个异地恢复点都是独立的完整恢复点。要从中恢复，先把它下载到本地或网络存储库（已有的块不重复下载），再像普通恢复点一样挂载、浏览或裸机恢复。</p>
        ${points.length ? h`<div class="table-wrap"><table class="table cards"><thead><tr><th>计算机</th><th>恢复点时间</th><th>复制时间</th><th>锁定</th><th>校验</th><th></th></tr></thead><tbody>
          ${points.map((p) => h`<tr><td data-label="计算机"><b>${p.machineName}</b><br><small class="muted">${R.bytes(p.logicalBytes)}${p.scope === 'Files' ? ' · 文件级' : p.bareMetal ? '' : ' · 仅分区'}</small></td>
            <td data-label="恢复点" class="nowrap">${dateTime(p.pointCreated, true)}</td><td data-label="复制" class="nowrap">${ago(p.copied)}</td>
            <td data-label="锁定">${p.locked ? h`<span class="tag brand" title="${'锁定至 ' + dateTime(p.retainUntil, true)}">${icon('lock', 12)} 至 ${dateTime(p.retainUntil)}</span>` : h`<span class="faint">未锁定</span>`}</td>
            <td data-label="校验">${p.verifyStatus === 'Ok' ? h`<span class="pill ok">通过</span>` : p.verifyStatus === 'Failed' ? h`<span class="pill err">失败</span>` : h`<span class="faint">未校验</span>`}</td>
            <td class="actions-cell">${operate ? h`<button class="btn sm primary" data-dl="${p.id}">${icon('download')}下载到存储库…</button> <button class="btn sm" data-verify="${p.id}">校验</button>` : ''}</td></tr>`)}
        </tbody></table></div>` : h`<div class="empty">${icon('cloud', 28)}<h3>还没有异地恢复点</h3><p>点“立即复制”或等待计划时间。</p></div>`}`);
      m.el.querySelectorAll('[data-verify]').forEach((b) => b.addEventListener('click', async () => {
        try { const job = await R.api.post(`/offsite/${target.id}/points/${b.dataset.verify}/verify`, { deep: false }); R.toast('校验作业已加入队列'); R.openJob(job.id); } catch (e) { R.toast(e.message, 'err'); }
      }));
      m.el.querySelectorAll('[data-dl]').forEach((b) => b.addEventListener('click', () => restoreDialog(target, points.find((p) => p.id === b.dataset.dl))));
    }
    draw();
  }

  async function restoreDialog(target, point, onDone) {
    const repos = (await R.api.get('/repositories')).filter((r) => r.kind !== 'Offline' && r.status === 'Online');
    const m = R.modal({
      title: '从异地副本下载恢复点',
      body: h`<p style="margin-top:0">把 <b>${point.machineName}</b> 在 <b>${dateTime(point.pointCreated, true)}</b> 的恢复点（${R.bytes(point.logicalBytes)}）从“${target.name}”下载到存储库。存储库中已有的数据块不会重复下载。完成后可在“恢复点”中挂载浏览或用恢复介质裸机恢复。</p>
        ${repos.length ? h`<div class="field"><label for="od-r">目标存储库</label><select class="input" id="od-r">${repos.map((r) => h`<option value="${r.id}">${r.name} · ${R.bytes(r.diskFree)} 可用</option>`)}</select></div>`
          : h`<div class="callout err">${icon('error')}<div>没有在线的本地或网络存储库。请先新建一个存储库。</div></div>`}`,
      foot: h`<button class="btn" data-close>取消</button><button class="btn primary" data-go ${repos.length ? '' : 'disabled'}>${icon('download')}开始下载</button>`
    });
    m.el.querySelector('[data-go]').addEventListener('click', async (e) => {
      e.target.disabled = true;
      try {
        const job = await R.api.post(`/offsite/${target.id}/points/${point.id}/restore`, { repositoryId: m.el.querySelector('#od-r').value });
        m.close(); R.toast('下载作业已加入队列'); if (onDone) onDone(job); else R.openJob(job.id);
      } catch (err) { e.target.disabled = false; R.toast(err.message, 'err'); }
    });
  }

  const find = (ctx, id) => (ctx.state.data.offsite || []).find((t) => t.id === id);
  R.offsiteSection = offsiteSection;
  R.offsiteRestoreDialog = restoreDialog;
  R.offsiteActions = {
    offsiteCreate(el, e, ctx) { targetDialog(ctx, 'create'); },
    offsiteAttach(el, e, ctx) { targetDialog(ctx, 'attach'); },
    offsiteEdit(el, e, ctx) { targetDialog(ctx, 'edit', find(ctx, el.dataset.id)); },
    offsitePoints(el, e, ctx) { pointsDialog(find(ctx, el.dataset.id)); },
    async offsiteRun(el, e, ctx) {
      el.disabled = true;
      try { await R.api.post(`/offsite/${el.dataset.id}/run`, { machineIds: null }); R.toast('异地复制已加入队列'); } catch (err) { R.toast(err.message, 'err'); }
      ctx.reload();
    },
    async offsiteRefresh(el, e, ctx) {
      try { const r = await R.api.post(`/offsite/${el.dataset.id}/refresh`); R.toast(`已读取存储桶：${r.points} 个异地恢复点` + (r.problems.length ? `，${r.problems.length} 个无法读取` : '')); } catch (err) { R.toast(err.message, 'err'); }
      ctx.reload();
    },
    async offsiteRemove(el, e, ctx) {
      const t = find(ctx, el.dataset.id);
      if (!await R.confirm({ title: '移除异地副本', message: `从此 Core 移除“${t.name}”，不再复制。存储桶中的数据不会被删除（锁定期内也无法删除）；之后可以用加密口令“连接现有副本”重新使用。`, ok: '移除', danger: true, typed: t.name })) return;
      try { await R.api.del('/offsite/' + t.id); R.toast('已移除异地副本'); } catch (err) { R.toast(err.message, 'err'); }
      ctx.reload();
    }
  };
})(window.R = window.R || {});

</script>
  <script>
(function (R) {
  'use strict';
  const { h, icon, bytes, ago, dateTime, pill } = R;
  const pui = { machine: '', kind: '', verify: '', range: '', repository: '', selected: new Set() };
  const isFiles = (p) => p.scope === 'Files';
  const isVm = (p) => p.scope === 'VirtualMachine';
  const RANGES = { '': ['全部时间', 0], '1': ['24 小时内', 1], '7': ['7 天内', 7], '30': ['30 天内', 30] };
  const typeTag = (p) => h`${isFiles(p) ? h`<span class="tag brand">文件级</span>` : p.kind === 'Base' ? h`<span class="tag brand">基准</span>` : h`<span class="tag">增量</span>`}${!isFiles(p) && p.bareMetal === false ? h` <span class="tag" title="只包含所选分区，不能裸机恢复">仅分区</span>` : ''}${isVm(p) ? h` <span class="tag brand">虚拟机</span>` : ''}${R.originTag(p)}`;
  const volTags = (p) => h`<div class="vol-tags">${(p.volumes || []).map((v) => isFiles(p) ? (v.folders || []).map((f) => h`<span class="tag mono" style="${'border-left:3px solid ' + R.roleColor('Files')}">${f}</span>`)
    : h`<span class="tag" style="${'border-left:3px solid ' + R.roleColor(v.role)}">${v.driveLetter ? v.driveLetter + ':' : v.mountPoint && !/^LVM/.test(v.mountPoint) ? v.mountPoint : R.roleName(v.role)}${v.full && p.kind !== 'Base' ? ' 完整' : ''}</span>`)}</div>`;

  // ───────────── recovery points: every machine, filterable ─────────────
  R.pages.points = {
    title: '恢复点',
    async load(params) {
      if (params.machine !== undefined) pui.machine = params.machine;
      const query = new URLSearchParams({ limit: '3000' });
      if (pui.machine) query.set('machineId', pui.machine);
      if (pui.kind) query.set('kind', pui.kind);
      if (pui.verify) query.set('verify', pui.verify);
      if (pui.repository) query.set('repositoryId', pui.repository);
      if (pui.range) query.set('from', String(Date.now() - Number(pui.range) * 86400e3));
      const [points, machines, repositories] = await Promise.all([R.api.get('/points?' + query), R.api.get('/machines'), R.api.get('/repositories')]);
      return { points: points.filter(p => R.features.virtualization || !isVm(p)), machines: machines.filter(m => R.features.virtualization || !m.kind || m.kind === 'Agent'), repositories };
    },
    view({ points, machines, repositories }, _, { can }) {
      const list = points;
      const machine = machines.find((m) => m.id === pui.machine);
      [...pui.selected].forEach((id) => { if (!list.some((p) => p.id === id)) pui.selected.delete(id); });
      const admin = can('admin');
      const operate = can('operate');
      const picked = list.filter((p) => pui.selected.has(p.id));
      const copyable = picked.length && picked.every((p) => p.repositoryKind !== 'Offline');
      const oneMachine = picked.length && picked.every((p) => p.machineId === picked[0].machineId);
      const shown = list.slice(0, 500);
      const filtered = pui.machine || pui.kind || pui.verify || pui.range || pui.repository;
      const failed = list.filter((p) => p.verifyStatus === 'Failed').length;
      return h`
        ${R.pageHead({
          title: '恢复点', key: 'points',
          sub: `${list.length.toLocaleString()} 个恢复点${filtered ? '（已筛选）' : ''}${failed ? `，${failed} 个校验失败` : ''}。点“恢复…”选择恢复方式。`,
          help: h`<p>整机和分区恢复点可以用于裸机恢复或按卷恢复，也可以挂载后浏览和恢复单个文件；文件级恢复点可以浏览、下载或写回文件。</p><p>增量只保存变化的数据，夜间维护按保留策略合并旧恢复点；也可以勾选后手动删除（较早的恢复点会合并到其后的恢复点）或复制到离线盘。</p>`,
          actions: operate ? h`<a class="btn primary" href="#/restore">${icon('wand')}恢复…</a>` : ''
        })}
        <section class="panel">
          <div class="toolbar filters">
            <select class="input" data-input="fMachine" aria-label="计算机"><option value="">全部计算机</option>${machines.filter((m) => m.pointCount > 0).map((m) => h`<option value="${m.id}" ${pui.machine === m.id ? 'selected' : ''}>${m.name}（${m.pointCount}）</option>`)}</select>
            <select class="input" data-input="fKind" aria-label="类型">${[['', '全部类型'], ['Base', '基准'], ['Incremental', '增量'], ['Files', '文件级'], ['Copy', '离线盘副本']].map(([k, l]) => h`<option value="${k}" ${pui.kind === k ? 'selected' : ''}>${l}</option>`)}</select>
            <select class="input" data-input="fVerify" aria-label="校验">${[['', '全部校验状态'], ['Ok', '校验通过'], ['Failed', '校验失败'], ['None', '未校验']].map(([k, l]) => h`<option value="${k}" ${pui.verify === k ? 'selected' : ''}>${l}</option>`)}</select>
            <select class="input" data-input="fRange" aria-label="时间">${Object.entries(RANGES).map(([k, [l]]) => h`<option value="${k}" ${pui.range === k ? 'selected' : ''}>${l}</option>`)}</select>
            <select class="input" data-input="fRepo" aria-label="存储库"><option value="">全部存储库</option>${repositories.map((r) => h`<option value="${r.id}" ${pui.repository === r.id ? 'selected' : ''}>${r.name}</option>`)}</select>
            ${filtered ? h`<button class="btn sm ghost" data-action="clearFilters">清除筛选</button>` : ''}
          </div>
          ${machine && list.length ? h`<div class="panel-body timeline-body"><div class="small muted" style="margin-bottom:4px">${machine.name} · ${new Set(list.filter((p) => !isFiles(p)).map((p) => p.chainId)).size} 条链 · 实心为基准</div>${R.timeline(list.slice(0, 300), null)}</div>` : ''}
          ${operate && list.length ? h`<div class="selbar"><span class="muted small">${pui.selected.size ? `已选择 ${pui.selected.size} 个恢复点` : '勾选后可复制到离线盘' + (admin ? '或删除（同一台计算机）' : '')}</span>
            <div style="margin-left:auto;display:flex;gap:8px">${pui.selected.size ? h`<button class="btn sm ghost" data-action="clearPick">取消选择</button>` : ''}<button class="btn sm" data-action="copyOffline" ${copyable ? '' : 'disabled'} title="${picked.length && !copyable ? '离线盘上的恢复点不能再复制' : '每个恢复点在离线盘上写成独立的完整恢复点，不依赖其他恢复点'}">${icon('repo')}复制到离线盘</button>${admin ? h`<button class="btn sm danger" data-action="delete" ${oneMachine ? '' : 'disabled'} title="${picked.length && !oneMachine ? '一次只能删除同一台计算机的恢复点' : ''}">${icon('trash')}删除所选</button>` : ''}</div></div>` : ''}
          ${list.length ? h`<div class="table-wrap"><table class="table cards">
          <thead><tr>${operate ? h`<th class="pick"><input type="checkbox" data-action="all" aria-label="全选" ${shown.length && shown.every((p) => pui.selected.has(p.id)) ? 'checked' : ''}></th>` : ''}<th>时间</th><th>计算机</th><th>类型</th><th>卷</th><th class="num">变化 / 新增存储</th><th>存储库</th><th>校验</th><th></th></tr></thead>
          <tbody>${shown.map((p) => h`<tr class="${pui.selected.has(p.id) ? 'sel' : ''}">
            ${operate ? h`<td class="pick"><input type="checkbox" data-action="pick" data-id="${p.id}" ${pui.selected.has(p.id) ? 'checked' : ''} aria-label="${'选择 ' + dateTime(p.created, true)}"></td>` : ''}
            <td data-label="时间" class="nowrap"><b>${dateTime(p.created, true)}</b><br><small class="muted">${ago(p.created)}</small></td>
            <td data-label="计算机" class="nowrap"><a href="${'#/machines/' + p.machineId}">${p.machineName || '—'}</a></td>
            <td data-label="类型">${typeTag(p)}</td>
            <td data-label="卷">${volTags(p)}</td>
            <td data-label="变化 / 新增" class="num nowrap">${bytes(p.changedBytes)}<br><small class="muted">${bytes(p.storedBytes)}</small></td>
            <td data-label="存储库">${p.repositoryName}</td>
            <td data-label="校验">${p.verifyStatus === 'Ok' ? h`<span class="pill ok">通过</span>` : p.verifyStatus === 'Failed' ? h`<span class="pill err">失败</span>` : h`<span class="faint">未校验</span>`}</td>
            <td class="actions-cell">${operate ? h`<a class="btn sm" href="${'#/restore?point=' + p.id}">${icon('wand')}恢复…</a>` : ''}${R.menu([
              operate ? { action: 'mount', id: p.id, label: isFiles(p) ? '浏览文件' : '挂载浏览', icon: 'mount' } : null,
              operate && isVm(p) ? { action: 'vmRestore', id: p.id, label: '整机恢复', icon: 'restore' } : null,
              operate && isVm(p) ? { action: 'vmInstant', id: p.id, label: '即时恢复', icon: 'play' } : null,
              operate ? { action: 'verify', id: p.id, label: '校验', icon: 'check' } : null,
              operate && p.repositoryKind !== 'Offline' ? { action: 'copyOne', id: p.id, label: '复制到离线盘…', icon: 'repo' } : null,
              admin ? '-' : null,
              admin ? { action: 'delete-one', id: p.id, label: '删除…', icon: 'trash', danger: true } : null])}</td>

          ${R.helpBody('repos-local', h`<p>数据以 1 MiB 块去重、压缩后写入分段文件，可选 AES-256-GCM 加密。建议放在独立的数据盘上，不要和系统盘共用。网络存储库使用指定账户（或 Core 计算机账户）访问共享，NAS 重启后会自动重新连接。</p>`)}</div>

                  <dt>路径</dt><dd class="mono">${r.path}</dd>
                  ${net ? h`<dt>访问账户</dt><dd>${r.userName ? h`<span class="mono">${r.userName}</span>` : 'Core 服务器的计算机账户'}</dd>` : ''}
                  <dt>计算机 / 恢复点</dt><dd>${r.machines} 台 / ${r.points.toLocaleString()} 个${r.unlisted ? h`<br><span class="small muted">其中 ${r.unlisted.toLocaleString()} 个未在控制台列出（计算机删除时保留了恢复点）</span>${can('admin') && r.status === 'Online' ? h` <button class="btn sm" data-action="importUnlisted" data-id="${r.id}">导入</button>` : ''}` : ''}</dd>
                  <dt>去重与压缩</dt><dd>${r.savings > 0 ? `节省 ${Math.round(r.savings * 100)}%（${bytes(r.logicalBytes)} 唯一数据块）` : '—'}</dd>
                  <dt>数据块</dt><dd>${r.blocks.toLocaleString()}</dd>

                </dl>
              </div>
            </div></section>`;
        })}</div>`
          : h`<section class="panel"><div class="empty">${icon('repo', 30)}<h3>还没有存储库</h3><p>选择 Core 服务器上独立数据盘中的一个空目录，例如 D:\\BareTurnRepository；或者 NAS 上的共享文件夹，例如 \\\\nas\\backup\\BareTurn。</p>${can('admin') ? h`<button class="btn primary" data-action="create">${icon('plus')}新建存储库</button>` : ''}</div></section>`}
        ${R.offsiteSection(offsite, repos, can)}
        ${offlineSection(drives, can)}`;
    },
    actions: {

        if (!await R.confirm({ title: '导入未列出的恢复点', message: `把 ${r.name} 中 ${r.unlisted} 个未在控制台列出的恢复点导入控制台。它们所属的计算机会以“已归档”状态出现，可以浏览、恢复、恢复保护或再次删除。`, ok: '导入' })) return;
        try { const result = await R.api.post(`/repositories/${r.id}/import`); R.toast(`已导入 ${result.imported} 个恢复点`); }

      account(el, e, ctx) { accountDialog(ctx, ctx.state.data.all.find((x) => x.id === el.dataset.id)); },
