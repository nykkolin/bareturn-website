      ${icon(cls === 'err' ? 'error' : 'warn', 16)}
      <div class="lic-banner-text"><strong>${b.title}</strong><span>${b.message}</span></div>
      <a class="btn sm" href="#/settings/license">许可管理</a>
    </div>`);
  }
  R.refreshLicenseBanner = async () => {
    try {
      const lic = await R.api.get('/license');
      if (state.session) state.session.license = lic;
      renderLicenseBanner();
    } catch (e) { /* ignore */ }
  };

  function renderNav() {
    const active = state.page === 'machine' ? 'machines' : state.page === 'mount' ? 'mounts' : state.page;
    document.body.classList.remove('nav-open');
    document.getElementById('nav-links').innerHTML = String(h`${nav.map((g) => h`
      ${g.group ? h`<div class="nav-group">${g.group}</div>` : ''}
      ${g.items.filter(([key]) => R.features.virtualization || !['hypervisors','instant'].includes(key)).map(([key, label, ic]) => h`<a href="${'#/' + key}" class="${key === active ? 'active' : ''}" ${key === active ? h`aria-current="page"` : ''}>${icon(ic)}<span>${label}</span>${key === 'events' && state.alerts ? h`<span class="count">${state.alerts}</span>` : ''}</a>`)}
    `)}`);
  }

  function renderTopbar() {
    const user = state.session.user;
    const dark = document.documentElement.dataset.theme === 'dark';
    document.getElementById('topbar').innerHTML = String(h`
      <button class="icon-btn nav-toggle" data-global="nav" aria-label="打开导航菜单" aria-controls="main-nav">${icon('menu')}</button>
      <div class="search" role="search">${icon('search', 16)}<input id="global-search" placeholder="搜索计算机、任务、存储库…  按 / 聚焦" autocomplete="off" aria-label="全局搜索"><div id="search-results"></div></div>
      <button class="icon-btn search-toggle" data-global="search" aria-label="搜索">${icon('search')}</button>
      <div class="spacer"></div>
      ${R.demo && R.demo.enabled ? h`<span class="tag demo-tag">演示数据</span>` : ''}
      <span id="topbar-jobs"></span>
      <button class="icon-btn" data-global="theme" title="${dark ? '浅色模式' : '深色模式'}" aria-label="切换主题">${icon(dark ? 'sun' : 'moon')}</button>
      <a class="icon-btn" href="#/events" title="事件" aria-label="事件">${icon('events')}${state.alerts ? h`<span class="badge"></span>` : ''}</a>
      <button class="user-chip" data-global="user" aria-haspopup="menu"><span class="avatar">${R.initials(user.displayName || user.userName)}</span><span class="user-name">${user.displayName || user.userName}<br><small>${R.roles[user.role] || user.role}</small></span></button>
    `);
    renderActive();
  }

  // ── running tasks indicator (top bar) ──
  // Only its own slot is redrawn on every poll, so typing in the search box is never interrupted.
  function renderActive() {
    const slot = document.getElementById('topbar-jobs');
    if (!slot) return;
    const list = state.active || [];
    const running = list.filter((j) => j.status === 'Running');
    const queued = list.length - running.length;
    const open = !!document.querySelector('.jobs-pop');
    slot.innerHTML = String(list.length
      ? h`<button class="${'run-chip' + (open ? ' on' : '')}" data-global="active" aria-haspopup="dialog" aria-expanded="${open ? 'true' : 'false'}" title="查看运行中的任务">
          <span class="spin" aria-hidden="true"></span><span class="run-text">${running.length ? `${running.length} 个任务运行中` : `${queued} 个任务排队中`}${running.length && queued ? h`<small> · ${queued} 个排队</small>` : ''}</span><b class="run-count">${list.length}</b>
          ${running.length === 1 ? h`<span class="mini-bar" aria-hidden="true"><span style="${'width:' + Math.round(running[0].progress) + '%'}"></span></span><b>${Math.round(running[0].progress)}%</b>` : ''}</button>`
      : h`<button class="icon-btn" data-global="active" title="没有运行中的任务" aria-label="任务">${icon('jobs')}</button>`);
    if (open) renderPopover();
  }
  function renderPopover() {
    let pop = document.querySelector('.jobs-pop');
    const anchor = document.querySelector('#topbar-jobs [data-global=active]');
    if (!pop || !anchor) return;
    const list = state.active || [];
    const r = anchor.getBoundingClientRect();
    pop.style.top = (r.bottom + 8) + 'px';
    pop.style.right = Math.max(12, window.innerWidth - r.right) + 'px';
    pop.innerHTML = String(h`<div class="jobs-pop-head"><b>运行中的任务</b><a href="#/jobs" data-pop-close>查看全部任务</a></div>
      ${list.length ? h`<div class="jobs-pop-list">${list.map((j) => h`<button class="jobs-pop-item" data-job="${j.id}">
          <span class="t"><b>${j.title}</b>${j.status === 'Running' ? h`<span class="p">${Math.round(j.progress)}%</span>` : h`<span class="pill plain off">排队中</span>`}</span>
          ${j.status === 'Running' ? h`<span class="bar"><span style="${'width:' + j.progress + '%'}"></span></span>` : ''}
          <small class="muted">${R.jobType[j.type] || j.type}${j.phase ? ' · ' + j.phase : ''}${j.rate ? ' · ' + R.rate(j.rate) : ''}${j.started ? ' · 已运行 ' + R.duration(Date.now() - j.started) : ''}</small>
          ${j.message && j.status === 'Running' ? h`<small class="m">${j.message}</small>` : ''}</button>`)}</div>`
        : h`<div class="empty small" style="padding:22px">没有运行中或排队的任务</div>`}`);
  }
  function togglePopover() {
    const existing = document.querySelector('.jobs-pop');
    if (existing) { closePopover(); return; }
    const pop = document.createElement('div');
    pop.className = 'jobs-pop'; pop.setAttribute('role', 'dialog'); pop.setAttribute('aria-label', '运行中的任务');
    document.body.appendChild(pop);
    renderActive();
    refreshActive();
  }
  function closePopover() { const pop = document.querySelector('.jobs-pop'); if (pop) { pop.remove(); renderActive(); } }
  document.addEventListener('click', (e) => {
    const pop = document.querySelector('.jobs-pop');
    if (!pop) return;
    const item = e.target.closest('.jobs-pop-item');
    if (item) { closePopover(); R.openJob(item.dataset.job); return; }
    if (e.target.closest('[data-pop-close]')) { closePopover(); return; }
    if (!e.target.closest('.jobs-pop') && !e.target.closest('[data-global=active]')) closePopover();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePopover(); });
  window.addEventListener('resize', () => renderPopover());

  let activeTimer = null;
  async function refreshActive() {
    clearTimeout(activeTimer);
    if (!state.session) return;
    try { state.active = await R.api.get('/jobs?status=Active&limit=20'); }
    catch (e) { /* keep the last list */ }
    renderActive();
    // Faster while something runs or the list is open; slower (and paused in background tabs) otherwise.
    const busy = (state.active || []).length || document.querySelector('.jobs-pop');
    activeTimer = setTimeout(refreshActive, document.hidden ? 30000 : busy ? 3000 : 10000);
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden && state.session) refreshActive(); });

  async function render(soft) {
    const route = parseRoute();
    const token = ++state.token;
    const changed = route.page !== state.page || JSON.stringify(route.params) !== JSON.stringify(state.params);
    state.page = route.page; state.params = route.params;
    const page = R.pages[route.page];
    clearTimeout(state.timer);
    if (changed && !soft) { renderNav(); document.getElementById('page').innerHTML = String(h`<div class="empty">正在加载…</div>`); }
    try {
      const data = page.load ? await page.load(route.params) : null;
      if (token !== state.token) return;
      state.data = data;
      const html = String(page.view(data, route.params, { can }));
      const target = document.getElementById('page');
      // Keep scroll and focus stable during background refreshes.
      if (!soft || !document.querySelector('.overlay')) {
        const focused = document.activeElement && document.activeElement.id;
        target.innerHTML = html;
        if (focused) { const el = document.getElementById(focused); if (el) el.focus(); }
        page.mount && page.mount(target, data, route.params);
      }
      if (changed && !soft) { document.title = (page.title || 'BareTurn') + ' · BareTurn'; document.getElementById('content').scrollTop = 0; }
    } catch (error) {
      if (token !== state.token) return;
      if (!soft) document.getElementById('page').innerHTML = String(h`<div class="panel"><div class="empty">${icon('error', 28)}<h3>无法加载此页面</h3><p>${error.message}</p><button class="btn" data-global="reload">重试</button></div></div>`);
    }
    const live = typeof page.live === 'function' ? page.live(state.data) : page.live;
    if (live) state.timer = setTimeout(() => render(true), live);
  }

  async function refreshAlerts() {
    try {
      const events = await R.api.get('/events?severity=Error&limit=50');
      state.alerts = events.filter((e) => !e.acknowledged).length;
      renderNav(); renderTopbar();
    } catch (e) { /* ignore */ }
  }
  R.refreshAlerts = refreshAlerts;

  function userMenu(anchor) {
    const m = R.modal({
      title: '账户',
      body: h`<dl class="kv"><dt>用户</dt><dd>${state.session.user.userName}</dd><dt>角色</dt><dd>${R.roles[state.session.user.role]}</dd><dt>Core</dt><dd>${state.session.core.name}</dd></dl>`,
      foot: h`<button class="btn" data-pw>${icon('key')}修改密码</button>
        ${R.demo?.enabled ? '' : h`<button class="btn" data-mfa>双因素认证</button>`}
        <button class="btn danger" data-out>${icon('logout')}退出登录</button>`
    });
    m.el.querySelector('[data-out]').onclick = async () => { await R.api.post('/logout'); m.close(); signedOut(); };
    m.el.querySelector('[data-pw]').onclick = () => { m.close(); changePassword(); };
    m.el.querySelector('[data-mfa]')?.addEventListener('click', async () => {
      m.close();
      try { await R.pages.auth.manageMfa(); } catch (error) { R.toast(error.message, 'err'); }
    });
  }

  function changePassword() {
    const m = R.modal({
      title: '修改密码',
      body: h`<form id="pw"><div class="field"><label for="pw-cur">当前密码</label><input class="input" id="pw-cur" name="current" type="password" autocomplete="current-password" required></div>
        <div class="field"><label for="pw-new">新密码</label><input class="input" id="pw-new" name="password" type="password" autocomplete="new-password" required><span class="hint">至少 10 个字符，包含大写字母、小写字母、数字、符号中的三类。</span></div></form>`,
      foot: h`<button class="btn" data-close>取消</button><button class="btn primary" data-save>保存</button>`
    });
    m.el.querySelector('[data-save]').onclick = async () => {
      try { await R.api.post('/me/password', R.formData(m.el.querySelector('#pw'))); m.close(); R.toast('密码已更新'); }
      catch (e) { R.toast(e.message, 'err'); }
    };
  }

  // Global search: machines, jobs, repositories, plans and offsite targets (server side, debounced).
  let searchTimer = null, searchToken = 0;
  function search(input) {
    const box = document.getElementById('search-results');
    const q = input.value.trim();
    clearTimeout(searchTimer);
    if (!q) { box.innerHTML = ''; return; }
    searchTimer = setTimeout(async () => {
      const token = ++searchToken;
      let r;
      try { r = await R.api.get('/search?q=' + encodeURIComponent(q)); } catch (e) { return; }
      if (token !== searchToken || input.value.trim() !== q) return;
      const groups = [
        ['计算机', (r.machines || []).map((m) => ({ href: '#/machines/' + m.id, icon: R.osIcon(m.osName), title: m.name, sub: (m.archived ? '已归档' : m.host || '') + (m.osName ? ' · ' + m.osName : '') }))],
        ['任务', (r.jobs || []).map((j) => ({ href: '#/jobs?open=' + j.id, icon: icon('jobs'), title: j.title, sub: (R.jobStatus[j.status] || ['', j.status])[1] + ' · ' + R.ago(j.created) + (j.message ? ' · ' + j.message : '') }))],
        ['存储库', (r.repositories || []).map((x) => ({ href: '#/repositories', icon: icon('repo'), title: x.name, sub: x.path || (x.kind === 'Offline' ? '离线盘' : '') }))],
        ['保护计划', (r.plans || []).map((x) => ({ href: '#/plans', icon: icon('plans'), title: x.name, sub: x.description || '' }))],
        ['异地副本', (r.offsite || []).map((x) => ({ href: '#/repositories', icon: icon('cloud'), title: x.name, sub: x.bucket }))]
      ].filter(([, items]) => items.length);
      let first = true;
      box.innerHTML = String(h`<div class="search-results">${groups.length ? groups.map(([label, items]) => h`<div class="search-group">${label}</div>${items.map((x) => {
        const html = h`<a href="${x.href}" class="${first ? 'on' : ''}"><span class="sr-ico">${x.icon}</span><span class="clip"><b>${x.title}</b><br><small class="muted">${x.sub}</small></span></a>`;
        first = false; return html; })}`) : h`<div class="empty small">没有匹配的结果</div>`}</div>`);
    }, 160);
  }

  // ── global event delegation ──
  document.addEventListener('click', async (e) => {
    const g = e.target.closest('[data-global]');
    if (g) {
      const what = g.dataset.global;
      if (what === 'theme') toggleTheme();
      if (what === 'user') userMenu(g);
      if (what === 'active') togglePopover();
      if (what === 'reload') render();
      if (what === 'nav') document.body.classList.toggle('nav-open');
      if (what === 'nav-close') document.body.classList.remove('nav-open');
      if (what === 'search') { document.body.classList.toggle('search-open'); const s = document.getElementById('global-search'); if (s && document.body.classList.contains('search-open')) s.focus(); }
      return;
    }
    if (!e.target.closest('.search')) { const box = document.getElementById('search-results'); if (box) box.innerHTML = ''; }
    if (e.target.closest('.search-results a')) { const s = document.getElementById('global-search'); if (s) s.value = ''; document.body.classList.remove('search-open'); }
    // The narrow-screen navigation drawer closes once a page is picked.
    if (e.target.closest('#nav-links a')) document.body.classList.remove('nav-open');
    // Links inside clickable rows keep their native navigation.
    const el = e.target.closest('a[href], [data-action]');
    // Dialogs wire their own controls; page actions only come from the page itself.
    if (!el?.dataset.action || el.closest('.overlay')) return;
    const page = R.pages[state.page];
    const handler = page && page.actions && page.actions[el.dataset.action];
    if (handler) { e.preventDefault(); try { await handler(el, e, ctx()); } catch (error) { R.toast(error.message, 'err'); } }
  });
  // Forms never navigate; their own handlers (or buttons) perform the request.
  document.addEventListener('submit', (e) => e.preventDefault());
  document.addEventListener('input', (e) => {
    if (e.target.id === 'global-search') search(e.target);
    const page = R.pages[state.page];
    const handler = e.target.dataset && e.target.dataset.input && page && page.actions && page.actions[e.target.dataset.input];
    if (handler) handler(e.target, e, ctx());
  });
  document.addEventListener('keydown', (e) => {
    if (e.target.id === 'global-search' && e.key === 'Enter') { const a = document.querySelector('.search-results a.on') || document.querySelector('.search-results a'); if (a) { location.hash = a.getAttribute('href'); e.target.value = ''; search(e.target); document.body.classList.remove('search-open'); } }
    if (e.target.id === 'global-search' && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
      const links = [...document.querySelectorAll('.search-results a')];
      if (!links.length) return;
      e.preventDefault();
      const at = links.findIndex((a) => a.classList.contains('on'));
      const next = (at + (e.key === 'ArrowDown' ? 1 : -1) + links.length) % links.length;
      links.forEach((a, i) => a.classList.toggle('on', i === next));
    }
    if (e.target.id === 'global-search' && e.key === 'Escape') { e.target.value = ''; search(e.target); e.target.blur(); document.body.classList.remove('search-open'); }
    if (e.key === '/' && !/input|textarea|select/i.test(document.activeElement.tagName)) { e.preventDefault(); const s = document.getElementById('global-search'); if (s) s.focus(); }
  });

  // Re-renders the current page from already loaded data (no request), keeping focus and caret.
  function redraw() {
    const page = R.pages[state.page];
    if (!page || !state.data) return;
    const target = document.getElementById('page');
    const active = document.activeElement;
    const focused = active && active.id, caret = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
    target.innerHTML = String(page.view(state.data, state.params, { can }));
    if (focused) { const el = document.getElementById(focused); if (el) { el.focus(); if (caret !== null && el.setSelectionRange) el.setSelectionRange(caret, caret); } }
    page.mount && page.mount(target, state.data, state.params);
  }

  function ctx() { return { state, can, reload: () => render(true), redraw, go: (hash) => { location.hash = hash; } }; }

  function signedOut() {
    state.session = null; clearTimeout(state.timer); clearTimeout(activeTimer); closePopover();
    R.pages.auth.login();
  }

  async function start() {
    themeInit();
    if (R.demo && R.demo.enabled) {
      R.demo.init();
      // A server-hosted demo uses the same release capabilities as the live console. Standalone previews default to off.
      if (/^https?:$/.test(location.protocol)) {
        try { const response = await fetch('/api/session', { credentials: 'same-origin' }); if (response.ok) R.features.virtualization = (await response.json()).features?.virtualization === true; } catch (error) { /* offline preview */ }
      }
    }
    let session;
    try { session = await R.api.get('/session'); }
    catch (e) { document.getElementById('app').innerHTML = String(h`<div class="empty">${icon('error', 28)}<h3>无法连接 BareTurn Core</h3><p>${e.message}</p></div>`); return; }
    if (session.setupRequired) return R.pages.auth.setup(session);
    if (!session.authenticated) return R.pages.auth.login(session);
    signedIn(session);
  }

  async function signedIn(session) {
    R.features.virtualization = session.features?.virtualization === true;
    state.session = session;
    state.page = null;
    renderShell();
    window.onhashchange = () => render();
    render();
    refreshAlerts();
    setInterval(refreshAlerts, 30000);
    refreshActive();
    try { state.machines = await R.api.get('/machines'); } catch (e) { /* ignore */ }
  }

  R.app = { start, signedIn, signedOut, can, state, render };
  document.addEventListener('DOMContentLoaded', start);
})(window.R = window.R || {});

</script>
  <script>
(function (R) {
  'use strict';
  const { h, icon, brandMark } = R;

  // Abstract art: stacked disk platters with a restore arc, drawn as thin lines.
  const art = R.raw(`<svg class="art" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g fill="none" stroke="#2a4250" stroke-width="1.2">${Array.from({ length: 9 }, (_, i) => `<ellipse cx="420" cy="${150 + i * 34}" rx="${220 - i * 6}" ry="${46 - i}"/>`).join('')}</g>
    <g fill="none" stroke="#35c2ae" stroke-width="2"><path d="M180 520a240 240 0 1 0 70-170" opacity=".55"/><path d="m236 318 14 32 32-14" opacity=".55"/></g>
    <g fill="#35c2ae">${Array.from({ length: 7 }, (_, i) => `<circle cx="${120 + i * 62}" cy="640" r="${i === 0 ? 7 : 4.5}" opacity="${0.35 + i * 0.09}"/>`).join('')}</g>
    <path d="M120 640H492" stroke="#2a4250" stroke-width="1.2"/></svg>`);

  function frame(form) {
    document.getElementById('app').innerHTML = String(h`<div class="auth">
      <section class="auth-form">${form}</section>
      <aside class="auth-art">${art}<blockquote>每台计算机，都随时可以完整地回到某个时间点。</blockquote><small>BareTurn Core · 整机备份与裸机恢复</small></aside>
    </div>`);
  }

  function login(session) {
    frame(h`<div class="brand" style="color:var(--ink);padding:0">${brandMark}<div><div class="brand-name">BareTurn</div></div></div>
      <h1>登录管理控制台</h1><p>${session && session.core ? session.core.name : 'BareTurn Core'}</p>
      <form id="login-form" novalidate>
        <div class="field"><label for="u">用户名</label><input class="input" id="u" name="userName" autocomplete="username" required></div>
        <div class="field"><label for="p">密码</label><input class="input" id="p" name="password" type="password" autocomplete="current-password" required></div>
        <div class="field error" id="login-error" role="alert"></div>
        <button class="btn primary" style="width:100%;height:40px">登录</button>
      </form>
      ${session && session.core ? h`<p class="small faint" style="margin-top:28px">服务器证书 SHA-256<br><span class="mono">${session.core.fingerprint.match(/.{1,4}/g).join(' ')}</span></p>` : ''}`);
    const form = document.getElementById('login-form');
    document.getElementById('u').focus();
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const error = document.getElementById('login-error');
      error.textContent = '';
      const data = R.formData(form);
      if (!data.userName || !data.password) { error.textContent = '请输入用户名和密码。'; return; }
      const submit = form.querySelector('button');
      submit.disabled = true;
      try {
        const result = await R.api.post('/login', data);
        if (result?.mfaRequired) secondStep(session, result.ticket);
        else R.app.signedIn(await R.api.get('/session'));
      } catch (err) { error.textContent = err.message; }
      finally { submit.disabled = false; }
    });
  }

  function secondStep(session, ticket) {
    frame(h`<h1>双因素验证</h1><p>输入验证器 App 的 6 位动态码，或一个未使用的恢复码。</p>
      <form id="verify-login">
        <div class="field"><label for="login-code">动态码或恢复码</label><input class="input mono" id="login-code" name="code" autocomplete="one-time-code" maxlength="24" required></div>
        <div class="field error" role="alert"></div>
        <button class="btn primary" type="submit">验证并登录</button>
        <button class="btn" type="button" data-back>返回登录</button>
      </form>`);
    const form = document.getElementById('verify-login');
    const code = form.elements.code;
    const submit = form.querySelector('[type=submit]');
    const back = form.querySelector('[data-back]');
    const error = form.querySelector('[role=alert]');
    code.focus();
    back.onclick = () => login(session);
    form.onsubmit = async (event) => {
      event.preventDefault();
      error.textContent = '';
      submit.disabled = back.disabled = true;
      try {
        await R.api.post('/login/verify', { ticket, code: code.value });
        R.app.signedIn(await R.api.get('/session'));
      } catch (err) {
        error.textContent = err.message;
        code.select();
        if (err.status === 401) return;
        submit.disabled = false;
      } finally { back.disabled = false; }
    };
  }

  async function manageMfa() {
    const { enabled } = await R.api.get('/me/mfa');
    const setup = enabled ? null : await R.api.post('/me/mfa/begin');
    const modal = R.modal({
      title: enabled ? '停用双因素认证' : '绑定验证器 App',
      body: h`${setup ? h`<p>用验证器 App 扫码，或手动输入密钥并选择基于时间的验证码。</p>
          <img src="data:image/png;base64,${setup.qr}" alt="验证器绑定二维码" style="max-width:100%">
          <p class="mono">${setup.secret}</p>` : h`<p>停用后，登录只需要密码；剩余恢复码将失效。</p>`}
        <form id="mfa-form">
          <div class="field"><label for="mfa-password">当前密码</label><input class="input" id="mfa-password" name="password" type="password" autocomplete="current-password" required></div>
          <div class="field"><label for="mfa-code">${enabled ? '动态码或恢复码' : '6 位动态码'}</label><input class="input mono" id="mfa-code" name="code" autocomplete="one-time-code" maxlength="${enabled ? 24 : 6}" required></div>
          <div class="field error" role="alert"></div>
        </form>`,
      foot: h`<button class="btn" data-close>取消</button><button class="btn primary" type="submit" form="mfa-form">${enabled ? '确认停用' : '确认绑定'}</button>`
    });
    const form = modal.el.querySelector('form');
    const submit = modal.el.querySelector('[type=submit]');
    const error = form.querySelector('[role=alert]');
    form.onsubmit = async (event) => {
      event.preventDefault();
      error.textContent = '';
      submit.disabled = true;
      try {
        const result = await R.api.post(enabled ? '/me/mfa/disable' : '/me/mfa/enable', {
          password: form.elements.password.value, code: form.elements.code.value, ticket: setup?.ticket
        });
        modal.close();
        R.app.signedOut();
        if (enabled) { R.toast('双因素认证已停用，请重新登录。'); return; }
        R.modal({
          title: '保存一次性恢复码',
          body: h`<p>这些恢复码仅显示一次。请离线妥善保存；每个恢复码只能使用一次。</p>
            <pre class="mono">${result.recoveryCodes.join('\n')}</pre>
            <p>绑定用的动态码已用过。重新登录时，请等待验证器显示新的动态码。</p>`,
          foot: h`<button class="btn primary" data-close>已保存，返回登录</button>`
        });
      } catch (err) { error.textContent = err.message; }
      finally { submit.disabled = false; }
    };
  }

  function setup(session) {
    frame(h`<div class="brand" style="color:var(--ink);padding:0">${brandMark}<div><div class="brand-name">BareTurn</div></div></div>
      <h1>初始化 BareTurn Core</h1><p>创建第一个管理员账户。之后可以在“设置 → 用户”中添加操作员和只读用户。</p>
      <form id="setup-form" novalidate>
        <div class="field"><label for="cn">Core 名称</label><input class="input" id="cn" name="coreName" value="${session.core.name}"><span class="hint">显示在控制台和恢复介质中，便于区分多台 Core。</span></div>
        <div class="row"><div class="field"><label for="su">管理员用户名</label><input class="input" id="su" name="userName" value="admin" autocomplete="username"></div>
        <div class="field"><label for="sd">显示名称</label><input class="input" id="sd" name="displayName" placeholder="例如 张伟"></div></div>
        <div class="field"><label for="sp">密码</label><input class="input" id="sp" name="password" type="password" autocomplete="new-password"><span class="hint">至少 10 个字符，包含大写字母、小写字母、数字、符号中的三类。</span></div>
        <div class="field error" id="setup-error" role="alert"></div>
        <button class="btn primary" style="width:100%;height:40px">创建管理员并登录</button>
      </form>`);
    const form = document.getElementById('setup-form');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = R.formData(form);
      try {
        await R.api.post('/setup', data);
        await R.api.post('/login', { userName: data.userName, password: data.password });
        R.app.signedIn(await R.api.get('/session'));
      } catch (err) { document.getElementById('setup-error').textContent = err.message; }
    });
  }

  R.pages.auth = { login, setup, manageMfa, view: () => '' };
})(window.R = window.R || {});

</script>
  <script>

  // "3 小时" / "2 天" without "前".

            <div class="fact"><div class="k">受保护数据</div><div class="v">${bytes(d.protectedBytes)}</div><div class="d">${d.points.toLocaleString()} 个恢复点</div></div>

        <div class="grid dash" style="margin-top:18px">

            <section class="panel">

              ${d.attention.length ? h`<ul class="list">${d.attention.map((a) => h`<li>

                  <div class="capacity" title="${'存储库 ' + bytes(r.storedBytes) + ' / 磁盘 ' + bytes(r.diskTotal)}"><span class="repo" style="${'width:' + (r.diskTotal ? r.storedBytes / r.diskTotal * 100 : 0) + '%'}"></span><span class="other" style="${'width:' + (r.diskTotal ? other / r.diskTotal * 100 : 0) + '%'}"></span></div>

  <script>
(function (R) {
  'use strict';
  const { h, icon, bytes, ago, dateTime, pill } = R;
  const ui = { status: 'all', q: '', plan: '', kind: '' };

  const statusGroups = {
    all: ['全部', () => true],
    ok: ['已保护', (m) => m.status === 'Ok' && !m.paused],
    warn: ['需注意', (m) => ['Warning', 'Pending'].includes(m.status) || (m.paused && !m.archived)],
    err: ['失败', (m) => m.status === 'Error'],
    off: ['离线', (m) => m.status === 'Offline'],
    late: ['未按计划', (m) => !!m.overdueSince],
    archived: ['已归档', (m) => m.archived]
  };
  const span = (ms) => ms < 3600e3 ? Math.max(1, Math.round(ms / 60e3)) + ' 分钟' : ms < 48 * 3600e3 ? Math.round(ms / 3600e3) + ' 小时' : Math.round(ms / 86400e3) + ' 天';

  // ───────────── list ─────────────
  R.pages.machines = {
    title: '计算机',
    live: 6000,
    async load(params) {
      if (params.status && statusGroups[params.status]) ui.status = params.status;
      const [machines, plans, repositories] = await Promise.all([R.api.get('/machines'), R.api.get('/plans'), R.api.get('/repositories')]);
      R.app.state.machines = machines;
      return { machines, plans, repositories, protect: params.protect === '1' };
    },
    mount(_, data) {
      if (data.protect) { history.replaceState(null, '', '#/machines'); protectWizard(data.plans, data.repositories); data.protect = false; }
    },
    view({ machines, plans }, _, { can }) {
      const q = ui.q.toLowerCase();
      const list = machines.filter(m => R.features.virtualization || !m.kind || m.kind === 'Agent').filter(statusGroups[ui.status][1])
        .filter((m) => !q || (m.name + ' ' + (m.host || '') + ' ' + (m.osName || '')).toLowerCase().includes(q))
        .filter((m) => !ui.plan || m.planId === ui.plan)
        .filter((m) => !R.features.virtualization || !ui.kind || (m.kind || 'Agent') === ui.kind);
      const active = machines.filter((m) => !m.archived);
      return h`
        ${R.pageHead({
          title: '计算机', key: 'machines',
          sub: `${active.length} 台受保护${machines.length > active.length ? `，${machines.length - active.length} 台已归档` : ''}${machines.filter(statusGroups.late[1]).length ? `，${machines.filter(statusGroups.late[1]).length} 台未按计划备份` : ''}。`,
          help: h`<p>添加计算机时，Core 用一次性输入的管理员账户（Windows 管理员，或 Linux 的 root / sudo 用户）与客户端配对，之后通过固定证书和令牌通信，不保存账户密码。</p><p>“未按计划”表示保护计划要求的下一次备份时间已过（含宽限期），仍没有成功的恢复点。</p>`,
          actions: can('operate') ? h`<button class="btn primary" data-action="protect">${icon('plus')}保护计算机</button>` : ''
        })}
        <section class="panel">
          <div class="toolbar">
            <div class="chips" role="tablist">${Object.entries(statusGroups).map(([key, [label, test]]) => {
              const count = machines.filter(test).length;
              return key === 'late' && !count && ui.status !== 'late' ? '' : h`<button class="${'chip' + (ui.status === key ? ' on' : '') + (key === 'late' && count ? ' warn' : '')}" data-action="filter" data-status="${key}" role="tab" aria-selected="${ui.status === key}">${label} <b>${count}</b></button>`;
            })}</div>
            <div class="toolbar-end">
              <select class="input" data-input="plan" aria-label="按保护计划筛选"><option value="">全部保护计划</option>${plans.map((p) => h`<option value="${p.id}" ${ui.plan === p.id ? 'selected' : ''}>${p.name}</option>`)}</select>
              ${R.features.virtualization ? h`<select class="input" data-input="kind" aria-label="按类型筛选"><option value="">全部类型</option>${['Agent','VMware','HyperV'].map(k => h`<option value="${k}" ${ui.kind === k ? 'selected' : ''}>${k === 'HyperV' ? 'Hyper-V' : k}</option>`)}</select>` : ''}
              <input class="input" id="machine-filter" placeholder="筛选名称、地址或系统" value="${ui.q}" data-input="search" aria-label="筛选计算机">
            </div>
          </div>
          ${list.length ? h`<div class="table-wrap"><table class="table cards machines-table">
            <thead><tr><th>计算机</th>${R.features.virtualization ? h`<th>类型</th>` : ''}<th>状态</th><th>计划 / 存储库</th><th>上次备份</th><th class="num">恢复点</th><th></th></tr></thead>
            <tbody>${list.map((m) => {
              const state = R.machineState(m);
              const job = m.activeJob;
              return h`<tr class="click" data-action="open" data-id="${m.id}">
                <td data-label="计算机"><div class="machine-cell"><span class="os-icon">${R.osIcon(m.osName)}</span><div class="clip"><strong>${m.name}</strong><small title="${(m.host || '') + ' · ' + (m.osName || '')}">${m.kind && m.kind !== 'Agent' ? m.kind === 'HyperV' ? 'Hyper-V 虚拟机' : 'VMware 虚拟机' : m.host || '已停止保护'} · ${m.osName || '—'}</small></div></div></td>
                ${R.features.virtualization ? h`<td data-label="类型">${m.kind === 'HyperV' ? 'Hyper-V' : m.kind || 'Agent'}</td>` : ''}
                <td data-label="状态" class="status-cell">${pill(R.machineStatus, state)}${m.overdueSince ? h` <span class="pill warn" title="${'计划要求在 ' + dateTime(m.dueAt || m.overdueSince) + ' 前完成备份'}">${icon('clock', 12)}晚了 ${span(Date.now() - (m.dueAt || m.overdueSince))}</span>` : ''}
                  ${state === 'Running' && job ? h`<div class="bar" style="margin-top:6px;width:120px"><span style="${'width:' + job.progress + '%'}"></span></div>` : m.statusMessage && state !== 'Ok' ? h`<div class="small muted clip-line status-msg" title="${m.statusMessage}">${m.statusMessage}</div>` : ''}</td>
                <td data-label="计划 / 存储库">${m.planName || h`<span class="faint">未分配计划</span>`}${m.archived ? '' : h`<br><small class="muted">${m.repositoryName ? '→ ' + m.repositoryName : '未选择存储库'}</small>`}</td>
                <td data-label="上次备份" class="nowrap">${m.lastBackup ? h`${ago(m.lastBackup)}<br><small class="muted" title="${dateTime(m.lastBackup, true)}">${m.paused ? '计划已暂停' : m.nextRun ? '下次 ' + ago(m.nextRun) : dateTime(m.lastBackup)}</small>` : h`<span class="faint">从未</span>`}</td>
                <td data-label="恢复点" class="num">${m.pointCount}<br><small class="muted">${bytes(m.protectedBytes)}</small></td>
                <td class="actions-cell">${can('operate') && !m.archived && m.repositoryId ? h`<button class="btn sm" data-action="backup" data-id="${m.id}" ${state === 'Running' || job ? 'disabled' : ''} title="立即备份">${icon('play')}<span class="hide-sm">备份</span></button>` : ''}${can('operate') && m.pointCount ? h` <a class="btn sm ghost" href="${'#/restore?machine=' + m.id}" title="恢复">${icon('wand')}<span class="hide-sm">恢复</span></a>` : ''}</td>
              </tr>`;
            })}</tbody></table></div>`
            : machines.length ? h`<div class="empty">没有符合筛选条件的计算机</div>`
            : h`<div class="empty">${icon('machines', 30)}<h3>还没有受保护的计算机</h3><p>先在要保护的 Windows 或 Linux 计算机上安装 BareTurn Agent，再在这里添加它。Core 用一次性输入的管理员账户与客户端配对，不保存账户密码。</p>${can('operate') ? h`<button class="btn primary" data-action="protect">${icon('plus')}保护计算机</button>` : ''}</div>`}
        </section>`;
    },
    actions: {
      filter(el, e, ctx) { ui.status = el.dataset.status; ctx.reload(); },
      search(el, e, ctx) { ui.q = el.value; clearTimeout(ui.t); ui.t = setTimeout(ctx.reload, 150); },
      plan(el, e, ctx) { ui.plan = el.value; ctx.reload(); },
      kind(el, e, ctx) { ui.kind = el.value; ctx.reload(); },
      open(el, e, ctx) { if (!e.target.closest('button,a')) ctx.go('#/machines/' + el.dataset.id); },
      async backup(el, e, ctx) { e.stopPropagation(); await R.api.post(`/machines/${el.dataset.id}/backup`, { forceBase: false }); R.toast('备份已加入队列'); ctx.reload(); },
      protect(el, e, ctx) { protectWizard(ctx.state.data.plans, ctx.state.data.repositories); }
    }
  };

  // ───────────── protect wizard ─────────────
  function protectWizard(plans, repositories) {
    let targets = (repositories || []).filter((r) => r.kind !== 'Offline');
    plans = plans || [];
    const admin = R.app.can('admin');
    const steps = ['连接', '认证', '备份内容', '存储库与计划'];
    const s = { step: 0, host: '', port: 9803, name: '', cert: null, user: '', machine: null, excluded: [], scope: { mode: 'machine', included: [], files: { include: [], exclude: [] } },
      repositoryId: (targets.find((r) => r.status === 'Online') || targets[0] || {}).id || '', planId: plans[0] ? plans[0].id : '', startNow: true, busy: false, error: '',
      scanning: false, scanDone: false, scanError: '', discovered: [], alreadyProtected: 0, scannedRanges: [], scanElapsedMs: 0,
      showRange: false, scanTargets: '', scanPort: 9803, selectedKey: '', selectedAgent: null };
    let scanAbort = null;
    function abortScan() { if (scanAbort) { scanAbort.abort(); scanAbort = null; } }
    const m = R.modal({ title: '', wide: true, body: '', onClose: abortScan });
    m.el.querySelector('.modal').style.padding = '0';

    function renderDiscover() {
      const meta = s.scanning
        ? `正在扫描${s.scanTargets ? ' ' + s.scanTargets : '局域网'}…`
        : s.scanDone
          ? `${s.discovered.length ? `发现 ${s.discovered.length} 台` : '未发现未添加的客户端'}${s.alreadyProtected ? `（已跳过 ${s.alreadyProtected} 台已保护）` : ''}`
          : '';
      return h`<div class="discover-box">
        <div class="discover-head">
          <span class="discover-title">${icon('search', 15)}自动发现未添加的客户端</span>
          ${meta ? h`<span class="discover-meta">${meta}</span>` : ''}
          <div class="discover-actions">
            <button type="button" class="btn sm ghost" data-toggle-range>${s.showRange ? '收起网段' : '指定网段…'}</button>
            <button type="button" class="btn sm" data-scan ${s.scanning ? 'disabled' : ''}>${s.scanning ? R.raw('<span class="spin" style="display:inline-flex">' + icon('refresh', 14) + '</span>') : icon('refresh', 14)}${s.scanning ? '扫描中…' : '重新扫描'}</button>
          </div>
        </div>
        ${s.showRange ? h`<div class="discover-range">
          <input class="input range-input" id="w-range" value="${s.scanTargets}" placeholder="IP、CIDR 网段或范围，例如 10.20.2.0/24 或 192.168.1.1-50（留空自动扫描局域网）" aria-label="扫描网段或地址范围">
          <input class="input port-input" id="w-scan-port" type="number" min="1" max="65535" value="${s.scanPort}" placeholder="端口" aria-label="扫描端口">
          <button type="button" class="btn sm primary" data-scan-range ${s.scanning ? 'disabled' : ''}>扫描</button>
        </div>` : ''}
        ${s.scanError ? h`<div class="callout err" style="margin:0 12px 10px" role="alert">${icon('error')}<div>${s.scanError}</div></div>` : ''}
        ${s.discovered.length ? h`<div class="discover-list" role="listbox" aria-label="自动发现的未添加客户端">${s.discovered.map((a, idx) => {
          const key = a.host + ':' + a.port;
          const on = s.selectedKey === key;
          const osLabel = a.osName || (a.platform === 'Linux' ? 'Linux' : 'Windows');
          return h`<button type="button" class="${'discover-item' + (on ? ' on' : '')}" data-pick-agent="${idx}" role="option" aria-selected="${on}">
            <span class="os-icon">${R.osIcon(a.osName || a.platform)}</span>
            <div class="clip">
              <strong><span>${a.machine || a.host}</span>${a.archivedMachineId ? h`<span class="tag" title="${'与已归档计算机“' + (a.archivedMachineName || a.machine) + '”匹配；如需沿用原恢复点，可在该计算机详情页点击“恢复保护”'}">曾归档</span>` : ''}</strong>
              <small><span class="mono">${a.host}:${a.port}</span> · ${osLabel}${a.version ? ' · Agent ' + a.version : ''}</small>
            </div>
            <div class="discover-end">${on ? h`<span class="pill ok">已选择</span>` : h`<span class="small muted">选择</span>`}</div>
          </button>`;
        })}</div>`
          : s.scanning ? h`<div class="discover-empty">${R.raw('<span class="spin" style="display:inline-flex">' + icon('refresh', 15) + '</span>')}<span>正在搜索已安装 BareTurn Agent 且尚未添加的计算机…</span></div>`
          : s.scanDone && !s.scanError ? h`<div class="discover-empty">${icon('info', 15)}<span>${s.alreadyProtected
            ? `当前范围内没有未添加的客户端（已发现的 ${s.alreadyProtected} 台均已保护）。如需扫描其他网段，请点击“指定网段…”。`
            : '未发现未添加的客户端。请确认目标计算机已安装并运行 BareTurn Agent，或点击“指定网段…”扫描跨网段主机，也可在下方手动输入地址。'}</span></div>` : ''}
        ${s.scanDone && !s.scanning && s.scannedRanges.length ? h`<div class="discover-foot"><span>已扫描：${s.scannedRanges.join('、')}</span><span>耗时 ${(s.scanElapsedMs / 1000).toFixed(1)} 秒</span>${s.discovered.length ? h`<span>双击条目可直接连接</span>` : ''}</div>` : ''}
      </div>`;
    }

    function drawDiscover() {
      const box = m.el.querySelector('#w-discover');
      if (box) box.innerHTML = String(renderDiscover());
    }

    async function startScan() {
      abortScan();
      const rangeInput = m.el.querySelector('#w-range');
      const portInput = m.el.querySelector('#w-scan-port');
      if (rangeInput) s.scanTargets = rangeInput.value.trim();
      if (portInput) s.scanPort = Number(portInput.value) || 9803;
      const controller = new AbortController();
      scanAbort = controller;
      s.scanning = true;
      s.scanError = '';
      drawDiscover();
      try {
        const res = await R.api.post('/machines/scan', { targets: s.scanTargets || null, port: s.scanPort, includeBroadcast: !s.scanTargets }, { signal: controller.signal });
        if (scanAbort !== controller) return;
        s.discovered = (res && res.agents) || [];
        s.alreadyProtected = (res && res.alreadyProtected) || 0;
        s.scannedRanges = (res && res.scannedRanges) || [];
        s.scanElapsedMs = (res && res.elapsedMs) || 0;
        s.scanDone = true;
        if (s.selectedKey) {
          const match = s.discovered.find((a) => a.host + ':' + a.port === s.selectedKey);
          if (match) s.selectedAgent = match;
        }
      } catch (error) {
        if (controller.signal.aborted || scanAbort !== controller) return;
        s.scanError = error.message || '自动发现失败。';
        s.scanDone = true;
      }
      if (scanAbort === controller) scanAbort = null;
      s.scanning = false;
      drawDiscover();
    }

    function pickAgent(idx, advance) {
      const a = s.discovered[idx];
      if (!a) return;
      s.host = a.host;
      s.port = a.port || 9803;
      s.selectedKey = a.host + ':' + a.port;
      s.selectedAgent = a;
      s.error = '';
      const hostEl = m.el.querySelector('#w-host');
      const portEl = m.el.querySelector('#w-port');
      const nameEl = m.el.querySelector('#w-name');
      if (hostEl) hostEl.value = s.host;
      if (portEl) portEl.value = String(s.port);
      if (nameEl) nameEl.placeholder = a.machine ? '默认：' + a.machine : '默认使用计算机名';
      drawDiscover();
      if (advance) next();
    }

    function body() {
      if (s.step === 0) return h`<h3 class="wizard-title">连接到客户端</h3><p class="wizard-lead">从自动发现的客户端中选择，或手动输入已安装 BareTurn Agent 的计算机地址。此步骤只建立 TLS 连接，不发送任何账户信息。</p>
        <div id="w-discover">${renderDiscover()}</div>
        <div class="row" style="grid-template-columns:1fr 140px"><div class="field"><label for="w-host">主机名或 IP 地址</label><input class="input" id="w-host" value="${s.host}" placeholder="例如 192.168.10.21 或 sql-prod-01.corp.local"></div>
        <div class="field"><label for="w-port">端口</label><input class="input" id="w-port" type="number" min="1" max="65535" value="${s.port}"></div></div>
        <div class="field"><label for="w-name">显示名称（可选）</label><input class="input" id="w-name" value="${s.name}" placeholder="${s.selectedAgent && s.selectedAgent.machine ? '默认：' + s.selectedAgent.machine : '默认使用计算机名'}"></div>
        <div class="callout">${icon('info')}<div>自动发现通过局域网 UDP 广播（9803）与网段探测查找已安装 BareTurn Agent 且尚未添加的计算机，并自动过滤已保护主机。Windows：客户端安装完成页和 <span class="mono">C:\\ProgramData\\BareTurn\\Agent\\connection-info.txt</span> 中记录了端口；Linux：<span class="mono">/var/lib/bareturn/agent/connection-info.txt</span>。</div></div>`;
      if (s.step === 1) return h`<h3 class="wizard-title">使用管理员账户配对</h3><p class="wizard-lead">账户只在本次配对时使用一次（Windows：Negotiate / NTLM；Linux：在已固定证书的 TLS 连接内由 PAM 验证）。配对成功后客户端生成专用令牌，Core 不保存此密码。</p>
        <div class="field"><label for="w-user">用户名</label><input class="input" id="w-user" value="${s.user}" placeholder="Windows：CORP\\backup-admin 或 SQL-PROD-01\\Administrator；Linux：root 或 sudo 用户" autocomplete="off"></div>
        <div class="field"><label for="w-pass">密码</label><input class="input" id="w-pass" type="password" autocomplete="new-password"></div>
        <div class="callout">${icon('info')}<div>Windows：客户端计算机本地 Administrators 组中的任一账户，或域管理员账户。Linux：root，或属于 sudo / wheel / admin 组的用户（不需要在客户端保存密码，只验证一次）。</div></div>
        <p class="small faint" style="margin-top:16px">已连接 ${s.host}:${s.port}（${s.cert.subject}${s.cert.fingerprint ? h`，指纹 <span class="mono" title="${s.cert.fingerprint}">${s.cert.fingerprint.slice(0, 16)}…</span>` : ''}）。Core 将固定此证书，证书变化后需要重新添加计算机。</p>`;
      if (s.step === 2) {
        const layout = s.machine.layout;
        return h`<h3 class="wizard-title">备份内容</h3><p class="wizard-lead">${s.machine.name} · ${layout.osName} · ${layout.firmware} 启动。可以备份整机或仅系统磁盘，也可以只备份指定分区（例如 C: 或 D:），或只备份指定的文件夹。之后可在计算机设置中修改。</p>
          ${s.scope.mode === 'machine' ? R.diskMap(layout, s.excluded) : ''}
          <div style="margin-top:16px">${R.scopeEditor(layout, s.scope)}</div>
          ${s.scope.mode === 'machine' ? h`<div style="margin-top:6px">${layout.disks.filter((d) => d.supported && !(d.isBoot || d.isSystem)).map((d) =>
            h`<label class="check"><input type="checkbox" data-disk="${d.uniqueId}" ${s.excluded.includes(d.uniqueId) ? '' : 'checked'}><span>包含磁盘 ${d.number}（${d.friendlyName}，${bytes(d.size)}）</span></label>`)}</div>
          ${R.isLinux(layout) ? h`<div class="callout ok">${icon('shield')}<div>EFI、/boot、根文件系统与 LVM 物理卷均按块备份，跳过 ext4 / XFS 的空闲空间和未分配的 LVM 区段；LVM 上的文件系统在卷组有可用空间时用快照读取，否则在线读取（会有警告）。裸机恢复时按原始偏移、类型和分区 GUID 重建分区。</div></div>`
            : h`<div class="callout ok">${icon('shield')}<div>EFI、恢复分区与 Windows 分区均会备份，MSR 只记录布局；裸机恢复时按原始偏移和类型重建分区。</div></div>`}` : ''}`;
      }
      return h`<h3 class="wizard-title">存储库与保护计划</h3><p class="wizard-lead">存储库决定备份数据存到哪里；保护计划决定什么时候备份、恢复点保留多久，可以多台计算机共用。还没有合适的可以在这里直接新建，两者之后都可在计算机设置中修改。</p>
        <div class="field"><label for="w-repo">存储库</label>
        ${targets.length ? h`<div style="display:flex;gap:8px"><select class="input" id="w-repo" style="flex:1">${R.repoOptions(targets, s.repositoryId)}</select>${admin ? h`<button type="button" class="btn" data-new-repo>${icon('plus')}新建存储库</button>` : ''}</div>`
          : admin ? h`<div class="callout warn" style="margin-top:0">${icon('warn')}<div>还没有存储库。新建一个存储库（Core 本地数据盘或 NAS 共享）后即可在此完成全部设置。<div style="margin-top:8px"><button type="button" class="btn sm primary" data-new-repo>${icon('plus')}新建存储库</button></div></div></div>`
          : h`<div class="callout warn" style="margin-top:0">${icon('warn')}<div>还没有存储库，新建存储库需要管理员权限。可以先完成添加，由管理员新建存储库后在计算机设置中选择。</div></div>`}</div>
        <div class="field"><span class="label">保护计划</span>
        ${plans.length ? h`<div class="choice">${plans.map((p) => h`<label class="${s.planId === p.id ? 'on' : ''}"><input type="radio" name="plan" value="${p.id}" ${s.planId === p.id ? 'checked' : ''}><span><strong>${p.name}</strong><small>${R.pages.plans.describe(p)}</small></span></label>`)}
          <label class="${s.planId === '' ? 'on' : ''}"><input type="radio" name="plan" value="" ${s.planId === '' ? 'checked' : ''}><span><strong>稍后分配</strong><small>计算机会保持“等待首次备份”状态</small></span></label></div>
          ${admin ? h`<button type="button" class="btn sm" data-new-plan style="margin-top:8px;align-self:flex-start">${icon('plus')}新建保护计划</button>` : ''}`
          : admin ? h`<div class="callout warn" style="margin-top:0">${icon('warn')}<div>还没有保护计划。新建一个计划（备份时间与保留策略），创建后自动选中。<div style="margin-top:8px"><button type="button" class="btn sm primary" data-new-plan>${icon('plus')}新建保护计划</button></div></div></div>`
          : h`<div class="callout warn" style="margin-top:0">${icon('warn')}<div>还没有保护计划，新建计划需要管理员权限。可以先完成添加，之后再分配计划。</div></div>`}</div>
        <label class="check" style="margin-top:16px"><input type="checkbox" id="w-start" ${s.startNow && s.planId && s.repositoryId ? 'checked' : ''} ${s.planId && s.repositoryId ? '' : 'disabled'}><span>完成后立即创建基准恢复点<small>首次备份会完整读取所有已用数据，之后只传输变化的数据块。</small></span></label>`;
    }

    function draw() {
      const modalEl = m.el.querySelector('.modal');
      const prior = modalEl.querySelector('.modal-body');
      const keep = prior && prior.dataset.step === String(s.step) ? prior.scrollTop : 0;
      modalEl.innerHTML = String(h`<div class="wizard">
        <aside class="wizard-steps"><h2 style="font-size:16px;margin:2px 8px 16px">保护计算机</h2><ol>${steps.map((label, i) => h`<li class="${i === s.step ? 'on' : i < s.step ? 'done' : ''}">${label}</li>`)}</ol></aside>
        <div class="wizard-main">
          <div class="modal-head" style="padding-bottom:0"><span class="muted small">第 ${s.step + 1} 步，共 ${steps.length} 步</span><button class="icon-btn" data-close aria-label="关闭">${icon('close')}</button></div>
          <div class="modal-body">${body()}${s.error ? h`<div class="callout err" role="alert">${icon('error')}<div>${s.error}</div></div>` : ''}</div>
          <div class="modal-foot">
            ${s.step === 1 || s.step === 3 ? h`<button class="btn" data-back>上一步</button>` : ''}
            <button class="btn primary" data-next ${s.busy ? 'disabled' : ''}>${s.busy ? '请稍候…' : ['连接', '配对', '下一步', '完成'][s.step]}</button>
          </div>
        </div></div>`);
      const bodyEl = modalEl.querySelector('.modal-body');
      bodyEl.dataset.step = String(s.step);
      bodyEl.scrollTop = keep;
      const first = s.step === 0 ? modalEl.querySelector('#w-host') : modalEl.querySelector('.modal-body input:not([type=checkbox]):not([type=radio])');
      if (first) first.focus();
      modalEl.querySelectorAll('input[name=plan]').forEach((r) => r.addEventListener('change', () => { s.planId = r.value; draw(); }));
      const repo = modalEl.querySelector('#w-repo');
      if (repo) repo.addEventListener('change', () => { s.repositoryId = repo.value; draw(); });
      const start = modalEl.querySelector('#w-start');
      if (start) start.addEventListener('change', () => { s.startNow = start.checked; });
      modalEl.querySelectorAll('[data-disk]').forEach((c) => c.addEventListener('change', () => {
        s.excluded = c.checked ? s.excluded.filter((x) => x !== c.dataset.disk) : s.excluded.concat(c.dataset.disk); draw();
      }));
      if (s.step === 2) R.bindScope(modalEl, s.machine.layout, s.scope, draw);
    }

    async function next() {
      const v = (id) => { const el = m.el.querySelector('#' + id); return el ? el.value.trim() : ''; };
      s.error = '';
      try {
        if (s.step === 0) {
          s.host = v('w-host'); s.port = Number(v('w-port')) || 9803; s.name = v('w-name');
          if (!s.host) throw new Error('请输入主机名或 IP 地址，或从上方自动发现列表中选择。');
          abortScan();
          if (s.selectedAgent && s.host === s.selectedAgent.host && s.port === (s.selectedAgent.port || 9803) && s.selectedAgent.fingerprint) {
            s.cert = { fingerprint: s.selectedAgent.fingerprint, subject: s.selectedAgent.subject || ('CN=' + (s.selectedAgent.machine || s.host)),
              notBefore: s.selectedAgent.notBefore, notAfter: s.selectedAgent.notAfter };
            s.step = 1;
          } else {
            s.busy = true; draw();
            s.cert = await R.api.post('/machines/discover', { host: s.host, port: s.port });
            s.step = 1;
          }
        } else if (s.step === 1) {
          s.user = v('w-user');
          const password = m.el.querySelector('#w-pass').value;
          if (!s.user || !password) throw new Error('请输入用户名和密码。');
          s.busy = true; draw();
          s.machine = await R.api.post('/machines', { host: s.host, port: s.port, fingerprint: s.cert.fingerprint, userName: s.user, password, displayName: s.name, planId: null, startNow: false });
          s.scope.machineId = s.machine.id;
          s.step = 2;
        } else if (s.step === 2) {
          R.scopePayload(s.scope);
          s.step = 3;
        } else {
          const startBox = m.el.querySelector('#w-start');
          if (startBox && !startBox.disabled) s.startNow = startBox.checked;
          if (s.planId && !s.repositoryId) throw new Error('分配保护计划前请先选择存储库。');
          s.busy = true; draw();
          await R.api.put('/machines/' + s.machine.id, Object.assign({ planId: s.planId, repositoryId: s.repositoryId, excludedDisks: s.excluded }, R.scopePayload(s.scope)));
          const start = s.planId && s.repositoryId && s.startNow;
          if (start) await R.api.post(`/machines/${s.machine.id}/backup`, { forceBase: false });
          m.close();
          R.toast(start ? `已开始保护 ${s.machine.name}，首次备份已排队` : `已添加 ${s.machine.name}`);
          location.hash = '#/machines/' + s.machine.id;
          return;
        }
      } catch (error) { s.error = error.message; }
      s.busy = false; draw();
    }

    // Create a repository or plan without leaving the wizard; the new one is selected when its dialog closes.
    function newRepository() {
      R.repoDialog(async (result) => {
        try { targets = (await R.api.get('/repositories')).filter((r) => r.kind !== 'Offline'); } catch (_) { /* keep the old list */ }
        if (targets.some((r) => r.id === result.id)) s.repositoryId = result.id;
        s.error = ''; draw();
      });
    }
    function newPlan() {
      R.planEditor(async (plan) => {
        try { plans = await R.api.get('/plans'); } catch (_) { if (plan && plan.id) plans = plans.concat(plan); }
        if (plan && plans.some((p) => p.id === plan.id)) s.planId = plan.id;
        s.error = ''; draw();
      });
    }

    m.el.addEventListener('click', (e) => {
      if (s.busy) return;
      const pick = e.target.closest('[data-pick-agent]');
      if (pick) return pickAgent(Number(pick.dataset.pickAgent), false);
      if (e.target.closest('[data-toggle-range]')) {
        s.showRange = !s.showRange;
        drawDiscover();
        const rangeEl = m.el.querySelector('#w-range');
        if (rangeEl) rangeEl.focus();
        return;
      }
      if (e.target.closest('[data-scan]') || e.target.closest('[data-scan-range]')) return startScan();
      if (e.target.closest('[data-new-repo]')) return newRepository();
      if (e.target.closest('[data-new-plan]')) return newPlan();
      if (e.target.closest('[data-next]')) next();
      if (e.target.closest('[data-back]')) { s.step--; s.error = ''; draw(); }
    });
    m.el.addEventListener('dblclick', (e) => {
      if (s.busy) return;
      const pick = e.target.closest('[data-pick-agent]');
      if (pick) pickAgent(Number(pick.dataset.pickAgent), true);
    });
    m.el.addEventListener('input', (e) => {
      const id = e.target.id;
      if (id === 'w-host') {
        s.host = e.target.value.trim();
        if (s.selectedAgent && s.host !== s.selectedAgent.host) { s.selectedKey = ''; s.selectedAgent = null; drawDiscover(); }
      } else if (id === 'w-port') {
        s.port = Number(e.target.value) || 9803;
        if (s.selectedAgent && s.port !== (s.selectedAgent.port || 9803)) { s.selectedKey = ''; s.selectedAgent = null; drawDiscover(); }
      } else if (id === 'w-name') {
        s.name = e.target.value;
      } else if (id === 'w-range') {
        s.scanTargets = e.target.value;
      } else if (id === 'w-scan-port') {
        s.scanPort = Number(e.target.value) || 9803;
      }
    });
    m.el.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' || e.target.tagName !== 'INPUT' || e.target.type === 'checkbox') return;
      if (e.target.id === 'w-range' || e.target.id === 'w-scan-port') { e.preventDefault(); startScan(); return; }
      next();
    });
    draw();
    startScan();
  }
  R.protectWizard = protectWizard;

  // ───────────── detail ─────────────
  function kvRow(k, v) { return h`<dt>${k}</dt><dd>${v}</dd>`; }
  // Unsaved scope edits on the settings tab survive background refreshes.
  const scopes = {};
  function scopeState(m) {
    if (!scopes[m.id]) scopes[m.id] = R.scopeStateOf(m);
    return scopes[m.id];
  }
  // Selected recovery points on the points tab (per machine).
  const picked = {};
  const pickSet = (id) => picked[id] || (picked[id] = new Set());
  const isFiles = (p) => p.scope === 'Files';
  const isVm = (p) => p.scope === 'VirtualMachine';
  const pointTag = (p) => h`${isVm(p) ? h` <span class="tag brand">虚拟机</span>` : isFiles(p) ? h` <span class="tag" title="文件级恢复点：可浏览、下载或写回文件，不能裸机恢复">文件级</span>`
    : p.bareMetal === false ? h` <span class="tag" title="只包含所选分区，不能裸机恢复">仅分区</span>` : ''}${R.originTag(p)}`;

  R.pages.machine = {
    title: '计算机',
    live: (d) => (d && d.machine && d.machine.activeJob ? 3000 : 10000),
    async load(params) {
      const id = params.id;
      const [machine, points, jobs, plans, repositories] = await Promise.all([
        R.api.get('/machines/' + id), R.api.get('/points?machineId=' + id + '&limit=2000'), R.api.get('/jobs?machineId=' + id + '&limit=50'), R.api.get('/plans'), R.api.get('/repositories')]);
      return { machine, points, jobs, plans, repositories, selected: R.pages.machine.selected };
    },
    view(d, params, { can }) {
      const m = d.machine, tab = params.tab || 'overview';
      const state = R.machineState(m);
      const plan = d.plans.find((p) => p.id === m.planId);
      const job = m.activeJob;
      const layout = m.layout || { disks: [] };
      const tabs = [['overview', '概览'], ['points', `恢复点 ${d.points.length}`], ['jobs', '任务'], ['settings', '设置']];
      return h`
        <div class="crumbs"><a href="#/machines">计算机</a>${icon('chevron', 14)}<span>${m.name}</span></div>
        <div class="page-head">
          <div style="display:flex;gap:14px;align-items:center"><span class="os-icon" style="width:46px;height:46px">${R.osIcon(m.osName)}</span>
            <div><h1>${m.name} ${pill(R.machineStatus, state)}</h1><p>${m.kind && m.kind !== 'Agent' ? m.kind + ' · ' + (m.vmPath || '虚拟化平台') : m.host ? m.host + ':' + m.port : '已停止保护'} · ${m.osName || '未知系统'}${m.domain ? ' · ' + m.domain : ''}</p></div></div>
          <div class="actions">${can('operate') && d.points.length ? h`<a class="btn" href="${'#/restore?machine=' + m.id}">${icon('wand')}恢复…</a>` : ''}${can('operate') && m.archived ? h`<button class="btn primary" data-action="reprotect">${icon('shield')}恢复保护</button>` : ''}${can('operate') && !m.archived ? h`
            <button class="btn primary" data-action="backup" ${job || !m.repositoryId ? 'disabled' : ''} title="${m.repositoryId ? '' : '请先在设置中选择存储库'}">${icon('play')}立即备份</button>
            ${R.menu([
              { action: 'full', label: '完整备份…', icon: 'play', disabled: !!job || !m.repositoryId, title: m.repositoryId ? '' : '请先在设置中选择存储库' },
              { action: 'pause', label: m.paused ? '恢复计划备份' : '暂停计划备份', icon: m.paused ? 'play' : 'pause' },
              { action: 'refresh', label: '刷新计算机信息', icon: 'refresh' }
            ], '更多操作')}` : ''}</div>
        </div>
        ${m.overdueSince && !m.archived ? h`<div class="callout warn" style="margin-top:0">${icon('clock')}<div>未按计划备份：保护计划要求的备份已超时 ${span(Date.now() - (m.dueAt || m.overdueSince))}（上次成功 ${m.lastBackup ? ago(m.lastBackup) : '从未'}）。${m.status === 'Offline' ? '计算机离线，请检查网络与 BareTurn Agent 服务。' : ''}</div></div>` : ''}
        ${m.statusMessage && state !== 'Ok' && !m.archived ? h`<div class="${'callout ' + (state === 'Error' ? 'err' : 'warn')}" style="margin-top:0">${icon(state === 'Error' ? 'error' : 'warn')}<div>${m.statusMessage}</div></div>` : ''}
        <nav class="tabs">${tabs.map(([key, label]) => h`<a href="${'#/machines/' + m.id + (key === 'overview' ? '' : '/' + key)}" class="${tab === key ? 'on' : ''}">${label}</a>`)}</nav>
        ${m.archived ? h`<div class="callout" style="margin-top:0">${icon('info')}<div>此计算机已停止保护，${m.pointCount} 个恢复点保留用于恢复。${can('operate') ? '可以“恢复保护”重新与客户端配对，沿用原有恢复点和历史；' : ''}${can('admin') ? '不再需要时可在“设置”中删除。' : ''}</div></div>` : ''}
        ${tab === 'overview' ? overview(d, m, plan, job, layout) : tab === 'points' ? pointsTab(d, can) : tab === 'jobs' ? R.pages.jobs.table(d.jobs) : settingsTab(d, m, can)}`;
    },
    mount(target, d, params) {
      if ((params.tab || 'overview') !== 'settings' || !d.machine.layout) return;
      if (d.machine.kind && d.machine.kind !== 'Agent') {
        const panel = target.querySelector('#scope-panel'); const vm = d.machine.vmOptions || {};
        if (panel) panel.innerHTML = String(h`<p>虚拟机采用整盘备份。</p><label class="field">一致性<select name="vmQuiesce">${[['TryApplication','尝试应用一致，失败后崩溃一致'],['RequireApplication','必须应用一致'],['Crash','始终崩溃一致']].map(([key,label])=>h`<option value="${key}" ${(vm.quiesce || 'TryApplication') === key ? 'selected' : ''}>${label}</option>`)}</select></label><label class="field">排除磁盘（稳定标识，每行一个）<textarea name="vmExcluded">${(vm.excludedDisks || []).join('\n')}</textarea></label><label><input type="checkbox" name="vmFree" ${vm.skipGuestFreeSpace !== false ? 'checked' : ''}> 跳过应用一致快照中的来宾空闲簇</label>`);
        return;
      }
      const panel = target.querySelector('#scope-panel');
      const state = scopeState(d.machine);
      const draw = () => {
        panel.innerHTML = String(R.scopeEditor(d.machine.layout, state, R.app.can('operate') && !d.machine.archived));
        const disks = target.querySelector('#disk-include');
        if (disks) disks.style.display = state.mode === 'machine' ? '' : 'none';
        R.bindScope(panel, d.machine.layout, state, draw);
      };
      draw();
    },
    actions: {
      async backup(el, e, ctx) { await R.api.post(`/machines/${ctx.state.params.id}/backup`, { forceBase: false }); R.toast('备份已加入队列'); ctx.reload(); },
      async full(el, e, ctx) {
        if (!await R.confirm({ title: '创建完整备份', message: '将忽略变化缓存，完整读取所有已用数据并开始新的恢复点链。适用于磁盘布局发生变化或需要独立基准的情况。', ok: '开始完整备份' })) return;
        await R.api.post(`/machines/${ctx.state.params.id}/backup`, { forceBase: true }); R.toast('完整备份已加入队列'); ctx.reload();
      },
      async refresh(el, e, ctx) { el.disabled = true; await R.api.post(`/machines/${ctx.state.params.id}/refresh`); R.toast('已更新计算机信息'); ctx.reload(); },
      async pause(el, e, ctx) { const m = ctx.state.data.machine; await R.api.put('/machines/' + m.id, { paused: !m.paused }); R.toast(m.paused ? '已恢复计划备份' : '已暂停计划备份'); ctx.reload(); },
      'select-point'(el, e, ctx) { R.pages.machine.selected = el.dataset.id; ctx.reload(); },
      async verify(el, e, ctx) { await R.api.post(`/points/${el.dataset.id}/verify`, { deep: true }); R.toast('校验作业已加入队列'); ctx.reload(); },
      restore(el, e, ctx) { const p = ctx.state.data.points.find(p => p.id === el.dataset.id); return isVm(p) ? R.vmRestoreDialog(p) : restoreDialog(ctx.state.data.machine, p); },
      instant(el, e, ctx) { return R.vmRestoreDialog(ctx.state.data.points.find(p => p.id === el.dataset.id), true); },
      mount(el, e, ctx) { R.mountDialog(ctx.state.data.points.find((p) => p.id === el.dataset.id)); },
      async save(el, e, ctx) {
        const form = document.getElementById('machine-settings');
        const data = R.formData(form);
        const machine = ctx.state.data.machine;
        const scope = R.scopePayload(scopeState(machine));
        const excluded = [...form.querySelectorAll('[data-disk]')].filter((c) => !c.checked).map((c) => c.dataset.disk);
        const update = { name: data.name, excludedDisks: excluded };
        // Archived machines can only be renamed here; scope, repository and plan come back with "resume protection".
        if (!machine.archived) {
          if (data.planId && !data.repositoryId) throw new Error('分配保护计划前请先选择存储库。');
          if (machine.repositoryId && data.repositoryId !== machine.repositoryId && machine.pointCount > 0) {
            const to = (ctx.state.data.repositories.find((r) => r.id === data.repositoryId) || {}).name || '新存储库';
            if (!await R.confirm({ title: '更换存储库', message: `之后的备份写入“${to}”，第一次会在那里创建完整的基准恢复点。原存储库“${machine.repositoryName || ''}”中的 ${machine.pointCount} 个恢复点保留，仍可浏览和恢复，并继续按保留策略合并。`, ok: '更换' })) return;
          }
          Object.assign(update, { planId: data.planId, repositoryId: data.repositoryId }, machine.kind && machine.kind !== 'Agent' ? { vmOptions: { quiesce:data.vmQuiesce, excludedDisks:(data.vmExcluded || '').split(/\s+/).filter(Boolean), skipGuestFreeSpace:form.querySelector('[name=vmFree]').checked } } : scope);
        }
        await R.api.put('/machines/' + ctx.state.params.id, update);
        delete scopes[ctx.state.params.id];
        R.toast('设置已保存'); ctx.reload();
      },
      async stop(el, e, ctx) {
        const m = ctx.state.data.machine;
        if (!await R.confirm({ title: '停止保护', message: `将解除与 ${m.name} 的配对并停止计划备份。现有恢复点保留，仍可用于裸机恢复。`, ok: '停止保护', danger: true })) return;
        await R.api.del('/machines/' + m.id); R.toast('已停止保护'); ctx.go('#/machines');
      },
      reprotect(el, e, ctx) { reprotectDialog(ctx.state.data.machine, ctx.state.data.plans, ctx.state.data.repositories, ctx.reload); },
      'remove-archived'(el, e, ctx) { removeArchivedDialog(ctx.state.data.machine, ctx.state.data.points.length, () => ctx.go('#/machines')); },
      'pt-pick'(el, e, ctx) { const set = pickSet(ctx.state.params.id); if (el.checked) set.add(el.dataset.id); else set.delete(el.dataset.id); ctx.redraw(); },
      'pt-all'(el, e, ctx) { const set = pickSet(ctx.state.params.id); set.clear(); if (el.checked) ctx.state.data.points.forEach((p) => set.add(p.id)); ctx.redraw(); },
      'pt-clear'(el, e, ctx) { pickSet(ctx.state.params.id).clear(); ctx.redraw(); },
      async 'delete-point'(el, e, ctx) { if (await deletePoints(ctx.state.data.machine, ctx.state.data.points.filter((p) => p.id === el.dataset.id), ctx.state.data.points)) { pickSet(ctx.state.params.id).delete(el.dataset.id); ctx.reload(); } },
      async 'delete-points'(el, e, ctx) {
        const set = pickSet(ctx.state.params.id);
        if (await deletePoints(ctx.state.data.machine, ctx.state.data.points.filter((p) => set.has(p.id)), ctx.state.data.points)) { set.clear(); ctx.reload(); }
      },
      async remove(el, e, ctx) {
        const m = ctx.state.data.machine;
        if (!await R.confirm({ title: '删除计算机及全部恢复点', message: `将永久删除 ${m.name} 的 ${ctx.state.data.points.length} 个恢复点，并在存储库中回收空间。此操作不可撤销。`, ok: '永久删除', danger: true, typed: m.name })) return;
        await R.api.del('/machines/' + m.id + '?deletePoints=true'); R.toast('删除作业已加入队列'); ctx.go('#/machines');
      }
    }
  };

  function overview(d, m, plan, job, layout) {
    const points = d.points;
    const sel = points.find((p) => p.id === d.selected) || points[0];
    const lp = (layout.disks || []);
    return h`<div class="grid dash">
      <div class="stack">
        ${job ? h`<section class="panel"><div class="panel-head"><h2>${R.jobType[job.type] || job.type}</h2>${pill(R.jobStatus, job.status)}<div class="end"><a class="btn sm ghost" href="${'#/jobs/' + job.id}">查看详情</a></div></div>
          <div class="panel-body"><div class="bar lg"><span style="${'width:' + job.progress + '%'}"></span></div><p class="small muted" style="margin:8px 0 0">${job.phase ? job.phase + ' · ' : ''}${job.message || ''}</p></div></section>` : ''}
