  // ───────────── offline drives ─────────────
  const SOURCE_NAMES = { Repository: '复制存储库中的最新恢复点', Agent: '从计算机直接备份' };

  const lag = (ms) => ms < 3600000 ? Math.max(1, Math.round(ms / 60000)) + ' 分钟' : ms < 48 * 3600000 ? Math.round(ms / 3600000) + ' 小时' : Math.round(ms / 86400000) + ' 天';
  // How far the drive's chain lags behind the machine's repository.
  function freshness(x) {
    if (x.source === 'Agent') return x.latestOnDrive ? h`<span class="muted small">${ago(x.latestOnDrive)}</span>` : h`<span class="faint">尚无</span>`;
    if (!x.latestInRepository) return h`<span class="faint">存储库中还没有恢复点</span>`;
    if (!x.latestOnDrive) return h`<span class="pill warn">尚未复制</span>`;
    if (x.latestOnDrive >= x.latestInRepository) return h`<span class="pill ok">已是最新</span>`;
    return h`<span class="pill warn" title="${'存储库中最新：' + dateTime(x.latestInRepository, true)}">落后 ${lag(x.latestInRepository - x.latestOnDrive)}</span>`;
  }

  const retentionShort = (r) => {
    if (!r) return '默认';
    const parts = [`全部 ${r.keepAllHours} 小时`];
    if (r.hourlyDays) parts.push(`每小时 ${r.hourlyDays} 天`);
    if (r.dailyDays) parts.push(`每天 ${r.dailyDays} 天`);
    if (r.weeklyWeeks) parts.push(`每周 ${r.weeklyWeeks} 周`);
    if (r.monthlyMonths) parts.push(`每月 ${r.monthlyMonths} 个月`);
    return parts.join(' · ');
  };

  function offlineSection(drives, can) {
    const DAY = 86400000;
    return h`
      <div class="section-head" id="section-offline"><div class="page-title"><h2>离线盘${R.helpToggle('offline')}</h2><p>连接在 Core 服务器上的移动硬盘，备份完成后自动弹出，拔下单独存放。</p>
        ${R.helpBody('offline', h`<p>连接后，登记的计算机会备份到盘上（默认复制存储库中的最新恢复点，不需要计算机在线），完成后自动弹出。拔下来单独存放：勒索软件和被攻陷的 Core 都碰不到一块不在线的盘。可引导的离线盘插到任何计算机上启动即可整机恢复，不需要 Core。建议至少两块盘轮换。</p>`)}</div>
        <div class="actions">${can('admin') ? h`<button class="btn" data-action="offlineCreate">${icon('plus')}新建离线盘</button>` : ''}</div></div>
      ${drives.length ? h`<div class="stack">${drives.map((r) => {
        const on = r.status === 'Online';
        const o = r.offline || {};
        const rows = r.offlineMachines || [];
        const usedPct = r.diskTotal ? r.storedBytes / r.diskTotal * 100 : 0;
        const otherPct = r.diskTotal ? Math.max(0, (r.diskTotal - r.diskFree - r.storedBytes) / r.diskTotal * 100) : 0;
        const remind = (o.reminderDays || 0) * DAY;
        const stale = !on && rows.length && remind && Date.now() - (r.lastSync || r.created) > remind;
        const hours = r.connectedSince ? Math.floor((Date.now() - r.connectedSince) / 3600000) : 0;
        const lingering = on && o.maxConnectedHours && hours >= o.maxConnectedHours;
        return h`<section class="panel">
          <div class="panel-head">${icon('repo')}<h2>${r.name}</h2>${on ? h`<span class="pill ok">已连接</span>` : r.ejected ? h`<span class="pill off">已弹出，可以拔出</span>` : h`<span class="pill off">未连接</span>`}<span class="tag">${icon('lock', 12)} AES-256-GCM</span>${o.bootable ? h`<span class="tag brand" title="${o.biosBoot ? 'UEFI 与 BIOS' : 'UEFI'}">可引导</span>` : ''}
            <div class="end">${can('operate') && on ? h`<button class="btn sm primary" data-action="offlineSync" data-id="${r.id}">立即备份…</button><button class="btn sm" data-action="offlineEject" data-id="${r.id}">弹出</button>` : ''}${can('operate') && !on && r.ejected ? h`<button class="btn sm" data-action="offlineConnect" data-id="${r.id}">重新连接</button>` : ''}${R.menu([
              can('admin') ? { action: 'offlineContent', id: r.id, label: '备份内容…', icon: 'machines' } : null,
              can('admin') ? { action: 'offlineEdit', id: r.id, label: '设置…', icon: 'settings' } : null,
              can('operate') && on && o.bootable ? { action: 'offlineBoot', id: r.id, label: '更新启动环境…', icon: 'media' } : null,
              can('admin') ? '-' : null,
              can('admin') ? { action: 'offlineRemove', id: r.id, label: '移除离线盘…', icon: 'close', danger: true } : null], '离线盘操作')}</div></div>
          <div class="panel-body">
            ${stale ? h`<div class="callout warn" style="margin-top:0">${icon('warn')}<div>已超过 ${o.reminderDays} 天没有完成离线备份。请把这块盘连接到 Core 服务器。</div></div>` : ''}
            ${lingering ? h`<div class="callout warn" style="margin-top:0">${icon('warn')}<div>这块盘已连续连接 ${hours} 小时。连接着的盘不具备离线保护，备份完成后请弹出并拔出。</div></div>` : ''}
            ${on && o.keepAll && r.diskTotal && r.diskFree < r.diskTotal * 0.1 ? h`<div class="callout warn" style="margin-top:0">${icon('warn')}<div>离线盘只剩 ${bytes(r.diskFree)}。这块盘设为永久保留，不会自动清理旧恢复点：请在“恢复点”页面删除不再需要的恢复点，或换一块新盘继续存档。</div></div>` : ''}
            ${!rows.length ? h`<div class="callout warn" style="margin-top:0">${icon('warn')}<div>还没有选择要备份到这块盘的计算机。${can('admin') ? h` <button class="btn sm" data-action="offlineContent" data-id="${r.id}">选择计算机</button>` : '请联系管理员在“备份内容”中选择。'}${on && can('operate') ? h`<br><span class="small muted">也可以在“恢复点”页面勾选恢复点，复制到这块盘。</span>` : ''}</div></div>` : ''}
            <div style="display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px">
              <div>${on ? h`
                <div style="display:flex;justify-content:space-between;margin-bottom:8px"><span><b>${bytes(r.storedBytes)}</b> <span class="muted">离线存储库占用</span></span><span class="muted">${bytes(r.diskFree)} 可用 / ${bytes(r.diskTotal)}</span></div>
                <div class="capacity"><span class="repo" style="${'width:' + usedPct + '%'}"></span><span class="other" style="${'width:' + otherPct + '%'}"></span></div>
                <div class="legend"><span><i style="background:var(--brand)"></i>BareTurn</span><span><i style="background:var(--line-strong)"></i>盘上的其他数据</span></div>`
                : h`<div class="muted">${r.ejected ? '盘已卸载，数据已全部写入，可以拔出。拔出后再次连接时会自动识别。' : '盘不在线。连接到 Core 服务器后会自动识别（按存储库标识识别，与盘符无关）' + (o.autoBackup ? '，并开始备份。' : '。')}</div>
                <div class="small muted" style="margin-top:8px">上次连接时占用 ${bytes(r.storedBytes)}</div>`}</div>
              <dl class="kv">
                <dt>位置</dt><dd class="mono">${r.path || '—'}</dd>
                <dt>上次离线备份</dt><dd>${r.lastSync ? `${dateTime(r.lastSync, true)}（${ago(r.lastSync)}）` : '从未'}</dd>
                <dt>恢复点</dt><dd>${(r.points || 0).toLocaleString()} 个${r.standalonePoints ? h`<span class="small muted">，其中 ${r.standalonePoints} 个独立完整恢复点（手动复制，不参与保留策略）</span>` : ''}</dd>
                <dt>引导</dt><dd>${o.bootable ? `${o.partitionStyle === 'GPT' ? '仅 UEFI' : o.biosBoot ? 'UEFI 与 BIOS' : 'UEFI'} · ${o.bootMedia || ''}${o.bootUpdated ? '（' + dateTime(o.bootUpdated) + '）' : ''}` : '不可引导（用恢复介质启动）'}</dd>
                <dt>保留</dt><dd>${o.keepAll ? h`<span class="tag brand">永久保留</span> <span class="small muted">不自动合并或删除</span>` : h`按保留策略 <span class="small muted">（${retentionShort(o.retention)}）</span>`}</dd>
                <dt>自动</dt><dd>${o.autoBackup ? '连接后自动备份' : '连接后不自动备份'} · ${o.autoEject ? '完成后自动弹出' : '完成后不弹出'}</dd>
              </dl>
            </div>
            ${rows.length ? h`<div style="overflow-x:auto;margin-top:18px;border:1px solid var(--line);border-radius:9px"><table class="table">
              <thead><tr><th>计算机</th><th>来源</th><th>离线盘上最新</th><th>状态</th><th class="num">盘上恢复点</th></tr></thead>
              <tbody>${rows.map((x) => h`<tr>
                <td><b>${x.name}</b>${x.archived ? h` <span class="tag">已归档</span>` : ''}</td>
                <td>${SOURCE_NAMES[x.source] || x.source}${x.source === 'Agent' && x.archived ? h`<br><small style="color:var(--danger)">已归档，无法直接备份</small>` : ''}</td>
                <td class="nowrap">${x.latestOnDrive ? dateTime(x.latestOnDrive, true) : h`<span class="faint">—</span>`}</td>
                <td>${freshness(x)}</td>
                <td class="num">${x.points}${x.standalone ? h`<br><small class="muted">${x.standalone} 个独立</small>` : ''}</td></tr>`)}</tbody></table></div>` : ''}
          </div></section>`;
      })}</div>`
        : h`<section class="panel"><div class="empty">${icon('repo', 30)}<h3>还没有离线盘</h3><p>把一块移动硬盘连接到 Core 服务器，然后新建离线盘：可以初始化整块 USB 磁盘（可引导），也可以使用现有的 NTFS 卷（盘上现有的文件不会被删除）。</p>${can('admin') ? h`<button class="btn primary" data-action="offlineCreate">${icon('plus')}新建离线盘</button>` : ''}</div></section>`}`;
  }

  // Estimate box shared by the backup and copy dialogs: per item what the drive would have to store.
  function estimateView(result, labels) {
    if (!result) return h`<div class="small muted">正在估算需要写入的数据…</div>`;
    if (result.error) return h`<div class="callout err">${icon('error')}<div>${result.error}</div></div>`;
    const short = result.diskFree && result.bytes > result.diskFree;
    return h`<div class="${'callout ' + (short ? 'err' : result.items.some((i) => i.problem) ? 'warn' : 'ok')}">${icon(short ? 'error' : 'info')}<div>
      预计新增约 <b>${bytes(result.bytes)}</b>${result.unknown ? '（不含从计算机直接备份的部分）' : ''}，离线盘可用 ${bytes(result.diskFree)}。${short ? h`<br><b>空间不足</b>：请减少项目、删除离线盘上不需要的恢复点，或换一块更大的盘。` : ''}
      ${result.items.filter((i) => i.problem || i.upToDate).map((i) => h`<br><span class="small">${labels(i)}：${i.problem || i.note}</span>`)}</div></div>`;
  }

  // "Back up now": what this run writes, per registered machine. Defaults come from the drive's "backup content".
  async function backupDialog(ctx, drive) {
    const rows = (drive.offlineMachines || []).map((x) => ({ ...x, on: true, mode: x.archived && x.source === 'Agent' ? 'Repository' : x.source, pointId: null, points: null }));
    const o = drive.offline || {};
    let estimate = null, timer = null, serial = 0;
    const m = R.modal({
      title: `立即备份 · ${drive.name}`, wide: true,
      body: h`<div id="ob-body"></div>`,
      foot: h`<label class="check left" style="margin:0"><input type="checkbox" id="ob-eject" ${o.autoEject ? 'checked' : ''}><span>完成后弹出</span></label><button class="btn" data-close>取消</button><button class="btn primary" data-save>开始备份</button>`
    });
    const body = m.el.querySelector('#ob-body');
    const save = m.el.querySelector('[data-save]');
    const items = () => rows.filter((x) => x.on).map((x) => x.mode === 'Pick' ? { machineId: x.id, pointId: x.pointId } : { machineId: x.id, source: x.mode });
    const label = (i) => (rows.find((x) => x.id === i.machineId) || {}).name || i.machineName;
    function render() {
      body.innerHTML = String(h`
        <p class="muted" style="margin-top:0">选择这次写入离线盘的内容。“复制存储库中的最新恢复点”直接从 Core 上的存储库读取，不连接计算机，已归档的计算机也可以；“指定恢复点”会在离线盘上写成独立的完整恢复点，不依赖盘上的其他恢复点，也不参与保留策略。</p>
        ${rows.length ? h`<div style="border:1px solid var(--line);border-radius:9px;overflow:hidden"><table class="table"><thead><tr><th class="pick"></th><th>计算机</th><th style="width:46%">来源</th><th class="num">预计写入</th></tr></thead><tbody>
          ${rows.map((x, i) => {
            // Estimate items come back in request order: the n-th checked row.
            const est = x.on && estimate && estimate.items ? estimate.items[rows.filter((y) => y.on).indexOf(x)] : null;
            return h`<tr>
              <td class="pick"><input type="checkbox" data-row="${i}" data-field="on" ${x.on ? 'checked' : ''} aria-label="${'备份 ' + x.name}"></td>
              <td><b>${x.name}</b>${x.archived ? h` <span class="tag">已归档</span>` : ''}<br><small class="muted">离线盘上最新：${x.latestOnDrive ? dateTime(x.latestOnDrive, true) : '—'}</small></td>
              <td><select class="input" data-row="${i}" data-field="mode" ${x.on ? '' : 'disabled'}>
                  <option value="Repository" ${x.mode === 'Repository' ? 'selected' : ''}>存储库中的最新恢复点${x.latestInRepository ? '（' + dateTime(x.latestInRepository) + '）' : ''}</option>
                  <option value="Pick" ${x.mode === 'Pick' ? 'selected' : ''}>指定恢复点（写成独立的完整恢复点）…</option>
                  <option value="Agent" ${x.mode === 'Agent' ? 'selected' : ''} ${x.archived ? 'disabled' : ''}>从计算机直接备份${x.archived ? '（已归档，不可用）' : ''}</option></select>
                ${x.mode === 'Pick' && x.on ? (x.points ? h`<select class="input" style="margin-top:6px" data-row="${i}" data-field="pointId">${x.points.length ? x.points.map((p) => h`<option value="${p.id}" ${p.id === x.pointId ? 'selected' : ''}>${dateTime(p.created, true)} · ${p.scope === 'Files' ? '文件级' : p.kind === 'Base' ? '基准' : '增量'} · ${p.repositoryName}</option>`) : h`<option value="">没有可复制的恢复点</option>`}</select>` : h`<div class="small muted" style="margin-top:6px">正在读取恢复点…</div>`) : ''}</td>
              <td class="num">${!x.on ? h`<span class="faint">—</span>` : !est ? h`<span class="faint">…</span>` : est.problem ? h`<span style="color:var(--danger)" title="${est.problem}">无法备份</span>` : est.upToDate ? h`<span class="muted">已是最新</span>` : est.bytes == null ? h`<span class="muted" title="${est.note}">无法预估</span>` : bytes(est.bytes)}</td></tr>`;
          })}</tbody></table></div>` : h`<div class="callout warn">${icon('warn')}<div>还没有登记要备份到这块盘的计算机。管理员可以在“备份内容”中选择，也可以在“恢复点”页面勾选恢复点复制到这块盘。</div></div>`}
        <div style="margin-top:14px">${items().length ? estimateView(estimate, label) : ''}</div>`);
      const list = items();
      save.disabled = !list.length || list.some((i) => i.pointId === null) || !!(estimate && estimate.diskFree && estimate.bytes > estimate.diskFree);
    }
    function refresh() {
      clearTimeout(timer);
      estimate = null; render();
      const list = items();
      if (!list.length || list.some((i) => i.pointId === null)) return;
      const mine = ++serial;
      timer = setTimeout(async () => {
        try { const r = await R.api.post(`/offline/${drive.id}/estimate`, { items: list }); if (mine === serial) { estimate = r; render(); } }
        catch (err) { if (mine === serial) { estimate = { error: err.message }; render(); } }
      }, 250);
    }
    body.addEventListener('change', async (e) => {
      const t = e.target.closest('[data-row]');
      if (!t) return;
      const x = rows[Number(t.dataset.row)];
      if (t.dataset.field === 'on') x.on = t.checked;
      else if (t.dataset.field === 'mode') x.mode = t.value;
      else if (t.dataset.field === 'pointId') x.pointId = t.value || null;
      if (x.mode === 'Pick' && !x.points) {
        x.pointId = null; render();
        try { x.points = (await R.api.get(`/points?machineId=${encodeURIComponent(x.id)}&limit=500`)).filter((p) => p.repositoryKind !== 'Offline'); }
        catch (err) { x.points = []; R.toast(err.message, 'err'); }
        x.pointId = x.points[0] ? x.points[0].id : null;
      }
      refresh();
    });
    refresh();
    save.addEventListener('click', async () => {
      save.disabled = true; save.textContent = '请稍候…';
      try {
        await R.api.post(`/offline/${drive.id}/sync`, { items: items(), eject: m.el.querySelector('#ob-eject').checked });
        m.close(); R.toast('离线备份已开始，进度见“任务”'); ctx.reload();
      } catch (err) { R.toast(err.message, 'err'); save.disabled = false; save.textContent = '开始备份'; }
    });
  }

  // Recovery points page → "copy to offline drive": every point becomes a standalone complete base on the drive.
  async function copyDialog(points) {
    let drives = [];
    try { drives = (await R.api.get('/repositories')).filter((r) => r.kind === 'Offline'); } catch (err) { R.toast(err.message, 'err'); return false; }
    const online = drives.filter((r) => r.status === 'Online');
    return new Promise((resolve) => {
      let done = false, estimate = null, serial = 0;
      const m = R.modal({
        title: `复制到离线盘（${points.length} 个恢复点）`, wide: true,
        onClose: () => resolve(done),
        body: h`<form id="oc-form">
          <p class="muted" style="margin-top:0">每个恢复点在离线盘上写成<b>独立的完整恢复点</b>：包含所有卷的完整数据，不依赖之前的基准或增量，单独即可恢复；以后的离线备份不会接着它写，保留策略也不会合并或删除它，需要时在“恢复点”页面手动删除。已在盘上的数据块不会重复写入。</p>
          ${online.length ? h`<div class="field"><label>离线盘</label><select class="input" name="drive">${online.map((r) => h`<option value="${r.id}">${r.name} · ${bytes(r.diskFree)} 可用</option>`)}</select></div>`
            : h`<div class="callout warn">${icon('warn')}<div>${drives.length ? `没有已连接的离线盘（${drives.map((r) => r.name).join('、')} 都未连接）。请把离线盘连接到 Core 服务器后重试。` : '还没有离线盘。请先在“存储库”页面新建离线盘。'}</div></div>`}
          <div style="border:1px solid var(--line);border-radius:9px;overflow:hidden;max-height:260px;overflow-y:auto;margin-bottom:14px"><table class="table"><thead><tr><th>计算机</th><th>恢复点</th><th>存储库</th><th class="num">预计写入</th></tr></thead><tbody id="oc-rows"></tbody></table></div>
          <div id="oc-estimate"></div>
          <label class="check"><input type="checkbox" name="eject"><span>完成后弹出离线盘<small>还要继续往这块盘复制或备份时不要勾选。</small></span></label>
        </form>`,
        foot: h`<button class="btn" data-close>取消</button><button class="btn primary" data-save ${online.length ? '' : 'disabled'}>开始复制</button>`
      });
      const form = m.el.querySelector('#oc-form');
      const save = m.el.querySelector('[data-save]');
      const label = (i) => `${i.machineName || ''} ${i.created ? dateTime(i.created, true) : ''}`;
      function render() {
        form.querySelector('#oc-rows').innerHTML = String(h`${points.map((p) => {
          const est = estimate && estimate.items ? estimate.items.find((e) => e.pointId === p.id) : null;
          return h`<tr><td><b>${p.machineName}</b></td><td class="nowrap">${dateTime(p.created, true)} <span class="tag">${p.scope === 'Files' ? '文件级' : p.kind === 'Base' ? '基准' : '增量'}</span></td><td>${p.repositoryName}</td>
            <td class="num">${!online.length ? '—' : !est ? h`<span class="faint">…</span>` : est.problem ? h`<span style="color:var(--danger)">${est.problem}</span>` : est.upToDate ? h`<span class="muted">已在盘上</span>` : bytes(est.bytes)}</td></tr>`;
        })}`);
        form.querySelector('#oc-estimate').innerHTML = online.length ? String(estimateView(estimate, label)) : '';
        save.disabled = !online.length || !estimate || !!estimate.error || estimate.items.every((i) => i.upToDate || i.problem) || !!(estimate.diskFree && estimate.bytes > estimate.diskFree);
      }
      async function refresh() {
        if (!online.length) { render(); return; }
        estimate = null; render();
        const mine = ++serial;
        const id = R.formData(form).drive;
        try { const r = await R.api.post(`/offline/${id}/estimate`, { items: points.map((p) => ({ machineId: p.machineId, pointId: p.id })) }); if (mine === serial) { estimate = r; render(); } }
        catch (err) { if (mine === serial) { estimate = { error: err.message }; render(); } }
      }
      const select = form.querySelector('[name=drive]');
      if (select) select.addEventListener('change', refresh);
      refresh();
      save.addEventListener('click', async () => {
        const f = R.formData(form);
        save.disabled = true; save.textContent = '请稍候…';
        try {
          await R.api.post(`/offline/${f.drive}/copy`, { pointIds: points.map((p) => p.id), eject: f.eject });
          done = true; m.close(); R.toast('已开始复制到离线盘，进度见“任务”');
        } catch (err) { R.toast(err.message, 'err'); save.disabled = false; save.textContent = '开始复制'; }
      });
    });
  }

  // "Backup content": which machines the drive holds and where each one's routine offline backup comes from.
  async function contentDialog(ctx, drive) {
    let machines = [];
    try { machines = (await R.api.get('/machines')).filter((x) => x.pointCount > 0 || !x.archived); } catch (err) { R.toast(err.message, 'err'); return; }
    const o = drive.offline || {};
    const chosen = new Set(o.machines || []);
    const sources = Object.assign({}, o.sources || {});
    const m = R.modal({
      title: `备份内容 · ${drive.name}`, wide: true,
      body: h`<form id="oc-content">
        <p class="muted" style="margin-top:0">勾选要备份到这块盘的计算机，并选择每台计算机的来源。连接后自动备份和“立即备份”都按这里的设置执行。</p>
        <div class="callout">${icon('info')}<div><b>复制存储库中的最新恢复点</b>（推荐）：从 Core 上的存储库读取并逐块校验，不连接计算机、不占用生产机资源，已归档的计算机也可以；离线盘上与主存储库是同一时间点。<br><b>从计算机直接备份</b>：在计算机上重新做一次快照，数据不经过主存储库；主存储库损坏时也不受影响，但计算机必须在线。</div></div>
        ${machines.length ? h`<div style="border:1px solid var(--line);border-radius:9px;overflow:hidden"><table class="table"><thead><tr><th class="pick"></th><th>计算机</th><th style="width:50%">来源</th></tr></thead><tbody>
          ${machines.map((x) => h`<tr><td class="pick"><input type="checkbox" data-machine="${x.id}" ${chosen.has(x.id) ? 'checked' : ''} aria-label="${x.name}"></td>
            <td><b>${x.name}</b>${x.archived ? h` <span class="tag">已归档</span>` : ''}<br><small class="muted">${x.pointCount} 个恢复点${x.repositoryName ? ' · ' + x.repositoryName : ''}</small></td>
            <td><select class="input" data-source="${x.id}"><option value="Repository">${SOURCE_NAMES.Repository}</option><option value="Agent" ${(sources[x.id] === 'Agent') ? 'selected' : ''} ${x.archived ? 'disabled' : ''}>${SOURCE_NAMES.Agent}${x.archived ? '（已归档）' : ''}</option></select></td></tr>`)}
        </tbody></table></div>` : h`<div class="muted small">还没有计算机。</div>`}
      </form>`,
      foot: h`<button class="btn" data-close>取消</button><button class="btn primary" data-save>保存</button>`
    });
    m.el.querySelector('[data-save]').addEventListener('click', async (e) => {
      const form = m.el.querySelector('#oc-content');
      const picked = Array.from(form.querySelectorAll('[data-machine]')).filter((x) => x.checked).map((x) => x.dataset.machine);
      const map = {};
      picked.forEach((id) => { map[id] = form.querySelector(`[data-source="${id}"]`).value; });
      e.target.disabled = true;
      try { await R.api.put('/offline/' + drive.id, { machines: picked, sources: map }); m.close(); R.toast('备份内容已保存'); ctx.reload(); }
      catch (err) { R.toast(err.message, 'err'); e.target.disabled = false; }
    });
  }

  async function offlineDialog(ctx, drive) {
    const edit = !!drive;
    let volumes = [], disks = [], media = [], machines = [];
    // Listing the USB disks runs PowerShell storage queries on Core and can take a few seconds: show the dialog at once and
    // load everything in parallel.
    let cancelled = false;
    const loading = R.modal({ title: edit ? `离线盘设置 · ${drive.name}` : '新建离线盘', wide: !edit,
      body: h`<div class="empty small">${edit ? '正在读取…' : '正在检测 Core 服务器上的磁盘…'}</div>`, onClose: () => { cancelled = true; } });
    try {
      [machines, media, disks, volumes] = await Promise.all([R.api.get('/machines'), edit ? [] : R.api.get('/media'),
        edit ? [] : R.api.get('/offline/disks'), edit ? [] : R.api.get('/offline/volumes')]);
    } catch (err) { if (!cancelled) { loading.close(); R.toast(err.message, 'err'); } return; }
    if (cancelled) return;
    machines = machines.filter((x) => !x.archived);
    media = media.filter((x) => x.status === 'Ready');
    const o = edit ? (drive.offline || {}) : { machines: [], autoBackup: true, autoEject: true };
    const chosen = o.machines || [];
    const usableVolumes = volumes.filter((v) => v.usable);
    const usableDisks = disks.filter((d) => d.usable);
    let mode = edit ? 'edit' : usableDisks.length || !usableVolumes.length ? 'disk' : 'volume';
    const m = R.modal({
      title: edit ? `离线盘设置 · ${drive.name}` : '新建离线盘',
      wide: !edit,
      body: h`<form id="od-form">
        ${edit ? '' : h`<div class="field"><span class="label">方式</span><div class="seg">
          <button type="button" data-mode="disk" class="${mode === 'disk' ? 'on' : ''}">初始化整块 USB 磁盘（可引导，推荐）</button>
          <button type="button" data-mode="volume" class="${mode === 'volume' ? 'on' : ''}">使用现有 NTFS 卷（保留数据，不可引导）</button></div></div>`}
        <div class="field"><label>名称</label><input class="input" name="name" value="${edit ? drive.name : ''}" placeholder="例如 离线盘 A"></div>
        ${edit ? '' : h`
        <div id="od-disk">
          <div class="field"><label>Core 服务器上的 USB 磁盘</label>
            ${disks.length ? h`<select class="input" name="disk">${disks.map((d) => h`<option value="${d.number}" ${d.usable ? '' : 'disabled'}>磁盘 ${d.number} · ${d.friendlyName} · ${bytes(d.size)} · ${d.busType}${d.roots.length ? ' · ' + d.roots.join(' ') : ''}${d.reason ? ' · ' + d.reason : ''}</option>`)}</select>`
              : h`<div class="callout warn" style="margin-top:0">${icon('warn')}<div>没有找到 USB 磁盘。请把移动硬盘连接到 Core 服务器后重试。</div></div>`}
            <span class="hint" id="od-disk-hint"></span></div>
          <div class="field"><label>写入的恢复介质</label>
            ${media.length ? h`<select class="input" name="media">${media.map((x) => h`<option value="${x.id}">${x.name} · ${bytes(x.size)} · ${dateTime(x.created)}</option>`)}</select>`
              : h`<div class="callout warn" style="margin-top:0">${icon('warn')}<div>还没有可用的恢复介质。请先在 <a href="#/media">恢复介质</a> 页面生成一个，再回来初始化离线盘。</div></div>`}
            <span class="hint">磁盘上会建一个 4 GB 的启动分区放恢复环境，其余空间为 NTFS 数据分区。从这块盘启动计算机即可直接恢复，不需要 Core 和网络。</span></div>
        </div>
        <div id="od-volume">
          <div class="field"><label>Core 服务器上的卷</label>
            ${volumes.length ? h`<select class="input" name="root">${volumes.map((v) => h`<option value="${v.root}" ${v.usable ? '' : 'disabled'}>${v.root} ${v.label || ''} · ${bytes(v.free)} 可用 / ${bytes(v.size)}${v.usable && v.existing ? ' · 已有离线存储库，可重新登记' : ''}${v.reason ? ' · ' + v.reason : ''}</option>`)}</select>` : h`<div class="callout warn" style="margin-top:0">${icon('warn')}<div>没有找到可用的卷。请把 NTFS 格式的移动硬盘连接到 Core 服务器后重试。</div></div>`}
            <span class="hint">存储库放在盘上的 BareTurnOffline 目录，现有文件不会被删除。这种盘不能直接引导：恢复时用恢复介质 U 盘启动，恢复控制台会找到这块盘。</span></div>
        </div>
        <div class="field"><label id="od-pass-label">加密口令</label><input class="input" name="passphrase" type="password" autocomplete="new-password"><span class="hint" id="od-pass-hint"></span></div>
        <div class="field" id="od-confirm"><label>确认口令</label><input class="input" name="confirm" type="password" autocomplete="new-password"></div>`}
        ${edit ? '' : h`<div class="field"><span class="label">备份到这块盘的计算机</span>
          ${machines.length ? machines.map((x) => h`<label class="check"><input type="checkbox" data-machine="${x.id}" ${chosen.includes(x.id) ? 'checked' : ''}><span>${x.name}<small>${x.osName || ''}</small></span></label>`) : h`<div class="muted small">还没有受保护的计算机。可以先创建离线盘，之后在“备份内容”中选择。</div>`}
          <span class="hint">默认复制存储库中的最新恢复点（不需要计算机在线）。创建后可以在“备份内容”中为每台计算机改为从计算机直接备份。</span></div>`}
        <label class="check"><input type="checkbox" name="autoBackup" ${o.autoBackup ? 'checked' : ''}><span>连接后自动开始备份<small>盘连接到 Core 服务器并被识别后立即开始；一小时内刚备份过则不重复。</small></span></label>
        <label class="check"><input type="checkbox" name="autoEject" ${o.autoEject ? 'checked' : ''}><span>备份完成后自动弹出<small>卸载卷并请求 Windows 弹出设备，之后可以直接拔出。</small></span></label>
        <div class="field"><span class="label">保留方式</span><div class="choice" id="od-keep">
          <label class="${o.keepAll ? '' : 'on'}"><input type="radio" name="keep" value="policy" ${o.keepAll ? '' : 'checked'}><span><strong>按保留策略合并旧恢复点</strong><small>适合频繁轮换的盘：近期的版本保留得密，越早越稀，旧版本合并到较新的恢复点中，盘不会被写满。</small></span></label>
          <label class="${o.keepAll ? 'on' : ''}"><input type="radio" name="keep" value="all" ${o.keepAll ? 'checked' : ''}><span><strong>永久保留（长期存档）</strong><small>不自动合并或删除任何恢复点，每次备份都作为一个版本留在盘上，需要时手动删除。盘会逐渐写满：空间不够时这次备份失败，盘上已有的数据不受影响。</small></span></label>
        </div></div>
        ${edit ? h`
        <div class="row">
          <div class="field"><label>超过多少天未离线备份时提醒</label><input class="input" type="number" name="reminderDays" min="0" max="365" value="${o.reminderDays ?? 7}"><span class="hint">0 = 不提醒</span></div>
          <div class="field"><label>连续连接超过多少小时时提醒</label><input class="input" type="number" name="maxConnectedHours" min="0" max="720" value="${o.maxConnectedHours ?? 24}"><span class="hint">0 = 不提醒</span></div>
        </div>
        <div class="field" id="od-policy" style="${o.keepAll ? 'display:none' : ''}"><span class="label">离线盘上的保留策略</span><span class="hint" style="margin-top:0">每次离线备份结束后按此合并旧恢复点。手动复制的独立完整恢复点不受影响。</span>
          <div class="row" style="margin-top:8px">${[['keepAllHours', '保留全部（小时）', 8760], ['hourlyDays', '之后每小时 1 个（天）', 365], ['dailyDays', '之后每天 1 个（天）', 3650], ['weeklyWeeks', '之后每周 1 个（周）', 520], ['monthlyMonths', '之后每月 1 个（月）', 240]]
            .map(([k, text, max]) => h`<div class="field"><label>${text}</label><input class="input" type="number" name="${'ret_' + k}" min="${k === 'keepAllHours' ? 1 : 0}" max="${max}" value="${(o.retention || {})[k] ?? 0}"></div>`)}</div></div>` : ''}
        ${edit ? '' : h`<div id="od-erase"><div class="callout err">${icon('warn')}<div id="od-erase-text">所选磁盘上的全部分区和数据都会被永久清除。</div></div>
          <div class="field"><label>输入 ERASE 以确认</label><input class="input mono" name="erase" style="width:200px" autocomplete="off"></div></div>`}
      </form>`,
      foot: h`<button class="btn" data-close>取消</button><button class="btn primary" data-save>${edit ? '保存' : '创建离线盘'}</button>`
    });
    loading.close(); // the dialog with the data is already on top: no flash of the page behind
    const form = m.el.querySelector('#od-form');
    const save = m.el.querySelector('[data-save]');
    form.querySelectorAll('input[name=keep]').forEach((r) => r.addEventListener('change', () => {
      form.querySelectorAll('#od-keep label').forEach((l) => l.classList.toggle('on', l.querySelector('input').checked));
      const policy = form.querySelector('#od-policy');
      if (policy) policy.style.display = r.value === 'all' && r.checked ? 'none' : '';
    }));
    const $ = (sel) => form.querySelector(sel);
    const volumeSelect = $('[name=root]');
    const diskSelect = $('[name=disk]');
    const existing = () => { const v = mode === 'volume' && volumeSelect && volumes.find((x) => x.root === volumeSelect.value); return !!(v && v.existing); };
    const label = () => (edit ? '保存' : mode === 'disk' ? '清除并初始化' : existing() ? '登记此离线盘' : '创建离线盘');
    function refresh() {
      if (edit) return;
      const attach = existing();
      $('#od-disk').style.display = mode === 'disk' ? '' : 'none';
      $('#od-volume').style.display = mode === 'volume' ? '' : 'none';
      $('#od-erase').style.display = mode === 'disk' ? '' : 'none';
      $('#od-confirm').style.display = attach ? 'none' : '';
      $('#od-pass-label').textContent = attach ? '这块盘现有的加密口令' : '加密口令';
      $('#od-pass-hint').textContent = attach ? '这块盘上已有离线存储库。输入创建时设置的口令即可重新登记，并导入盘上的恢复点。'
        : '离线盘必须加密，至少 12 个字符。从这块盘恢复时需要输入口令；口令不保存在恢复环境中，丢失后盘上的备份无法读取，请单独妥善保管。';
      const d = diskSelect && disks.find((x) => String(x.number) === diskSelect.value);
      if (d) {
        $('#od-disk-hint').textContent = (d.style === 'GPT' ? '磁盘大于 2 TB，将使用 GPT 分区表：只能在 UEFI 模式下引导。' : '将使用 MBR 分区表：UEFI 与 BIOS（传统）模式都能引导。') + (d.hasBootPartition ? '这块盘以前初始化过；重新初始化会清除上面的离线备份。' : '');
        $('#od-erase-text').textContent = `磁盘 ${d.number}（${d.friendlyName}，${bytes(d.size)}${d.serialNumber ? '，序列号 ' + d.serialNumber : ''}）上的全部分区和数据都会被永久清除。`;
      }
      save.textContent = label();
      save.disabled = mode === 'disk' ? !usableDisks.length || !media.length : !usableVolumes.length;
    }
    if (volumeSelect && usableVolumes[0]) volumeSelect.value = usableVolumes[0].root;
    if (diskSelect && usableDisks[0]) diskSelect.value = String(usableDisks[0].number);
    if (volumeSelect) volumeSelect.addEventListener('change', refresh);
    if (diskSelect) diskSelect.addEventListener('change', refresh);
    form.addEventListener('click', (e) => {
      const b = e.target.closest('[data-mode]');
      if (!b) return;
      mode = b.dataset.mode;
      form.querySelectorAll('[data-mode]').forEach((x) => x.classList.toggle('on', x === b));
      refresh();
    });
    refresh();
    save.addEventListener('click', async () => {
      const f = R.formData(form);
      const picked = Array.from(form.querySelectorAll('[data-machine]')).filter((x) => x.checked).map((x) => x.dataset.machine);
      if (!edit && !existing() && f.passphrase !== f.confirm) { R.toast('两次输入的口令不一致。', 'err'); return; }
      if (mode === 'disk' && (f.erase || '').trim().toUpperCase() !== 'ERASE') { R.toast('请输入 ERASE 确认清除整块磁盘。', 'err'); return; }
      save.disabled = true; save.textContent = '请稍候…';
      try {
        if (edit) {
          const retention = {};
          ['keepAllHours', 'hourlyDays', 'dailyDays', 'weeklyWeeks', 'monthlyMonths'].forEach((k) => { retention[k] = f['ret_' + k] || (k === 'keepAllHours' ? 1 : 0); });
          await R.api.put('/offline/' + drive.id, { name: f.name, autoBackup: f.autoBackup, autoEject: f.autoEject, reminderDays: f.reminderDays || 0, maxConnectedHours: f.maxConnectedHours || 0, retention, keepAll: f.keep === 'all' });
          m.close(); R.toast('离线盘设置已保存');
        } else if (mode === 'disk') {
          const d = disks.find((x) => String(x.number) === f.disk);
          await R.api.post('/offline/prepare', { name: f.name, diskNumber: d.number, uniqueId: d.uniqueId, mediaId: f.media, passphrase: f.passphrase, machines: picked, autoBackup: f.autoBackup, autoEject: f.autoEject, keepAll: f.keep === 'all', confirm: 'ERASE' });
          m.close(); R.toast('正在初始化离线盘（约需几分钟），进度见“任务”');
        } else {
          const attach = existing();
          const result = await R.api.post('/offline', { name: f.name, root: f.root, passphrase: f.passphrase, machines: picked, autoBackup: f.autoBackup, autoEject: f.autoEject, keepAll: f.keep === 'all', attach });
          m.close(); R.toast(attach ? `已登记，导入 ${result.imported} 个恢复点` : '离线盘已创建。点击“立即备份”创建第一个基准恢复点。');
        }
        ctx.reload();
      } catch (err) { R.toast(err.message, 'err'); save.disabled = false; save.textContent = label(); }
    });
  }

  async function bootDialog(ctx, drive) {
    let media = [];
    try { media = (await R.api.get('/media')).filter((x) => x.status === 'Ready'); } catch (err) { R.toast(err.message, 'err'); return; }
    const o = drive.offline || {};
    const m = R.modal({
      title: `更新启动环境 · ${drive.name}`,
      body: h`<form id="ob-form">
        <p class="muted" style="margin-top:0">把所选恢复介质重新写入离线盘的启动分区。升级 Core、在介质中加入驱动后，建议更新每块离线盘。盘上的备份不受影响。</p>
        <dl class="kv"><dt>当前</dt><dd>${o.bootMedia || '—'}${o.bootUpdated ? '（' + dateTime(o.bootUpdated) + '）' : ''}</dd></dl>
        <div class="field"><label>恢复介质</label>${media.length ? h`<select class="input" name="media">${media.map((x) => h`<option value="${x.id}">${x.name} · ${bytes(x.size)} · ${dateTime(x.created)}</option>`)}</select>` : h`<div class="callout warn" style="margin-top:0">${icon('warn')}<div>还没有可用的恢复介质，请先在 <a href="#/media">恢复介质</a> 页面生成。</div></div>`}</div>
      </form>`,
      foot: h`<button class="btn" data-close>取消</button><button class="btn primary" data-save ${media.length ? '' : 'disabled'}>写入</button>`
    });
    m.el.querySelector('[data-save]').addEventListener('click', async (e) => {
      e.target.disabled = true;
      try { await R.api.post(`/offline/${drive.id}/boot`, { mediaId: R.formData(m.el.querySelector('#ob-form')).media }); m.close(); R.toast('正在写入启动环境，进度见“任务”'); ctx.reload(); }
      catch (err) { R.toast(err.message, 'err'); e.target.disabled = false; }
    });
  }

  // onDone(result) replaces the page reload when the dialog is opened from elsewhere (protect wizard).
  function repoDialog(mode, ctx, onDone) {
    const create = mode === 'create';
    const okLabel = create ? '创建存储库' : '连接并导入';
    const m = R.modal({
      title: create ? '新建存储库' : '连接现有存储库',
      body: h`<form id="repo-form">
        <div class="field"><label>名称</label><input class="input" name="name" placeholder="例如 主存储库"></div>
        <div class="field"><span class="label">位置</span><div class="choice" id="rp-kind">
          <label class="on"><input type="radio" name="kind" value="Fixed" checked><span><strong>Core 服务器本地磁盘</strong><small>独立的 NTFS / ReFS 数据卷，速度最快</small></span></label>
          <label><input type="radio" name="kind" value="Network"><span><strong>网络共享（SMB）</strong><small>NAS 或文件服务器上的共享文件夹，Core 用指定账户访问（需要 SMB 2 或更高版本）</small></span></label>
        </div></div>
        <div class="field"><label id="rp-path-label">Core 服务器上的路径</label><input class="input mono" name="path" id="rp-path" placeholder="D:\\BareTurnRepository" autocomplete="off"><span class="hint" id="rp-path-hint"></span></div>
        <div id="rp-net" style="display:none">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <div class="field"><label>用户名</label><input class="input" name="userName" autocomplete="off" placeholder="例如 bareturn 或 CORP\\backup"></div>
            <div class="field"><label>密码</label><input class="input" name="password" type="password" autocomplete="new-password"></div>
          </div>
          <div class="small muted" style="margin:-6px 0 12px">NAS 本地账户直接填用户名，域账户填 域\\用户名。留空则以 Core 服务器的计算机账户访问（仅域环境，需在共享上授权 域\\计算机名$）。密码用本机 DPAPI 加密保存，不会显示在控制台。</div>
          <div style="display:flex;gap:10px;align-items:center"><button type="button" class="btn sm" data-test>${icon('link')}测试连接</button><span class="small muted" id="rp-test-state"></span></div>
          <div id="rp-test"></div>
          ${create ? h`<div class="callout">${icon('info')}<div>NAS 与 Core 同时在线，能访问 Core 的勒索软件也可能删改共享上的文件。建议为 BareTurn 建一个专用账户、只授权这一个共享，开启 NAS 的快照功能，并继续用离线盘保存一份离线副本。</div></div>` : ''}
        </div>
        ${create ? h`<label class="check"><input type="checkbox" name="encrypt" id="rp-enc" checked><span>加密存储库（AES-256-GCM）<small>口令用于派生密钥。Core 会以本机 DPAPI 保存解锁后的密钥；重装 Core 后连接存储库时需要再次输入口令。存储库放在 NAS 上时强烈建议加密。</small></span></label>` : ''}
        <div class="field" id="rp-pass"><label>${create ? '加密口令' : '加密口令（如果存储库已加密）'}</label><input class="input" name="passphrase" type="password" autocomplete="new-password">${create ? h`<span class="hint">至少 12 个字符。丢失口令将无法在新 Core 上读取此存储库，请妥善保管。</span>` : ''}</div>
        ${create ? h`<div class="field" id="rp-pass2"><label>确认口令</label><input class="input" name="confirm" type="password" autocomplete="new-password"></div>` : ''}
      </form>`,
      foot: h`<button class="btn" data-close>取消</button><button class="btn primary" data-save>${okLabel}</button>`
    });
    const $ = (sel) => m.el.querySelector(sel);
    const form = $('#repo-form');
    const kind = () => (form.querySelector('input[name=kind]:checked') || {}).value || 'Fixed';
    const hints = {
      Fixed: create ? '目录必须为空或不存在；建议使用独立的 NTFS / ReFS 数据卷，不要放在系统盘。映射的网络驱动器（Z: 等）对 Core 服务不可见，请改选“网络共享”。' : '包含 repository.json 的目录。恢复点会导入到此 Core，原计算机显示为“已归档”。',
      Network: create ? '共享下的一个专用文件夹，不存在时自动创建，已存在则必须为空。不能直接使用共享根目录。' : '共享中包含 repository.json 的文件夹。恢复点会导入到此 Core，原计算机显示为“已归档”。'
    };
    function syncKind() {
      const k = kind();
      form.querySelectorAll('#rp-kind label').forEach((l) => l.classList.toggle('on', l.querySelector('input').checked));
      $('#rp-net').style.display = k === 'Network' ? '' : 'none';
      $('#rp-path-label').textContent = k === 'Network' ? '共享文件夹（UNC 路径）' : 'Core 服务器上的路径';
      $('#rp-path').placeholder = k === 'Network' ? '\\\\nas\\backup\\BareTurn' : 'D:\\BareTurnRepository';
      $('#rp-path-hint').textContent = hints[k];
    }
    form.querySelectorAll('input[name=kind]').forEach((r) => r.addEventListener('change', () => { syncKind(); $('#rp-test').innerHTML = ''; $('#rp-test-state').textContent = ''; }));
    syncKind();
    ['#rp-path', 'input[name=userName]', 'input[name=password]'].forEach((sel) => $(sel).addEventListener('input', () => { $('#rp-test').innerHTML = ''; $('#rp-test-state').textContent = ''; }));
    const enc = $('#rp-enc');
    if (enc) enc.addEventListener('change', () => { ['#rp-pass', '#rp-pass2'].forEach((sel) => { $(sel).style.display = enc.checked ? '' : 'none'; }); });

    function testResult(t) {
      const notes = [];
      let level = t.writable ? 'ok' : 'err';
      if (!t.writable) notes.push(t.problem);
      if (t.registered) { level = 'err'; notes.push('此文件夹中的存储库已经连接到这台 Core。'); }
      else if (create && t.existing) { level = level === 'err' ? level : 'warn'; notes.push('此文件夹中已有 BareTurn 存储库：请改用“连接现有存储库”。'); }
      else if (create && !t.empty) { level = level === 'err' ? level : 'warn'; notes.push('文件夹不为空。新存储库需要空文件夹或尚不存在的文件夹。'); }
      else if (!create && !t.existing) { level = level === 'err' ? level : 'warn'; notes.push('文件夹中没有 BareTurn 存储库（repository.json）。'); }
      else if (!create && t.existing) notes.push(t.encrypted ? '找到已加密的存储库，请输入它的口令。' : '找到未加密的存储库。');
      const space = t.total ? `可用 ${bytes(t.free)} / ${bytes(t.total)}` : '共享未报告容量';
      return h`<div class="${'callout ' + level}">${icon(level === 'ok' ? 'check' : level === 'warn' ? 'warn' : 'error')}<div><b>${t.writable ? '已连接，可以读写' : '已连接，但不能写入'}</b> · ${space}${notes.map((n) => h`<br>${n}`)}</div></div>`;
    }
    $('[data-test]').addEventListener('click', async (e) => {
      const f = R.formData(form);
      const btn = e.currentTarget;
      btn.disabled = true; $('#rp-test-state').textContent = '正在连接…'; $('#rp-test').innerHTML = '';
      try { $('#rp-test').innerHTML = String(testResult(await R.api.post('/repositories/network/test', { path: f.path, userName: f.userName, password: f.password }))); $('#rp-test-state').textContent = ''; }
      catch (err) { $('#rp-test').innerHTML = String(h`<div class="callout err">${icon('error')}<div>${err.message}</div></div>`); $('#rp-test-state').textContent = ''; }
      btn.disabled = false;
    });

    $('[data-save]').addEventListener('click', async (e) => {
      const f = R.formData(form);
      if (create && f.encrypt && f.passphrase !== f.confirm) return R.toast('两次输入的口令不一致。', 'err');
      const network = f.kind === 'Network';
      e.target.disabled = true; e.target.textContent = network ? '正在连接共享…' : '请稍候…';
      try {
        const result = await R.api.post('/repositories', {
          mode, name: f.name, path: f.path, passphrase: create && !f.encrypt ? null : f.passphrase || null,
          kind: f.kind, userName: network ? f.userName || null : null, password: network ? f.password || null : null
        });
        m.close(); R.toast(create ? '存储库已创建' : `已连接，导入 ${result.imported} 个恢复点`); onDone ? onDone(result) : ctx.reload();
      } catch (err) { R.toast(err.message, 'err'); e.target.disabled = false; e.target.textContent = okLabel; }
    });
  }

  R.repoDialog = (onDone) => repoDialog('create', null, onDone);

  // Account a network repository connects with (e.g. after the password was changed on the NAS).
  function renameDialog(ctx, r) {
    const m = R.modal({
      title: '重命名存储库',
      body: h`<form id="rename-form">
        <div class="field"><label for="repo-name">名称</label><input class="input" id="repo-name" name="name" value="${r.name}" maxlength="64" required autocomplete="off"><span class="hint">只修改控制台中显示的名称，存储库中的数据和路径不变。</span></div>
      </form>`,
      foot: h`<button class="btn" data-close>取消</button><button class="btn primary" data-save>保存</button>`
    });
    const input = m.el.querySelector('#repo-name');
    input.focus(); input.select();
    const save = async () => {
      const name = input.value.trim();
      if (!name) { R.toast('请输入名称', 'err'); return; }
      if (name === r.name) { m.close(); return; }
      const button = m.el.querySelector('[data-save]'); button.disabled = true;
      try { await R.api.put(`/repositories/${r.id}/name`, { name }); m.close(); R.toast('已重命名'); ctx.reload(); }
      catch (err) { R.toast(err.message, 'err'); button.disabled = false; }
    };

  async function copyToClipboard(text) {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return; }
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    if (!ok) throw new Error('copy failed');
  }

  function downloadAdkScript() {
    const lines = [
      '#Requires -RunAsAdministrator',
      '# BareTurn Core 恢复介质构建组件部署脚本（Windows ADK Deployment Tools + WinPE 加载项）',
      '# 用法：在 Core 服务器上以管理员身份运行 PowerShell 执行此脚本。',
      '#       离线部署时，请将 adksetup.exe / adkwinpesetup.exe（或 ADK\\、WinPE\\ 离线目录）放在本脚本同级目录后运行。',
      '$ErrorActionPreference = "Stop"',
      '',
      'function Get-AdkStatus {',
      '    $candidates = @()',
      '    foreach ($k in "HKLM:\\SOFTWARE\\Microsoft\\Windows Kits\\Installed Roots", "HKLM:\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows Kits\\Installed Roots") {',
      '        $v = (Get-ItemProperty -LiteralPath $k -ErrorAction SilentlyContinue).KitsRoot10',
      '        if ($v) { $candidates += Join-Path $v "Assessment and Deployment Kit" }',
      '    }',
      '    if (${env:ProgramFiles(x86)}) { $candidates += Join-Path ${env:ProgramFiles(x86)} "Windows Kits\\10\\Assessment and Deployment Kit" }',
      '    $hasTools = $false; $hasWinPe = $false; $root = $null',
      '    foreach ($c in ($candidates | Select-Object -Unique)) {',
      '        $t = Test-Path -LiteralPath (Join-Path $c "Deployment Tools\\amd64\\Oscdimg\\oscdimg.exe")',
      '        $w = Test-Path -LiteralPath (Join-Path $c "Windows Preinstallation Environment\\amd64\\en-us\\winpe.wim")',
      '        if ($t) { $hasTools = $true; $root = $c }',
      '        if ($w) { $hasWinPe = $true; if (-not $root) { $root = $c } }',
      '    }',
      '    [pscustomobject]@{ Tools = $hasTools; WinPe = $hasWinPe; Root = $root }',
      '}',
      '',
      '$status = Get-AdkStatus',
      'if ($status.Tools -and $status.WinPe) {',
      '    Write-Host "已检测到 Windows ADK Deployment Tools 与 WinPE 加载项：$($status.Root)" -ForegroundColor Green',
      '    Write-Host "请返回 BareTurn 控制台点击「重新检测」即可生成恢复介质。"; exit 0',
      '}',
      '',
      '$here = Split-Path -Parent $MyInvocation.MyCommand.Path',
      '$localAdk = @((Join-Path $here "adksetup.exe"), (Join-Path $here "ADK\\adksetup.exe")) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1',
      '$localWinPe = @((Join-Path $here "adkwinpesetup.exe"), (Join-Path $here "WinPE\\adkwinpesetup.exe")) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1',
      '$hasWinget = [bool](Get-Command winget -ErrorAction SilentlyContinue)',
      '',
      'if (-not $status.Tools) {',
      '    if ($localAdk) {',
      '        Write-Host "正在从本地安装 Windows ADK Deployment Tools..." -ForegroundColor Cyan',
      '        $p = Start-Process -FilePath $localAdk -ArgumentList "/quiet /features OptionId.DeploymentTools /ceip off" -Wait -PassThru',
      '        if ($p.ExitCode -ne 0) { throw "adksetup.exe 退出码：$($p.ExitCode)" }',
      '    } elseif ($hasWinget) {',
      '        Write-Host "正在通过 winget 安装 Windows ADK..." -ForegroundColor Cyan',
      '        winget install --id Microsoft.WindowsADK --accept-package-agreements --accept-source-agreements',
      '        if ($LASTEXITCODE -ne 0) { throw "winget 安装 Windows ADK 失败（退出码 $LASTEXITCODE）" }',
      '    } else {',
      `        Write-Warning "未找到本地 adksetup.exe 且系统不可用 winget。请访问：${ADK_URL}"`,
      '        exit 1',
      '    }',
      '}',
      '',
      'if (-not $status.WinPe) {',
      '    if ($localWinPe) {',
      '        Write-Host "正在从本地安装 Windows PE 加载项..." -ForegroundColor Cyan',
      '        $p = Start-Process -FilePath $localWinPe -ArgumentList "/quiet /ceip off" -Wait -PassThru',
      '        if ($p.ExitCode -ne 0) { throw "adkwinpesetup.exe 退出码：$($p.ExitCode)" }',
      '    } elseif ($hasWinget) {',
      '        Write-Host "正在通过 winget 安装 Windows PE 加载项..." -ForegroundColor Cyan',
      '        winget install --id Microsoft.ADKPEAddon --accept-package-agreements --accept-source-agreements',
      '        if ($LASTEXITCODE -ne 0) { throw "winget 安装 WinPE 加载项失败（退出码 $LASTEXITCODE）" }',
      '    } else {',
      `        Write-Warning "未找到本地 adkwinpesetup.exe 且系统不可用 winget。请访问：${ADK_URL}"`,
      '        exit 1',
      '    }',
      '}',
      '',
      '$after = Get-AdkStatus',
      'if ($after.Tools -and $after.WinPe) {',
      '    Write-Host "部署完成：$($after.Root)" -ForegroundColor Green',
      '    Write-Host "无需重启 BareTurn Core 服务，返回控制台点击「重新检测」即可生成恢复介质。"',
      '} else {',
      '    Write-Warning "安装已结束，但仍缺少必要文件（Deployment Tools=$($after.Tools), WinPE=$($after.WinPe)）。请确认 ADK 与 WinPE 加载项版本一致。"',
      '    exit 2',
      '}'
    ];
    const blob = new Blob(['\uFEFF' + lines.join('\r\n') + '\r\n'], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'Install-BareTurnADK.ps1';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    R.toast('已下载部署脚本 Install-BareTurnADK.ps1');
  }

          </section>

        } catch (err) { R.toast(err.message, 'err'); }

    });

          <div id="vmware-local-box" class="field" style="display:none">

  <script>
/* Restore wizard: one entry for every kind of recovery — what to restore → which machine → which recovery point → how. */
(function (R) {
  'use strict';
  const { h, icon, bytes, ago, dateTime } = R;
  const isFiles = (p) => p.scope === 'Files';
  const isVm = (p) => p.scope === 'VirtualMachine';

  const KINDS = {
    files: { icon: 'folder', title: '文件和文件夹', text: '挂载恢复点，在浏览器中找到文件，下载或写回原计算机 / 其他计算机。适合误删、误改的文件。', fits: () => null },
    volume: { icon: 'disk', title: '整个分区', text: '把数据分区（例如 D: 或 /srv）写回原分区、其他分区或新分区，原计算机或其他计算机均可；大容量数据盘可即时恢复：先上线，后台回写。也可以下载分区映像。', fits: (p) => isFiles(p) ? '文件级恢复点没有分区映像' : null },
    machine: { icon: 'machines', title: '整台计算机', text: '裸机恢复：用恢复介质启动目标计算机（新硬件、虚拟机或清空的磁盘），按原分区布局重建并修复引导。', fits: (p) => isFiles(p) ? '文件级恢复点不能裸机恢复' : p.bareMetal === false ? '只包含所选分区，不含完整的系统与引导分区' : null },
    offsite: { icon: 'cloud', title: '从异地副本恢复', text: 'Core 或存储库损坏、被勒索加密时：从对象存储中的不可变副本下载恢复点，再按上面任一方式恢复。', fits: () => null }
  };
  const STEPS = ['恢复什么', '计算机', '恢复点', '恢复'];
  const ws = { kind: '', machine: '', point: '', target: '', q: '', step: 0, from: '' };

  R.pages.restore = {
    title: '恢复向导',
    async load(params) {
      const key = JSON.stringify(params);
      if (key !== ws.from) {
        ws.from = key;
        Object.assign(ws, { kind: params.kind || '', machine: params.machine || '', point: params.point || '', target: '', q: '', step: params.kind ? 1 : 0 });
        if (ws.point) {
          try { const d = await R.api.get('/points/' + ws.point); ws.machine = d.point.machineId; } catch (e) { ws.point = ''; }
        }
        if (ws.kind && ws.machine) ws.step = ws.point ? 2 : 2;
      }
      const [machines, offsite] = await Promise.all([R.api.get('/machines'), R.api.get('/offsite').catch(() => [])]);
      const visible = machines.filter((m) => (R.features.virtualization || !m.kind || m.kind === 'Agent') && m.pointCount > 0);
      let points = [];
      if (ws.kind !== 'offsite' && ws.machine) points = await R.api.get('/points?machineId=' + ws.machine + '&limit=2000');
      let offsitePoints = [];
      if (ws.kind === 'offsite' && ws.target) offsitePoints = await R.api.get('/offsite/' + ws.target + '/points');
      return { machines: visible, points: points.filter((p) => R.features.virtualization || !isVm(p)), offsite, offsitePoints };
    },
    view(d, _, { can }) {
      if (!can('operate')) return h`${R.pageHead({ title: '恢复向导' })}<section class="panel"><div class="empty">恢复需要操作员或管理员权限。</div></section>`;
      const machine = d.machines.find((m) => m.id === ws.machine);
      const kind = KINDS[ws.kind];
      return h`
        ${R.pageHead({ title: '恢复向导', key: 'restore', sub: '选择要恢复什么，向导会给出对应的步骤。',
          help: h`<p>所有恢复方式都从这里开始。文件恢复会只读挂载恢复点，不复制数据；整机恢复需要恢复介质（在“恢复介质”中生成）。恢复点所在的存储库不可用时，可以从异地副本或离线盘恢复。</p>` })}
        <ol class="stepper">${STEPS.map((label, i) => h`<li class="${i === ws.step ? 'on' : i < ws.step ? 'done' : ''}">${i < ws.step ? h`<button data-action="toStep" data-step="${i}">${label}</button>` : h`<span>${label}</span>`}</li>`)}</ol>
        ${ws.step === 0 ? stepKind(d) : ws.step === 1 ? (ws.kind === 'offsite' ? stepTarget(d) : stepMachine(d)) : ws.step === 2 ? (ws.kind === 'offsite' ? stepOffsitePoint(d) : stepPoint(d, machine, kind)) : ''}`;
    },
    actions: {
      kind(el, e, ctx) { ws.kind = el.dataset.kind; ws.target = ''; ws.step = ws.kind !== 'offsite' && ws.machine ? 2 : 1; ctx.reload(); },
      toStep(el, e, ctx) { ws.step = Number(el.dataset.step); ctx.reload(); },
      machine(el, e, ctx) { if (ws.machine !== el.dataset.id) ws.point = ''; ws.machine = el.dataset.id; ws.step = 2; ctx.reload(); },
      target(el, e, ctx) { ws.target = el.dataset.id; ws.step = 2; ctx.reload(); },
      q(el, e, ctx) { ws.q = el.value; clearTimeout(ws.t); ws.t = setTimeout(ctx.redraw, 120); },
      point(el, e, ctx) { ws.point = el.dataset.id; ctx.redraw(); },
      async go(el, e, ctx) {
        const point = ctx.state.data.points.find((p) => p.id === ws.point);
        const machine = ctx.state.data.machines.find((m) => m.id === ws.machine);
        if (!point) return;
        if (ws.kind === 'files') return R.mountDialog(point);
        if (ws.kind === 'machine') return isVm(point) ? R.vmRestoreDialog(point) : R.bmrDialog(machine, point);
        if (ws.kind === 'volume') return volumeDialog(point);
      },
      offsiteGo(el, e, ctx) {
        const target = ctx.state.data.offsite.find((t) => t.id === ws.target);
        const point = ctx.state.data.offsitePoints.find((p) => p.id === el.dataset.id);
        R.offsiteRestoreDialog(target, point, (job) => { R.toast('下载完成后，恢复点会出现在“恢复点”中，可以继续选择恢复方式。'); R.openJob(job.id); });
      }

  };

  function stepKind(d) {
    return h`<div class="kind-grid">${Object.entries(KINDS).map(([key, k]) => h`<button class="${'kind-card' + (ws.kind === key ? ' on' : '')}" data-action="kind" data-kind="${key}">
      <span class="kind-icon">${icon(k.icon, 26)}</span><strong>${k.title}</strong><span>${k.text}</span>
      ${key === 'offsite' && !d.offsite.length ? h`<small class="muted">还没有配置异地副本</small>` : ''}</button>`)}</div>
      <p class="small muted" style="margin-top:14px">即时恢复、迁移等虚拟机恢复在恢复点上选择“整台计算机”后进行。需要启动盘？前往 <a href="#/media">恢复介质</a>。</p>`;
  }

  function stepMachine(d) {
    const q = ws.q.toLowerCase();
    const list = d.machines.filter((m) => !q || (m.name + ' ' + (m.host || '') + ' ' + (m.osName || '')).toLowerCase().includes(q));
    return h`<section class="panel">
      <div class="toolbar"><b>选择计算机</b><div class="toolbar-end"><input class="input" id="rw-q" data-input="q" value="${ws.q}" placeholder="筛选名称、地址或系统" aria-label="筛选计算机"></div></div>
      ${list.length ? h`<div class="pick-list">${list.map((m) => h`<button class="${'pick-row' + (m.id === ws.machine ? ' on' : '')}" data-action="machine" data-id="${m.id}">
        <span class="os-icon">${R.osIcon(m.osName)}</span><span class="clip"><b>${m.name}</b><small class="muted">${m.archived ? '已归档' : m.host || ''} · ${m.osName || ''}</small></span>
        <span class="muted small nowrap">${m.pointCount} 个恢复点 · 最新 ${ago(m.lastBackup)}</span>${icon('chevron', 16)}</button>`)}</div>`
        : h`<div class="empty">${d.machines.length ? '没有符合条件的计算机' : '还没有任何恢复点'}</div>`}
    </section>`;
  }

  function stepPoint(d, machine, kind) {
    if (!machine) return h`<div class="empty">请先选择计算机</div>`;
    const usable = d.points.filter((p) => !kind.fits(p));
    if (!ws.point || !d.points.some((p) => p.id === ws.point && !kind.fits(p))) ws.point = (usable[0] || {}).id || '';
    const sel = d.points.find((p) => p.id === ws.point);
    const verb = { files: '挂载并浏览…', volume: '选择分区…', machine: sel && isVm(sel) ? '整机恢复…' : '查看裸机恢复步骤…' }[ws.kind];
    return h`<div class="grid dash">
      <section class="panel"><div class="panel-head"><h2>${machine.name} 的恢复点</h2><span class="sub">${kind.title}</span></div>
        ${d.points.length ? h`<div class="pick-list">${d.points.slice(0, 400).map((p) => {
          const why = kind.fits(p);
          return h`<button class="${'pick-row' + (p.id === ws.point ? ' on' : '') + (why ? ' off' : '')}" data-action="point" data-id="${p.id}" ${why ? 'disabled' : ''} title="${why || ''}">
            <span class="radio" aria-hidden="true"></span><span class="clip"><b>${dateTime(p.created, true)}</b> <span class="small muted">${ago(p.created)}</span>
            <small class="muted">${isFiles(p) ? '文件级' : p.kind === 'Base' ? '基准' : '增量'}${p.origin ? ' · 离线盘副本' : ''} · ${p.repositoryName || ''}${why ? ' · ' + why : ''}</small></span>
            ${p.verifyStatus === 'Ok' ? h`<span class="pill ok">已校验</span>` : p.verifyStatus === 'Failed' ? h`<span class="pill err">校验失败</span>` : ''}</button>`;
        })}</div>` : h`<div class="empty">没有恢复点</div>`}
      </section>
      <section class="panel"><div class="panel-head"><h2>恢复</h2></div><div class="panel-body">
        ${sel ? h`<dl class="kv"><dt>计算机</dt><dd>${machine.name}</dd><dt>恢复点</dt><dd>${dateTime(sel.created, true)}（${ago(sel.created)}）</dd>
          <dt>内容</dt><dd>${(sel.volumes || []).map((v) => v.role === 'Files' ? (v.folders || []).join('、') : v.driveLetter ? v.driveLetter + ':' : v.mountPoint && !/^LVM/.test(v.mountPoint) ? v.mountPoint : R.roleName(v.role)).join('  ')}</dd>
          <dt>已用数据</dt><dd>${bytes(sel.usedBytes)}</dd></dl>
          ${sel.verifyStatus === 'Failed' ? h`<div class="callout err">${icon('error')}<div>这个恢复点上次校验失败，建议选择其他恢复点。</div></div>` : ''}
          <p class="small muted">${kind.text}</p>
          <button class="btn primary" data-action="go">${icon('wand')}${verb}</button>`
          : h`<div class="callout warn" style="margin-top:0">${icon('warn')}<div>没有适合“${kind.title}”的恢复点。${ws.kind === 'machine' ? '可以改为恢复文件或分区。' : ''}</div></div>`}
      </div></section></div>`;
  }

  function stepTarget(d) {
    if (!d.offsite.length) return h`<section class="panel"><div class="empty">${icon('cloud', 28)}<h3>还没有异地副本</h3><p>在“存储库 › 异地副本”中新建或连接现有副本（Core 重建后用加密口令连接）。</p><a class="btn primary" href="#/repositories?section=offsite">前往异地副本</a></div></section>`;
    return h`<section class="panel"><div class="toolbar"><b>选择异地副本</b></div><div class="pick-list">${d.offsite.map((t) => h`<button class="${'pick-row' + (t.id === ws.target ? ' on' : '')}" data-action="target" data-id="${t.id}">
      <span class="os-icon">${icon('cloud')}</span><span class="clip"><b>${t.name}</b><small class="muted">${t.bucket}${t.prefix ? ' / ' + t.prefix : ''}</small></span>
      <span class="muted small nowrap">${t.points} 个恢复点${t.lastSuccess ? ' · 上次 ' + ago(t.lastSuccess) : ''}</span>${icon('chevron', 16)}</button>`)}</div></section>`;
  }

  function stepOffsitePoint(d) {
    const q = ws.q.toLowerCase();
    const list = d.offsitePoints.filter((p) => !q || p.machineName.toLowerCase().includes(q));
    return h`<section class="panel"><div class="toolbar"><b>选择要下载的恢复点</b><div class="toolbar-end"><input class="input" data-input="q" value="${ws.q}" placeholder="筛选计算机" aria-label="筛选计算机"></div></div>
      ${list.length ? h`<div class="table-wrap"><table class="table cards"><thead><tr><th>计算机</th><th>恢复点时间</th><th>大小</th><th>锁定</th><th></th></tr></thead><tbody>
        ${list.map((p) => h`<tr><td data-label="计算机"><b>${p.machineName}</b></td><td data-label="恢复点" class="nowrap">${dateTime(p.pointCreated, true)}<br><small class="muted">${ago(p.pointCreated)}</small></td>
          <td data-label="大小">${bytes(p.logicalBytes)}</td><td data-label="锁定">${p.locked ? h`<span class="tag brand">${icon('lock', 12)} 至 ${dateTime(p.retainUntil)}</span>` : h`<span class="faint">未锁定</span>`}</td>
          <td class="actions-cell"><button class="btn sm primary" data-action="offsiteGo" data-id="${p.id}">${icon('download')}下载到存储库…</button></td></tr>`)}</tbody></table></div>`
        : h`<div class="empty">没有异地恢复点</div>`}
      <p class="small muted" style="padding:0 14px 12px">下载完成后，恢复点出现在“恢复点”中（标记为独立完整），再选择文件、分区或整机恢复。</p></section>`;
  }

  // Volumes of a point: download images, or mount the ones that can be browsed.
  async function volumeDialog(point) {
    const m = R.modal({ title: '恢复分区', wide: true, body: h`<div class="empty small">正在读取分区…</div>` });
    let volumes;
    try { volumes = await R.api.get('/points/' + point.id + '/volumes'); } catch (e) { m.set(h`<div class="callout err">${icon('error')}<div>${e.message}</div></div>`); return; }
    const url = (v) => '/api/points/' + encodeURIComponent(point.id) + '/volumes/' + encodeURIComponent(v.key) + '/image';
    m.set(h`<p style="margin-top:0">${point.machineName} · ${dateTime(point.created, true)}。“恢复到计算机”把整个分区写回一台安装了 Agent 的计算机（完整恢复，或即时恢复：先上线、后台回写）；分区映像是该分区备份时的完整内容（空闲空间为零），支持断点续传。</p>
      <div class="table-wrap"><table class="table cards"><thead><tr><th>分区</th><th>文件系统</th><th class="num">大小</th><th></th></tr></thead><tbody>
      ${volumes.filter((v) => v.role !== 'Files').map((v) => h`<tr><td data-label="分区"><b>${v.name}</b>${v.logical ? h` <span class="tag">LVM 逻辑卷</span>` : ''}${v.problem ? h`<br><small class="muted">${v.problem}</small>` : ''}</td>
        <td data-label="文件系统">${v.fileSystem || '—'}</td><td data-label="大小" class="num">${bytes(v.length)}</td>
        <td class="actions-cell">${!R.volumeRestoreProblem(v) ? h`<button class="btn sm primary" data-restore="${v.key}">${icon('restore')}恢复到计算机…</button>` : ''} ${v.image ? h`<a class="btn sm" href="${url(v)}" download>${icon('download')}下载映像</a>` : ''} ${v.mountable ? h`<button class="btn sm" data-mount="${v.key}">${icon('mount')}挂载浏览</button>` : ''}</td></tr>`)}
      </tbody></table></div>
      <div class="callout">${icon('info')}<div>系统、引导和恢复分区不能在线写回：在“恢复介质”中生成 ISO，启动目标计算机，在恢复控制台选择此恢复点后只勾选需要的分区。</div></div>`);
    m.el.querySelectorAll('[data-restore]').forEach((b) => b.addEventListener('click', () => {
      const v = volumes.find((x) => x.key === b.dataset.restore);
      m.close(); R.volumeRestoreDialog(point, v);
    }));
    m.el.querySelectorAll('[data-mount]').forEach((b) => b.addEventListener('click', async () => {
      b.disabled = true;
      try { const session = await R.api.post('/points/' + point.id + '/mount', { volumeKey: b.dataset.mount }); m.close(); location.hash = '#/mounts/' + encodeURIComponent(session.id); }
      catch (e) { b.disabled = false; R.toast(e.message, 'err'); }
    }));
  }
})(window.R = window.R || {});

  <script>
/* File-level recovery: mount a recovery point volume, browse it, download files or restore them to a machine. */
(function (R) {
  'use strict';
  const { h, icon, bytes, ago, dateTime } = R;
  const ui = { hidden: true, q: '', selected: new Set(), at: '' };

  const downloadUrl = (id, paths, base) => '/api/mounts/' + encodeURIComponent(id) + '/download?' +
    new URLSearchParams([['base', base || ''], ...paths.map((p) => ['path', p])]).toString();
  function download(id, paths, base) {
    if (R.demo && R.demo.enabled) { R.toast('演示模式不提供真实文件下载'); return; }
    const a = document.createElement('a');
    a.href = downloadUrl(id, paths, base);
    a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
  }
  const browseHash = (id, path) => '#/mounts/' + encodeURIComponent(id) + (path ? '?path=' + encodeURIComponent(path) : '');
  const volLabel = (v) => v.name || (v.driveLetter ? v.driveLetter + ':' : v.mountPoint || R.roleName(v.role));
  const imageUrl = (point, v) => '/api/points/' + encodeURIComponent(point) + '/volumes/' + encodeURIComponent(v.key) + '/image';

  // ───────────── mount a volume of a point ─────────────
  async function mountDialog(point) {
    if (!point) return;
    const m = R.modal({ title: '挂载恢复点', body: h`<div class="empty small">正在读取分区…</div>` });
    let volumes;
    try { volumes = await R.api.get('/points/' + point.id + '/volumes'); }
    catch (e) { m.set(h`<div class="callout err">${icon('error')}<div>${e.message}</div></div>`); return; }
    const first = volumes.find((v) => v.mountable && v.driveLetter) || volumes.find((v) => v.mountable);
    m.set(h`<p style="margin-top:0">以只读方式打开 <b>${point.machineName || ''}</b> 在 <b>${dateTime(point.created, true)}</b> 的分区。不复制数据，浏览和下载时按需从存储库读取，原恢复点不会被修改。</p>
      <div class="choice">${volumes.map((v) => h`<label class="${v === first ? 'on' : ''}" style="${v.mountable ? '' : 'opacity:.55'}"><input type="radio" name="mvol" value="${v.key}" ${v === first ? 'checked' : ''} ${v.mountable ? '' : 'disabled'}>
        <span><strong>${volLabel(v)}${v.logical ? h` <span class="tag">LVM 逻辑卷</span>` : ''}</strong><small>${v.role === 'Files' ? `文件级备份 · ${(v.files || 0).toLocaleString()} 个文件 · ${bytes(v.length)} · ${(v.folders || []).join('、')}`
          : h`${R.roleName(v.role)} · ${bytes(v.length)} · ${v.fileSystem || '无文件系统'}${v.problem ? ' · ' + v.problem : v.mountable ? '' : v.role === 'Lvm' ? ' · 物理卷本身不能浏览，请选择下面的逻辑卷' : /swap/i.test(v.fileSystem || '') ? ' · 交换空间没有文件' : ' · 不支持浏览（支持 NTFS、FAT/FAT32、exFAT、ext2/3/4、XFS）'}`}</small>
          ${R.features.virtualization && v.role === 'VirtualDisk' ? h`<span style="display:flex;gap:6px;margin-top:6px"><a class="btn sm" download href="${imageUrl(point.id, v).replace('/image','/flat')}">平坦 VMDK</a><a class="btn sm" download href="${imageUrl(point.id, v).replace('/image','/vmdk')}">VMDK 描述文件</a><a class="btn sm" download href="${imageUrl(point.id, v).replace('/image','/vhd')}">固定 VHD</a></span>` : ''}
          ${v.image && !v.mountable && v.role !== 'Lvm' && v.role !== 'Swap' ? h`<a class="btn sm" style="margin-top:6px;align-self:flex-start" href="${imageUrl(point.id, v)}" download>${icon('download')}下载分区映像</a>` : ''}</span></label>`)}</div>
      ${volumes.some((v) => /^(btrfs|crypto_LUKS)$/i.test(v.fileSystem || '') || (v.logical && v.problem))
        ? h`<div class="callout">${icon('info')}<div>Btrfs、LUKS 加密卷，以及精简 / RAID / 缓存类型的 LVM 卷不能在控制台中浏览。可以下载分区映像，在 Linux 计算机上只读挂载：<span class="mono">mount -o loop,ro 映像.img /mnt</span>；LVM 物理卷先 <span class="mono">losetup -r -f --show 映像.img</span>，再 <span class="mono">vgchange -ay</span>。</div></div>` : ''}
      <div class="callout">${icon('info')}<div>挂载期间此恢复点不会被保留策略合并；闲置 8 小时后自动卸载。</div></div>`);
    const foot = document.createElement('div');
    foot.className = 'modal-foot';
    foot.innerHTML = String(h`<button class="btn" data-close>取消</button><button class="btn primary" data-go ${first ? '' : 'disabled'}>${icon('mount')}挂载并浏览</button>`);
    m.el.querySelector('.modal').appendChild(foot);
    m.el.querySelectorAll('input[name=mvol]').forEach((r) => r.addEventListener('change', () => {
      m.el.querySelectorAll('.choice label').forEach((l) => l.classList.toggle('on', l.contains(r)));
    }));
    foot.querySelector('[data-go]').onclick = async (e) => {
      const key = (m.el.querySelector('input[name=mvol]:checked') || {}).value;
      if (!key) return;
      e.target.disabled = true; e.target.textContent = '正在挂载…';
      try {
        const session = await R.api.post('/points/' + point.id + '/mount', { volumeKey: key });
        m.close(); location.hash = browseHash(session.id);
      } catch (error) { e.target.disabled = false; e.target.textContent = '挂载并浏览'; R.toast(error.message, 'err'); }
    };
  }
  R.mountDialog = mountDialog;

  // Pick machine → point → volume from the mounts page.
  async function pickPoint() {
    const machines = (await R.api.get('/machines')).filter((x) => x.pointCount > 0);
    const m = R.modal({ title: '选择恢复点', body: '' });
    const s = { machine: machines[0] && machines[0].id, points: [], point: null };
    async function load() {
      s.points = s.machine ? await R.api.get('/points?machineId=' + s.machine + '&limit=500') : [];
      s.point = s.points[0] && s.points[0].id;
      draw();
    }
    function draw() {
      m.set(machines.length ? h`<div class="field"><label for="pp-m">计算机</label><select class="input" id="pp-m">${machines.map((x) => h`<option value="${x.id}" ${x.id === s.machine ? 'selected' : ''}>${x.name}（${x.pointCount} 个恢复点）</option>`)}</select></div>
        <div class="field"><label for="pp-p">恢复点</label><select class="input" id="pp-p">${s.points.map((p) => h`<option value="${p.id}" ${p.id === s.point ? 'selected' : ''}>${dateTime(p.created, true)} · ${p.kind === 'Base' ? '基准' : '增量'} · ${(p.volumes || []).map((v) => v.driveLetter ? v.driveLetter + ':' : R.roleName(v.role)).join(' ')}</option>`)}</select></div>
        <div class="modal-foot" style="padding:12px 0 0"><button class="btn" data-close>取消</button><button class="btn primary" data-next ${s.point ? '' : 'disabled'}>下一步</button></div>`
        : h`<div class="empty small">还没有恢复点</div>`);
      const ms = m.el.querySelector('#pp-m'), ps = m.el.querySelector('#pp-p'), next = m.el.querySelector('[data-next]');
      if (ms) ms.onchange = () => { s.machine = ms.value; load(); };
      if (ps) ps.onchange = () => { s.point = ps.value; };
      if (next) next.onclick = () => { const p = s.points.find((x) => x.id === s.point); m.close(); mountDialog(p); };
    }
    load();
  }

  // ───────────── mounts list ─────────────
  R.pages.mounts = {
    title: '文件恢复',
    live: 15000,
    load: () => R.api.get('/mounts'),
    view(mounts, _, { can }) {
      return h`
        ${R.pageHead({ title: '文件恢复', key: 'mounts', sub: mounts.length ? `${mounts.length} 个已挂载的分区` : '没有挂载的分区',
          help: h`<p>把恢复点中的分区以只读方式挂载到 Core，直接浏览目录、下载文件或文件夹（ZIP），或把文件写回原计算机或其他计算机。支持 NTFS、FAT/FAT32、exFAT、ext2/3/4 与 XFS（包括 LVM 逻辑卷）。Windows 分区还可以映射为驱动器盘符，在资源管理器中打开。</p><p>挂载期间恢复点不会被保留策略合并；闲置 8 小时后自动卸载。</p>`,
          actions: can('operate') ? h`<a class="btn" href="#/restore?kind=files">${icon('wand')}恢复向导</a><button class="btn primary" data-action="pick">${icon('mount')}挂载恢复点</button>` : '' })}
        <section class="panel">${mounts.length ? h`<div class="table-wrap"><table class="table cards">
          <thead><tr><th>分区</th><th>计算机</th><th>恢复点</th><th>文件系统</th><th>挂载者</th><th>挂载时间</th><th>自动卸载</th><th></th></tr></thead>
          <tbody>${mounts.map((x) => h`<tr class="click" data-action="open" data-id="${x.id}">
            <td data-label="分区"><div class="machine-cell"><span class="os-icon">${icon('mount')}</span><div><strong>${x.volumeName}</strong><small>${bytes(x.volumeLength)}</small></div></div></td>
            <td data-label="计算机">${x.machineName}</td>

  // ───────────── file browser ─────────────
  R.pages.mount = {

              <input class="input" id="file-filter" placeholder="筛选此文件夹" value="${ui.q}" data-input="filter" aria-label="筛选文件">

  // ───────────── restore selected items to a machine ─────────────
  async function restoreDialog(mount, paths) {
    if (!paths.length) return;
    // ext4 / XFS files go back to Linux machines (with their mode and owner), NTFS / FAT files to Windows machines.
    const machines = (await R.api.get('/machines')).filter((x) => !x.archived && (mount.fileSet || !!x.linux === !!mount.unix));
    const byPath = mount.driveLetter || mount.fileSet || (mount.unix && mount.mountPoint);
    const s = { machine: machines.some((x) => x.id === mount.machineId) ? mount.machineId : (machines[0] || {}).id, dest: byPath ? 'Original' : 'Folder', folder: '', conflict: 'Rename', busy: false };
    const stamp = new Date().toISOString().slice(0, 10);

    const m = R.modal({ title: '恢复到计算机', wide: false, body: '' });

      const original = s.machine === mount.machineId && byPath && !(mount.fileSet && paths.some((p) => !p));

        ${mount.unix ? h`<p class="small muted" style="margin-top:0">ext4 / XFS 中的文件只能写回 Linux 计算机；符号链接和设备文件不恢复。</p>` : ''}
        ${machines.length ? h`<div class="field"><label for="fr-m">目标计算机</label><select class="input" id="fr-m">${machines.map((x) => h`<option value="${x.id}" ${x.id === s.machine ? 'selected' : ''}>${x.name}${x.id === mount.machineId ? '（原计算机）' : ''}${x.status === 'Offline' ? ' · 离线' : ''}</option>`)}</select></div>` : h`<div class="callout warn">${icon('warn')}<div>没有可连接的计算机，请改为下载文件。</div></div>`}
        <div class="field"><span class="label">恢复位置</span><div class="choice">
          <label class="${s.dest === 'Original' ? 'on' : ''}" style="${original ? '' : 'opacity:.55'}"><input type="radio" name="fr-dest" value="Original" ${s.dest === 'Original' ? 'checked' : ''} ${original ? '' : 'disabled'}><span><strong>原位置</strong><small>${original ? (mount.fileSet ? '写回各文件原来所在的盘符和路径' : mount.unix ? `写回 ${mount.mountPoint} 下的原路径，保留权限与所有者` : `写回 ${mount.driveLetter}: 上的原路径`) : mount.fileSet ? '仅在恢复到原计算机时可用' : mount.unix ? '仅在恢复到原计算机、且文件系统备份时已挂载时可用' : '仅在恢复到原计算机、且分区有盘符时可用'}</small></span></label>
          <label class="${s.dest === 'Folder' ? 'on' : ''}"><input type="radio" name="fr-dest" value="Folder" ${s.dest === 'Folder' ? 'checked' : ''}><span><strong>指定文件夹</strong><small>在目标文件夹下重建原有目录结构，不影响现有文件</small></span></label>
        </div></div>
        ${s.dest === 'Folder' ? h`<div class="field"><label for="fr-f">目标文件夹（目标计算机上的${mount.unix ? '绝对路径' : '本地路径'}）</label><input class="input mono" id="fr-f" value="${s.folder}"></div>` : ''}
        <div class="field"><label for="fr-c">同名文件</label><select class="input" id="fr-c">
          <option value="Rename" ${s.conflict === 'Rename' ? 'selected' : ''}>保留两者（恢复的文件改名）</option>
          <option value="Skip" ${s.conflict === 'Skip' ? 'selected' : ''}>跳过，保留现有文件</option>
          <option value="Overwrite" ${s.conflict === 'Overwrite' ? 'selected' : ''}>覆盖现有文件</option></select></div>
        ${s.conflict === 'Overwrite' ? h`<div class="callout warn">${icon('warn')}<div>覆盖后无法撤销。正在使用中的文件可能无法覆盖，会记录在任务日志中。</div></div>` : ''}
        <div class="modal-foot" style="padding:12px 0 0"><button class="btn" data-close>取消</button><button class="btn primary" data-go ${machines.length && !s.busy ? '' : 'disabled'}>${s.busy ? '正在提交…' : '开始恢复'}</button></div>`);
      const bind = (sel, ev, fn) => { const el = m.el.querySelector(sel); if (el) el.addEventListener(ev, fn); };
      bind('#fr-m', 'change', (e) => { s.machine = e.target.value; draw(); });
      bind('#fr-f', 'input', (e) => { s.folder = e.target.value; });
      bind('#fr-c', 'change', (e) => { s.conflict = e.target.value; draw(); });
      m.el.querySelectorAll('input[name=fr-dest]').forEach((r) => r.addEventListener('change', () => { s.dest = r.value; draw(); }));
      bind('[data-go]', 'click', async () => {
        s.busy = true; draw();
        try {
          const job = await R.api.post('/mounts/' + mount.id + '/restore', { paths, destination: s.dest, folder: s.dest === 'Folder' ? s.folder.trim() : null, conflict: s.conflict, machineId: s.machine });
          m.close(); R.toast('文件恢复已加入队列'); location.hash = '#/jobs/' + job.id;
        } catch (error) { s.busy = false; draw(); R.toast(error.message, 'err'); }
      });
    }
    draw();
  }

  // ───────────── drive letter via read-only WebDAV ─────────────
  function davDialog(mount) {
    const url = location.origin + mount.davPath;

    const m = R.modal({
      title: '映射为驱动器',
