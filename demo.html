        <div class="field"><span class="label">命令提示符</span><div class="copy-line"><code class="mono">${cmd}</code><button class="btn sm" data-copy="${cmd}">${icon('copy')}复制</button></div></div>
        <div class="field"><span class="label">资源管理器 › 映射网络驱动器 › 文件夹</span><div class="copy-line"><code class="mono">${url}</code><button class="btn sm" data-copy="${url}">${icon('copy')}复制</button></div></div>
        <ol class="steps">
          <li><div><strong>信任 Core 证书</strong><span>Windows WebDAV 客户端只接受受信任的证书：把 Core 证书导入该计算机的“受信任的根证书颁发机构”，并使用证书中的主机名访问。</span></div></li>
          <li><div><strong>启动 WebClient 服务</strong><span>Windows 10/11 默认已安装；Windows Server 需先安装“WebDAV 重定向程序”功能。</span></div></li>
          <li><div><strong>大文件</strong><span>WebClient 默认只允许下载 50 MB 以内的文件。需要更大时，把注册表 HKLM\\SYSTEM\\CurrentControlSet\\Services\\WebClient\\Parameters 下 FileSizeLimitInBytes 调大（最大 4 GB）后重启 WebClient；更大的文件请在控制台下载。</span></div></li>
        </ol>`,
      foot: h`<button class="btn primary" data-close>完成</button>`
    });
    m.el.querySelectorAll('[data-copy]').forEach((b) => b.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(b.dataset.copy); R.toast('已复制'); } catch (e) { R.toast('无法访问剪贴板，请手动复制', 'err'); }
    }));
  }
})(window.R = window.R || {});

</script>
  <script>
/* Whole-partition restore: write a recovery point volume to a partition of a protected machine (full copy, or instant: online first,
   written back in the background), and the list of restore sessions with their write-back progress. */
(function (R) {
  'use strict';
  const { h, icon, bytes, ago, dateTime } = R;
  const MiB = 1024 * 1024;
  const SOURCE_ROLES = ['Data', 'Unknown', 'Oem'];
  const STATES = {
    Preparing: ['run', '准备中'], Copying: ['run', '写入中'], Online: ['run', '已上线 · 回写中'], Hydrated: ['warn', '等待切换'],
    Completed: ['ok', '已完成'], Failed: ['err', '失败'], Cancelled: ['off', '已取消']
  };
  const active = (s) => ['Preparing', 'Copying', 'Online', 'Hydrated'].includes(s.state);
  const modeName = (m) => m === 'Live' ? '即时恢复' : '完整恢复';

  /** Why a point volume cannot be written back as a whole partition (null = it can). */
  R.volumeRestoreProblem = (v) => {
    if (v.role === 'Files' || v.logical) return v.logical ? '逻辑卷请挂载后恢复文件，或下载映像' : '文件级恢复点没有分区';
    if (['Windows', 'Efi', 'Msr', 'SystemReserved', 'Recovery', 'Root', 'Boot', 'BiosBoot'].includes(v.role)) return '系统与引导分区请用恢复介质裸机恢复';
    if (v.role === 'Swap') return '交换分区无需恢复';
    if (v.role === 'Lvm') return 'LVM 物理卷暂不支持写回';
    if (!SOURCE_ROLES.includes(v.role)) return '不能按分区写回';
    return null;
  };

  // ───────────── restore one volume to a machine ─────────────
  R.volumeRestoreDialog = async function (point, volume) {
    const m = R.modal({ title: '恢复整个分区', wide: true, body: h`<div class="empty small">正在读取计算机…</div>` });
    let machines;
    try { machines = await R.api.get('/machines'); } catch (e) { m.set(h`<div class="callout err">${icon('error')}<div>${e.message}</div></div>`); return; }
    const sourceMachine = machines.find((x) => x.id === point.machineId);
    const linux = sourceMachine ? !!sourceMachine.linux : /^(ext[234]|xfs|vfat)$/i.test(volume.fileSystem || '');
    const candidates = machines.filter((x) => !x.archived && (!x.kind || x.kind === 'Agent') && !!x.linux === linux);
    const s = {
      machine: candidates.some((x) => x.id === point.machineId) ? point.machineId : (candidates[0] || {}).id, targets: null, error: null, kind: 'Original',
      partition: '', disk: '', region: 0, size: 0, mode: 'Full', letter: '', mount: '', force: false, newUuid: false, extend: true, autoCutover: true, mbps: 0, busy: false
    };

    async function loadTargets() {
      s.targets = null; s.error = null; draw();
      if (!s.machine) { s.error = linux ? '没有可连接的 Linux 计算机（需要已安装 Agent 并正在受保护）。' : '没有可连接的 Windows 计算机（需要已安装 Agent 并正在受保护）。'; draw(); return; }
      try {
        const t = await R.api.get('/points/' + encodeURIComponent(point.id) + '/volumes/' + encodeURIComponent(volume.key) + '/restore-targets?machineId=' + encodeURIComponent(s.machine));
        s.targets = t;
        const parts = allParts(t);
        const usable = parts.filter((p) => !p.problem && !p.original);
        const disks = t.disks.filter((d) => !d.newProblem && d.free.length);
        s.kind = t.originalKey && !(parts.find((p) => p.original) || {}).problem ? 'Original' : usable.length ? 'Existing' : disks.length ? 'New' : 'Existing';
        s.partition = (usable[0] || {}).key || '';
        s.disk = (disks[0] || {}).uniqueId || '';
        s.region = 0;
        s.size = Math.ceil(t.source.length / MiB);
        s.mode = 'Full';
        // Drive letter: the original one when it is free (or belongs to the partition being replaced), else the first free letter.
        const used = new Set(t.usedLetters || []);
        const own = s.kind === 'Original' ? (parts.find((p) => p.original) || {}).driveLetter : null;
        const wanted = t.source.driveLetter;
        s.letter = linux ? '' : wanted && (!used.has(wanted) || wanted === own) ? wanted : ('DEFGHIJKLMNOPQRSTUVWXYZ'.split('').find((l) => !used.has(l)) || '');
        s.mount = linux && s.kind === 'Original' ? (t.source.mountPoint && !/^LVM/.test(t.source.mountPoint) ? t.source.mountPoint : '') : '';
        s.newUuid = linux && t.sameMachine && s.kind !== 'Original';
      } catch (e) { s.error = e.message; }
      draw();
    }

    const allParts = (t) => t.disks.flatMap((d) => d.partitions.map((p) => Object.assign({ disk: d }, p)));
    const target = () => {
      const t = s.targets;
      if (!t) return null;
      if (s.kind === 'Original') return allParts(t).find((p) => p.original);
      if (s.kind === 'Existing') return allParts(t).find((p) => p.key === s.partition);
      const d = t.disks.find((x) => x.uniqueId === s.disk);
      return d ? { disk: d, size: s.size * MiB, isNew: true } : null;
    };
    const freeLetters = () => {
      const used = new Set((s.targets && s.targets.usedLetters) || []);
      const own = (target() || {}).driveLetter;
      return 'DEFGHIJKLMNOPQRSTUVWXYZ'.split('').filter((l) => !used.has(l) || l === own);
    };

    function draw() {
      const t = s.targets;
      const v = t ? t.source : { name: volume.name, length: volume.length, fileSystem: volume.fileSystem };
      const tg = target();
      const region = t && s.kind === 'New' ? ((t.disks.find((d) => d.uniqueId === s.disk) || {}).free || [])[s.region] : null;
      const minSize = Math.ceil(v.length / MiB);
      const maxSize = region ? Math.floor(region.size / MiB) : minSize;
      const canExtend = tg && (tg.size || 0) > v.length + MiB;
      const liveProblem = t && t.source.liveProblem;
      if (s.mode === 'Live' && liveProblem) s.mode = 'Full';
      const valid = t && !t.busy && tg && !(tg.problem) && (s.kind !== 'New' || (region && s.size >= minSize && s.size <= maxSize));
      m.set(h`
        <p style="margin-top:0">把 <b>${point.machineName || ''} ${volume.name}</b>（${volume.fileSystem || '未知文件系统'}，${bytes(volume.length)}）在 <b>${dateTime(point.created, true)}</b> 的内容写回一个分区。只写入已用的数据块，空闲空间不传输。</p>
        <div class="field"><label for="vr-m">目标计算机</label>
          ${candidates.length ? h`<select class="input" id="vr-m">${candidates.map((x) => h`<option value="${x.id}" ${x.id === s.machine ? 'selected' : ''}>${x.name}${x.id === point.machineId ? '（原计算机）' : ''}${x.status === 'Offline' ? ' · 离线' : ''}</option>`)}</select>`
            : h`<div class="callout warn">${icon('warn')}<div>没有可连接的${linux ? ' Linux' : ' Windows'} 计算机。分区只能写回同一平台、已安装 Agent 的计算机；也可以下载分区映像。</div></div>`}</div>
        ${s.error ? h`<div class="callout err">${icon('error')}<div>${s.error}</div></div>` : !t ? h`<div class="empty small">正在读取目标计算机的磁盘…</div>` : h`
        ${t.busy ? h`<div class="callout warn">${icon('warn')}<div>${t.machine.name} 已有分区恢复在进行，完成后才能开始新的恢复（进度见“分区恢复”）。</div></div>` : ''}
        <div class="field"><span class="label">恢复到</span><div class="choice">
          ${(() => { const o = allParts(t).find((p) => p.original); return h`<label class="${s.kind === 'Original' ? 'on' : ''}" style="${o && !o.problem ? '' : 'opacity:.55'}"><input type="radio" name="vr-k" value="Original" ${s.kind === 'Original' ? 'checked' : ''} ${o && !o.problem ? '' : 'disabled'}>
            <span><strong>原分区</strong><small>${o ? `${o.name}（磁盘 ${o.disk.number} 分区 ${o.number}，${bytes(o.size)}）${o.problem ? ' · ' + o.problem : '：现有内容将被替换'}` : t.sameMachine ? '原分区已不存在（磁盘布局已变化）' : '仅在恢复到原计算机时可用'}</small></span></label>`; })()}
          <label class="${s.kind === 'Existing' ? 'on' : ''}"><input type="radio" name="vr-k" value="Existing" ${s.kind === 'Existing' ? 'checked' : ''}>
            <span><strong>现有的其他分区</strong><small>覆盖目标计算机上的一个数据分区（不小于 ${bytes(v.length)}）</small>
            ${s.kind === 'Existing' ? h`<select class="input" id="vr-p" style="margin-top:6px">${allParts(t).filter((p) => !p.original).map((p) => h`<option value="${p.key}" ${p.key === s.partition ? 'selected' : ''} ${p.problem ? 'disabled' : ''}>磁盘 ${p.disk.number} 分区 ${p.number} · ${p.name} · ${bytes(p.size)}${p.fileSystem ? ' · ' + p.fileSystem : ''}${p.problem ? ' — ' + p.problem : ''}</option>`)}</select>` : ''}</span></label>
          <label class="${s.kind === 'New' ? 'on' : ''}"><input type="radio" name="vr-k" value="New" ${s.kind === 'New' ? 'checked' : ''}>
            <span><strong>新分区</strong><small>在磁盘的未分配空间中创建分区，不影响现有数据</small>
            ${s.kind === 'New' ? h`<span style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap">
              <select class="input" id="vr-d" style="flex:2;min-width:220px">${t.disks.map((d) => h`<option value="${d.uniqueId}" ${d.uniqueId === s.disk ? 'selected' : ''} ${d.newProblem ? 'disabled' : ''}>磁盘 ${d.number} · ${d.friendlyName} · ${bytes(d.size)}${d.partitionStyle === 'RAW' ? ' · 未初始化（将创建 GPT）' : ''}${d.newProblem ? ' — ' + d.newProblem : ''}</option>`)}</select>
              ${region ? h`<select class="input" id="vr-r" style="flex:1;min-width:160px">${((t.disks.find((d) => d.uniqueId === s.disk) || {}).free || []).map((f, i) => h`<option value="${i}" ${i === s.region ? 'selected' : ''}>未分配 ${bytes(f.size)}（偏移 ${bytes(f.offset)}）</option>`)}</select>
              <span style="display:flex;gap:6px;align-items:center;flex:1;min-width:150px" title="${'大小 ' + minSize + '–' + maxSize + ' MiB'}"><input class="input" id="vr-s" type="number" min="${minSize}" max="${maxSize}" step="1" value="${s.size}" style="width:130px" aria-label="新分区大小（MiB）"><span class="small muted">MiB（最大 ${maxSize}）</span></span>` : ''}</span>` : ''}</span></label>
        </div></div>
        <div class="field"><span class="label">恢复方式</span><div class="choice">
          <label class="${s.mode === 'Full' ? 'on' : ''}"><input type="radio" name="vr-mode" value="Full" ${s.mode === 'Full' ? 'checked' : ''}><span><strong>完整恢复</strong><small>写完全部已用数据后分区才可用，期间分区不能访问。</small></span></label>
          <label class="${s.mode === 'Live' ? 'on' : ''}" style="${liveProblem ? 'opacity:.55' : ''}"><input type="radio" name="vr-mode" value="Live" ${s.mode === 'Live' ? 'checked' : ''} ${liveProblem ? 'disabled' : ''}>
            <span><strong>即时恢复（先上线，后台回写）</strong><small>${liveProblem || (linux
              ? '几秒钟内即可挂载使用；未回写的数据在读取时从 Core 按需获取，写入直接落到本地分区，其余数据在后台回写。回写完成后自动切换为直接访问本地分区，不中断使用。'
              : '几秒钟内即可用盘符访问；未回写的数据在读取时从 Core 按需获取，写入直接落到本地分区，其余数据在后台回写。回写完成后切换到本地分区（需要短暂断开该卷，或在下次重新启动时切换）。')}</small></span></label>
        </div></div>
        <div class="form-grid">
          ${linux ? h`<label class="field">挂载点<input class="input mono" id="vr-mp" value="${s.mount}" placeholder="例如 /srv/data，留空则不挂载"></label>`
            : h`<label class="field">盘符<select class="input" id="vr-l"><option value="" ${s.letter ? '' : 'selected'}>不分配盘符</option>${freeLetters().map((l) => h`<option value="${l}" ${l === s.letter ? 'selected' : ''}>${l}:</option>`)}</select></label>`}
          <label class="field">读取限速（Mbps，0 为不限）<input class="input" id="vr-bw" type="number" min="0" step="10" value="${s.mbps}"></label>
        </div>
        ${linux ? h`<label class="check"><input type="checkbox" id="vr-f" ${s.force ? 'checked' : ''}><span>强制：结束占用目标分区的进程后卸载</span></label>` : h`<div class="callout">目标卷被占用时自动卸载，已打开的文件会断开。盘符冲突时自动使用可用盘符。</div>`}
        ${canExtend ? h`<label class="check"><input type="checkbox" id="vr-x" ${s.extend ? 'checked' : ''}><span>把文件系统扩展到整个分区（${bytes(tg.size)}）</span></label>` : ''}
        ${linux ? h`<label class="check"><input type="checkbox" id="vr-u" ${s.newUuid ? 'checked' : ''}><span>为恢复的文件系统生成新 UUID（与原分区同时存在于一台计算机时需要）</span></label>` : ''}
        ${s.mode === 'Live' && !linux ? h`<label class="check"><input type="checkbox" id="vr-c" ${s.autoCutover ? 'checked' : ''}><span>回写完成后，在没有打开的文件时自动切换到本地分区</span></label>` : ''}
        ${s.mode === 'Live' ? h`<div class="callout">${icon('info')}<div>${linux
          ? '即时恢复使用内核 dm-clone 与 nbd：回写完成前请保持目标计算机与 Core 的网络连接；Agent 或计算机重新启动后自动继续。期间 /etc/fstab 中目标分区的条目会暂时加上 noauto。'
          : '即时恢复通过本机回环 iSCSI 磁盘提供此卷（Windows 自带 iSCSI 发起程序）：回写完成前请保持与 Core 的网络连接，Core 长时间不可达时访问未回写数据的程序会等待；Agent 或计算机重新启动后自动继续。'}</div></div>` : ''}
        ${s.kind !== 'New' && tg ? h`<div class="callout warn">${icon('warn')}<div>${tg.name}（磁盘 ${tg.disk.number} 分区 ${tg.number}）上现有的全部数据将被替换，无法撤销。</div></div>` : ''}
        `}
        <div class="modal-foot" style="padding:12px 0 0"><button class="btn" data-close>取消</button><button class="btn primary" data-go ${valid && !s.busy ? '' : 'disabled'}>${s.busy ? '正在提交…' : s.mode === 'Live' ? '开始即时恢复' : '开始恢复'}</button></div>`);
      const bind = (sel, ev, fn) => { const el = m.el.querySelector(sel); if (el) el.addEventListener(ev, fn); };
      bind('#vr-m', 'change', (e) => { s.machine = e.target.value; loadTargets(); });
      m.el.querySelectorAll('input[name=vr-k]').forEach((r) => r.addEventListener('change', () => {
        s.kind = r.value;
        if (linux) { s.newUuid = s.targets.sameMachine && s.kind !== 'Original'; if (s.kind === 'Original' && !s.mount && s.targets.source.mountPoint && !/^LVM/.test(s.targets.source.mountPoint)) s.mount = s.targets.source.mountPoint; }
        draw();
      }));
      m.el.querySelectorAll('input[name=vr-mode]').forEach((r) => r.addEventListener('change', () => { s.mode = r.value; draw(); }));
      bind('#vr-p', 'change', (e) => { s.partition = e.target.value; draw(); });
      bind('#vr-d', 'change', (e) => { s.disk = e.target.value; s.region = 0; draw(); });
      bind('#vr-r', 'change', (e) => { s.region = Number(e.target.value); draw(); });
      bind('#vr-s', 'change', (e) => { s.size = Math.max(0, Math.round(Number(e.target.value) || 0)); draw(); });
      bind('#vr-l', 'change', (e) => { s.letter = e.target.value; });
      bind('#vr-mp', 'input', (e) => { s.mount = e.target.value; });
      bind('#vr-bw', 'input', (e) => { s.mbps = Math.max(0, Number(e.target.value) || 0); });
      bind('#vr-f', 'change', (e) => { s.force = e.target.checked; });
      bind('#vr-x', 'change', (e) => { s.extend = e.target.checked; });
      bind('#vr-u', 'change', (e) => { s.newUuid = e.target.checked; });
      bind('#vr-c', 'change', (e) => { s.autoCutover = e.target.checked; });
      bind('[data-go]', 'click', () => submit(region, tg));
    }

    async function submit(region, tg) {
      const t = s.targets;
      const body = {
        machineId: s.machine, mode: s.mode, targetKind: s.kind === 'New' ? 'New' : 'Existing', force: s.force, newUuid: linux && s.newUuid,
        extend: !!(tg && (tg.size || 0) > t.source.length + MiB) && s.extend, autoCutover: s.autoCutover, bandwidthMbps: s.mbps,
        driveLetter: linux ? null : s.letter || null, mountPoint: linux ? (s.mount.trim() || null) : null
      };
      if (s.kind === 'New') {
        Object.assign(body, { diskUniqueId: s.disk, offset: region.offset, size: s.size * MiB });
      } else {
        body.partitionKey = tg.key;
        const machineName = (candidates.find((x) => x.id === s.machine) || {}).name;
        if (!await R.confirm({ title: '覆盖分区', danger: true, typed: 'OVERWRITE', ok: '覆盖并恢复',
          message: `${machineName} 上 ${tg.name}（磁盘 ${tg.disk.number} 分区 ${tg.number}，${bytes(tg.size)}）的全部数据将被 ${point.machineName} ${volume.name}（${dateTime(point.created, true)}）的内容替换。` })) return;
        body.confirm = 'OVERWRITE';
      }
      s.busy = true; draw();
      try {
        await R.api.post('/points/' + encodeURIComponent(point.id) + '/volumes/' + encodeURIComponent(volume.key) + '/restore', body);
        m.close();
        R.toast(s.mode === 'Live' ? '即时恢复已开始，卷上线后即可使用' : '分区恢复已加入队列');
        location.hash = '#/volume-restores';
      } catch (e) { s.busy = false; draw(); R.toast(e.message, 'err'); }
    }

    draw();
    loadTargets();
  };

  // ───────────── sessions ─────────────
  function progress(x) {
    const st = x.status || {};
    const total = st.totalBytes || x.volumeLength || 0;
    const done = Math.min(st.doneBytes || 0, total);
    const pctValue = total ? done * 100 / total : 0;
    if (!active(x) && x.state !== 'Completed') return h`<span class="faint">—</span>`;
    return h`<div class="bar"><span style="${'width:' + (x.state === 'Completed' ? 100 : pctValue).toFixed(1) + '%'}"></span></div>
      <small class="muted">${x.state === 'Completed' ? bytes(total) : `${bytes(done)} / ${bytes(total)} · ${Math.floor(pctValue)}%`}${st.backgroundRate != null && x.state === 'Online' ? ' · 后台回写 ' + (R.rate(st.backgroundRate) || '0 B/s') : ''}${st.rate && active(x) ? ' · 从 Core 读取 ' + R.rate(st.rate) : ''}${st.paused ? ' · 已暂停' : ''}${st.bandwidthMbps ? ` · 限速 ${st.bandwidthMbps} Mbps` : ''}</small>
      ${x.mode === 'Live' && (st.onDemandBytes || st.backgroundBytes) ? h`<br><small class="faint">按需读取 ${bytes(st.onDemandBytes || 0)} · 后台回写 ${bytes(st.backgroundBytes || 0)}${st.reconnects ? ` · 重连 ${st.reconnects} 次` : ''}</small>` : ''}`;
  }

  function where(x) {
    const st = x.status || {};
    const letter = st.driveLetter || x.driveLetter;
    const mount = st.mountPoint || x.mountPoint;
    return letter ? letter + ':' : mount || '';
  }

  R.pages['volume-restores'] = {
    title: '分区恢复',
    live: (list) => (list || []).some(active) ? 4000 : 30000,
    load: () => R.api.get('/volume-restores'),
    view(list, _, { can }) {
      const running = list.filter(active);
      return h`
        ${R.pageHead({ title: '分区恢复', key: 'volume-restores', sub: running.length ? `${running.length} 个恢复正在进行` : '没有进行中的分区恢复',
          help: h`<p>把恢复点中的整个数据分区（例如 D: 或 /srv）写回原计算机或其他安装了 Agent 的计算机：可以覆盖原分区、其他现有分区，或在未分配空间中新建分区。系统和引导分区请用恢复介质裸机恢复。</p>
            <p><b>即时恢复</b>：分区几秒钟内上线可用，读取尚未回写的数据时从 Core 按需获取，其余数据在后台回写，适合大容量数据盘。Windows 通过本机回环 iSCSI 磁盘提供，回写完成后切换到本地分区；Linux 使用内核 dm-clone，回写完成后自动在线切换。回写期间可暂停、继续或限速，Agent 或计算机重新启动后自动继续。</p>`,
          actions: can('operate') ? h`<a class="btn primary" href="#/restore?kind=volume">${icon('wand')}恢复分区…</a>` : '' })}
        <section class="panel">${list.length ? h`<div class="table-wrap"><table class="table cards">
          <thead><tr><th>分区</th><th>恢复到</th><th>方式</th><th>状态</th><th style="width:24%">进度</th><th>开始</th><th></th></tr></thead>
          <tbody>${list.map((x) => {
            const st = x.status || {};
            return h`<tr>
            <td data-label="分区"><div class="machine-cell"><span class="os-icon">${icon('disk')}</span><div><strong>${x.sourceMachineName || '?'} ${x.volumeName}</strong><small>${x.pointCreated ? '恢复点 ' + dateTime(x.pointCreated, true) : ''}${x.volumeLength ? ' · ' + bytes(x.volumeLength) : ''}${x.fileSystem ? ' · ' + x.fileSystem : ''}</small></div></div></td>
            <td data-label="恢复到"><b class="nowrap">${x.machineName || '?'}</b>${where(x) ? h` <span class="tag">${where(x)}</span>` : ''}<br><small class="muted">${x.targetName}${st.device ? ' · ' + st.device : ''}</small></td>
            <td data-label="方式">${x.mode === 'Live' ? h`<span class="tag brand">${modeName(x.mode)}</span>` : modeName(x.mode)}</td>
            <td data-label="状态">${R.pill(STATES, x.state)}<br><small class="muted">${x.message || ''}</small>${(st.warnings || []).length ? h`<br><small class="warn-text">${icon('warn', 12)} ${st.warnings.length} 条提示</small>` : ''}</td>
            <td data-label="进度">${progress(x)}</td>
            <td data-label="开始" class="nowrap">${ago(x.created)}<br><small class="muted">${x.createdBy}</small></td>
            <td class="actions-cell">${can('operate') && active(x) ? h`
              ${x.mode === 'Live' && x.state === 'Online' ? h`<button class="btn sm" data-action="${st.paused ? 'resume' : 'pause'}" data-id="${x.id}">${icon(st.paused ? 'play' : 'pause')}${st.paused ? '继续' : '暂停'}</button>` : ''}
              ${x.mode === 'Live' && x.state === 'Hydrated' && !x.linux ? h`<button class="btn sm primary" data-action="cutover" data-id="${x.id}">${icon('check')}切换到本地分区</button>` : ''}
              ${x.state !== 'Hydrated' ? h`<button class="btn sm" data-action="throttle" data-id="${x.id}">限速</button>` : ''}
              <button class="btn sm ghost" data-action="cancel" data-id="${x.id}">取消</button>` : ''}
              ${x.jobId ? h` <a class="btn sm ghost" href="${'#/jobs?open=' + x.jobId}" title="任务日志">${icon('jobs')}</a>` : ''}
              ${(st.warnings || []).length ? h` <button class="btn sm ghost" data-action="details" data-id="${x.id}" title="提示">${icon('info')}</button>` : ''}</td>
          </tr>`; })}</tbody></table></div>`
          : h`<div class="empty">${icon('disk', 30)}<h3>还没有分区恢复</h3><p>在恢复向导中选择“整个分区”，或在恢复点的分区列表中选择“恢复到计算机”。大容量数据盘可以选择即时恢复：先上线使用，再在后台回写。</p>${can('operate') ? h`<a class="btn primary" href="#/restore?kind=volume">${icon('wand')}恢复分区…</a>` : ''}</div>`}</section>`;
    },
    actions: {
      async pause(el, e, ctx) { await control(el.dataset.id, 'pause'); ctx.reload(); },
      async resume(el, e, ctx) { await control(el.dataset.id, 'resume'); ctx.reload(); },
      async cutover(el, e, ctx) {
        const x = ctx.state.data.find((y) => y.id === el.dataset.id);
        const force = await R.confirm({ title: '切换到本地分区', ok: '立即切换', danger: true,
          message: `${x.machineName} ${where(x) || x.volumeName} 将短暂断开（约几秒钟），然后由本地分区提供。仍打开着此卷上文件的程序会失去这些文件，请先关闭它们或停止相关服务。` });
        if (!force) return;
        await control(x.id, 'cutover', { force: true });
        R.toast('正在切换'); ctx.reload();
      },
      async throttle(el, e, ctx) {
        const x = ctx.state.data.find((y) => y.id === el.dataset.id);
        const m = R.modal({ title: '读取限速', body: h`<div class="field"><label for="vr-t">从 Core 读取的上限（Mbps，0 为不限）</label><input class="input" id="vr-t" type="number" min="0" step="10" value="${(x.status || {}).bandwidthMbps || 0}"></div>
          <p class="small muted">${x.mode === 'Live' ? (x.linux ? '对按需读取和后台回写都生效。' : '对按需读取和后台回写都生效；暂停只停止后台回写。') : ''}</p>`,
          foot: h`<button class="btn" data-close>取消</button><button class="btn primary" data-ok>保存</button>` });
        m.el.querySelector('[data-ok]').onclick = async () => {
          try { await control(x.id, 'throttle', { bandwidthMbps: Math.max(0, Number(m.el.querySelector('#vr-t').value) || 0) }); m.close(); ctx.reload(); }
          catch (err) { R.toast(err.message, 'err'); }
        };
      },
      async cancel(el, e, ctx) {
        const x = ctx.state.data.find((y) => y.id === el.dataset.id);
        const live = x.mode === 'Live' && ['Online', 'Hydrated'].includes(x.state);
        if (!await R.confirm({ title: '取消分区恢复', danger: true, ok: '取消恢复',
          message: live ? `即时恢复的卷 ${where(x) || x.volumeName} 将立即下线，正在使用它的程序会出错；目标分区只回写了一部分，不能直接使用。` : '目标分区只写入了一部分，内容不完整，不能直接使用。' })) return;
        await control(x.id, 'cancel'); R.toast('已请求取消'); ctx.reload();
      },
      details(el, e, ctx) {
        const x = ctx.state.data.find((y) => y.id === el.dataset.id);

      }
    }
  };

  async function control(id, action, body) {
    try { return await R.api.post('/volume-restores/' + encodeURIComponent(id) + '/' + action, body || {}); }
    catch (e) { R.toast(e.message, 'err'); throw e; }
  }
})(window.R = window.R || {});

  <script>
(function (R) {
  'use strict';
  const { h, icon, ago, dateTime, pill, bytes } = R;
  const ui = { status: '', type: '', machine: '', range: '', q: '' };
  const RANGES = [['', '全部时间'], ['1', '24 小时内'], ['7', '7 天内'], ['30', '30 天内']];
  const ev = { severity: '' };

  function table(jobs) {
    if (!jobs.length) return h`<section class="panel"><div class="empty">没有作业记录</div></section>`;
    return h`<section class="panel"><div class="table-wrap"><table class="table cards jobs-table">
      <thead><tr><th>作业</th><th>状态</th><th style="width:30%">进度 / 结果</th><th>发起</th><th>开始</th><th>耗时</th></tr></thead>
      <tbody>${jobs.map((j) => h`<tr class="click" data-action="job" data-id="${j.id}">
        <td data-label="作业"><b>${j.title}</b><br><small class="muted">${R.jobType[j.type] || j.type}</small></td>
        <td data-label="状态">${pill(R.jobStatus, j.status)}</td>
        <td data-label="结果">${j.status === 'Running' ? h`<div class="bar"><span style="${'width:' + j.progress + '%'}"></span></div><small class="muted">${Math.round(j.progress)}% · ${j.phase || ''}${j.rate ? ' · ' + R.rate(j.rate) : ''}</small>`
          : h`<small class="${'clip-2' + (j.status === 'Failed' ? ' err-text' : ' muted')}" title="${j.message || ''}">${j.message || ''}</small>`}</td>
        <td data-label="发起" class="small">${j.createdBy || ''}</td>
        <td data-label="开始" class="nowrap">${j.started ? dateTime(j.started) : h`<span class="faint">${ago(j.created)}</span>`}</td>
        <td data-label="耗时" class="nowrap">${j.started ? R.duration((j.ended || Date.now()) - j.started) : '—'}</td>
      </tr>`)}</tbody></table></div></section>`;
  }

  async function openJob(id) {
    const m = R.modal({ title: '作业详情', drawer: true, body: h`<div class="empty">正在加载…</div>` });
    let timer;
    async function draw() {
      try {
        const { job, logs, children = [], parent = null } = await R.api.get('/jobs/' + id);
        if (!document.body.contains(m.el)) return;
        const running = job.status === 'Running' || job.status === 'Queued';
        m.el.querySelector('.modal-head h2').textContent = job.title;
        m.set(h`<div style="display:flex;gap:10px;align-items:center;margin-bottom:14px">${pill(R.jobStatus, job.status)}<span class="muted">${R.jobType[job.type] || job.type}</span>
            ${running && R.app.can('operate') && job.type !== 'Restore' ? h`<button class="btn sm danger" data-cancel style="margin-left:auto">取消作业</button>` : ''}</div>
          ${job.status === 'Running' ? h`<div class="bar lg"><span style="${'width:' + job.progress + '%'}"></span></div><p class="small muted">${Math.round(job.progress)}% · ${job.phase || ''} · ${job.message || ''}${job.bytesTotal && job.type !== 'OfflineSync' ? ` · ${bytes(job.bytesDone)} / ${bytes(job.bytesTotal)}` : ''}${job.rate ? ' · ' + R.rate(job.rate) : ''}</p>`
            : h`<p style="margin-top:0">${job.message || ''}</p>`}
          <dl class="kv" style="margin:16px 0 20px">
            <dt>发起</dt><dd>${job.createdBy}</dd><dt>排队</dt><dd>${dateTime(job.created, true)}</dd>
            <dt>开始</dt><dd>${job.started ? dateTime(job.started, true) : '—'}</dd><dt>结束</dt><dd>${job.ended ? dateTime(job.ended, true) : '—'}</dd>
            ${job.started ? h`<dt>耗时</dt><dd>${R.duration((job.ended || Date.now()) - job.started)}</dd>` : ''}
            ${job.machineId ? h`<dt>计算机</dt><dd><a href="${'#/machines/' + job.machineId}" data-close>查看计算机</a></dd>` : ''}
            ${parent ? h`<dt>所属任务</dt><dd><a href="#" data-open="${parent.id}">${parent.title}</a></dd>` : ''}
          </dl>
          ${children.length ? h`<h3 style="font-size:14px;margin:0 0 8px">包含的作业（${children.length}）</h3>
            <div style="border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:20px"><table class="table"><tbody>${children.map((c) => h`<tr class="click" data-open="${c.id}">
              <td><b>${c.title}</b><br><small class="muted">${R.jobType[c.type] || c.type}</small></td>
              <td style="width:30%">${c.status === 'Running' ? h`<div class="bar"><span style="${'width:' + c.progress + '%'}"></span></div><small class="muted">${Math.round(c.progress)}%${c.rate ? ' · ' + R.rate(c.rate) : ''}</small>` : pill(R.jobStatus, c.status)}</td>
              <td class="small muted" style="width:34%">${c.message || ''}</td></tr>`)}</tbody></table></div>` : ''}
          <h3 style="font-size:14px;margin:0 0 8px">日志</h3>
          <div class="log">${logs.map((l) => h`<div class="${l.level}"><span class="t">${new Date(l.time).toLocaleTimeString('zh-CN', { hour12: false })}</span><span>${l.message}</span></div>`)}</div>`);
        m.el.querySelectorAll('[data-open]').forEach((el) => el.addEventListener('click', (e) => { e.preventDefault(); clearTimeout(timer); m.close(); openJob(el.dataset.open); }));
        const cancel = m.el.querySelector('[data-cancel]');
        if (cancel) cancel.onclick = async () => { await R.api.post(`/jobs/${id}/cancel`); R.toast('已请求取消'); draw(); };
        const log = m.el.querySelector('.log'); if (log) log.scrollTop = log.scrollHeight;
        if (running) timer = setTimeout(draw, 2500);
      } catch (e) { m.set(h`<div class="callout err">${icon('error')}<div>${e.message}</div></div>`); }
    }
    const observer = new MutationObserver(() => { if (!document.body.contains(m.el)) { clearTimeout(timer); observer.disconnect(); } });
    observer.observe(document.getElementById('overlays'), { childList: true });
    draw();
  }
  R.openJob = openJob;

  R.pages.jobs = {
    title: '任务',
    live: 4000,
    table,
    async load(params) {
      // #/jobs/<id> and #/jobs?open=<id> (links in notifications) open the job drawer; other parameters preset the filters.
      const open = params.id || params.open;
      if (open || params.status || params.type || params.range || params.machine) {
        if (params.status) ui.status = params.status;
        if (params.type) ui.type = params.type;
        if (params.range) ui.range = params.range;
        if (params.machine) ui.machine = params.machine;
        history.replaceState(null, '', '#/jobs');
        if (open) setTimeout(() => openJob(open), 0);
      }
      const q = new URLSearchParams({ limit: '300' });
      if (ui.status) q.set('status', ui.status);
      if (ui.type) q.set('type', ui.type);
      if (ui.machine) q.set('machineId', ui.machine);
      if (ui.q.trim()) q.set('q', ui.q.trim());
      if (ui.range) q.set('from', String(Date.now() - Number(ui.range) * 86400e3));
      const [jobs, machines] = await Promise.all([R.api.get('/jobs?' + q), R.app.state.machines && R.app.state.machines.length ? Promise.resolve(R.app.state.machines) : R.api.get('/machines')]);
      return { jobs, machines };
    },
    view({ jobs, machines }) {
      const filtered = ui.status || ui.type || ui.machine || ui.range || ui.q;
      return h`${R.pageHead({ title: '任务', key: 'jobs', sub: `${jobs.length >= 300 ? '最近 300' : jobs.length} 个作业${filtered ? '（已筛选）' : ''}`,
          help: h`<p>备份、汇总、校验、空间回收、介质生成、离线盘与异地复制，以及恢复控制台发起的裸机恢复都会记录在这里。点击一行查看日志。</p>` })}
        <div class="toolbar panel filters" style="margin-bottom:14px;border-radius:var(--radius)">
          <div class="chips">${[['', '全部'], ['Active', '进行中'], ['Problem', '失败或警告'], ['Failed', '失败'], ['Succeeded', '成功']].map(([k, l]) => h`<button class="${'chip' + (ui.status === k ? ' on' : '')}" data-action="status" data-v="${k}">${l}</button>`)}</div>
          <div class="toolbar-end">
            <select class="input" data-input="type" aria-label="作业类型"><option value="">全部类型</option>${Object.entries(R.jobType).filter(([k]) => R.features.virtualization || !['VmRestore','InstantRecovery','InstantMigrate'].includes(k)).map(([k, l]) => h`<option value="${k}" ${ui.type === k ? 'selected' : ''}>${l}</option>`)}</select>
            <select class="input" data-input="machine" aria-label="计算机"><option value="">全部计算机</option>${machines.map((m) => h`<option value="${m.id}" ${ui.machine === m.id ? 'selected' : ''}>${m.name}</option>`)}</select>
            <select class="input" data-input="range" aria-label="时间范围">${RANGES.map(([k, l]) => h`<option value="${k}" ${ui.range === k ? 'selected' : ''}>${l}</option>`)}</select>
            <input class="input" id="job-q" data-input="q" value="${ui.q}" placeholder="搜索标题或消息" aria-label="搜索作业">
            ${filtered ? h`<button class="btn sm ghost" data-action="clear">清除</button>` : ''}
          </div>
        </div>
        ${table(jobs)}`;
    },
    actions: {
      status(el, e, ctx) { ui.status = el.dataset.v; ctx.reload(); },
      type(el, e, ctx) { ui.type = el.value; ctx.reload(); },
      machine(el, e, ctx) { ui.machine = el.value; ctx.reload(); },
      range(el, e, ctx) { ui.range = el.value; ctx.reload(); },
      q(el, e, ctx) { ui.q = el.value; clearTimeout(ui.t); ui.t = setTimeout(ctx.reload, 300); },
      clear(el, e, ctx) { Object.assign(ui, { status: '', type: '', machine: '', range: '', q: '' }); ctx.reload(); },
      job(el) { openJob(el.dataset.id); }
    }
  };
  // Job rows on other pages (machine detail) open the same drawer.
  R.pages.machine.actions.job = (el) => openJob(el.dataset.id);

  R.pages.events = {
    title: '事件',
    live: 10000,
    load: () => R.api.get('/events?limit=500' + (ev.severity ? '&severity=' + ev.severity : '')),
    view(events, _, { can }) {
      const sev = { Info: ['ok', '信息'], Warning: ['warn', '警告'], Error: ['err', '错误'] };
      const unack = events.filter((e) => !e.acknowledged && e.severity === 'Error').length;
      return h`${R.pageHead({ title: '事件', sub: unack ? `${unack} 个错误尚未确认。` : '没有未确认的错误。', actions: can('operate') && unack ? h`<button class="btn" data-action="ack">${icon('check')}全部标记为已确认</button>` : '' })}
        <section class="panel">
          <div class="toolbar"><div class="chips">${[['', '全部'], ['Error', '错误'], ['Warning', '警告'], ['Info', '信息']].map(([k, l]) => h`<button class="${'chip' + (ev.severity === k ? ' on' : '')}" data-action="sev" data-v="${k}">${l}</button>`)}</div></div>
          ${events.length ? h`<div class="table-wrap"><table class="table cards"><thead><tr><th style="width:110px">级别</th><th>事件</th><th>类别</th><th>时间</th>${can('operate') ? h`<th style="width:90px"></th>` : ''}</tr></thead><tbody>
            ${events.map((e) => h`<tr style="${e.acknowledged || e.severity !== 'Error' ? '' : 'background:color-mix(in srgb, var(--danger-tint) 45%, transparent)'}">
              <td data-label="级别">${pill(sev, e.severity)}</td>
              <td data-label="事件">${e.message}${e.jobId ? h` <a class="small" href="${'#/jobs?open=' + e.jobId}">作业</a>` : ''}${e.machineId ? h` <a class="small" href="${'#/machines/' + e.machineId}">计算机</a>` : ''}</td>
              <td data-label="类别" class="small muted">${({ Alert: '告警', Notification: '通知', Offsite: '异地副本', Report: '报告' })[e.category] || e.category}</td><td data-label="时间" class="nowrap">${dateTime(e.time)}</td>${can('operate') ? h`<td class="nowrap">${e.acknowledged ? (e.severity === 'Info' ? '' : h`<span class="small muted">已确认</span>`) : e.severity === 'Info' ? '' : h`<button class="btn sm ghost" data-action="ackOne" data-id="${e.id}" title="确认此事件">${icon('check')}确认</button>`}</td>` : ''}</tr>`)}
          </tbody></table></div>` : h`<div class="empty">没有事件</div>`}
        </section>`;
    },
    actions: {
      sev(el, e, ctx) { ev.severity = el.dataset.v; ctx.reload(); },
      async ack(el, e, ctx) { await R.api.post('/events/ack', { all: true }); R.toast('已确认全部事件'); R.refreshAlerts?.(); ctx.reload(); },
      async ackOne(el, e, ctx) { el.disabled = true; await R.api.post('/events/ack', { ids: [Number(el.dataset.id)] }); R.toast('已确认事件'); R.refreshAlerts?.(); ctx.reload(); }
    }
  };
})(window.R = window.R || {});

  <script>
(function (R) {
  'use strict';
  const { h, icon, dateTime, ago } = R;

  R.pages.settings = {
    title: '设置',
    async load(params) {
      const tab = !R.features.virtualization && params.id === 'virtualization' ? 'general' : params.id || 'general';
      const settings = await R.api.get('/settings');
      const admin = R.app.can('admin');
      const license = tab === 'license' ? await R.api.get('/license') : null;
      const users = admin && tab === 'users' ? await R.api.get('/users') : [];
      const audit = admin && tab === 'audit' ? await R.api.get('/audit?limit=300') : [];
      const virtualization = admin && tab === 'virtualization' ? await R.api.get('/settings/virtualization') : null;
      const notifications = tab === 'notifications' ? await R.api.get('/settings/notifications') : null;
      if (notifications && !nf.dirty) nf.hooks = notifications.settings.webhooks.map((w) => Object.assign({}, w));
      return { settings, license, users, audit, tab, virtualization, notifications };
    },
    view({ settings: s, license, users, audit, tab, virtualization, notifications }, _, { can }) {
      const tabs = [['general', '常规'], ['license', '许可'], ['notifications', '通知'], ['performance', '备份性能'], ['virtualization', '虚拟化'], ['users', '用户与角色'], ['audit', '审计日志'], ['configuration', '备份与恢复'], ['about', '应用信息']].filter(([k]) => (k !== 'virtualization' || R.features.virtualization) && (can('admin') || k === 'general' || k === 'license' || k === 'about' || k === 'performance' || k === 'notifications'));
      return h`${R.pageHead({ title: '设置', sub: `${s.coreName} · BareTurn Core ${s.version}` })}
        <nav class="tabs">${tabs.map(([k, l]) => h`<a href="${'#/settings/' + k}" class="${tab === k ? 'on' : ''}">${l}</a>`)}</nav>
        ${tab === 'license' ? licenseTab(license, can) : tab === 'virtualization' && can('admin') ? R.virtualizationSettings(virtualization) : tab === 'notifications' ? notificationsTab(notifications, can) : tab === 'general' ? general(s, can) : tab === 'performance' ? performance(s.tuning || {}, can) : tab === 'configuration' ? (can('admin') ? configuration(s) : about(s)) : tab === 'users' ? usersTab(users) : tab === 'audit' ? auditTab(audit) : about(s)}`;
    },

      async testChannel(el, e, ctx) {

          await saveNotifications(ctx);

          R.toast('测试通知已发送，请检查是否收到');

      addHook(el, e, ctx) { keepForm(ctx); hookDialog(null, ctx); },

      removeHook(el, e, ctx) { keepForm(ctx); nf.hooks = nf.hooks.filter((x) => (x.id || x.tmp) !== el.dataset.id); nf.dirty = true; ctx.redraw(); },
      async saveVirtualization(el, e, ctx) {
        const form = document.getElementById('virtualization-settings'); const data = R.formData(form);
        const body = Object.assign({}, ctx.state.data.virtualization, { instantEnabled: form.querySelector('[name=instantEnabled]').checked, bindAddress: data.bindAddress, cachePath: data.cachePath,
          maxSessions: Number(data.maxSessions), cacheMiB: Number(data.cacheMiB), maxCacheBytes: Number(data.maxCacheGiB) * 1024 ** 3, nfsPort: Number(data.nfsPort), mountPort: Number(data.mountPort), iscsiPort: Number(data.iscsiPort) });
        await R.api.put('/settings/virtualization', body); R.toast('已保存'); ctx.reload();
      },

        const f = R.formData(document.getElementById('settings-form'));

        const f = R.formData(document.getElementById('tuning-form'));
        await R.api.put('/settings/tuning', {
          zstdLevel: Number(f.zstdLevel), streams: Number(f.streams), sourceDedup: f.sourceDedup,
          changeTracking: f.changeTracking, fullScanDays: f.fullScanDays ?? 7, verifySampleRate: f.verify ? 64 : 0,
          excludeSystemFiles: f.excludeSystemFiles, vssWriters: f.vssWriters, readThreads: Number(f.readThreads),
          bandwidthMbps: f.bandwidthMbps ?? 0, lowPriority: f.lowPriority
        });
        R.toast('备份性能设置已保存，下次备份生效'); ctx.reload();
      },
      addUser(el, e, ctx) { userDialog(null, ctx); },
      editUser(el, e, ctx) { userDialog(ctx.state.data.users.find((u) => u.id === el.dataset.id), ctx); },
      async deleteUser(el, e, ctx) {

        await R.api.del('/users/' + u.id); R.toast('用户已删除'); ctx.reload();

      restoreConfiguration(el, e, ctx) { configurationDialog(true, ctx); },

  // ───────────── notifications ─────────────

    const err = (k) => st.errors && st.errors[k] ? h`<div class="callout err" style="margin:8px 0 0">${icon('error')}<div>最近一次发送失败：${st.errors[k]}</div></div>` : '';
    const anyChannel = em.enabled || sy.enabled || nf.hooks.some((w) => w.enabled);
    return h`<form id="notify-form" autocomplete="off">
      ${anyChannel ? '' : h`<div class="callout warn" style="margin-top:0">${icon('bell')}<div>还没有启用任何通知方式。启用后，备份失败、计算机未按计划备份、存储库空间不足等问题会主动通知你。</div></div>`}

              <div class="field"><label>端口</label><input class="input" type="number" name="emailPort" value="${em.port}" ${dis}></div>
              <div class="field"><label>加密</label><select class="input" name="emailSecurity" ${dis}>${[['StartTls', 'STARTTLS（587）'], ['Tls', 'SSL/TLS（465）'], ['None', '不加密（25，仅内网中继）']].map(([k, l]) => h`<option value="${k}" ${em.security === k ? 'selected' : ''}>${l}</option>`)}</select></div></div>
            <div class="row"><div class="field"><label>用户名（可选）</label><input class="input" name="emailUser" value="${em.userName || ''}" autocomplete="off" ${dis}></div>
